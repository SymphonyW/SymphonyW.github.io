<section class="stats-dashboard">
    <header class="stats-header">
        <h2 class="section-title">Stats</h2>
        <p class="stats-subtitle">基于全部已发布文章自动统计，每次构建后自动更新</p>
    </header>

    <div class="stats-cards" id="stats-cards"></div>

    <div class="stats-block">
        <h3 class="stats-block-title">每月文章数</h3>
        <div class="stats-canvas-wrap">
            <canvas id="chart-posts-time"></canvas>
        </div>
    </div>

    <div class="stats-grid-2">
        <div class="stats-block">
            <h3 class="stats-block-title">分类分布</h3>
            <div class="stats-canvas-wrap">
                <canvas id="chart-categories"></canvas>
            </div>
        </div>
        <div class="stats-block">
            <h3 class="stats-block-title">热门标签 Top 12</h3>
            <div class="stats-canvas-wrap">
                <canvas id="chart-tags"></canvas>
            </div>
        </div>
    </div>

    <div class="stats-block">
        <h3 class="stats-block-title">写作活跃度（近 26 周）</h3>
        <div id="stats-heatmap" class="stats-heatmap"></div>
    </div>

    <div class="stats-block">
        <h3 class="stats-block-title">最近文章</h3>
        <div id="stats-recent" class="stats-recent"></div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script><script type="text/javascript" src="/js/stats.min.js" defer></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.StatsDashboard && Chart) {
            window.StatsDashboard.mount({
                url: "\/stats\/index.json",
                summary: "#stats-cards",
                postsChart: "#chart-posts-time",
                catChart: "#chart-categories",
                tagsChart: "#chart-tags",
                tagsLimit: 12,
                heatmap: "#stats-heatmap",
                heatmapWeeks: 26,
                recent: "#stats-recent",
                recentLimit: 8
            });
        }
    });
</script>
