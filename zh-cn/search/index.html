    <script>
    (() => {
        const container = document.querySelector('.editorial-search');
        const form = container.querySelector('form');
        const input = form.querySelector('input');
        const status = container.querySelector('.search-status');
        const results = container.querySelector('.search-results');
        const list = container.querySelector('.search-result-list');
        const suggestions = container.querySelector('.search-suggestions');
        const isZH = container.dataset.language === 'zh-cn';
        let dataPromise;
        let revision = 0;
        let timer;
        const initialText = status.textContent;

        const readIndex = () => {
            if (!dataPromise) {
                dataPromise = fetch(form.dataset.json).then(response => {
                    if (!response.ok) throw new Error('Search index unavailable');
                    return response.json();
                }).then(pages => pages.map(page => ({
                    ...page,
                    content: String(page.content || '').replace(/\s+/g, ' ').trim(),
                    title: String(page.title || '')
                }))).catch(error => {
                    dataPromise = undefined;
                    throw error;
                });
            }
            return dataPromise;
        };

        const appendHighlight = (element, value, keywords) => {
            const lower = value.toLocaleLowerCase();
            let cursor = 0;
            while (cursor < value.length) {
                let start = -1;
                let length = 0;
                for (const word of keywords) {
                    const found = lower.indexOf(word, cursor);
                    if (found !== -1 && (start === -1 || found < start || (found === start && word.length > length))) {
                        start = found;
                        length = word.length;
                    }
                }
                if (start === -1) {
                    element.append(document.createTextNode(value.slice(cursor)));
                    break;
                }
                element.append(document.createTextNode(value.slice(cursor, start)));
                const mark = document.createElement('mark');
                mark.textContent = value.slice(start, start + length);
                element.append(mark);
                cursor = start + length;
            }
        };

        const renderRow = (page, keywords, index) => {
            const article = document.createElement('article');
            article.className = 'post-row';
            const link = document.createElement('a');
            link.className = 'post-row-link';
            const target = new URL(page.permalink, location.href);
            link.href = target.pathname + target.search + target.hash;
            const number = document.createElement('span');
            number.className = 'post-row-number';
            number.setAttribute('aria-hidden', 'true');
            number.textContent = String(index + 1).padStart(2, '0');
            const copy = document.createElement('div');
            copy.className = 'post-row-copy';
            const title = document.createElement('h2');
            title.className = 'post-row-title';
            appendHighlight(title, page.title, keywords);
            const preview = document.createElement('p');
            preview.className = 'post-row-description';
            const matches = keywords.map(word => page.content.toLocaleLowerCase().indexOf(word)).filter(position => position >= 0);
            const start = matches.length ? Math.max(0, Math.min(...matches) - 32) : 0;
            const snippet = (start ? '…' : '') + page.content.slice(start, start + 180) + (page.content.length > start + 180 ? '…' : '');
            appendHighlight(preview, snippet, keywords);
            const meta = document.createElement('div');
            meta.className = 'post-row-meta';
            if (page.date) {
                const date = document.createElement('time');
                date.dateTime = page.date;
                date.textContent = page.date.slice(0, 10).replace(/-/g, '.');
                meta.append(date);
            }
            const arrow = document.createElement('span');
            arrow.className = 'post-row-arrow';
            arrow.setAttribute('aria-hidden', 'true');
            arrow.textContent = '↗';
            copy.append(title, preview, meta);
            link.append(number, copy, arrow);
            article.append(link);
            return article;
        };

        const search = async (updateURL = true) => {
            clearTimeout(timer);
            const currentRevision = ++revision;
            const query = input.value.trim();
            if (updateURL) {
                const url = new URL(location.href);
                if (query) url.searchParams.set('keyword', query);
                else url.searchParams.delete('keyword');
                history.replaceState(null, '', url);
            }
            list.replaceChildren();
            suggestions.hidden = Boolean(query);
            if (!query) {
                status.textContent = initialText;
                results.setAttribute('aria-busy', 'false');
                return;
            }
            status.textContent = isZH ? '正在查找…' : 'Searching…';
            results.setAttribute('aria-busy', 'true');
            try {
                const pages = await readIndex();
                if (currentRevision !== revision) return;
                const keywords = [...new Set(query.toLocaleLowerCase().split(/\s+/).filter(Boolean))];
                const found = pages.map(page => {
                    const title = page.title.toLocaleLowerCase();
                    const content = page.content.toLocaleLowerCase();
                    const score = keywords.reduce((sum, word) => sum + (title.includes(word) ? 20 : 0) + (content.includes(word) ? 1 : 0), 0);
                    return { page, score };
                }).filter(item => item.score > 0).sort((a, b) => b.score - a.score || b.page.date.localeCompare(a.page.date));
                const fragment = document.createDocumentFragment();
                found.forEach(({ page }, index) => fragment.append(renderRow(page, keywords, index)));
                list.append(fragment);
                status.textContent = found.length
                    ? (isZH ? '找到 ' + found.length + ' 篇相关文章' : found.length + (found.length === 1 ? ' article found' : ' articles found'))
                    : (isZH ? '没有找到相关文章，换一个关键词试试。' : 'No articles found. Try another word or a shorter phrase.');
            } catch (error) {
                if (currentRevision !== revision) return;
                status.textContent = isZH ? '搜索暂时无法加载，请再次搜索以重试。' : 'Search could not load. Submit your search again to retry.';
            } finally {
                if (currentRevision === revision) results.setAttribute('aria-busy', 'false');
            }
        };

        form.addEventListener('submit', event => { event.preventDefault(); search(); });
        input.addEventListener('input', event => {
            clearTimeout(timer);
            ++revision;
            if (!event.isComposing) timer = setTimeout(() => search(), 160);
        });
        input.addEventListener('compositionend', () => search());
        container.querySelectorAll('[data-query]').forEach(button => {
            button.addEventListener('click', () => {
                input.value = button.dataset.query;
                input.focus();
                search();
            });
        });
        const restoreQuery = () => {
            input.value = new URL(location.href).searchParams.get('keyword') || '';
            search(false);
        };
        window.addEventListener('popstate', restoreQuery);
        restoreQuery();
    })();
    </script>
