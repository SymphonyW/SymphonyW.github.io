<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From Git push to a verified Kubernetes release</title>
  <desc id="desc">Six stages: commit, test, build and push an immutable image, deploy, verify, and recover or observe.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63765e" stroke-width="2"/></marker>
  </defs>
  <rect width="1200" height="720" rx="20" fill="#f6f1e7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#24362d">
    <text x="64" y="66" font-size="19" letter-spacing="4" fill="#607354">SNOW / ENGINEERING NOTES</text>
    <text x="64" y="138" font-size="46" font-weight="650">K8s 自动化部署全流程</text>
    <text x="64" y="180" font-size="24" fill="#52624f">Git push → immutable image → verified release</text>
    <path d="M64 210H1136" stroke="#ccc8b8"/>
    <g fill="#fffdf8" stroke="#c8cebd" stroke-width="1.5">
      <rect x="64" y="244" width="320" height="148" rx="12"/>
      <rect x="440" y="244" width="320" height="148" rx="12"/>
      <rect x="816" y="244" width="320" height="148" rx="12"/>
      <rect x="816" y="450" width="320" height="148" rx="12"/>
      <rect x="440" y="450" width="320" height="148" rx="12"/>
      <rect x="64" y="450" width="320" height="148" rx="12" fill="#e7eddc"/>
    </g>
    <g font-size="18" fill="#607354" letter-spacing="2">
      <text x="90" y="278">01 / SOURCE</text><text x="466" y="278">02 / CI</text><text x="842" y="278">03 / ARTIFACT</text>
      <text x="842" y="484">04 / RELEASE</text><text x="466" y="484">05 / VERIFY</text><text x="90" y="484">06 / RESPOND</text>
    </g>
    <g font-size="28" font-weight="600">
      <text x="90" y="323">提交与评审</text><text x="466" y="323">测试与检查</text><text x="842" y="323">构建与推送</text>
      <text x="842" y="529">滚动更新</text><text x="466" y="529">接口与版本验证</text><text x="90" y="529">观察与恢复</text>
    </g>
    <g font-size="21" fill="#52624f">
      <text x="90" y="362">Commit + pull request</text><text x="466" y="362">Test before merge</text><text x="842" y="362">GHCR / image digest</text>
      <text x="842" y="568">Kubernetes Deployment</text><text x="466" y="568">Readiness + smoke test</text><text x="90" y="568">Observe or restore</text>
    </g>
    <g fill="none" stroke="#63765e" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M393 318H428"/><path d="M769 318H804"/><path d="M976 402V438"/>
      <path d="M805 524H771"/><path d="M429 524H395"/>
    </g>
    <text x="64" y="662" font-size="22" fill="#52624f">每次发布都能追溯：Git SHA · image digest · configuration · verification</text>
  </g>
</svg>
