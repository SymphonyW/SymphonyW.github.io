<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="zh-cn"><title id="title">一个受控的 Agent 执行循环</title><desc id="desc">数据先经过筛选；动作先经过校验；完成需要可验证的结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">一个受控的 Agent 执行循环</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">数据先经过筛选；动作先经过校验；完成需要可验证的结果。</tspan></text><rect x="55" y="155" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">任务状态</tspan></text><text x="79" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">目标、进度、待确认动作</tspan></text><rect x="450" y="155" width="300" height="115" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">上下文装配</tspan></text><text x="474" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">只选这一步需要的信息</tspan></text><rect x="845" y="155" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">长期记忆</tspan></text><text x="869" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">有来源、有范围、可更新</tspan></text><path d="M 355 210 H 445" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 210 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="55" y="350" width="300" height="125" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">交付与完成检查</tspan></text><text x="79" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">证据是否支持结论？</tspan><tspan x="79" dy="32.199999999999996">产物是否真实可用？</tspan></text><rect x="450" y="350" width="300" height="125" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">模型决策与规划</tspan></text><text x="474" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">提出下一步动作</tspan><tspan x="474" dy="32.199999999999996">或提出完成请求</tspan></text><rect x="845" y="350" width="300" height="125" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">运行时校验</tspan></text><text x="869" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">参数、权限、预算</tspan><tspan x="869" dy="32.199999999999996">通过后才执行</tspan></text><path d="M 600 270 V 345" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 407 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 750 407 H 840" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="555" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="597" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">观察与状态更新</tspan></text><text x="474" y="635" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">记录事实，维护下一步</tspan></text><rect x="845" y="555" width="300" height="115" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="597" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">外部工具与环境</tspan></text><text x="869" y="635" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">检索、读取、保存产物</tspan></text><path d="M 995 475 V 550" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 612 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 612 H 25 V 210 H 50" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><text x="250" y="592" fill="#5e6d65" font-size="21" font-weight="400" text-anchor="start"><tspan x="250" dy="0">写回事实</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">教学示意 · 非框架默认实现</tspan></text></g></svg>