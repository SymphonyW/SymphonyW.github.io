<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="zh-cn"><title id="title">工具调用是一条受控执行链</title><desc id="desc">格式正确只是起点；权限、结果与重试策略由程序落实。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">工具调用是一条受控执行链</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">格式正确只是起点；权限、结果与重试策略由程序落实。</tspan></text><rect x="55" y="165" width="235" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">1  提出调用</tspan></text><text x="79" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">工具名、参数</tspan><tspan x="79" dy="32.199999999999996">关联调用标识</tspan></text><rect x="340" y="165" width="235" height="140" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="364" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="364" dy="0">2  校验授权</tspan></text><text x="364" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="364" dy="0">输入约束与权限</tspan><tspan x="364" dy="32.199999999999996">可信服务端身份</tspan></text><rect x="625" y="165" width="235" height="140" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="649" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="649" dy="0">3  执行动作</tspan></text><text x="649" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="649" dy="0">超时与预算控制</tspan><tspan x="649" dy="32.199999999999996">记录真实结果</tspan></text><rect x="910" y="165" width="235" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="934" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="934" dy="0">4  反馈结果</tspan></text><text x="934" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="934" dy="0">限长、分页、来源</tspan><tspan x="934" dy="32.199999999999996">关联原调用</tspan></text><path d="M 290 235 H 335" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 575 235 H 620" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 860 235 H 905" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 457 305 V 362 H 215 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 742 362 H 600 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 742 362 H 985 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="55" y="415" width="320" height="180" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">可修正的输入错误</tspan></text><text x="79" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">返回明确字段错误</tspan><tspan x="79" dy="32.199999999999996">由模型修正参数</tspan><tspan x="79" dy="32.199999999999996">不能靠重试绕过权限</tspan></text><rect x="440" y="415" width="320" height="180" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="464" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="464" dy="0">只读瞬时故障</tspan></text><text x="464" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="464" dy="0">退避、限次、计入预算</tspan><tspan x="464" dy="32.199999999999996">不存在则重新检索</tspan><tspan x="464" dy="32.199999999999996">结果过大则分页</tspan></text><rect x="825" y="415" width="320" height="180" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="849" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="849" dy="0">写入结果不确定</tspan></text><text x="849" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="849" dy="0">先查询动作结果</tspan><tspan x="849" dy="32.199999999999996">使用服务端幂等键</tspan><tspan x="849" dy="32.199999999999996">无法确认则等待核实</tspan></text><text x="55" y="667" fill="#20352e" font-size="25" font-weight="600" text-anchor="start"><tspan x="55" dy="0">超时 ≠ 动作未发生；不要把同一份报告盲目创建两遍。</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">教学示意 · 非框架默认实现</tspan></text></g></svg>