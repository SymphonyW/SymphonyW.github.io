<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" xml:lang="zh-cn"><title id="title">状态记录事实，检查点支持恢复</title><desc id="desc">暂停与失败需要明确状态；外部动作的完成结果还要单独核实。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="780" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">状态记录事实，检查点支持恢复</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">暂停与失败需要明确状态；外部动作的完成结果还要单独核实。</tspan></text><rect x="55" y="180" width="250" height="110" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="222" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">已创建</tspan></text><text x="79" y="260" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">初始化目标和约束</tspan></text><rect x="475" y="180" width="250" height="110" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="499" y="222" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="499" dy="0">运行中</tspan></text><text x="499" y="260" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="499" dy="0">执行并写入事实</tspan></text><rect x="895" y="180" width="250" height="110" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="919" y="222" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="919" dy="0">已完成</tspan></text><text x="919" y="260" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="919" dy="0">交付物验证通过</tspan></text><path d="M 305 235 H 470" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 725 235 H 890" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="55" y="395" width="300" height="120" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="437" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">等待输入或审批</tspan></text><text x="79" y="475" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">保存待处理动作与范围</tspan></text><rect x="450" y="395" width="300" height="120" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="437" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">失败 / 预算耗尽</tspan></text><text x="474" y="475" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">保存缺口与错误原因</tspan></text><rect x="845" y="395" width="300" height="120" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="437" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">恢复前核实</tspan></text><text x="869" y="475" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">查询未确认动作的结果</tspan></text><path d="M 550 290 V 342 H 205 V 390" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 205 395 V 325 H 500 V 295" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 650 290 V 390" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 750 455 H 840" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 995 395 V 330 H 700 V 295" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="55" y="595" width="1090" height="105" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="80" y="635" fill="#20352e" font-size="24" font-weight="600" text-anch