<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="zh-cn"><title id="title">记忆需要完整的生命周期</title><desc id="desc">保存值得复用的信息；读写都检查来源、范围、时效与冲突。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">记忆需要完整的生命周期</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">保存值得复用的信息；读写都检查来源、范围、时效与冲突。</tspan></text><rect x="55" y="165" width="300" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">候选信息</tspan></text><text x="79" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">用户偏好、确认事实</tspan><tspan x="79" dy="32.199999999999996">经过验证的任务经验</tspan></text><rect x="450" y="165" width="300" height="140" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">写入前筛选</tspan></text><text x="474" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">是否长期有用？</tspan><tspan x="474" dy="32.199999999999996">来源可信？范围明确？</tspan></text><rect x="845" y="165" width="300" height="140" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">记忆存储</tspan></text><text x="869" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">来源、时间、版本</tspan><tspan x="869" dy="32.199999999999996">可修正、可删除</tspan></text><path d="M 355 235 H 445" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 750 235 H 840" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="845" y="415" width="300" height="145" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">读取前过滤</tspan></text><text x="869" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">先检查租户与用户范围</tspan><tspan x="869" dy="32.199999999999996">再做相关性与时效筛选</tspan></text><rect x="450" y="415" width="300" height="145" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">处理冲突</tspan></text><text x="474" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">当前明确要求优先</tspan><tspan x="474" dy="32.199999999999996">有疑问就回查证据</tspan></text><rect x="55" y="415" width="300" height="145" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">进入本次上下文</tspan></text><text x="79" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">仅装配有用的几条</tspan><tspan x="79" dy="32.199999999999996">保留来源引用</tspan></text><path d="M 995 305 V 410" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 485 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 485 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><text x="55" y="650" fill="#20352e" font-size="24" font-weight="600" text-anchor="start"><tspan x="55" dy="0">存储可以从 JSON 或数据库表开始；向量索引只是可选的检索方式。</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">教学示意 · 非框架默认实现</tspan></text></g></svg>