<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Data layer scaling</title>
  <desc id="desc">Data layer evolution from one database to replicas, shards, and specialized stores.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #fff7ed; }
      .title { font: 800 32px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .db { fill: #ffffff; stroke: #f97316; stroke-width: 2; }
      .rep { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .shard { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .store { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .h { font: 800 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .s { font: 600 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .note { font: 700 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #9a3412; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="60" y="64">数据层扩展：先保护主库，再拆分，再让专用系统做专用事</text>
  <g transform="translate(70 120)">
    <rect class="db" x="0" y="140" width="150" height="110" rx="18"/>
    <text class="h" x="75" y="185" text-anchor="middle">单库</text>
    <text class="s" x="75" y="215" text-anchor="middle">所有数据集中</text>
    <path class="line" d="M150 195 H240"/>
    <g transform="translate(260 70)">
      <rect class="db" x="0" y="95" width="150" height="100" rx="18"/>
      <text class="h" x="75" y="134" text-anchor="middle">主库</text>
      <text class="s" x="75" y="162" text-anchor="middle">写请求</text>
      <rect class="rep" x="0" y="235" width="150" height="100" rx="18"/>
      <text class="h" x="75" y="274" text-anchor="middle">从库</text>
      <text class="s" x="75" y="302" text-anchor="middle">读请求</text>
      <path class="line" d="M75 195 V235"/>
    </g>
    <path class="line" d="M410 195 H500"/>
    <g transform="translate(520 20)">
      <rect class="shard" x="0" y="52" width="150" height="86" rx="16"/>
      <text class="h" x="75" y="88" text-anchor="middle">用户库</text>
      <text class="s" x="75" y="114" text-anchor="middle">垂直拆分</text>
      <rect class="shard" x="0" y="172" width="150" height="86" rx="16"/>
      <text class="h" x="75" y="208" text-anchor="middle">订单表 00</text>
      <text class="s" x="75" y="234" text-anchor="middle">水平分片</text>
      <rect class="shard" x="0" y="292" width="150" height="86" rx="16"/>
      <text class="h" x="75" y="328" text-anchor="middle">订单表 01</text>
      <text class="s" x="75" y="354" text-anchor="middle">按规则路由</text>
    </g>
    <path class="line" d="M670 195 H760"/>
    <g transform="translate(790 24)">
      <rect class="store" x="0" y="20" width="170" height="82" rx="16"/>
      <text class="h" x="85" y="55" text-anchor="middle">Redis</text>
      <text class="s" x="85" y="80" text-anchor="middle">热点缓存</text>
      <rect class="store" x="0" y="128" width="170" height="82" rx="16"/>
      <text class="h" x="85" y="163" text-anchor="middle">Elasticsearch</text>
      <text class="s" x="85" y="188" text-anchor="middle">全文搜索</text>
      <rect class="store" x="0" y="236" width="170" height="82" rx="16"/>
      <text class="h" x="85" y="271" text-anchor="middle">MongoDB</text>
      <text class="s" x="85" y="296" text-anchor="middle">灵活文档</text>
      <rect class="store" x="0" y="344" width="170" height="82" rx="16"/>
      <text class="h" x="85" y="379" text-anchor="middle">TSDB / HBase</text>
      <text class="s" x="85" y="404" text-anchor="middle">海量写入</text>
    </g>
    <text class="note" x="0" y="520">主库仍然要尽量保持为“真相源”；其他存储通常是为了查询、缓存或分析而生。</text>
  </g>
</svg>
