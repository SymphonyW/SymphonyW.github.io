<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Architecture evolution roadmap</title>
  <desc id="desc">A roadmap from single machine architecture to cloud native architecture.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .head { font: 800 34px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .lane { font: 800 24px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 800 20px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 600 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .step { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .ops { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text class="head" x="60" y="70">从小网站到云原生：每一步都被瓶颈推动</text>
  <g transform="translate(60 115)">
    <rect class="band" x="0" y="0" width="1080" height="170" rx="18"/>
    <text class="lane" x="28" y="48">访问层</text>
    <rect class="step" x="180" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="255" y="72" text-anchor="middle">单机</text>
    <text class="boxText" x="255" y="100" text-anchor="middle">快速上线</text>
    <rect class="step" x="390" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="465" y="72" text-anchor="middle">应用集群</text>
    <text class="boxText" x="465" y="100" text-anchor="middle">水平扩容</text>
    <rect class="step" x="600" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="675" y="72" text-anchor="middle">反向代理</text>
    <text class="boxText" x="675" y="100" text-anchor="middle">统一入口</text>
    <rect class="step" x="810" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="885" y="72" text-anchor="middle">CDN</text>
    <text class="boxText" x="885" y="100" text-anchor="middle">就近访问</text>
    <path class="arrow" d="M330 78 H380"/>
    <path class="arrow" d="M540 78 H590"/>
    <path class="arrow" d="M750 78 H800"/>
  </g>
  <g transform="translate(60 325)">
    <rect class="band" x="0" y="0" width="1080" height="170" rx="18"/>
    <text class="lane" x="28" y="48">数据层</text>
    <rect class="data" x="180" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="255" y="72" text-anchor="middle">独立数据库</text>
    <text class="boxText" x="255" y="100" text-anchor="middle">资源隔离</text>
    <rect class="data" x="390" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="465" y="72" text-anchor="middle">读写分离</text>
    <text class="boxText" x="465" y="100" text-anchor="middle">主写从读</text>
    <rect class="data" x="600" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="675" y="72" text-anchor="middle">缓存</text>
    <text class="boxText" x="675" y="100" text-anchor="middle">挡住热点</text>
    <rect class="data" x="810" y="36" width="150" height="84" rx="14"/>
    <text class="boxTitle" x="885" y="72" text-anchor="middle">分库分表</text>
    <text class="boxText" x="885" y="100" text-anchor="middle">突破容量</text>
    <path class="arrow" d="M330 78 H380"/>
    <path class="arrow" d="M540 78 H590"/>
    <path class="arrow" d="M750 78 H800"/>
  </g>
  <g transform="translate(60 535)">
    <rect class="band" x="0" y="0" width="1080" height="210" rx="18"/>
    <text class="lane" x="28" y="52">工程层</text>
    <rect class="ops" x="180" y="46" width="150" height="94" rx="14"/>
    <text class="boxTitle" x="255" y="84" text-anchor="middle">搜索 / NoSQL</text>
    <text class="boxText" x="255" y="113" text-anchor="middle">专用能力</text>
    <rect class="ops" x="390" y="46" width="150" height="94" rx="14"/>
    <text class="boxTitle" x="465" y="84" text-anchor="middle">分布式服务</text>
    <text class="boxText" x="465" y="113" text-anchor="middle">独立交付</text>
    <rect class="ops" x="600" y="46" width="150" height="94" rx="14"/>
    <text class="boxTitle" x="675" y="84" text-anchor="middle">微服务治理</text>
    <text class="boxText" x="675" y="113" text-anchor="middle">稳定运行</text>
    <rect class="ops" x="810" y="46" width="150" height="94" rx="14"/>
    <text class="boxTitle" x="885" y="84" text-anchor="middle">云原生</text>
    <text class="boxText" x="885" y="113" text-anchor="middle">自动化平台</text>
    <path class="arrow" d="M330 93 H380"/>
    <path class="arrow" d="M540 93 H590"/>
    <path class="arrow" d="M750 93 H800"/>
  </g>
</svg>
