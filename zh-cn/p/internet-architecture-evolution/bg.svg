<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Internet architecture evolution cover</title>
  <desc id="desc">A cover image showing internet architecture growing from one server to cloud native clusters.</desc>
  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 70px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .sub { font: 600 30px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #d1fae5; }
      .label { font: 700 23px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .tiny { font: 600 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #e5e7eb; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#coverBg)"/>
  <path d="M0 520 C170 455 280 575 430 510 C610 432 760 432 945 515 C1040 558 1130 550 1200 505 L1200 675 L0 675 Z" fill="#020617" opacity="0.22"/>
  <g transform="translate(78 92)">
    <text class="tiny" x="0" y="0" letter-spacing="5">ARCHITECTURE EVOLUTION</text>
    <text class="title" x="0" y="92">互联网架构演进</text>
    <text class="sub" x="2" y="150">从单机应用到云原生平台</text>
  </g>
  <g filter="url(#shadow)" transform="translate(96 306)">
    <rect x="0" y="78" width="120" height="118" rx="18" fill="#fef3c7"/>
    <text class="label" x="60" y="145" text-anchor="middle">单机</text>
    <path d="M136 137 H236" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M236 137 l-20 -14 v28 z" fill="#f8fafc"/>
    <rect x="270" y="48" width="150" height="178" rx="18" fill="#ccfbf1"/>
    <text class="label" x="345" y="124" text-anchor="middle">集群</text>
    <text class="label" x="345" y="160" text-anchor="middle">缓存</text>
    <path d="M440 137 H540" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M540 137 l-20 -14 v28 z" fill="#f8fafc"/>
    <rect x="574" y="18" width="178" height="238" rx="18" fill="#dbeafe"/>
    <text class="label" x="663" y="112" text-anchor="middle">服务化</text>
    <text class="label" x="663" y="148" text-anchor="middle">中间件</text>
    <path d="M772 137 H872" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M872 137 l-20 -14 v28 z" fill="#f8fafc"/>
    <rect x="906" y="-10" width="198" height="294" rx="22" fill="#f0fdf4"/>
    <text class="label" x="1005" y="106" text-anchor="middle">云原生</text>
    <text class="label" x="1005" y="142" text-anchor="middle">Kubernetes</text>
  </g>
  <g transform="translate(100 590)">
    <text class="tiny" x="0" y="0">业务增长带来瓶颈，架构升级解决瓶颈，也引入新的复杂度</text>
  </g>
</svg>
