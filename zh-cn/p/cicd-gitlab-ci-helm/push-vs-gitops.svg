<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Push deployment and GitOps</title><desc id="desc">In push deployment a CI job calls the cluster API through Helm. In GitOps CI updates a desired-state repository and a cluster-side controller reconciles it. Use one owner for the same resource.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5a7a94" stroke-width="2"/></marker></defs>
<rect width="1200" height="650" rx="24" fill="#f1f5fa"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="50" y="66" fill="#152e48" font-size="34" font-weight="700">Who applies the desired state?</text>
<text x="50" y="126" fill="#276d86" font-size="28" font-weight="600">PUSH / CI job owns deployment</text>
<g fill="#fff" stroke="#bdcddd" stroke-width="2"><rect x="50" y="156" width="290" height="108" rx="14"/><rect x="455" y="156" width="290" height="108" rx="14"/><rect x="860" y="156" width="290" height="108" rx="14"/></g>
<g fill="#152e48" text-anchor="middle" font-size="28"><text x="195" y="202">GitLab CI</text><text x="600" y="202">Helm CLI</text><text x="1005" y="202">Kubernetes API</text></g><g fill="#526d83" text-anchor="middle" font-size="22"><text x="195" y="238">build + deploy job</text><text x="600" y="238">release update</text><text x="1005" y="238">reconcile workloads</text></g>
<g stroke="#5a7a94" stroke-width="3" marker-end="url(#a)"><path d="M354 210h87"/><path d="M759 210h87"/></g>
<text x="50" y="340" fill="#247564" font-size="28" font-weight="600">GITOPS / Controller owns reconciliation</text>
<g fill="#e4f3ef" stroke="#78a99c" stroke-width="2"><rect x="50" y="372" width="240" height="108" rx="14"/><rect x="340" y="372" width="240" height="108" rx="14"/><rect x="630" y="372" width="240" height="108" rx="14"/><rect x="920" y="372" width="230" height="108" rx="14"/></g>
<g fill="#174c44" text-anchor="middle" font-size="27"><text x="170" y="417">GitLab CI</text><text x="460" y="417">Config Git repo</text><text x="750" y="417">Argo CD / Flux</text><text x="1035" y="417">Kubernetes</text></g><g fill="#3c6961" text-anchor="middle" font-size="21"><text x="170" y="453">publish image</text><text x="460" y="453">review desired digest</text><text x="750" y="453">pull + compare + sync</text><text x="1035" y="453">actual state</text></g>
<g stroke="#5a7a94" stroke-width="3" marker-end="url(#a)"><path d="M300 426h29"/><path d="M590 426h29"/><path d="M880 426h29"/></g>
<rect x="50" y="538" width="1100" height="66" rx="12" fill="#152e48"/><text x="600" y="580" text-anchor="middle" fill="#fff" font-size="25">One owner per resource. Configure drift correction deliberately.</text>
</g></svg>
