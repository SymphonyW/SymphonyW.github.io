<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 与 Codex 工作流对比</title>
  <desc id="desc">左边展示 Claude Code 围绕本地仓库连续工作，右边展示 Codex 在本地与云端之间进行任务委派和回收。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1523"/>
      <stop offset="100%" stop-color="#13273b"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1dd0ff"/>
      <stop offset="100%" stop-color="#3af3c9"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ad7ff"/>
      <stop offset="100%" stop-color="#95ef8e"/>
    </linearGradient>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44e8d6"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#95ef8e"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#eef8ff">
    <text x="90" y="60" font-size="32" font-weight="700">两条典型工作流</text>
    <text x="90" y="94" font-size="18" fill="rgba(238,248,255,0.72)">左边更像持续深耕，右边更像任务委派</text>
    <text x="165" y="150" font-size="28" font-weight="700">Claude Code</text>
    <text x="745" y="150" font-size="28" font-weight="700">Codex</text>
  </g>

  <g>
    <rect x="90" y="190" width="440" height="480" rx="28" fill="rgba(17,31,49,0.76)" stroke="rgba(61,223,215,0.35)"/>
    <rect x="670" y="190" width="440" height="480" rx="28" fill="rgba(17,31,49,0.76)" stroke="rgba(149,239,142,0.35)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="160" y="240" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#left)" stroke-width="2"/>
      <rect x="160" y="350" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#left)" stroke-width="2"/>
      <rect x="160" y="460" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#left)" stroke-width="2"/>
      <rect x="160" y="570" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#left)" stroke-width="2"/>
      <text x="310" y="282" text-anchor="middle" font-size="22" fill="#eef8ff">进入本地仓库</text>
      <text x="310" y="392" text-anchor="middle" font-size="22" fill="#eef8ff">读代码、改文件、跑命令</text>
      <text x="310" y="502" text-anchor="middle" font-size="22" fill="#eef8ff">持续利用规则与上下文</text>
      <text x="310" y="612" text-anchor="middle" font-size="22" fill="#eef8ff">在同一工作区反复迭代</text>
      <path d="M310 306 V345" stroke="#44e8d6" stroke-width="4" marker-end="url(#arrowA)"/>
      <path d="M310 416 V455" stroke="#44e8d6" stroke-width="4" marker-end="url(#arrowA)"/>
      <path d="M310 526 V565" stroke="#44e8d6" stroke-width="4" marker-end="url(#arrowA)"/>
    </g>

    <g>
      <rect x="740" y="220" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#right)" stroke-width="2"/>
      <rect x="740" y="330" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#right)" stroke-width="2"/>
      <rect x="740" y="440" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#right)" stroke-width="2"/>
      <rect x="740" y="550" width="300" height="66" rx="18" fill="rgba(24,45,66,0.95)" stroke="url(#right)" stroke-width="2"/>
      <text x="890" y="262" text-anchor="middle" font-size="22" fill="#eef8ff">在本地或云端发起任务</text>
      <text x="890" y="372" text-anchor="middle" font-size="22" fill="#eef8ff">连接仓库或工作目录</text>
      <text x="890" y="482" text-anchor="middle" font-size="22" fill="#eef8ff">后台执行并记录日志</text>
      <text x="890" y="592" text-anchor="middle" font-size="22" fill="#eef8ff">回收 diff、分支或 PR</text>
      <path d="M890 286 V325" stroke="#95ef8e" stroke-width="4" marker-end="url(#arrowB)"/>
      <path d="M890 396 V435" stroke="#95ef8e" stroke-width="4" marker-end="url(#arrowB)"/>
      <path d="M890 506 V545" stroke="#95ef8e" stroke-width="4" marker-end="url(#arrowB)"/>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="rgba(238,248,255,0.78)" font-size="16">
    <text x="150" y="705">关键词：本地连续开发、长期上下文、工程驯化</text>
    <text x="710" y="705">关键词：任务分发、后台运行、多端切换、GitHub 回收</text>
  </g>
</svg>
