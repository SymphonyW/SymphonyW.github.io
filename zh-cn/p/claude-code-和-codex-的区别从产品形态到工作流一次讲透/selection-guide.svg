<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 与 Codex 的选型决策图</title>
  <desc id="desc">通过四个问题帮助判断更适合选择 Claude Code 还是 Codex。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1321"/>
      <stop offset="100%" stop-color="#13283b"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20d0ff"/>
      <stop offset="100%" stop-color="#3bf0c8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ad6ff"/>
      <stop offset="100%" stop-color="#92ee90"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfe8f5"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#eef8ff">
    <text x="90" y="58" font-size="32" font-weight="700">怎么选更合适</text>
    <text x="90" y="92" font-size="18" fill="rgba(238,248,255,0.72)">顺着自己的工作节奏选，不要只看品牌</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="450" y="130" width="300" height="78" rx="22" fill="rgba(24,40,58,0.94)" stroke="rgba(255,255,255,0.18)"/>
    <text x="600" y="178" text-anchor="middle" font-size="26" font-weight="700" fill="#eef8ff">你的默认工作方式是什么？</text>

    <rect x="180" y="280" width="300" height="78" rx="22" fill="rgba(24,40,58,0.94)" stroke="url(#g1)" stroke-width="2"/>
    <text x="330" y="328" text-anchor="middle" font-size="24" fill="#eef8ff">长期盯着本地仓库持续开发</text>

    <rect x="720" y="280" width="300" height="78" rx="22" fill="rgba(24,40,58,0.94)" stroke="url(#g2)" stroke-width="2"/>
    <text x="870" y="328" text-anchor="middle" font-size="24" fill="#eef8ff">经常把任务委派到后台</text>

    <path d="M530 208 L380 280" stroke="#cfe8f5" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M670 208 L820 280" stroke="#cfe8f5" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="120" y="450" width="420" height="180" rx="28" fill="rgba(24,40,58,0.84)" stroke="rgba(59,240,200,0.35)"/>
    <rect x="660" y="450" width="420" height="180" rx="28" fill="rgba(24,40,58,0.84)" stroke="rgba(146,238,144,0.35)"/>

    <text x="330" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#eef8ff">更偏 Claude Code</text>
    <text x="330" y="548" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">项目规则更重要</text>
    <text x="330" y="578" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">希望代理长期理解仓库脾气</text>
    <text x="330" y="608" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">常连内部工具、MCP、hooks</text>

    <text x="870" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#eef8ff">更偏 Codex</text>
    <text x="870" y="548" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">任务委派更重要</text>
    <text x="870" y="578" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">想把本地与云端打通</text>
    <text x="870" y="608" text-anchor="middle" font-size="19" fill="rgba(238,248,255,0.84)">强依赖 GitHub 异步协作</text>
  </g>
</svg>
