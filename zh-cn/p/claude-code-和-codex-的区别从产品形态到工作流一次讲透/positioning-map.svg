<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 与 Codex 的产品重心示意图</title>
  <desc id="desc">用二维坐标对比 Claude Code 与 Codex 在本地工程工作台和云端代理平台两个方向上的重心差异。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#122338"/>
    </linearGradient>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20d3ff"/>
      <stop offset="100%" stop-color="#39f0c7"/>
    </linearGradient>
    <linearGradient id="cx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72d7ff"/>
      <stop offset="100%" stop-color="#8df08e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <path d="M140 620 H1080"/>
    <path d="M140 620 V110"/>
    <path d="M140 510 H1080"/>
    <path d="M140 400 H1080"/>
    <path d="M140 290 H1080"/>
    <path d="M140 180 H1080"/>
    <path d="M300 620 V110"/>
    <path d="M460 620 V110"/>
    <path d="M620 620 V110"/>
    <path d="M780 620 V110"/>
    <path d="M940 620 V110"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#eaf7ff">
    <text x="140" y="62" font-size="34" font-weight="700">Claude Code vs Codex</text>
    <text x="140" y="96" font-size="18" fill="rgba(234,247,255,0.72)">看产品重心，不只看功能列表</text>
    <text x="890" y="665" font-size="18">云端委派 / 平台化更强</text>
    <text x="145" y="665" font-size="18">更偏本地工程工作台</text>
    <text x="42" y="170" font-size="18" transform="rotate(-90 42,170)">更偏任务分发</text>
    <text x="42" y="560" font-size="18" transform="rotate(-90 42,560)">更偏项目沉淀</text>
  </g>

  <g>
    <circle cx="395" cy="470" r="88" fill="rgba(32,211,255,0.14)" stroke="url(#cc)" stroke-width="3"/>
    <circle cx="820" cy="255" r="88" fill="rgba(141,240,142,0.14)" stroke="url(#cx)" stroke-width="3"/>
    <circle cx="395" cy="470" r="10" fill="#39f0c7"/>
    <circle cx="820" cy="255" r="10" fill="#8df08e"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="315" y="455" font-size="34" font-weight="700" fill="#f4fbff">Claude Code</text>
    <text x="278" y="490" font-size="18" fill="rgba(244,251,255,0.85)">本地工作区、规则、记忆、MCP</text>

    <text x="770" y="240" font-size="34" font-weight="700" fill="#f4fbff">Codex</text>
    <text x="700" y="275" font-size="18" fill="rgba(244,251,255,0.85)">多端统一、云端任务、GitHub 协作</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="rgba(244,251,255,0.78)" font-size="16">
    <text x="220" y="180">长期项目上下文</text>
    <text x="220" y="205">本地连续开发</text>
    <text x="220" y="230">细粒度放权</text>

    <text x="835" y="500">后台任务</text>
    <text x="835" y="525">多端切换</text>
    <text x="835" y="550">任务委派与回收</text>
  </g>
</svg>
