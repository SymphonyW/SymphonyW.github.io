<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache cover</title>
  <desc id="desc">A visual overview of KV Cache in transformer decoding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="44%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 520 C 170 455, 260 575, 430 500 S 760 430, 980 500 S 1170 560, 1200 490 L1200 675 L0 675 Z" fill="#020617" opacity="0.22"/>
  <g transform="translate(86 78)">
    <text x="0" y="0" fill="#cffafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">TRANSFORMER INFERENCE</text>
    <text x="0" y="90" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">KV Cache</text>
    <text x="0" y="148" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="600">为什么只缓存 Key / Value，不缓存 Query</text>
  </g>
  <g filter="url(#shadow)" transform="translate(90 290)">
    <rect x="0" y="0" width="1020" height="260" rx="28" fill="url(#panel)" stroke="#bfdbfe" stroke-opacity="0.35"/>
    <g transform="translate(58 52)">
      <rect x="0" y="0" width="150" height="66" rx="18" fill="#dbeafe"/>
      <text x="75" y="42" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Q_now</text>
      <path d="M170 33 H290" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/>
      <path d="M290 33 l-22 -14 v28 z" fill="#e0f2fe"/>
      <rect x="325" y="-26" width="520" height="118" rx="20" fill="#022c22" fill-opacity="0.75" stroke="#99f6e4" stroke-opacity="0.65"/>
      <text x="585" y="18" text-anchor="middle" fill="#ccfbf1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">KV Cache per layer</text>
      <g transform="translate(365 42)">
        <rect x="0" y="0" width="62" height="36" rx="9" fill="#67e8f9"/>
        <rect x="74" y="0" width="62" height="36" rx="9" fill="#67e8f9" opacity="0.88"/>
        <rect x="148" y="0" width="62" height="36" rx="9" fill="#67e8f9" opacity="0.76"/>
        <rect x="222" y="0" width="62" height="36" rx="9" fill="#34d399"/>
        <rect x="296" y="0" width="62" height="36" rx="9" fill="#34d399" opacity="0.88"/>
        <rect x="370" y="0" width="62" height="36" rx="9" fill="#34d399" opacity="0.76"/>
        <text x="31" y="25" text-anchor="middle" fill="#083344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">K1</text>
        <text x="105" y="25" text-anchor="middle" fill="#083344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">K2</text>
        <text x="179" y="25" text-anchor="middle" fill="#083344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">K...</text>
        <text x="253" y="25" text-anchor="middle" fill="#064e3b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">V1</text>
        <text x="327" y="25" text-anchor="middle" fill="#064e3b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">V2</text>
        <text x="401" y="25" text-anchor="middle" fill="#064e3b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">V...</text>
      </g>
      <text x="512" y="167" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">当前 Query 读取过去的 K/V；过去的 Query 不再参与未来计算</text>
    </g>
  </g>
</svg>
