<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Why not cache Query</title>
  <desc id="desc">Old queries are consumed immediately, while old keys and values are reused by future tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">为什么不存 Q：旧 Query 没有未来读者</text>
  <text x="72" y="116" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">未来 token 会拿自己的 Q 去读过去的 K/V；过去 token 的 Q 只服务于过去那一行 attention。</text>

  <g transform="translate(90 174)" filter="url(#shadow)">
    <rect width="1020" height="330" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="54" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">时间线</text>
    <g transform="translate(70 105)">
      <rect x="0" y="0" width="160" height="90" rx="18" fill="#e2e8f0"/>
      <text x="80" y="36" text-anchor="middle" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">token i</text>
      <text x="80" y="66" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">q_i, k_i, v_i</text>
      <rect x="342" y="0" width="160" height="90" rx="18" fill="#dbeafe"/>
      <text x="422" y="36" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">token j</text>
      <text x="422" y="66" text-anchor="middle" fill="#1e40af" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">q_j, k_j, v_j</text>
      <rect x="684" y="0" width="160" height="90" rx="18" fill="#dcfce7"/>
      <text x="764" y="36" text-anchor="middle" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">token t</text>
      <text x="764" y="66" text-anchor="middle" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">q_t 读取历史</text>
      <path d="M170 45 H326" stroke="#64748b" stroke-width="4" marker-end="url(#grayArrow)"/>
      <path d="M512 45 H668" stroke="#64748b" stroke-width="4" marker-end="url(#grayArrow)"/>

      <path d="M765 100 C700 180, 510 190, 430 98" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#blueArrow)"/>
      <path d="M765 100 C650 238, 190 238, 92 98" stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#blueArrow)"/>
      <text x="430" y="250" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">q_t 会反复读取 k_i/v_i、k_j/v_j ...</text>
      <text x="430" y="282" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">但不会读取 q_i 或 q_j</text>
    </g>
  </g>

  <g transform="translate(126 542)">
    <rect x="0" y="0" width="948" height="64" rx="18" fill="#0f172a"/>
    <text x="474" y="40" text-anchor="middle" fill="#fef3c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">K/V 是“可被未来访问的记忆”；Q 是“当前这一步的读请求”。</text>
  </g>
</svg>
