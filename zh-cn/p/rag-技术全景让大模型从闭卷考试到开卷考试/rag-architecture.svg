<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="off" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="on" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>
  <rect width="1200" height="680" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">RAG 完整架构：离线建库 + 在线问答</text>
  <!-- OFFLINE -->
  <g transform="translate(40,90)">
    <rect width="1120" height="230" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="20" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fbbf24">⚙️ 离线阶段（Offline · 一次性 / 增量更新）</text>
    <!-- docs -->
    <g transform="translate(40,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="150" height="120" rx="10" fill="#334155"/>
      <text x="75" y="45" text-anchor="middle" font-size="30">📄</text>
      <text x="75" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">原始文档</text>
      <text x="75" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">PDF/Word/HTML</text>
    </g>
    <line x1="195" y1="130" x2="225" y2="130" stroke="#64748b" stroke-width="3"/>
    <polygon points="225,130 215,124 215,136" fill="#64748b"/>
    <!-- chunking -->
    <g transform="translate(230,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="180" height="120" rx="10" fill="url(#off)"/>
      <text x="90" y="45" text-anchor="middle" font-size="30">✂️</text>
      <text x="90" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">切分 Chunking</text>
      <text x="90" y="100" text-anchor="middle" font-size="11" fill="#fef3c7">按长度/语义分段</text>
    </g>
    <line x1="415" y1="130" x2="445" y2="130" stroke="#64748b" stroke-width="3"/>
    <polygon points="445,130 435,124 435,136" fill="#64748b"/>
    <!-- embedding -->
    <g transform="translate(450,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="180" height="120" rx="10" fill="url(#off)"/>
      <text x="90" y="45" text-anchor="middle" font-size="30">🧬</text>
      <text x="90" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">向量化 Embedding</text>
      <text x="90" y="100" text-anchor="middle" font-size="11" fill="#fef3c7">BGE / M3E / OpenAI</text>
    </g>
    <line x1="635" y1="130" x2="665" y2="130" stroke="#64748b" stroke-width="3"/>
    <polygon points="665,130 655,124 655,136" fill="#64748b"/>
    <!-- vector db -->
    <g transform="translate(670,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="190" height="120" rx="10" fill="url(#off)"/>
      <text x="95" y="45" text-anchor="middle" font-size="30">🗄️</text>
      <text x="95" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">向量数据库</text>
      <text x="95" y="100" text-anchor="middle" font-size="11" fill="#fef3c7">Milvus/Chroma/Qdrant</text>
    </g>
    <g transform="translate(900,80)" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fbbf24">
      <text x="0" y="20">💡 切分策略直接影响检索质量</text>
      <text x="0" y="50">💡 常用 500 token / 段，带重叠</text>
      <text x="0" y="80">💡 Embedding 模型决定语义匹配上限</text>
    </g>
  </g>
  <!-- ONLINE -->
  <g transform="translate(40,360)">
    <rect width="1120" height="280" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="20" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#34d399">⚡ 在线阶段（Online · 每次查询实时执行）</text>
    <!-- query -->
    <g transform="translate(40,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="140" height="110" rx="10" fill="#334155"/>
      <text x="70" y="42" text-anchor="middle" font-size="28">🙋</text>
      <text x="70" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">用户提问</text>
    </g>
    <line x1="185" y1="125" x2="215" y2="125" stroke="#64748b" stroke-width="3"/>
    <polygon points="215,125 205,119 205,131" fill="#64748b"/>
    <!-- embed query -->
    <g transform="translate(220,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="150" height="110" rx="10" fill="url(#on)"/>
      <text x="75" y="42" text-anchor="middle" font-size="28">🧬</text>
      <text x="75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">问题向量化</text>
    </g>
    <line x1="375" y1="125" x2="405" y2="125" stroke="#64748b" stroke-width="3"/>
    <polygon points="405,125 395,119 395,131" fill="#64748b"/>
    <!-- retrieval -->
    <g transform="translate(410,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="150" height="110" rx="10" fill="url(#on)"/>
      <text x="75" y="42" text-anchor="middle" font-size="28">🔍</text>
      <text x="75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">相似度检索</text>
      <text x="75" y="95" text-anchor="middle" font-size="11" fill="#d1fae5">Top-K 召回</text>
    </g>
    <line x1="565" y1="125" x2="595" y2="125" stroke="#64748b" stroke-width="3"/>
    <polygon points="595,125 585,119 585,131" fill="#64748b"/>
    <!-- prompt -->
    <g transform="translate(600,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="150" height="110" rx="10" fill="url(#on)"/>
      <text x="75" y="42" text-anchor="middle" font-size="28">🔗</text>
      <text x="75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">构造 Prompt</text>
      <text x="75" y="95" text-anchor="middle" font-size="11" fill="#d1fae5">上下文拼接</text>
    </g>
    <line x1="755" y1="125" x2="785" y2="125" stroke="#64748b" stroke-width="3"/>
    <polygon points="785,125 775,119 775,131" fill="#64748b"/>
    <!-- llm -->
    <g transform="translate(790,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="150" height="110" rx="10" fill="url(#on)"/>
      <text x="75" y="42" text-anchor="middle" font-size="28">🤖</text>
      <text x="75" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">LLM 生成</text>
      <text x="75" y="95" text-anchor="middle" font-size="11" fill="#d1fae5">GPT/Qwen/DeepSeek</text>
    </g>
    <line x1="945" y1="125" x2="975" y2="125" stroke="#64748b" stroke-width="3"/>
    <polygon points="975,125 965,119 965,131" fill="#64748b"/>
    <!-- answer -->
    <g transform="translate(980,70)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="100" height="110" rx="10" fill="#334155"/>
      <text x="50" y="42" text-anchor="middle" font-size="28">💬</text>
      <text x="50" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">回答</text>
      <text x="50" y="95" text-anchor="middle" font-size="11" fill="#94a3b8">+引用</text>
    </g>
    <!-- feedback to vector db -->
    <path d="M 485 180 Q 485 230 765 180" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
    <text x="625" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#34d399">↑ 检索自上方向量数据库</text>
  </g>
</svg>
