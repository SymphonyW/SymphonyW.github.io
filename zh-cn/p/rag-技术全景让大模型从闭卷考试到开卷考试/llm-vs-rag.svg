<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">原生 LLM vs RAG：闭卷考试 vs 开卷考试</text>
  <line x1="600" y1="90" x2="600" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- left: naive LLM -->
  <g transform="translate(50,110)">
    <rect width="500" height="460" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#dc2626">原生 LLM（闭卷考试）</text>
    <g transform="translate(30,75)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">❌ 知识截止</text>
      <text x="20" y="52" font-size="13" fill="#64748b">训练数据有截止日期，不知道最新信息</text>
    </g>
    <g transform="translate(30,155)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">❌ 幻觉问题</text>
      <text x="20" y="52" font-size="13" fill="#64748b">一本正经地编造事实，难以察觉</text>
    </g>
    <g transform="translate(30,235)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">❌ 领域知识不足</text>
      <text x="20" y="52" font-size="13" fill="#64748b">对企业内部文档、专业领域不熟悉</text>
    </g>
    <g transform="translate(30,315)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#fca5a5"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">❌ 无法溯源</text>
      <text x="20" y="52" font-size="13" fill="#64748b">不知道答案来自哪里，无法核验</text>
    </g>
    <text x="250" y="430" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#dc2626">凭记忆答题</text>
  </g>
  <!-- right: RAG -->
  <g transform="translate(650,110)">
    <rect width="500" height="460" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#16a34a">RAG（开卷考试）</text>
    <g transform="translate(30,75)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">✓ 知识实时</text>
      <text x="20" y="52" font-size="13" fill="#64748b">更新知识库即可，无需重新训练</text>
    </g>
    <g transform="translate(30,155)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">✓ 减少幻觉</text>
      <text x="20" y="52" font-size="13" fill="#64748b">基于真实检索内容作答，有据可循</text>
    </g>
    <g transform="translate(30,235)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">✓ 领域可定制</text>
      <text x="20" y="52" font-size="13" fill="#64748b">挂载企业文档/专业资料，即用即查</text>
    </g>
    <g transform="translate(30,315)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="440" height="68" rx="8" fill="#fff" stroke="#86efac"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#1e293b">✓ 可溯源</text>
      <text x="20" y="52" font-size="13" fill="#64748b">回答附带引用来源，可核验可信度</text>
    </g>
    <text x="250" y="430" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#16a34a">翻资料答题</text>
  </g>
</svg>
