<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">四种知识注入方案横向对比</text>
  <!-- headers -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">
    <rect x="40" y="90" width="200" height="50" fill="#475569"/>
    <text x="140" y="121" text-anchor="middle">维度</text>
    <rect x="250" y="90" width="220" height="50" fill="#dc2626"/>
    <text x="360" y="121" text-anchor="middle">纯 LLM 提示工程</text>
    <rect x="475" y="90" width="220" height="50" fill="#f59e0b"/>
    <text x="585" y="121" text-anchor="middle">微调 Fine-tuning</text>
    <rect x="700" y="90" width="220" height="50" fill="#10b981"/>
    <text x="810" y="121" text-anchor="middle">RAG</text>
    <rect x="925" y="90" width="235" height="50" fill="#8b5cf6"/>
    <text x="1042" y="121" text-anchor="middle">RAG + 微调</text>
  </g>
  <!-- rows -->
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1e293b">
    <!-- row1 -->
    <rect x="40" y="145" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="178" text-anchor="middle" font-weight="600">知识更新</text>
    <rect x="250" y="145" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="178" text-anchor="middle" fill="#dc2626">✗ 改 Prompt</text>
    <rect x="475" y="145" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="178" text-anchor="middle" fill="#d97706">⚠ 需重新微调</text>
    <rect x="700" y="145" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="178" text-anchor="middle" fill="#16a34a">✓ 改库即可</text>
    <rect x="925" y="145" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="178" text-anchor="middle" fill="#7c3aed">✓ 改库即可</text>
    <!-- row2 -->
    <rect x="40" y="205" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="238" text-anchor="middle" font-weight="600">成本</text>
    <rect x="250" y="205" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="238" text-anchor="middle" fill="#16a34a">低</text>
    <rect x="475" y="205" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="238" text-anchor="middle" fill="#dc2626">高</text>
    <rect x="700" y="205" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="238" text-anchor="middle" fill="#d97706">中</text>
    <rect x="925" y="205" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="238" text-anchor="middle" fill="#dc2626">高</text>
    <!-- row3 -->
    <rect x="40" y="265" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="298" text-anchor="middle" font-weight="600">可溯源性</text>
    <rect x="250" y="265" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="298" text-anchor="middle" fill="#dc2626">✗</text>
    <rect x="475" y="265" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="298" text-anchor="middle" fill="#dc2626">✗</text>
    <rect x="700" y="265" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="298" text-anchor="middle" fill="#16a34a">✓ 引用来源</text>
    <rect x="925" y="265" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="298" text-anchor="middle" fill="#7c3aed">✓ 引用来源</text>
    <!-- row4 -->
    <rect x="40" y="325" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="358" text-anchor="middle" font-weight="600">准确性</text>
    <rect x="250" y="325" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="358" text-anchor="middle" fill="#d97706">一般</text>
    <rect x="475" y="325" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="358" text-anchor="middle" fill="#d97706">较好</text>
    <rect x="700" y="325" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="358" text-anchor="middle" fill="#16a34a">好</text>
    <rect x="925" y="325" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="358" text-anchor="middle" fill="#7c3aed">最好</text>
    <!-- row5 -->
    <rect x="40" y="385" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="418" text-anchor="middle" font-weight="600">实时性</text>
    <rect x="250" y="385" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="418" text-anchor="middle" fill="#16a34a">✓</text>
    <rect x="475" y="385" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="418" text-anchor="middle" fill="#dc2626">✗</text>
    <rect x="700" y="385" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="418" text-anchor="middle" fill="#16a34a">✓</text>
    <rect x="925" y="385" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="418" text-anchor="middle" fill="#7c3aed">✓</text>
    <!-- row6 -->
    <rect x="40" y="445" width="200" height="55" fill="#e2e8f0"/>
    <text x="140" y="478" text-anchor="middle" font-weight="600">适用场景</text>
    <rect x="250" y="445" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="360" y="472" text-anchor="middle" font-size="12" fill="#475569">通用问答</text>
    <text x="360" y="490" text-anchor="middle" font-size="12" fill="#475569">风格定制</text>
    <rect x="475" y="445" width="220" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="585" y="472" text-anchor="middle" font-size="12" fill="#475569">固定领域</text>
    <text x="585" y="490" text-anchor="middle" font-size="12" fill="#475569">风格/格式</text>
    <rect x="700" y="445" width="220" height="55" fill="#f0fdf4" stroke="#e2e8f0"/>
    <text x="810" y="472" text-anchor="middle" font-size="12" fill="#475569">动态知识库</text>
    <text x="810" y="490" text-anchor="middle" font-size="12" fill="#475569">企业文档问答</text>
    <rect x="925" y="445" width="235" height="55" fill="#fff" stroke="#e2e8f0"/>
    <text x="1042" y="472" text-anchor="middle" font-size="12" fill="#475569">高精度领域</text>
    <text x="1042" y="490" text-anchor="middle" font-size="12" fill="#475569">专家系统</text>
  </g>
  <text x="600" y="535" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">经验法则：知识频繁变化用 RAG，风格/格式固定用微调，两者结合效果最佳</text>
</svg>
