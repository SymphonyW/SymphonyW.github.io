<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">ACID vs BASE：两种一致性哲学</text>
  <text x="600" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">关系型的强约束 vs 分布式的可妥协</text>

  <!-- ACID 左侧 -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="540" height="440" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#3b82f6"/>
    <rect x="0" y="36" width="540" height="14" fill="#3b82f6"/>
    <text x="270" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">ACID：事务的四大保证</text>

    <g transform="translate(20,70)">
      <rect x="0" y="0" width="500" height="80" rx="8" fill="#fff" stroke="#3b82f6"/>
      <circle cx="40" cy="40" r="28" fill="#3b82f6"/>
      <text x="40" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">A</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">Atomicity 原子性</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">事务要么全部成功，要么全部回滚，</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">不存在中间状态。转账经典案例</text>
    </g>

    <g transform="translate(20,160)">
      <rect x="0" y="0" width="500" height="80" rx="8" fill="#fff" stroke="#3b82f6"/>
      <circle cx="40" cy="40" r="28" fill="#3b82f6"/>
      <text x="40" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">C</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">Consistency 一致性</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">事务前后数据满足所有约束，</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">主键、外键、CHECK 全部成立</text>
    </g>

    <g transform="translate(20,250)">
      <rect x="0" y="0" width="500" height="80" rx="8" fill="#fff" stroke="#3b82f6"/>
      <circle cx="40" cy="40" r="28" fill="#3b82f6"/>
      <text x="40" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">I</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">Isolation 隔离性</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">并发事务互不干扰，</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">通过锁/MVCC 实现四种隔离级别</text>
    </g>

    <g transform="translate(20,340)">
      <rect x="0" y="0" width="500" height="80" rx="8" fill="#fff" stroke="#3b82f6"/>
      <circle cx="40" cy="40" r="28" fill="#3b82f6"/>
      <text x="40" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">D</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">Durability 持久性</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">事务提交后永久保存，</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">即使宕机也不丢（WAL/redo log）</text>
    </g>
  </g>

  <!-- BASE 右侧 -->
  <g transform="translate(620,110)">
    <rect x="0" y="0" width="540" height="440" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#f59e0b"/>
    <rect x="0" y="36" width="540" height="14" fill="#f59e0b"/>
    <text x="270" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">BASE：分布式的妥协哲学</text>

    <g transform="translate(20,70)">
      <rect x="0" y="0" width="500" height="100" rx="8" fill="#fff" stroke="#f59e0b"/>
      <circle cx="40" cy="50" r="28" fill="#f59e0b"/>
      <text x="40" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">BA</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#854d0e">Basically Available 基本可用</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">分区失败时允许响应时间增加、</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">允许部分功能降级，但系统仍可用。</text>
      <text x="85" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">电商大促：关闭退货、延迟发货</text>
    </g>

    <g transform="translate(20,185)">
      <rect x="0" y="0" width="500" height="100" rx="8" fill="#fff" stroke="#f59e0b"/>
      <circle cx="40" cy="50" r="28" fill="#f59e0b"/>
      <text x="40" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">S</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#854d0e">Soft State 软状态</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">允许数据存在中间状态，</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">不要求每时刻强一致。</text>
      <text x="85" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">订单"已支付" + 库存"待扣减"短暂并存</text>
    </g>

    <g transform="translate(20,300)">
      <rect x="0" y="0" width="500" height="120" rx="8" fill="#fff" stroke="#f59e0b"/>
      <circle cx="40" cy="60" r="28" fill="#f59e0b"/>
      <text x="40" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">E</text>
      <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#854d0e">Eventually Consistent 最终一致</text>
      <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">不保证任意时刻一致，但保证</text>
      <text x="85" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">一段时间后所有副本最终收敛一致。</text>
      <text x="85" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">读己之写、单调读、会话一致</text>
      <text x="85" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">都是最终一致的不同强度</text>
    </g>
  </g>

  <!-- 底部对比 -->
  <g transform="translate(40,560)">
    <rect x="0" y="0" width="1120" height="30" rx="6" fill="#1e293b"/>
    <text x="560" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">ACID 适用：金融、库存、订单     |     BASE 适用：社交 feed、搜索索引、缓存、日志     |     实际系统：核心交易走 ACID，边缘业务走 BASE</text>
  </g>
</svg>
