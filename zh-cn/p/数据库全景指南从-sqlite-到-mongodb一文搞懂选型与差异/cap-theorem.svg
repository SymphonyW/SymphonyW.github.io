<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <rect width="1100" height="700" fill="#f8fafc"/>
  <text x="550" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">CAP 定理：分布式系统的三角抉择</text>
  <text x="550" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">分布式系统最多只能同时满足三者中的两个</text>

  <!-- 三角形 -->
  <g transform="translate(550,400)">
    <!-- 三角边 -->
    <polygon points="0,-220 240,140 -240,140" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- 内部说明文字 -->
    <text x="0" y="40" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748b">Pick Any Two</text>
    <text x="0" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94a3b8">三选二</text>

    <!-- C 顶点 -->
    <g transform="translate(0,-220)">
      <circle r="70" fill="#3b82f6"/>
      <text text-anchor="middle" y="-8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">C</text>
      <text text-anchor="middle" y="16" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Consistency</text>
      <text text-anchor="middle" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dbeafe">一致性</text>
    </g>
    <text x="0" y="-310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e40af">所有节点同一时刻数据一致</text>

    <!-- A 左下顶点 -->
    <g transform="translate(-240,140)">
      <circle r="70" fill="#22c55e"/>
      <text text-anchor="middle" y="-8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">A</text>
      <text text-anchor="middle" y="16" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Availability</text>
      <text text-anchor="middle" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dcfce7">可用性</text>
    </g>
    <text x="-240" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#166534">每次请求都能收到响应（不保证最新）</text>

    <!-- P 右下顶点 -->
    <g transform="translate(240,140)">
      <circle r="70" fill="#f59e0b"/>
      <text text-anchor="middle" y="-8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">P</text>
      <text text-anchor="middle" y="16" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Partition</text>
      <text text-anchor="middle" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">分区容错</text>
    </g>
    <text x="240" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#854d0e">网络分区时系统仍能运作</text>

    <!-- 三条边上的标签 -->
    <g transform="translate(-130,-40) rotate(60)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#dbeafe" stroke="#3b82f6"/>
      <text text-anchor="middle" y="5" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">CA — 传统 RDBMS</text>
    </g>
    <g transform="translate(130,-40) rotate(-60)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
      <text text-anchor="middle" y="5" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#854d0e">CP — 强一致 NoSQL</text>
    </g>
    <g transform="translate(0,140)">
      <rect x="-90" y="-16" width="180" height="32" rx="16" fill="#dcfce7" stroke="#22c55e"/>
      <text text-anchor="middle" y="5" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">AP — 高可用 NoSQL</text>
    </g>
  </g>

  <!-- 右侧说明 -->
  <g transform="translate(820,180)">
    <rect x="0" y="0" width="260" height="380" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">三种组合的典型代表</text>

    <g transform="translate(20,60)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="10" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">CA：单点强一致</text>
      <text x="10" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">MySQL / PostgreSQL 单机</text>
      <text x="10" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">放弃分区容错，</text>
      <text x="10" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">通常通过主从复制缓解</text>
    </g>

    <g transform="translate(20,165)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="10" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">CP：强一致优先</text>
      <text x="10" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">HBase / MongoDB / Redis</text>
      <text x="10" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">分区时拒绝写入，</text>
      <text x="10" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">宁可不可用也要数据正确</text>
    </g>

    <g transform="translate(20,270)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="10" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">AP：可用性优先</text>
      <text x="10" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">Cassandra / DynamoDB</text>
      <text x="10" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">分区时仍可读写，</text>
      <text x="10" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">事后通过最终一致性收敛</text>
    </g>
  </g>

  <!-- 左侧说明 -->
  <g transform="translate(20,180)">
    <rect x="0" y="0" width="260" height="380" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">关键认知</text>

    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="68" font-weight="700" fill="#dc2626">① P 不可避免</text>
      <text x="20" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">分布式系统必然存在网络分区，</text>
      <text x="20" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">所以实际上只在 C 和 A 之间选</text>

      <text x="20" y="142" font-weight="700" fill="#dc2626">② BASE 是 AP 的妥协</text>
      <text x="20" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">Basically Available 基本可用</text>
      <text x="20" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">Soft State 软状态</text>
      <text x="20" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">Eventually Consistent 最终一致</text>

      <text x="20" y="234" font-weight="700" fill="#dc2626">③ 同一系统可切换</text>
      <text x="20" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">注册中心：ZK(CP) vs Eureka(AP)</text>
      <text x="20" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">金融场景：强选 CP</text>
      <text x="20" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">社交feed：弱选 AP</text>

      <text x="20" y="326" font-weight="700" fill="#dc2626">④ ACID ≠ 一致性全部</text>
      <text x="20" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">ACID 是事务一致性，</text>
      <text x="20" y="364" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">CAP 的 C 是副本一致性，</text>
    </g>
  </g>
</svg>
