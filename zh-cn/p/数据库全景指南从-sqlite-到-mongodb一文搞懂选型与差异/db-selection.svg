<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880">
  <rect width="1200" height="880" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">数据库选型决策树</text>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">从业务场景出发，一步步找到最合适的数据库</text>

  <!-- 起点 -->
  <g transform="translate(500,90)">
    <rect x="0" y="0" width="200" height="60" rx="30" fill="#1e293b"/>
    <text x="100" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">业务需求是什么？</text>
  </g>
  <line x1="600" y1="150" x2="600" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,180 596,172 604,172" fill="#94a3b8"/>

  <!-- 第一层判断 -->
  <g transform="translate(450,180)">
    <polygon points="150,0 300,40 150,80 0,40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">数据结构</text>
    <text x="150" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#854d0e">是否固定？</text>
  </g>

  <!-- 左：结构固定 -->
  <line x1="450" y1="220" x2="320" y2="290" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="320,290 326,282 332,290" fill="#3b82f6"/>
  <text x="380" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e40af">固定 / 强一致</text>

  <g transform="translate(160,290)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">关系型 RDBMS</text>
    <text x="160" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">需要事务、JOIN、复杂查询？</text>
    <text x="160" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">→ 优先选 SQL</text>
  </g>

  <line x1="320" y1="370" x2="320" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="320,400 316,392 324,392" fill="#94a3b8"/>

  <g transform="translate(170,400)">
    <polygon points="150,0 300,40 150,80 0,40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">规模与一致性</text>
    <text x="150" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#854d0e">需求？</text>
  </g>

  <!-- 左左：单机小项目 -->
  <line x1="170" y1="440" x2="100" y2="510" stroke="#22c55e" stroke-width="2"/>
  <polygon points="100,510 108,504 110,514" fill="#22c55e"/>
  <text x="115" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#166534">单机/嵌入式</text>
  <g transform="translate(20,510)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">SQLite</text>
    <text x="90" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">单文件 / 移动端</text>
    <text x="90" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">原型 / 测试</text>
  </g>

  <!-- 左中：Web主流 -->
  <line x1="320" y1="480" x2="320" y2="510" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="320,510 316,502 324,502" fill="#3b82f6"/>
  <text x="332" y="498" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#1e40af">Web/中等规模</text>
  <g transform="translate(220,510)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">MySQL / PostgreSQL</text>
    <text x="100" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Web 应用主流</text>
    <text x="100" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">复杂业务首选 PG</text>
  </g>

  <!-- 左右：企业级 -->
  <line x1="470" y1="440" x2="540" y2="510" stroke="#a855f7" stroke-width="2"/>
  <polygon points="540,510 532,504 530,514" fill="#a855f7"/>
  <text x="495" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b21b6">企业级/金融</text>
  <g transform="translate(440,510)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Oracle / SQL Server</text>
    <text x="100" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">银行 / 电信 / 大企业</text>
    <text x="100" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">商业支持完善</text>
  </g>

  <!-- 右：结构灵活 -->
  <line x1="750" y1="220" x2="880" y2="290" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="880,290 874,282 868,290" fill="#f59e0b"/>
  <text x="800" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#854d0e">灵活 / 易扩展</text>

  <g transform="translate(720,290)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">NoSQL 阵营</text>
    <text x="160" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">按访问模式细选？</text>
    <text x="160" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">→ 看"读多还是写多、有没有关系"</text>
  </g>

  <line x1="880" y1="370" x2="880" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="880,400 876,392 884,392" fill="#94a3b8"/>

  <g transform="translate(730,400)">
    <polygon points="150,0 300,40 150,80 0,40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">访问模式</text>
    <text x="150" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#854d0e">是哪一种？</text>
  </g>

  <!-- KV -->
  <line x1="730" y1="440" x2="660" y2="510" stroke="#ef4444" stroke-width="2"/>
  <polygon points="660,510 668,504 670,514" fill="#ef4444"/>
  <text x="675" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#991b1b">高频读写简单K-V</text>
  <g transform="translate(580,510)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#991b1b">Redis</text>
    <text x="80" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">缓存 / 会话</text>
    <text x="80" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">排行榜 / 队列</text>
  </g>

  <!-- Document -->
  <line x1="880" y1="480" x2="880" y2="510" stroke="#ec4899" stroke-width="2"/>
  <polygon points="880,510 876,502 884,502" fill="#ec4899"/>
  <text x="892" y="498" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#9d174d">JSON文档多变</text>
  <g transform="translate(760,510)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9d174d">MongoDB</text>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">内容管理 / 日志</text>
    <text x="90" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">原型 / IoT</text>
  </g>

  <!-- Column -->
  <line x1="1030" y1="440" x2="1100" y2="510" stroke="#22c55e" stroke-width="2"/>
  <polygon points="1100,510 1092,504 1090,514" fill="#22c55e"/>
  <text x="1055" y="478" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#166534">海量写入</text>
  <g transform="translate(960,510)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">Cassandra</text>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">时序 / 推荐</text>
    <text x="90" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">大规模写入</text>
  </g>

  <!-- Graph -->
  <line x1="730" y1="440" x2="660" y2="620" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="660,620 668,614 670,624" fill="#8b5cf6"/>
  <text x="660" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#5b21b6">复杂关系网络</text>
  <g transform="translate(580,620)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Neo4j</text>
    <text x="80" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">社交 / 推荐</text>
    <text x="80" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">反欺诈 / 知识图谱</text>
  </g>

  <!-- Search -->
  <line x1="1030" y1="440" x2="1100" y2="620" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="1100,620 1092,614 1090,624" fill="#f43f5e"/>
  <text x="1100" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#9f1239">全文检索/日志</text>
  <g transform="translate(960,620)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9f1239">Elasticsearch</text>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">搜索 / 日志分析</text>
    <text x="90" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">ELK 全家桶</text>
  </g>

  <!-- 时序 -->
  <line x1="880" y1="480" x2="880" y2="620" stroke="#14b8a6" stroke-width="2"/>
  <polygon points="880,620 876,612 884,612" fill="#14b8a6"/>
  <text x="892" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#115e59">时间序列</text>
  <g transform="translate(790,620)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#115e59">InfluxDB</text>
    <text x="90" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">监控指标</text>
    <text x="90" y="64" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">IoT 传感器</text>
  </g>

  <!-- 底部建议 -->
  <g transform="translate(80,740)">
    <rect x="0" y="0" width="1040" height="120" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="20" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">三条选型铁律</text>

    <g transform="translate(20,46)">
      <rect x="0" y="0" width="320" height="60" rx="8" fill="#fef3c7"/>
      <text x="160" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#854d0e">① 先 SQL，后 NoSQL</text>
      <text x="160" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">默认 MySQL/PostgreSQL，</text>
      <text x="160" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">遇到具体瓶颈再换专用库</text>
    </g>

    <g transform="translate(360,46)">
      <rect x="0" y="0" width="320" height="60" rx="8" fill="#dcfce7"/>
      <text x="160" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#166534">② 没有银弹，组合使用</text>
      <text x="160" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">MySQL + Redis + ES + MongoDB</text>
      <text x="160" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">各取所长是工业界常态</text>
    </g>

    <g transform="translate(700,46)">
      <rect x="0" y="0" width="320" height="60" rx="8" fill="#dbeafe"/>
      <text x="160" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">③ 团队熟悉度优先</text>
      <text x="160" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">再好的技术没人会维护也是灾难，</text>
      <text x="160" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">选团队可控的而非最潮的</text>
    </g>
  </g>
</svg>
