<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">SQL vs NoSQL：数据模型架构对比</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">同样的"用户 + 订单"业务，两种存储方式截然不同</text>

  <!-- 左侧 SQL -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="540" height="580" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#3b82f6"/>
    <rect x="0" y="36" width="540" height="14" fill="#3b82f6"/>
    <text x="270" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">SQL 关系型：范式化拆表 + 外键关联</text>

    <!-- users 表 -->
    <g transform="translate(30,80)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">users 表</text>
      <rect x="0" y="10" width="220" height="200" rx="6" fill="#fff" stroke="#3b82f6"/>
      <rect x="0" y="10" width="220" height="30" fill="#dbeafe"/>
      <text x="10" y="30" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#1e40af">id | name  | email</text>
      <line x1="0" y1="40" x2="220" y2="40" stroke="#3b82f6"/>
      <g font-family="Consolas,monospace" font-size="12" fill="#1e293b">
        <text x="10" y="58">1  | Alice | a@x.com</text>
        <text x="10" y="80">2  | Bob   | b@x.com</text>
        <text x="10" y="102">3  | Carol | c@x.com</text>
      </g>
      <rect x="0" y="120" width="220" height="20" fill="#fef3c7"/>
      <text x="10" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#854d0e">主键 id 唯一标识</text>
      <text x="10" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Schema 严格：所有行必须有</text>
      <text x="10" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">相同的列，类型固定</text>
      <text x="10" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-style="italic" fill="#64748b">垂直扩展为主</text>
    </g>

    <!-- orders 表 -->
    <g transform="translate(290,80)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">orders 表</text>
      <rect x="0" y="10" width="220" height="200" rx="6" fill="#fff" stroke="#3b82f6"/>
      <rect x="0" y="10" width="220" height="30" fill="#dbeafe"/>
      <text x="10" y="30" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#1e40af">id | uid | amount</text>
      <line x1="0" y1="40" x2="220" y2="40" stroke="#3b82f6"/>
      <g font-family="Consolas,monospace" font-size="12" fill="#1e293b">
        <text x="10" y="58">101| 1   | $99</text>
        <text x="10" y="80">102| 1   | $50</text>
        <text x="10" y="102">103| 2   | $200</text>
      </g>
      <rect x="0" y="120" width="220" height="20" fill="#fef3c7"/>
      <text x="10" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#854d0e">uid 是外键，指向 users.id</text>
      <text x="10" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">通过 JOIN 关联查询：</text>
      <text x="10" y="178" font-family="Consolas,monospace" font-size="10" fill="#1e40af">SELECT u.name, o.amount</text>
      <text x="10" y="192" font-family="Consolas,monospace" font-size="10" fill="#1e40af">FROM users u JOIN orders o</text>
      <text x="10" y="206" font-family="Consolas,monospace" font-size="10" fill="#1e40af">ON u.id = o.uid;</text>
    </g>

    <!-- 关联线 -->
    <g stroke="#dc2626" stroke-width="2" fill="none">
      <path d="M250,160 Q270,160 290,160" />
      <circle cx="250" cy="160" r="4" fill="#dc2626"/>
      <polygon points="290,160 282,156 282,164"/>
    </g>
    <text x="270" y="150" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#dc2626">FK</text>

    <!-- 优点 -->
    <g transform="translate(30,310)">
      <rect x="0" y="0" width="480" height="240" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <text x="10" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">特点与权衡</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="10" y="46" font-weight="700" fill="#16a34a">✓ 强一致性：ACID 事务保证</text>
        <text x="10" y="64" font-weight="700" fill="#16a34a">✓ 数据无冗余：范式化减少重复</text>
        <text x="10" y="82" font-weight="700" fill="#16a34a">✓ 复杂查询：JOIN、子查询、聚合</text>
        <text x="10" y="100" font-weight="700" fill="#16a34a">✓ 成熟标准：SQL 跨厂商通用</text>
        <text x="10" y="124" font-weight="700" fill="#dc2626">✗ 扩展难：水平分库分表复杂</text>
        <text x="10" y="142" font-weight="700" fill="#dc2626">✗ Schema 变更成本高：ALTER 锁表</text>
        <text x="10" y="160" font-weight="700" fill="#dc2626">✗ 高并发写入瓶颈</text>
        <text x="10" y="178" font-weight="700" fill="#dc2626">✗ 非结构化数据弱：JSON 支持有限</text>
        <text x="10" y="206" font-weight="700" fill="#1e40af">代表：MySQL / PostgreSQL / Oracle</text>
        <text x="10" y="224" font-weight="600" fill="#475569">适合：核心业务、金融、ERP、复杂报表</text>
      </g>
    </g>
  </g>

  <!-- 右侧 NoSQL -->
  <g transform="translate(620,110)">
    <rect x="0" y="0" width="540" height="580" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="50" rx="14" fill="#f59e0b"/>
    <rect x="0" y="36" width="540" height="14" fill="#f59e0b"/>
    <text x="270" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">NoSQL 文档型：聚合存储 + 内嵌文档</text>

    <!-- users 集合 -->
    <g transform="translate(30,80)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">users 集合（每个文档自包含）</text>
      <rect x="0" y="10" width="480" height="200" rx="6" fill="#fff" stroke="#f59e0b"/>
      <rect x="0" y="10" width="480" height="30" fill="#fef3c7"/>
      <text x="10" y="30" font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#854d0e">{ "_id": 1, "name": "Alice", "email": "a@x.com",</text>
      <line x1="0" y1="40" x2="480" y2="40" stroke="#f59e0b"/>
      <g font-family="Consolas,monospace" font-size="11" fill="#1e293b">
        <text x="20" y="58">"orders": [</text>
        <text x="40" y="76">{ "oid": 101, "amount": 99, "items": ["book","pen"] },</text>
        <text x="40" y="94">{ "oid": 102, "amount": 50, "items": ["cup"] }</text>
        <text x="20" y="112">]</text>
        <text x="10" y="130">}</text>
        <text x="10" y="158">{ "_id": 2, "name": "Bob", ..., "orders": [...] }</text>
        <text x="10" y="176">{ "_id": 3, "name": "Carol", ..., "orders": [] }</text>
      </g>
      <rect x="0" y="190" width="480" height="20" fill="#dbeafe"/>
      <text x="10" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e40af">订单直接内嵌在用户文档中，一次读取拿到所有数据</text>
    </g>

    <!-- 特点 -->
    <g transform="translate(30,310)">
      <rect x="0" y="0" width="480" height="240" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <text x="10" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#854d0e">特点与权衡</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="10" y="46" font-weight="700" fill="#16a34a">✓ Schema 灵活：字段随时增减</text>
        <text x="10" y="64" font-weight="700" fill="#16a34a">✓ 读取快：单文档自包含，无需 JOIN</text>
        <text x="10" y="82" font-weight="700" fill="#16a34a">✓ 易水平扩展：分片简单</text>
        <text x="10" y="100" font-weight="700" fill="#16a34a">✓ 贴近对象模型：JSON 与代码天然契合</text>
        <text x="10" y="124" font-weight="700" fill="#dc2626">✗ 弱一致性：BASE，需业务容忍</text>
        <text x="10" y="142" font-weight="700" fill="#dc2626">✗ 数据冗余：订单改一次要更新多份</text>
        <text x="10" y="160" font-weight="700" fill="#dc2626">✗ 复杂关联查询弱：无标准 JOIN</text>
        <text x="10" y="178" font-weight="700" fill="#dc2626">✗ 事务支持有限（4.0 后才支持多文档）</text>
        <text x="10" y="206" font-weight="700" fill="#854d0e">代表：MongoDB / CouchDB / DocumentDB</text>
        <text x="10" y="224" font-weight="600" fill="#475569">适合：内容管理、IoT、日志、快速迭代业务</text>
      </g>
    </g>
  </g>
</svg>
