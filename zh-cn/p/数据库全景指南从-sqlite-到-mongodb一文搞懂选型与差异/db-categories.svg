<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">数据库分类全景图</text>
  <text x="600" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">按数据模型与适用场景划分</text>

  <!-- 中心节点 -->
  <g transform="translate(525,360)">
    <rect x="0" y="0" width="150" height="60" rx="30" fill="#1e293b"/>
    <text x="75" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">数据库</text>
  </g>

  <!-- 第一类：关系型 -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#3b82f6"/>
    <rect x="0" y="26" width="220" height="14" fill="#3b82f6"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">关系型 RDBMS</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1e40af">行式存储 · SQL · ACID</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• MySQL — Web 主流</text>
      <text x="20" y="120">• PostgreSQL — 功能强</text>
      <text x="20" y="142">• SQLite — 嵌入式</text>
      <text x="20" y="164">• Oracle / SQL Server</text>
    </g>
  </g>

  <!-- 第二类：键值 -->
  <g transform="translate(370,140)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#f59e0b"/>
    <rect x="0" y="26" width="220" height="14" fill="#f59e0b"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">键值型 KV</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92400e">内存优先 · 极速 · 简单</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• Redis — 缓存王者</text>
      <text x="20" y="120">• Memcached — 纯缓存</text>
      <text x="20" y="142">• DynamoDB — AWS 托管</text>
      <text x="20" y="164">• etcd — 配置中心</text>
    </g>
  </g>

  <!-- 第三类：文档型 -->
  <g transform="translate(660,140)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#ec4899"/>
    <rect x="0" y="26" width="220" height="14" fill="#ec4899"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">文档型 Document</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9d174d">JSON/BSON · 灵活 Schema</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• MongoDB — 文档首选</text>
      <text x="20" y="120">• CouchDB — 离线同步</text>
      <text x="20" y="142">• Firebase Firestore</text>
      <text x="20" y="164">• DocumentDB</text>
    </g>
  </g>

  <!-- 第四类：列族 -->
  <g transform="translate(950,140)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#22c55e"/>
    <rect x="0" y="26" width="220" height="14" fill="#22c55e"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">列族型 Column</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166534">海量写入 · 高可用</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• Cassandra — 分布式</text>
      <text x="20" y="120">• HBase — Hadoop 生态</text>
      <text x="20" y="142">• ScyllaDB — 高性能</text>
      <text x="20" y="164">• Bigtable — Google</text>
    </g>
  </g>

  <!-- 第五类：图 -->
  <g transform="translate(80,440)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#8b5cf6"/>
    <rect x="0" y="26" width="220" height="14" fill="#8b5cf6"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">图型 Graph</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b21b6">节点+关系 · 关系查询</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• Neo4j — 图王者</text>
      <text x="20" y="120">• ArangoDB — 多模型</text>
      <text x="20" y="142">• JanusGraph — 分布式</text>
      <text x="20" y="164">• NebulaGraph</text>
    </g>
  </g>

  <!-- 第六类：搜索 -->
  <g transform="translate(370,440)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#f43f5e"/>
    <rect x="0" y="26" width="220" height="14" fill="#f43f5e"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">搜索引擎 Search</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9f1239">倒排索引 · 全文检索</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• Elasticsearch</text>
      <text x="20" y="120">• OpenSearch</text>
      <text x="20" y="142">• Solr</text>
      <text x="20" y="164">• Meilisearch</text>
    </g>
  </g>

  <!-- 第七类：时序 -->
  <g transform="translate(660,440)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#14b8a6"/>
    <rect x="0" y="26" width="220" height="14" fill="#14b8a6"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">时序型 TSDB</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#115e59">时间戳 · 监控指标</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• InfluxDB</text>
      <text x="20" y="120">• TimescaleDB</text>
      <text x="20" y="142">• Prometheus</text>
      <text x="20" y="164">• TDengine</text>
    </g>
  </g>

  <!-- 第八类：OLAP/列存 -->
  <g transform="translate(950,440)">
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#eab308"/>
    <rect x="0" y="26" width="220" height="14" fill="#eab308"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">列存分析 OLAP</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#854d0e">列式存储 · 大数据分析</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="98">• ClickHouse</text>
      <text x="20" y="120">• Doris</text>
      <text x="20" y="142">• Greenplum</text>
      <text x="20" y="164">• Snowflake</text>
    </g>
  </g>

  <!-- 连线 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,4" opacity="0.7">
    <line x1="300" y1="230" x2="525" y2="370"/>
    <line x1="480" y1="230" x2="540" y2="360"/>
    <line x1="770" y1="230" x2="660" y2="360"/>
    <line x1="950" y1="230" x2="675" y2="370"/>
    <line x1="300" y1="530" x2="525" y2="410"/>
    <line x1="480" y1="530" x2="540" y2="420"/>
    <line x1="770" y1="530" x2="660" y2="420"/>
    <line x1="950" y1="530" x2="675" y2="410"/>
  </g>

  <!-- 底部图例 -->
  <g transform="translate(80,680)">
    <rect x="0" y="0" width="1040" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="20" y="25" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">核心矛盾：</text>
    <text x="20" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">结构化 vs 灵活  ·  一致性 vs 可用性  ·  规模 vs 性能  ·  读写均衡 vs 海量写入  ——  没有一种数据库能赢下所有场景，所以才会有这么多分类</text>
  </g>
</svg>
