<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">理解 API 的四个维度 / Four dimensions of an API</title>
  <desc id="desc">Separate interface design, communication, encoding, and contract descriptions. Examples show resource APIs and gRPC composed from different choices.</desc>
  <rect width="1200" height="900" fill="#f8f5ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20373c">
    <text x="60" y="66" fill="#627671" font-size="22" letter-spacing="3">01 / THE MAP</text>
    <text x="60" y="123" font-size="39" font-weight="700">这些名词，回答的是不同问题</text>
    <text x="60" y="163" fill="#627671" font-size="24">Different questions, compatible choices</text>
    <g transform="translate(60 205)">
      <rect width="1080" height="115" rx="8" fill="#dceee7"/>
      <text x="25" y="43" font-size="28" font-weight="700">接口如何组织？</text>
      <text x="25" y="81" fill="#506960" font-size="22">Design &amp; message rules</text>
      <text x="365" y="43" font-size="28">REST · RPC · GraphQL</text>
      <text x="365" y="81" fill="#506960" font-size="24">消息协议 / 框架：JSON-RPC · gRPC · SOAP</text>
    </g>
    <g transform="translate(60 337)">
      <rect width="1080" height="115" rx="8" fill="#e2ebed"/>
      <text x="25" y="43" font-size="28" font-weight="700">消息如何传递？</text>
      <text x="25" y="81" fill="#506970" font-size="22">Communication</text>
      <text x="365" y="43" font-size="28">HTTP · SSE · WebSocket</text>
      <text x="365" y="81" fill="#506970" font-size="24">Webhook：由提供方发起新的 HTTP 回调请求</text>
    </g>
    <g transform="translate(60 469)">
      <rect width="1080" height="115" rx="8" fill="#f9e3cd"/>
      <text x="25" y="43" font-size="28" font-weight="700">数据如何编码？</text>
      <text x="25" y="81" fill="#816045" font-size="22">Data representation</text>
      <text x="365" y="43" font-size="28">JSON · XML · Protocol Buffers</text>
      <text x="365" y="81" fill="#816045" font-size="24">决定数据如何表示，不决定接口一定是哪种风格</text>
    </g>
    <g transform="translate(60 601)">
      <rect width="1080" height="115" rx="8" fill="#e9e2f5"/>
      <text x="25" y="43" font-size="28" font-weight="700">契约如何描述？</text>
      <text x="25" y="81" fill="#6e5e81" font-size="22">Interface contracts</text>
      <text x="365" y="43" font-size="28">OpenAPI · .proto · GraphQL Schema · WSDL</text>
      <text x="365" y="81" fill="#6e5e81" font-size="24">约定方法、参数、字段和返回值</text>
    </g>
    <path d="M60 758H1140" stroke="#ccd3cb"/>
    <text x="60" y="805" font-size="26">资源式接口 + HTTP + JSON + OpenAPI</text>
    <text x="60" y="850" font-size="26">RPC + gRPC + HTTP/2 + Protocol Buffers + .proto</text>
  </g>
</svg>
