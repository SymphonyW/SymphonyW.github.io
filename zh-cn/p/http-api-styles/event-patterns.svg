<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">SSE、WebSocket、Webhook 如何传消息 / Event delivery patterns</title>
  <desc id="desc">SSE sends events from server to client through a response. WebSocket carries messages in both directions. Webhook providers initiate separate HTTP callback requests.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#426c66" stroke-width="2"/></marker></defs>
  <rect width="1200" height="1010" fill="#f8f5ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20373c">
    <text x="60" y="66" fill="#627671" font-size="22" letter-spacing="3">04 / FOLLOW THE MESSAGES</text>
    <text x="60" y="123" font-size="39" font-weight="700">都是“推送”，消息走的路并不一样</text>
    <text x="60" y="164" fill="#627671" font-size="24">Watch who opens the exchange and where each message goes</text>
    <g transform="translate(60 205)">
      <rect width="1080" height="230" rx="8" fill="#dceee7"/>
      <text x="25" y="48" fill="#17604e" font-size="31" font-weight="700">SSE</text>
      <text x="25" y="90" font-size="24">一个 HTTP 响应</text>
      <text x="25" y="126" fill="#506960" font-size="22">One response</text>
      <text x="333" y="45" font-size="26">客户端 / Client</text>
      <text x="810" y="45" font-size="26">服务端 / Server</text>
      <path d="M410 70V201M890 70V201" stroke="#a9c4b6" stroke-width="2"/>
      <path d="M420 83H880" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="73" text-anchor="middle" font-size="22">建立请求 / Open request</text>
      <path d="M880 137H420" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M880 184H420" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="128" text-anchor="middle" font-size="22">事件 1 / Event 1</text>
      <text x="650" y="175" text-anchor="middle" font-size="22">事件 2 / Event 2</text>
    </g>
    <g transform="translate(60 455)">
      <rect width="1080" height="230" rx="8" fill="#e9e2f5"/>
      <text x="25" y="48" fill="#62428c" font-size="31" font-weight="700">WebSocket</text>
      <text x="25" y="90" font-size="24">握手后的双向消息</text>
      <text x="25" y="126" fill="#6e5e81" font-size="22">Two-way messages</text>
      <text x="333" y="45" font-size="26">客户端 / Client</text>
      <text x="810" y="45" font-size="26">服务端 / Server</text>
      <path d="M410 70V201M890 70V201" stroke="#c6bad9" stroke-width="2"/>
      <path d="M420 83H880" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="73" text-anchor="middle" font-size="22">建立连接 / Handshake</text>
      <path d="M420 137H880" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="128" text-anchor="middle" font-size="22">消息 / Message</text>
      <path d="M880 184H420" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="175" text-anchor="middle" font-size="22">消息 / Message</text>
    </g>
    <g transform="translate(60 705)">
      <rect width="1080" height="230" rx="8" fill="#f9e3cd"/>
      <text x="25" y="48" fill="#8b4b1d" font-size="31" font-weight="700">Webhook</text>
      <text x="25" y="90" font-size="24">新的 HTTP 回调</text>
      <text x="25" y="126" fill="#816045" font-size="22">A new HTTP callback</text>
      <text x="321" y="45" font-size="26">提供方 / Provider</text>
      <text x="798" y="45" font-size="26">接收方 / Receiver</text>
      <path d="M410 70V201M890 70V201" stroke="#ddc1a4" stroke-width="2"/>
      <text x="650" y="89" text-anchor="middle" font-size="22">事件发生后 / After an event</text>
      <path d="M420 135H880" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="124" text-anchor="middle" font-size="22">POST /webhooks/payments</text>
      <path d="M880 184H420" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="650" y="175" text-anchor="middle" font-size="22">接收响应 / Acknowledgement</text>
    </g>
    <text x="60" y="980" fill="#627671" font-size="23">箭头表示消息方向 / Arrows show message direction, not physical connections.</text>
  </g>
</svg>
