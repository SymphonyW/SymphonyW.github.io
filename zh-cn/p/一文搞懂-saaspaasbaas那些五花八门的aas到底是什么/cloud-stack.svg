<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">云服务三层模型：IaaS / PaaS / SaaS</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">越往上，云厂商承担越多；越往下，用户掌控越细</text>

  <!-- 左侧：栈式分层图 -->
  <!-- SaaS 层 -->
  <g transform="translate(80,130)">
    <rect x="0" y="0" width="500" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="36" rx="14" fill="#3b82f6"/>
    <rect x="0" y="22" width="500" height="14" fill="#3b82f6"/>
    <text x="20" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">SaaS · 软件即服务</text>
    <text x="480" y="24" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">面向最终用户</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1e40af">直接用，不管运维、不管升级</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
      <text x="20" y="86">钉钉 · 飞书 · Gmail · Salesforce · Notion · 有赞</text>
      <text x="20" y="106">企业微信 · 石墨文档 · Zoom · Shopify</text>
    </g>
  </g>

  <!-- PaaS 层 -->
  <g transform="translate(80,270)">
    <rect x="0" y="0" width="500" height="120" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="36" rx="14" fill="#f59e0b"/>
    <rect x="0" y="22" width="500" height="14" fill="#f59e0b"/>
    <text x="20" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">PaaS · 平台即服务</text>
    <text x="480" y="24" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fef3c7">面向开发者</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#92400e">只管写代码，运行环境平台负责</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
      <text x="20" y="86">Heroku · Google App Engine · 阿里云 EDAS · Vercel</text>
      <text x="20" y="106">Netlify · Render · Cloud Foundry · 腾讯云 TSF</text>
    </g>
  </g>

  <!-- IaaS 层 -->
  <g transform="translate(80,410)">
    <rect x="0" y="0" width="500" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="36" rx="14" fill="#22c55e"/>
    <rect x="0" y="22" width="500" height="14" fill="#22c55e"/>
    <text x="20" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">IaaS · 基础设施即服务</text>
    <text x="480" y="24" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dcfce7">面向运维</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#166534">拿虚拟机、网络、存储自己拼</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
      <text x="20" y="86">AWS EC2 · 阿里云 ECS · 腾讯云 CVM · Azure VM</text>
      <text x="20" y="106">AWS S3 · 阿里云 OSS · 云硬盘 VPC · 负载均衡</text>
    </g>
  </g>

  <!-- 物理机房（非云） -->
  <g transform="translate(80,550)">
    <rect x="0" y="0" width="500" height="80" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="20" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#475569">On-Premise · 自建机房（非云）</text>
    <text x="20" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">买服务器 · 拉专线 · 配 UPS · 自己搞空调</text>
    <text x="20" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#475569">初始成本高，弹性差，但合规、可控</text>
  </g>

  <!-- 右侧：控制权箭头 -->
  <g transform="translate(620,140)">
    <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">控制权与责任</text>
    <!-- 箭头 -->
    <line x1="20" y1="20" x2="20" y2="510" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="20,510 14,498 26,498" fill="#94a3b8"/>
    <text x="30" y="30" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#3b82f6">↑ 用户责任最少</text>
    <text x="30" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#22c55e">↓ 用户责任最多</text>
  </g>

  <!-- 右侧：抽象程度说明 -->
  <g transform="translate(740,130)">
    <rect x="0" y="0" width="400" height="500" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="40" rx="14" fill="#1e293b"/>
    <rect x="0" y="26" width="400" height="14" fill="#1e293b"/>
    <text x="200" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">用户关心什么 / 云厂商管什么</text>

    <!-- SaaS 行 -->
    <g transform="translate(0,60)">
      <text x="20" y="20" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#3b82f6">SaaS</text>
      <text x="20" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">✓ 用户：使用、配置、数据</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">✗ 厂商：应用、运行时、OS、虚拟化、硬件</text>
    </g>
    <line x1="20" y1="140" x2="380" y2="140" stroke="#e2e8f0" stroke-width="1"/>

    <!-- PaaS 行 -->
    <g transform="translate(0,160)">
      <text x="20" y="20" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#f59e0b">PaaS</text>
      <text x="20" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">✓ 用户：代码、数据、应用配置</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">✗ 厂商：运行时、OS、虚拟化、硬件</text>
    </g>
    <line x1="20" y1="240" x2="380" y2="240" stroke="#e2e8f0" stroke-width="1"/>

    <!-- IaaS 行 -->
    <g transform="translate(0,260)">
      <text x="20" y="20" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#22c55e">IaaS</text>
      <text x="20" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">✓ 用户：OS、运行时、应用、数据</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">✗ 厂商：虚拟化、硬件、网络、存储</text>
    </g>
    <line x1="20" y1="340" x2="380" y2="340" stroke="#e2e8f0" stroke-width="1"/>

    <!-- On-Prem 行 -->
    <g transform="translate(0,360)">
      <text x="20" y="20" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">On-Prem</text>
      <text x="20" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">✓ 用户：全部，连硬件、机房、空调都管</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">✗ 厂商：无（或仅送服务器上门）</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <text x="600" y="720" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">选择层级 = 在"控制权"与"省心程度"之间做权衡</text>
</svg>
