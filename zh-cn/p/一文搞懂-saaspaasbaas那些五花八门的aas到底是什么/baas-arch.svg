<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">BaaS 架构：前端/移动开发者的"后端自助餐"</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">前端只写 UI 和业务逻辑，通用后端能力由 BaaS 厂商提供</text>

  <!-- 左侧：客户端 -->
  <g transform="translate(80,170)">
    <rect x="0" y="0" width="220" height="420" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#3b82f6"/>
    <rect x="0" y="26" width="220" height="14" fill="#3b82f6"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">客户端（你写的）</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">
      <text x="20" y="76" font-weight="600" fill="#1e40af">Web / iOS / Android</text>
      <text x="20" y="108">• 页面 UI、路由</text>
      <text x="20" y="132">• 状态管理</text>
      <text x="20" y="156">• 业务逻辑</text>
      <text x="20" y="180">• 调用 BaaS SDK</text>
      <text x="20" y="216" font-weight="600" fill="#1e40af">用到的代码</text>
    </g>
    <rect x="20" y="232" width="180" height="160" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <g font-family="Consolas,monospace" font-size="12" fill="#0f172a">
      <text x="30" y="252">// 登录</text>
      <text x="30" y="270">auth.signIn(email)</text>
      <text x="30" y="296">// 存数据</text>
      <text x="30" y="314">db.collection('todos')</text>
      <text x="30" y="332">  .add({text:'学习'})</text>
      <text x="30" y="358">// 上传文件</text>
      <text x="30" y="376">storage.put(file)</text>
    </g>
  </g>

  <!-- 中间：BaaS SDK 桥梁 -->
  <g transform="translate(320,360)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="100,0 90,-6 90,6" fill="#94a3b8"/>
    <text x="50" y="-12" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">HTTPS / SDK</text>
    <line x1="100" y1="40" x2="0" y2="40" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="0,40 10,34 10,46" fill="#94a3b8"/>
    <text x="50" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">JSON 响应</text>
  </g>

  <!-- 右侧：BaaS 平台 -->
  <g transform="translate(440,140)">
    <rect x="0" y="0" width="680" height="480" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="40" rx="14" fill="#1e293b"/>
    <rect x="0" y="26" width="680" height="14" fill="#1e293b"/>
    <text x="340" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">BaaS 平台（厂商提供，开箱即用）</text>

    <!-- 六大模块 -->
    <g transform="translate(20,60)">
      <!-- 认证 -->
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">认证 Auth</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• 账号密码 / 短信</text>
        <text x="14" y="78">• OAuth 第三方登录</text>
        <text x="14" y="100">• JWT / 单点登录</text>
      </g>
    </g>

    <g transform="translate(240,60)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">数据库 DB</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• NoSQL / SQL 托管</text>
        <text x="14" y="78">• 实时同步订阅</text>
        <text x="14" y="100">• 行级权限控制</text>
      </g>
    </g>

    <g transform="translate(460,60)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9d174d">存储 Storage</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• 图片 / 视频 / 文件</text>
        <text x="14" y="78">• CDN 加速分发</text>
        <text x="14" y="100">• 断点续传</text>
      </g>
    </g>

    <g transform="translate(20,200)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">云函数 Function</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• 自定义后端逻辑</text>
        <text x="14" y="78">• 定时触发</text>
        <text x="14" y="100">• HTTP / DB 触发</text>
      </g>
    </g>

    <g transform="translate(240,200)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">推送 Push</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• iOS APNs / Android FCM</text>
        <text x="14" y="78">• 主题订阅</text>
        <text x="14" y="100">• 模板消息</text>
      </g>
    </g>

    <g transform="translate(460,200)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">分析 Analytics</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="14" y="56">• 用户行为埋点</text>
        <text x="14" y="78">• 留存 / 漏斗</text>
        <text x="14" y="100">• 自定义事件</text>
      </g>
    </g>

    <!-- 底部：代表厂商 -->
    <g transform="translate(20,350)">
      <rect x="0" y="0" width="640" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="26" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">代表性 BaaS 产品</text>
      <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
        <text x="20" y="52">• <tspan font-weight="700" fill="#f59e0b">Firebase</tspan>（Google）— 全球最知名，含 Auth/RTDB/Storage/Firestore/FCM</text>
        <text x="20" y="72">• <tspan font-weight="700" fill="#22c55e">Supabase</tspan> — 开源 PostgreSQL + Auth + Storage，被誉为 Firebase 替代</text>
        <text x="20" y="92">• <tspan font-weight="700" fill="#3b82f6">LeanCloud</tspan> / <tspan font-weight="700" fill="#ec4899">微信云开发</tspan> / <tspan font-weight="700" fill="#8b5cf6">阿里云移动研发平台 EMAS</tspan></text>
      </g>
    </g>
  </g>
</svg>
