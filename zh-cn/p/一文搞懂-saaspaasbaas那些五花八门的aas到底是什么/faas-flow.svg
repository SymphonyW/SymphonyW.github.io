<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">FaaS 工作流：事件驱动 + 按需调用 + 自动伸缩</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">不用常驻服务器，有请求才唤起函数，按毫秒计费</text>

  <!-- 事件源 -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="220" height="360" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="14" fill="#1e293b"/>
    <rect x="0" y="26" width="220" height="14" fill="#1e293b"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">事件源 Triggers</text>

    <g transform="translate(20,60)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e40af">HTTP 请求</text>
    </g>
    <g transform="translate(20,116)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#92400e">对象存储事件</text>
    </g>
    <g transform="translate(20,172)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#166534">消息队列事件</text>
    </g>
    <g transform="translate(20,228)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#fce7f3" stroke="#ec4899"/>
      <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#9d174d">数据库变更</text>
    </g>
    <g transform="translate(20,284)">
      <rect x="0" y="0" width="180" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="90" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5b21b6">定时器 Cron</text>
    </g>
  </g>

  <!-- 箭头1 -->
  <g transform="translate(290,360)">
    <line x1="0" y1="-20" x2="80" y2="-20" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="80,-20 70,-26 70,-14" fill="#94a3b8"/>
    <line x1="0" y1="20" x2="80" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="80,20 70,14 70,26" fill="#94a3b8"/>
    <text x="40" y="-30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">触发</text>
  </g>

  <!-- FaaS 控制平面 -->
  <g transform="translate(380,180)">
    <rect x="0" y="0" width="380" height="360" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="40" rx="14" fill="#3b82f6"/>
    <rect x="0" y="26" width="380" height="14" fill="#3b82f6"/>
    <text x="190" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">FaaS 控制平面</text>

    <g transform="translate(20,60)">
      <text x="0" y="14" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">① 路由 / 鉴权</text>
      <text x="0" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">把事件分发到对应函数</text>
    </g>

    <g transform="translate(20,110)">
      <text x="0" y="14" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">② 冷启动 / 复用</text>
      <text x="0" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">无实例 → 拉镜像启动（~100ms）</text>
      <text x="0" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">有热实例 → 直接复用（~1ms）</text>
    </g>

    <!-- 函数实例 -->
    <g transform="translate(20,180)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="50" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">fn-instance</text>
      <text x="50" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#166534">v1.0</text>
    </g>
    <g transform="translate(130,180)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="50" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">fn-instance</text>
      <text x="50" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#166534">v1.0</text>
    </g>
    <g transform="translate(240,180)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="50" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">scaling…</text>
      <text x="50" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#92400e">+N</text>
    </g>

    <g transform="translate(20,260)">
      <text x="0" y="14" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">③ 自动伸缩</text>
      <text x="0" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">QPS 高 → 加实例；空闲 → 缩到 0</text>
      <text x="0" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">按执行时长 × 内存 × 调用次数计费</text>
    </g>
  </g>

  <!-- 箭头2 -->
  <g transform="translate(770,360)">
    <line x1="0" y1="-20" x2="80" y2="-20" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="80,-20 70,-26 70,-14" fill="#94a3b8"/>
    <line x1="80" y1="20" x2="0" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="0,20 10,14 10,26" fill="#94a3b8"/>
    <text x="40" y="-30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">读写</text>
  </g>

  <!-- 后端服务 -->
  <g transform="translate(860,180)">
    <rect x="0" y="0" width="280" height="360" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="14" fill="#1e293b"/>
    <rect x="0" y="26" width="280" height="14" fill="#1e293b"/>
    <text x="140" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">后端服务</text>

    <g transform="translate(20,60)">
      <rect x="0" y="0" width="240" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="120" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e40af">托管数据库 RDS/DynamoDB</text>
    </g>
    <g transform="translate(20,116)">
      <rect x="0" y="0" width="240" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="120" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#92400e">对象存储 S3 / OSS</text>
    </g>
    <g transform="translate(20,172)">
      <rect x="0" y="0" width="240" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="120" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#166534">消息队列 Kinesis / Kafka</text>
    </g>
    <g transform="translate(20,228)">
      <rect x="0" y="0" width="240" height="44" rx="6" fill="#fce7f3" stroke="#ec4899"/>
      <text x="120" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#9d174d">缓存 Redis / ElastiCache</text>
    </g>
    <g transform="translate(20,284)">
      <rect x="0" y="0" width="240" height="44" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="120" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5b21b6">第三方 API（支付/短信）</text>
    </g>
  </g>

  <!-- 底部：代表产品 -->
  <g transform="translate(60,580)">
    <rect x="0" y="0" width="1080" height="80" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="20" y="26" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">代表性 FaaS 产品</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b">
      <text x="20" y="50">• <tspan font-weight="700" fill="#f59e0b">AWS Lambda</tspan> — FaaS 鼻祖，与 API Gateway / S3 / Kinesis 深度集成</text>
      <text x="20" y="68">• <tspan font-weight="700" fill="#3b82f6">阿里云函数计算 FC</tspan> · <tspan font-weight="700" fill="#22c55e">腾讯云 SCF</tspan> · <tspan font-weight="700" fill="#ec4899">Azure Functions</tspan> · <tspan font-weight="700" fill="#8b5cf6">Google Cloud Functions</tspan> · <tspan font-weight="700" fill="#92400e">Cloudflare Workers</tspan></text>
    </g>
  </g>
</svg>
