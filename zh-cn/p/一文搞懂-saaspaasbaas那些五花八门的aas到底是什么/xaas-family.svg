<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">XaaS 全家福：所有"as a Service"模式一览</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">XaaS = X as a Service，把任意"X"打包成可按需使用的云服务</text>

  <!-- 中心公式 -->
  <g transform="translate(440,110)">
    <rect x="0" y="0" width="320" height="60" rx="30" fill="#1e293b"/>
    <text x="160" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">X + as a Service = 按需使用的云服务</text>
  </g>

  <!-- 第一行 -->
  <!-- SaaS -->
  <g transform="translate(60,200)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#3b82f6"/>
    <rect x="0" y="18" width="200" height="14" fill="#3b82f6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">SaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e40af">Software as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">软件即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">钉钉 / Salesforce / Notion</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向最终用户</text>
  </g>

  <!-- PaaS -->
  <g transform="translate(280,200)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#f59e0b"/>
    <rect x="0" y="18" width="200" height="14" fill="#f59e0b"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">PaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#92400e">Platform as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">平台即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Heroku / Vercel / GAE</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向开发者</text>
  </g>

  <!-- IaaS -->
  <g transform="translate(500,200)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#22c55e"/>
    <rect x="0" y="18" width="200" height="14" fill="#22c55e"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">IaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#166534">Infrastructure as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">基础设施即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">EC2 / ECS / CVM / S3</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向运维</text>
  </g>

  <!-- BaaS -->
  <g transform="translate(720,200)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#ec4899"/>
    <rect x="0" y="18" width="200" height="14" fill="#ec4899"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">BaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#9d174d">Backend as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">后端即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Firebase / Supabase / LeanCloud</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向前端/移动</text>
  </g>

  <!-- FaaS -->
  <g transform="translate(940,200)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="18" width="200" height="14" fill="#8b5cf6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">FaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#5b21b6">Function as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">函数即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Lambda / SCF / Workers</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">无服务器</text>
  </g>

  <!-- 第二行 -->
  <!-- DaaS -->
  <g transform="translate(60,360)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#3b82f6"/>
    <rect x="0" y="18" width="200" height="14" fill="#3b82f6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">DaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e40af">Data as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">数据即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">天气API / 工商数据 / Bloomberg</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向数据消费者</text>
  </g>

  <!-- AIaaS -->
  <g transform="translate(280,360)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#f59e0b"/>
    <rect x="0" y="18" width="200" height="14" fill="#f59e0b"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">AIaaS / MaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#92400e">AI / Model as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">AI / 模型即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">GLM API / OpenAI / 通义千问</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向应用集成方</text>
  </g>

  <!-- DBaaS -->
  <g transform="translate(500,360)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#22c55e"/>
    <rect x="0" y="18" width="200" height="14" fill="#22c55e"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">DBaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#166534">Database as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">数据库即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">RDS / MongoDB Atlas / PolarDB</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向开发者</text>
  </g>

  <!-- CaaS -->
  <g transform="translate(720,360)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#ec4899"/>
    <rect x="0" y="18" width="200" height="14" fill="#ec4899"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">CaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#9d174d">Containers as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">容器即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">ACK / EKS / GKE / ACR</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向容器化应用</text>
  </g>

  <!-- STaaS -->
  <g transform="translate(940,360)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="18" width="200" height="14" fill="#8b5cf6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">STaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#5b21b6">Storage as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">存储即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">OSS / S3 / COS / 七牛云</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向应用与备份</text>
  </g>

  <!-- 第三行 -->
  <!-- NaaS -->
  <g transform="translate(60,520)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#3b82f6"/>
    <rect x="0" y="18" width="200" height="14" fill="#3b82f6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">NaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e40af">Network as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">网络即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">CDN / SDN / Cloudflare</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向分发与组网</text>
  </g>

  <!-- SECaaS -->
  <g transform="translate(280,520)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#f59e0b"/>
    <rect x="0" y="18" width="200" height="14" fill="#f59e0b"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">SECaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#92400e">Security as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">安全即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">WAF / DDoS 防护 / Cloudflare</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向安全合规</text>
  </g>

  <!-- DRaaS -->
  <g transform="translate(500,520)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#22c55e"/>
    <rect x="0" y="18" width="200" height="14" fill="#22c55e"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">DRaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#166534">Disaster Recovery as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">灾备即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">云上容灾 / 跨地域备份</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向业务连续性</text>
  </g>

  <!-- WaaS -->
  <g transform="translate(720,520)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#ec4899"/>
    <rect x="0" y="18" width="200" height="14" fill="#ec4899"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">WaaS / DaaS-桌面</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#9d174d">Workspace / Desktop as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">工作空间/桌面即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">云桌面 / VDI / 阿里云无影</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向远程办公</text>
  </g>

  <!-- ITaaS -->
  <g transform="translate(940,520)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="18" width="200" height="14" fill="#8b5cf6"/>
    <text x="100" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">ITaaS</text>
    <text x="14" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#5b21b6">IT as a Service</text>
    <text x="14" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">IT 即服务</text>
    <text x="14" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">整体 IT 外包 / MSP</text>
    <text x="14" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">面向企业整体</text>
  </g>

  <!-- 底部说明 -->
  <text x="600" y="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">还有 IPaaS（集成）、VPaaS（视频）、BPaaS（业务流程）、EaaS（任何东西）…… 名字会持续增加，本质都是"把某能力服务化"</text>
</svg>
