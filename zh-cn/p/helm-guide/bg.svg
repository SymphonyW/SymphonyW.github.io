<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Helm：让 Kubernetes 应用成为可复用的包</title><desc id="desc">Templates + values → Kubernetes resources → A recorded release</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2768cf"/></marker></defs><rect width="1200" height="630" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif"><text x="54" y="58" font-size="32" font-weight="700" fill="#16324f" text-anchor="start">Helm：让 Kubernetes 应用成为可复用的包</text><text x="54" y="95" font-size="20" font-weight="400" fill="#576b80" text-anchor="start">Templates + values → Kubernetes resources → A recorded release</text><rect x="54" y="140" width="1092" height="420" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><text x="88" y="250" font-size="94" font-weight="750" fill="#2768cf" text-anchor="start">Helm</text><text x="91" y="301" font-size="29" font-weight="600" fill="#16324f" text-anchor="start">写一份部署方案</text><text x="91" y="343" font-size="27" font-weight="400" fill="#16324f" text-anchor="start">用不同参数重复安装</text><text x="91" y="397" font-size="22" font-weight="400" fill="#576b80" text-anchor="start">预览 · 安装 · 升级 · 回滚</text><rect x="505" y="176" width="265" height="145" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="505" y="192" width="5" height="113" rx="2" fill="#2768cf"/><text x="529" y="218" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Chart</text><text x="529" y="249" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Reusable templates</text><text x="529" y="291" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">templates/*.yaml</text><rect x="821" y="176" width="287" height="145" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="821" y="192" width="5" height="113" rx="2" fill="#087f8c"/><text x="845" y="218" font-size="27" font-weight="700" fill="#087f8c" text-anchor="start">values</text><text x="845" y="249" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Environment settings</text><text x="845" y="291" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas · image · port</text><path d="M 635 326 L 635 363" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><path d="M 960 326 L 960 363" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="373" width="603" height="126" rx="18" fill="#edf4ff" stroke="#b9d0f4" stroke-width="2"/><text x="535" y="419" font-size="32" font-weight="700" fill="#2768cf" text-anchor="start">Release → Kubernetes</text><text x="535" y="462" font-size="23" font-weight="400" fill="#16324f" text-anchor="start">同一套模板，独立的安装实例与历史</text><text x="1146" y="606" font-size="14" font-weight="600" fill="#576b80" text-anchor="end">SNOW / HELM FIELD NOTES</text></g></svg>
