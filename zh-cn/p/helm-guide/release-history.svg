<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">回滚产生新记录，不把历史编号倒退</title><desc id="desc">Rollback re-applies an earlier revision; it does not restore database contents.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2768cf"/></marker></defs><rect width="1200" height="630" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif"><text x="54" y="58" font-size="32" font-weight="700" fill="#16324f" text-anchor="start">回滚产生新记录，不把历史编号倒退</text><text x="54" y="95" font-size="20" font-weight="400" fill="#576b80" text-anchor="start">Rollback re-applies an earlier revision; it does not restore database contents.</text><rect x="54" y="165" width="322" height="216" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="54" y="181" width="5" height="184" rx="2" fill="#2768cf"/><text x="78" y="207" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Revision 1</text><text x="78" y="238" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Install / 首次安装</text><text x="78" y="280" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas: 1</text><text x="78" y="314" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Chart: 0.1.0</text><path d="M 384 270 L 429 270" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="443" y="165" width="322" height="216" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="443" y="181" width="5" height="184" rx="2" fill="#087f8c"/><text x="467" y="207" font-size="27" font-weight="700" fill="#087f8c" text-anchor="start">Revision 2</text><text x="467" y="238" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Upgrade / 升级</text><text x="467" y="280" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas: 2</text><text x="467" y="314" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Chart: 0.1.0</text><path d="M 773 270 L 818 270" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="832" y="165" width="314" height="216" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="832" y="181" width="5" height="184" rx="2" fill="#7350aa"/><text x="856" y="207" font-size="27" font-weight="700" fill="#7350aa" text-anchor="start">Revision 3</text><text x="856" y="238" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Rollback to 1 / 回滚</text><text x="856" y="280" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas: 1</text><text x="856" y="314" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">New revision, old config</text><path d="M 215 389 L 215 432 L 989 432 L 989 389" fill="none" stroke="#2768cf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="600" y="472" font-size="25" font-weight="600" fill="#2768cf" text-anchor="middle">helm rollback demo 1 → revision 3</text><rect x="54" y="502" width="1092" height="66" rx="18" fill="#fff2e7" stroke="#e9c7a8" stroke-width="2"/><text x="80" y="544" font-size="26" font-weight="600" fill="#875019" text-anchor="start">恢复资源配置 ≠ 恢复数据库、外部系统或脚本副作用</text><text x="1146" y="606" font-size="14" font-weight="600" fill="#576b80" text-anchor="end">SNOW / HELM FIELD NOTES</text></g></svg>
