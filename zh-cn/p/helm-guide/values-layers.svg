<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">多环境只改参数，不复制整套模板</title><desc id="desc">Higher layers override lower layers for the same key.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2768cf"/></marker></defs><rect width="1200" height="670" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif"><text x="54" y="58" font-size="32" font-weight="700" fill="#16324f" text-anchor="start">多环境只改参数，不复制整套模板</text><text x="54" y="95" font-size="20" font-weight="400" fill="#576b80" text-anchor="start">Higher layers override lower layers for the same key.</text><rect x="54" y="150" width="520" height="92" rx="18" fill="#edf4ff" stroke="#b9d0f4" stroke-width="2"/><text x="80" y="190" font-size="26" font-weight="700" fill="#2768cf" text-anchor="start">1  Chart values.yaml</text><text x="80" y="223" font-size="21" font-weight="400" fill="#16324f" text-anchor="start">replicaCount: 1</text><path d="M 314 251 L 314 279" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="291" width="520" height="92" rx="18" fill="#e8f5f3" stroke="#a9d8d1" stroke-width="2"/><text x="80" y="331" font-size="26" font-weight="700" fill="#087f8c" text-anchor="start">2  -f values-prod.yaml</text><text x="80" y="364" font-size="21" font-weight="400" fill="#16324f" text-anchor="start">replicaCount: 3</text><path d="M 314 392 L 314 420" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="432" width="520" height="92" rx="18" fill="#f1ebfa" stroke="#ccb9e5" stroke-width="2"/><text x="80" y="472" font-size="26" font-weight="700" fill="#7350aa" text-anchor="start">3  --set replicaCount=2</text><text x="80" y="505" font-size="20" font-weight="400" fill="#16324f" text-anchor="start">Explicit command-line override</text><path d="M 584 477 L 636 477" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="652" y="392" width="494" height="170" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="652" y="408" width="5" height="138" rx="2" fill="#7350aa"/><text x="676" y="434" font-size="27" font-weight="700" fill="#7350aa" text-anchor="start">Result / 最终结果</text><text x="676" y="465" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Rendered Deployment</text><text x="676" y="507" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas: 2</text><rect x="652" y="150" width="494" height="190" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><text x="680" y="195" font-size="28" font-weight="700" fill="#16324f" text-anchor="start">一份 Chart，多套输入</text><text x="680" y="240" font-size="21" font-weight="400" fill="#16324f" text-anchor="start">Multiple -f files: rightmost wins.</text><text x="680" y="278" font-size="21" font-weight="400" fill="#576b80" text-anchor="start">Map keys merge; lists usually replace.</text><text x="54" y="602" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">--set-string: keep versions and tags as strings. 版本号、镜像标签可明确按字符串传入。</text><text x="1146" y="646" font-size="14" font-weight="600" fill="#576b80" text-anchor="end">SNOW / HELM FIELD NOTES</text></g></svg>
