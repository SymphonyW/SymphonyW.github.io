<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="ghGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#24292e"/><stop offset="100%" stop-color="#1a1e22"/></linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2088ff"/><stop offset="100%" stop-color="#0969da"/></linearGradient>
    <linearGradient id="hugoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff4088"/><stop offset="100%" stop-color="#c2185b"/></linearGradient>
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
  </defs>
  <rect width="1200" height="440" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">本博客的自动部署流程</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(40,120)">
      <rect width="220" height="160" rx="14" fill="url(#ghGrad)"/>
      <text x="110" y="55" text-anchor="middle" font-size="40">💻</text>
      <text x="110" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">git push</text>
      <text x="110" y="125" text-anchor="middle" font-size="13" fill="#8b949e">推送到 main 分支</text>
      <text x="110" y="145" text-anchor="middle" font-size="12" fill="#8b949e">源仓库 SymphonyW/myBlog</text>
    </g>
    <g transform="translate(330,120)">
      <rect width="220" height="160" rx="14" fill="url(#actGrad)"/>
      <text x="110" y="55" text-anchor="middle" font-size="40">⚙️</text>
      <text x="110" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GitHub Actions</text>
      <text x="110" y="125" text-anchor="middle" font-size="13" fill="#dbeafe">触发 deploy 工作流</text>
      <text x="110" y="145" text-anchor="middle" font-size="12" fill="#dbeafe">ubuntu-latest Runner</text>
    </g>
    <g transform="translate(620,120)">
      <rect width="220" height="160" rx="14" fill="url(#hugoGrad)"/>
      <text x="110" y="55" text-anchor="middle" font-size="40">🔨</text>
      <text x="110" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Hugo Build</text>
      <text x="110" y="125" text-anchor="middle" font-size="13" fill="#fce7f3">hugo -D 生成静态站</text>
      <text x="110" y="145" text-anchor="middle" font-size="12" fill="#fce7f3">输出到 ./public</text>
    </g>
    <g transform="translate(910,120)">
      <rect width="240" height="160" rx="14" fill="url(#pagesGrad)"/>
      <text x="120" y="55" text-anchor="middle" font-size="40">🌐</text>
      <text x="120" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GitHub Pages</text>
      <text x="120" y="125" text-anchor="middle" font-size="13" fill="#d1fae5">推送到外部仓库</text>
      <text x="120" y="145" text-anchor="middle" font-size="12" fill="#d1fae5">SymphonyW.github.io</text>
    </g>
    <g stroke="#64748b" stroke-width="3" fill="#64748b">
      <line x1="260" y1="200" x2="325" y2="200"/>
      <polygon points="325,200 315,195 315,205"/>
      <line x1="550" y1="200" x2="615" y2="200"/>
      <polygon points="615,200 605,195 605,205"/>
      <line x1="840" y1="200" x2="905" y2="200"/>
      <polygon points="905,200 895,195 895,205"/>
    </g>
  </g>
  <g transform="translate(60,330)">
    <rect width="1080" height="80" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="540" y="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">全程耗时约 1 分钟 · 无人值守</text>
    <text x="540" y="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">PERSONAL_TOKEN 从 Secrets 注入 · 绝不出现在日志中 · 构建产物可追溯</text>
  </g>
</svg>
