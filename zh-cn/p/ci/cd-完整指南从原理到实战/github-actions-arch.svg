<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">GitHub Actions 架构层级</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(100,90)">
      <rect width="1000" height="110" rx="12" fill="#8b5cf6" opacity="0.95"/>
      <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Workflow 工作流</text>
      <text x="500" y="68" text-anchor="middle" font-size="14" fill="#ede9fe">一个 YAML 文件 · 定义完整自动化流程 · 由 Event 触发</text>
      <text x="500" y="92" text-anchor="middle" font-size="13" fill="#ddd6fe">触发事件：push / pull_request / schedule / workflow_dispatch</text>
    </g>
    <g transform="translate(100,230)">
      <rect width="470" height="110" rx="12" fill="#3b82f6" opacity="0.95"/>
      <text x="235" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Job 1 (build)</text>
      <text x="235" y="68" text-anchor="middle" font-size="13" fill="#dbeafe">runs-on: ubuntu-latest</text>
      <text x="235" y="92" text-anchor="middle" font-size="13" fill="#dbeafe">独立虚拟机 · 默认并行执行</text>
    </g>
    <g transform="translate(630,230)">
      <rect width="470" height="110" rx="12" fill="#3b82f6" opacity="0.95"/>
      <text x="235" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Job 2 (deploy)</text>
      <text x="235" y="68" text-anchor="middle" font-size="13" fill="#dbeafe">needs: build · 依赖 Job 1</text>
      <text x="235" y="92" text-anchor="middle" font-size="13" fill="#dbeafe">串行执行 · 上游失败则跳过</text>
    </g>
    <g transform="translate(100,370)">
      <rect width="470" height="220" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="235" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Steps (步骤序列)</text>
      <g transform="translate(20,55)">
        <rect width="430" height="36" rx="6" fill="#eff6ff"/>
        <text x="15" y="23" font-size="13" fill="#1e40af">▸ actions/checkout@v4</text>
      </g>
      <g transform="translate(20,99)">
        <rect width="430" height="36" rx="6" fill="#eff6ff"/>
        <text x="15" y="23" font-size="13" fill="#1e40af">▸ actions/setup-go@v5</text>
      </g>
      <g transform="translate(20,143)">
        <rect width="430" height="36" rx="6" fill="#fef3c7"/>
        <text x="15" y="23" font-size="13" fill="#92400e">▸ run: go test ./...</text>
      </g>
      <g transform="translate(20,187)">
        <rect width="430" height="22" rx="6" fill="#dcfce7"/>
        <text x="15" y="15" font-size="12" fill="#166534">✓ run: go build -o app</text>
      </g>
    </g>
    <g transform="translate(630,370)">
      <rect width="470" height="220" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="235" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Steps (步骤序列)</text>
      <g transform="translate(20,55)">
        <rect width="430" height="36" rx="6" fill="#eff6ff"/>
        <text x="15" y="23" font-size="13" fill="#1e40af">▸ download artifact</text>
      </g>
      <g transform="translate(20,99)">
        <rect width="430" height="36" rx="6" fill="#eff6ff"/>
        <text x="15" y="23" font-size="13" fill="#1e40af">▸ docker build &amp; push</text>
      </g>
      <g transform="translate(20,143)">
        <rect width="430" height="36" rx="6" fill="#fef3c7"/>
        <text x="15" y="23" font-size="13" fill="#92400e">▸ deploy to k8s</text>
      </g>
      <g transform="translate(20,187)">
        <rect width="430" height="22" rx="6" fill="#fef2f2"/>
        <text x="15" y="15" font-size="12" fill="#991b1b">▸ notify slack</text>
      </g>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,4">
    <line x1="600" y1="200" x2="335" y2="230"/>
    <line x1="600" y1="200" x2="865" y2="230"/>
    <line x1="335" y1="340" x2="335" y2="370"/>
    <line x1="865" y1="340" x2="865" y2="370"/>
  </g>
  <text x="600" y="610" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">Workflow 包含多个 Job，每个 Job 包含多个 Step，Step 可调用现成 Action 或直接 run 命令</text>
</svg>
