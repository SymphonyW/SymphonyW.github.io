<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">K8s container cloud deployment workflow</title>
  <desc id="desc">A deployment pipeline from Dockerfile to container image, registry, Kubernetes workload, service, ingress, and production traffic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102133"/>
      <stop offset="45%" stop-color="#153a4a"/>
      <stop offset="100%" stop-color="#1f493d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#d7f3e8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07111c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 690 C260 610 340 760 570 690 C810 616 910 520 1150 600 C1335 662 1422 730 1600 650 L1600 900 L0 900 Z" fill="#6ee7b7" opacity="0.16"/>
  <path d="M0 210 C220 145 315 260 505 205 C735 138 850 82 1068 154 C1230 208 1350 292 1600 210 L1600 0 L0 0 Z" fill="#38bdf8" opacity="0.12"/>

  <g transform="translate(120 128)">
    <text x="0" y="0" fill="#e8fff7" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">K8s 容器云部署流程</text>
    <text x="0" y="62" fill="#bceadd" font-family="Segoe UI, Arial, sans-serif" font-size="28">Dockerfile → Image → Registry → Deployment → Service → Ingress</text>
  </g>

  <g transform="translate(120 285)" filter="url(#shadow)">
    <rect x="0" y="0" width="1360" height="390" rx="28" fill="url(#panel)"/>
    <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(110 170)">
        <rect x="-78" y="-64" width="156" height="128" rx="18" fill="#155e75"/>
        <text x="0" y="-12" fill="#ecfeff" font-size="24" font-weight="700">Source</text>
        <text x="0" y="24" fill="#a7f3d0" font-size="18">代码仓库</text>
      </g>
      <g transform="translate(330 170)">
        <rect x="-88" y="-64" width="176" height="128" rx="18" fill="#166534"/>
        <text x="0" y="-12" fill="#f0fdf4" font-size="24" font-weight="700">Dockerfile</text>
        <text x="0" y="24" fill="#bbf7d0" font-size="18">构建说明</text>
      </g>
      <g transform="translate(560 170)">
        <rect x="-88" y="-64" width="176" height="128" rx="18" fill="#0f766e"/>
        <text x="0" y="-12" fill="#f0fdfa" font-size="24" font-weight="700">Image</text>
        <text x="0" y="24" fill="#ccfbf1" font-size="18">镜像制品</text>
      </g>
      <g transform="translate(790 170)">
        <rect x="-88" y="-64" width="176" height="128" rx="18" fill="#1d4ed8"/>
        <text x="0" y="-12" fill="#eff6ff" font-size="24" font-weight="700">Registry</text>
        <text x="0" y="24" fill="#bfdbfe" font-size="18">镜像仓库</text>
      </g>
      <g transform="translate(1020 170)">
        <rect x="-98" y="-64" width="196" height="128" rx="18" fill="#7c3aed"/>
        <text x="0" y="-12" fill="#faf5ff" font-size="24" font-weight="700">Deployment</text>
        <text x="0" y="24" fill="#ddd6fe" font-size="18">工作负载</text>
      </g>
      <g transform="translate(1250 170)">
        <rect x="-88" y="-64" width="176" height="128" rx="18" fill="#be123c"/>
        <text x="0" y="-12" fill="#fff1f2" font-size="24" font-weight="700">Traffic</text>
        <text x="0" y="24" fill="#fecdd3" font-size="18">生产访问</text>
      </g>
    </g>
    <g stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.72">
      <path d="M195 170 H242"/>
      <path d="M418 170 H472"/>
      <path d="M648 170 H702"/>
      <path d="M878 170 H922"/>
      <path d="M1118 170 H1162"/>
    </g>
    <g fill="#334155" opacity="0.72">
      <path d="M242 170 l-13 -9 v18 z"/>
      <path d="M472 170 l-13 -9 v18 z"/>
      <path d="M702 170 l-13 -9 v18 z"/>
      <path d="M922 170 l-13 -9 v18 z"/>
      <path d="M1162 170 l-13 -9 v18 z"/>
    </g>
    <text x="680" y="320" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="25" text-anchor="middle">把“代码能跑”变成“集群里稳定、可回滚、可观测地运行”</text>
  </g>
</svg>
