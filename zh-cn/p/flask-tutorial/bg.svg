<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flask 实战教程封面</title>
  <desc id="desc">面向 Python 开发者的轻量 Web 后端实战教程封面图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff7ff"/>
      <stop offset="100%" stop-color="#fff7e8"/>
    </linearGradient>
    <style>
      .font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}
      .title{font-size:82px;font-weight:800;fill:#102a43}
      .headline{font-size:43px;font-weight:800;fill:#17202a}
      .muted{font-size:28px;fill:#52606d}
      .code{font-size:28px;fill:#d6e7ff;font-family:Consolas,"Cascadia Mono",monospace}
      .code-accent{fill:#bdefea}
      .code-warn{fill:#f8e6a0}
      .pill{font-size:25px;font-weight:700;fill:white}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".55" stroke="#dce8ef" stroke-width="1">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600M0 800H1600"/>
    <path d="M80 0V900M160 0V900M240 0V900M320 0V900M400 0V900M480 0V900M560 0V900M640 0V900M720 0V900M800 0V900M880 0V900M960 0V900M1040 0V900M1120 0V900M1200 0V900M1280 0V900M1360 0V900M1440 0V900M1520 0V900"/>
  </g>
  <rect x="92" y="92" width="618" height="118" rx="34" fill="#fff" stroke="#c9d8e6" stroke-width="3"/>
  <text x="132" y="176" class="font title">Flask</text>
  <text x="132" y="306" class="font headline">面向 Python 开发者的</text>
  <text x="132" y="366" class="font headline">轻量 Web 后端实战教程</text>
  <text x="132" y="440" class="font muted">从第一个路由到模板、表单、会话、蓝图、测试与部署。</text>
  <text x="132" y="485" class="font muted">重点是理解 Flask 的自由度，并把自由变成可维护的项目结构。</text>
  <g transform="translate(132 725)">
    <rect width="90" height="46" rx="23" fill="#2563eb"/><text x="18" y="32" class="font pill">路由</text>
    <rect x="102" width="116" height="46" rx="23" fill="#e76f51"/><text x="120" y="32" class="font pill">Jinja2</text>
    <rect x="230" width="90" height="46" rx="23" fill="#0f766e"/><text x="248" y="32" class="font pill">蓝图</text>
    <rect x="332" width="90" height="46" rx="23" fill="#7c3aed"/><text x="350" y="32" class="font pill">测试</text>
    <rect x="434" width="90" height="46" rx="23" fill="#102a43"/><text x="452" y="32" class="font pill">部署</text>
  </g>
  <rect x="890" y="130" width="595" height="575" rx="32" fill="#18212d" stroke="#2e3a48" stroke-width="3"/>
  <circle cx="950" cy="186" r="11" fill="#ff5f56"/><circle cx="988" cy="186" r="11" fill="#ffbd2e"/><circle cx="1026" cy="186" r="11" fill="#27c93f"/>
  <text x="942" y="266" class="code code-accent">from flask import Flask, request</text>
  <text x="942" y="344" class="code" fill="#fff">app = Flask(__name__)</text>
  <text x="942" y="420" class="code code-warn">@app.get('/health')</text>
  <text x="942" y="458" class="code" fill="#fff">def health():</text>
  <text x="974" y="496" class="code">return {'status': 'ok'}</text>
  <text x="942" y="572" class="code code-warn">@app.post('/items')</text>
  <text x="942" y="610" class="code" fill="#fff">def create_item():</text>
  <text x="974" y="648" class="code">data = request.get_json()</text>
  <text x="974" y="686" class="code">return data, 201</text>
  <rect x="1030" y="748" width="360" height="64" rx="22" fill="#fff" stroke="#c9d8e6" stroke-width="3"/>
  <text x="1060" y="791" class="font" font-size="29" font-weight="800" fill="#0f766e">小而灵活，可渐进扩展</text>
</svg>
