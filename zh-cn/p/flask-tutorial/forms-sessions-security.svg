<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flask 表单、Session 与安全边界</title>
  <desc id="desc">展示表单输入、校验、Session、鉴权和输出的安全边界</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8f8"/><stop offset="100%" stop-color="#f6fffc"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0f766e"/></marker>
    <style>.font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.h{font-size:48px;font-weight:800;fill:#17202a}.sub{font-size:27px;fill:#52606d}.box-title{font-size:29px;font-weight:800}.body{font-size:24px;fill:#52606d}.note{font-size:26px;fill:#17202a}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="122" class="font h">表单、Session 与安全边界</text>
  <text x="92" y="164" class="font sub">Flask 很自由，所以更要主动处理 CSRF、密钥、Cookie 和输入校验</text>
  <g class="font">
    <g transform="translate(105 275)"><rect width="240" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="240" height="12" fill="#2563eb"/><text x="120" y="62" text-anchor="middle" class="box-title" fill="#2563eb">表单输入</text><text x="28" y="112" class="body">request.form</text><text x="28" y="145" class="body">request.get_json()</text><text x="28" y="178" class="body">永远不要默认可信</text></g>
    <line x1="355" y1="385" x2="388" y2="385" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(400 275)"><rect width="240" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="240" height="12" fill="#0f766e"/><text x="120" y="62" text-anchor="middle" class="box-title" fill="#0f766e">校验</text><text x="28" y="112" class="body">WTForms / Pydantic</text><text x="28" y="145" class="body">必填、长度、格式</text><text x="28" y="178" class="body">错误信息可展示</text></g>
    <line x1="650" y1="385" x2="683" y2="385" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(695 275)"><rect width="240" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="240" height="12" fill="#e76f51"/><text x="120" y="62" text-anchor="middle" class="box-title" fill="#e76f51">Session</text><text x="28" y="112" class="body">签名 Cookie</text><text x="28" y="145" class="body">需要 SECRET_KEY</text><text x="28" y="178" class="body">只放轻量信息</text></g>
    <line x1="945" y1="385" x2="978" y2="385" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(990 275)"><rect width="240" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="240" height="12" fill="#7c3aed"/><text x="120" y="62" text-anchor="middle" class="box-title" fill="#7c3aed">鉴权</text><text x="28" y="112" class="body">Flask-Login</text><text x="28" y="145" class="body">权限检查</text><text x="28" y="178" class="body">越权返回 403</text></g>
    <line x1="1240" y1="385" x2="1273" y2="385" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1285 275)"><rect width="240" height="220" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="240" height="12" fill="#12a67a"/><text x="120" y="62" text-anchor="middle" class="box-title" fill="#12a67a">输出</text><text x="28" y="112" class="body">模板默认转义</text><text x="28" y="145" class="body">JSON 明确字段</text><text x="28" y="178" class="body">避免敏感数据泄露</text></g>
    <rect x="155" y="650" width="1290" height="140" rx="24" fill="#fff" stroke="#f2b8b5" stroke-width="3"/>
    <text x="205" y="725" font-size="32" font-weight="800" fill="#d64545">安全底线</text>
    <text x="390" y="704" class="note">不要把密钥写进代码；生产环境开启 HTTPS；表单写入类操作开启 CSRF；</text>
    <text x="390" y="740" class="note">模板中避免手动拼接未转义 HTML；数据库查询使用 ORM 或参数化 SQL。</text>
  </g>
</svg>
