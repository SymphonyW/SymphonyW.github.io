<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flask 从开发到生产部署</title>
  <desc id="desc">展示 Flask 从代码、配置、数据库、WSGI 到入口的生产部署路径</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f9fbf7"/><stop offset="100%" stop-color="#f5fbff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0f766e"/></marker>
    <style>.font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.h{font-size:48px;font-weight:800;fill:#17202a}.sub{font-size:27px;fill:#52606d}.num{font-size:31px;font-weight:800;fill:white}.box-title{font-size:32px;font-weight:800}.body{font-size:22px;fill:#52606d}.check{font-size:27px;fill:#17202a}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="122" class="font h">Flask 从开发到生产</text>
  <text x="92" y="164" class="font sub">开发服务器只用于本地调试；上线时让 WSGI Server 接管请求</text>
  <g class="font">
    <g transform="translate(115 285)"><rect width="230" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="115" cy="70" r="35" fill="#2563eb"/><text x="115" y="81" text-anchor="middle" class="num">1</text><text x="115" y="154" text-anchor="middle" class="box-title" fill="#2563eb">代码</text><text x="38" y="203" class="body">应用工厂</text><text x="38" y="233" class="body">测试覆盖</text></g>
    <line x1="355" y1="410" x2="388" y2="410" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(400 285)"><rect width="230" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="115" cy="70" r="35" fill="#0f766e"/><text x="115" y="81" text-anchor="middle" class="num">2</text><text x="115" y="154" text-anchor="middle" class="box-title" fill="#0f766e">配置</text><text x="38" y="203" class="body">环境变量</text><text x="38" y="233" class="body">SECRET_KEY</text></g>
    <line x1="640" y1="410" x2="673" y2="410" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(685 285)"><rect width="230" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="115" cy="70" r="35" fill="#e76f51"/><text x="115" y="81" text-anchor="middle" class="num">3</text><text x="115" y="154" text-anchor="middle" class="box-title" fill="#e76f51">数据库</text><text x="38" y="203" class="body">迁移</text><text x="38" y="233" class="body">连接池</text></g>
    <line x1="925" y1="410" x2="958" y2="410" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(970 285)"><rect width="230" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="115" cy="70" r="35" fill="#12a67a"/><text x="115" y="81" text-anchor="middle" class="num">4</text><text x="115" y="154" text-anchor="middle" class="box-title" fill="#12a67a">WSGI</text><text x="38" y="203" class="body">Gunicorn / Waitress</text><text x="38" y="233" class="body">多进程</text></g>
    <line x1="1210" y1="410" x2="1243" y2="410" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1255 285)"><rect width="230" height="250" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="115" cy="70" r="35" fill="#7c3aed"/><text x="115" y="81" text-anchor="middle" class="num">5</text><text x="115" y="154" text-anchor="middle" class="box-title" fill="#7c3aed">入口</text><text x="38" y="203" class="body">Nginx / HTTPS</text><text x="38" y="233" class="body">日志 / 监控</text></g>
    <rect x="140" y="650" width="1320" height="152" rx="24" fill="#fff" stroke="#b9e3dd" stroke-width="3"/>
    <text x="190" y="716" font-size="31" font-weight="800" fill="#0f766e">最小生产清单</text>
    <text x="190" y="768" class="check">固定依赖版本  |  健康检查  |  日志  |  数据库迁移  |  密钥管理  |  HTTPS</text>
  </g>
</svg>
