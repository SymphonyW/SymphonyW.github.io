<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">systemd service management flow</title>
  <desc id="desc">A diagram showing how systemd starts a service, loads environment configuration, runs a non-root process, exposes an HTTP port, and sends logs to journalctl.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#38bdf8"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#cbd5e1}
      .h{font-size:34px;font-weight:820}
      .label{font-size:22px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .card{fill:#111827;stroke:#334155;stroke-width:2}
      .line{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="260" cy="140" r="190" fill="#38bdf8" opacity=".08"/>
  <circle cx="1100" cy="620" r="250" fill="#22c55e" opacity=".08"/>
  <text class="t h" x="80" y="84">Running a Service with systemd</text>
  <text class="t small muted" x="82" y="119">Keep configuration, code, process identity, port checks, and logs in one mental model.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="220" width="250" height="150" rx="22"/>
    <text class="t label" x="205" y="263" text-anchor="middle">Unit file</text>
    <text class="t mono small muted" x="205" y="304" text-anchor="middle">linux-lab.service</text>
    <text class="t mono small muted" x="205" y="333" text-anchor="middle">User=linux-lab</text>
  </g>
  <path class="line" d="M330 295h120"/>

  <g filter="url(#shadow)">
    <rect class="card" x="470" y="170" width="300" height="250" rx="28"/>
    <text class="t label" x="620" y="218" text-anchor="middle">systemd</text>
    <text class="t mono small muted" x="620" y="263" text-anchor="middle">start / stop / restart</text>
    <text class="t mono small muted" x="620" y="292" text-anchor="middle">enable</text>
    <text class="t mono small muted" x="620" y="321" text-anchor="middle">restart on failure</text>
    <text class="t mono small muted" x="620" y="350" text-anchor="middle">journal integration</text>
  </g>
  <path class="line" d="M770 295h120"/>

  <g filter="url(#shadow)">
    <rect class="card" x="910" y="220" width="250" height="150" rx="22"/>
    <text class="t label" x="1035" y="263" text-anchor="middle">App process</text>
    <text class="t mono small muted" x="1035" y="304" text-anchor="middle">.venv/bin/python</text>
    <text class="t mono small muted" x="1035" y="333" text-anchor="middle">127.0.0.1:8000</text>
  </g>
  <path class="line" d="M1160 295h84"/>

  <g filter="url(#shadow)">
    <rect class="card" x="1260" y="220" width="100" height="150" rx="22"/>
    <text class="t label" x="1310" y="277" text-anchor="middle">curl</text>
    <text class="t mono small muted" x="1310" y="316" text-anchor="middle">/health</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="300" y="506" width="290" height="118" rx="22"/>
    <text class="t label" x="445" y="550" text-anchor="middle">Environment</text>
    <text class="t mono small muted" x="445" y="585" text-anchor="middle">/etc/linux-lab.env</text>
  </g>
  <path class="line" d="M445 506c25-60 76-79 151-86"/>

  <g filter="url(#shadow)">
    <rect class="card" x="720" y="506" width="340" height="118" rx="22"/>
    <text class="t label" x="890" y="550" text-anchor="middle">Logs and evidence</text>
    <text class="t mono small muted" x="890" y="585" text-anchor="middle">journalctl -u linux-lab</text>
  </g>
  <path class="line" d="M945 506c-38-54-56-88-44-132"/>

  <text class="t mono small muted" x="82" y="690">Change unit file: daemon-reload then restart. Change env file: restart.</text>
</svg>
