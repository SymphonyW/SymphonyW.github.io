<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Backup and restore loop</title>
  <desc id="desc">A diagram showing the required loop for practical backup automation: validate inputs, create archive, restore into a temporary directory, compare, and keep evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e1c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#f59e0b"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#cbd5e1}
      .h{font-size:34px;font-weight:820}
      .label{font-size:22px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .card{fill:#111827;stroke:#334155;stroke-width:2}
      .line{fill:none;stroke:#f59e0b;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="700" cy="390" r="280" fill="#f59e0b" opacity=".08"/>
  <text class="t h" x="80" y="84">Backup Is Useful Only When Restore Works</text>
  <text class="t small muted" x="82" y="120">The script is one half of the job; verification is the other half.</text>

  <path class="line" d="M346 250c156-100 326-104 506-8"/>
  <path class="line" d="M995 367c42 142-8 240-150 292"/>
  <path class="line" d="M552 656c-155-47-240-140-246-281"/>
  <path class="line" d="M306 375c6-58 21-100 40-125"/>

  <g filter="url(#shadow)">
    <rect class="card" x="148" y="172" width="310" height="142" rx="22"/>
    <text class="t label" x="303" y="216" text-anchor="middle">1. Validate</text>
    <text class="t mono small muted" x="303" y="257" text-anchor="middle">arguments</text>
    <text class="t mono small muted" x="303" y="285" text-anchor="middle">paths and ownership</text>

    <rect class="card" x="545" y="148" width="310" height="142" rx="22"/>
    <text class="t label" x="700" y="192" text-anchor="middle">2. Archive</text>
    <text class="t mono small muted" x="700" y="233" text-anchor="middle">tar -czf unique.tmp</text>
    <text class="t mono small muted" x="700" y="261" text-anchor="middle">rename after success</text>

    <rect class="card" x="942" y="283" width="310" height="142" rx="22"/>
    <text class="t label" x="1097" y="327" text-anchor="middle">3. Restore</text>
    <text class="t mono small muted" x="1097" y="368" text-anchor="middle">mktemp -d</text>
    <text class="t mono small muted" x="1097" y="396" text-anchor="middle">tar -xzf archive</text>

    <rect class="card" x="620" y="572" width="310" height="142" rx="22"/>
    <text class="t label" x="775" y="616" text-anchor="middle">4. Compare</text>
    <text class="t mono small muted" x="775" y="657" text-anchor="middle">diff -r source restore</text>
    <text class="t mono small muted" x="775" y="685" text-anchor="middle">record result</text>

    <rect class="card" x="150" y="398" width="310" height="142" rx="22"/>
    <text class="t label" x="305" y="442" text-anchor="middle">5. Repeat</text>
    <text class="t mono small muted" x="305" y="483" text-anchor="middle">spaces, unicode, failures</text>
    <text class="t mono small muted" x="305" y="511" text-anchor="middle">no silent overwrite</text>
  </g>
</svg>
