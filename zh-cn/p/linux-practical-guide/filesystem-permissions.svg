<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux files and permissions</title>
  <desc id="desc">A diagram showing a Linux path, directory traversal, rwx permission groups, numeric permission values, and common ownership repair commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#cbd5e1}
      .dim{fill:#94a3b8}
      .h{font-size:34px;font-weight:820}
      .label{font-size:22px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .card{fill:#111827;stroke:#334155;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1140" cy="115" r="220" fill="#38bdf8" opacity=".08"/>
  <circle cx="220" cy="640" r="220" fill="#f59e0b" opacity=".08"/>
  <text class="t h" x="78" y="84">Files, Paths, and Permissions</text>
  <text class="t small muted" x="80" y="118">A readable file still needs a traversable path.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="78" y="172" width="560" height="175" rx="22"/>
    <text class="t label" x="110" y="220">Path components</text>
    <text class="t mono small muted" x="110" y="260">/ home / alice / linux-lab / notes / day1.txt</text>
    <path d="M126 286h78M232 286h94M354 286h150M532 286h72" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <text class="t mono small dim" x="126" y="318">x</text>
    <text class="t mono small dim" x="232" y="318">x</text>
    <text class="t mono small dim" x="354" y="318">x</text>
    <text class="t mono small dim" x="532" y="318">r or rw</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="700" y="172" width="620" height="175" rx="22"/>
    <text class="t label" x="732" y="220">Long listing</text>
    <text class="t mono" x="732" y="270" font-size="26">- rwx r-x ---  alice dev  app.sh</text>
    <text class="t mono small dim" x="755" y="310">type</text>
    <text class="t mono small dim" x="820" y="310">owner</text>
    <text class="t mono small dim" x="916" y="310">group</text>
    <text class="t mono small dim" x="1012" y="310">others</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="78" y="410" width="386" height="230" rx="22"/>
    <text class="t label" x="110" y="457">Numeric mode</text>
    <text class="t mono" x="110" y="504" font-size="28">r = 4</text>
    <text class="t mono" x="110" y="548" font-size="28">w = 2</text>
    <text class="t mono" x="110" y="592" font-size="28">x = 1</text>
    <text class="t mono small muted" x="245" y="548">chmod 640 file</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="507" y="410" width="386" height="230" rx="22"/>
    <text class="t label" x="539" y="457">Directory access</text>
    <text class="t small muted" x="539" y="500">To open a nested file, each parent</text>
    <text class="t small muted" x="539" y="528">directory needs execute permission.</text>
    <text class="t mono" x="539" y="584" font-size="24">namei -l /path/to/file</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="936" y="410" width="386" height="230" rx="22"/>
    <text class="t label" x="968" y="457">Common repair</text>
    <text class="t mono small muted" x="968" y="504">id</text>
    <text class="t mono small muted" x="968" y="536">ls -ld target parent</text>
    <text class="t mono small muted" x="968" y="568">sudo chown user:group file</text>
    <text class="t mono small muted" x="968" y="600">avoid chmod -R 777</text>
  </g>
</svg>
