<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Linux learning roadmap</title>
  <desc id="desc">A practical learning path from setup and files to permissions, logs, processes, networking, services, backup, and troubleshooting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#12323b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#38bdf8"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#b6c6d8}
      .h{font-size:34px;font-weight:820}
      .label{font-size:23px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .card{fill:#111827;stroke:#334155;stroke-width:2}
      .line{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="1130" cy="120" r="190" fill="#22c55e" opacity=".08"/>
  <circle cx="250" cy="610" r="240" fill="#38bdf8" opacity=".08"/>
  <text class="t h" x="80" y="88">Practical Linux Learning Path</text>
  <text class="t small muted" x="82" y="122">Learn each layer through commands, evidence, and repairable examples.</text>

  <path class="line" d="M200 360h126"/>
  <path class="line" d="M420 360h126"/>
  <path class="line" d="M640 360h126"/>
  <path class="line" d="M860 360h126"/>
  <path class="line" d="M1080 360h126"/>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="250" width="160" height="220" rx="22"/>
    <circle cx="140" cy="302" r="28" fill="#38bdf8"/>
    <text class="t label" x="140" y="360" text-anchor="middle">Setup</text>
    <text class="t mono small muted" x="140" y="395" text-anchor="middle">WSL / Ubuntu</text>
    <text class="t mono small muted" x="140" y="424" text-anchor="middle">apt tools</text>

    <rect class="card" x="280" y="250" width="160" height="220" rx="22"/>
    <path d="M333 305h54l22 26v74h-76z" fill="none" stroke="#22c55e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M387 305v26h22" fill="none" stroke="#22c55e" stroke-width="5"/>
    <text class="t label" x="360" y="360" text-anchor="middle">Files</text>
    <text class="t mono small muted" x="360" y="395" text-anchor="middle">pwd ls find</text>
    <text class="t mono small muted" x="360" y="424" text-anchor="middle">nano tree</text>

    <rect class="card" x="500" y="250" width="160" height="220" rx="22"/>
    <path d="M554 329h52v-30c0-20-12-35-26-35s-26 15-26 35v30z" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <rect x="540" y="329" width="80" height="58" rx="12" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <text class="t label" x="580" y="416" text-anchor="middle">Permissions</text>
    <text class="t mono small muted" x="580" y="445" text-anchor="middle">rwx sudo</text>

    <rect class="card" x="720" y="250" width="160" height="220" rx="22"/>
    <path d="M758 333h84M758 363h64M758 393h74" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
    <text class="t label" x="800" y="305" text-anchor="middle">Logs</text>
    <text class="t mono small muted" x="800" y="430" text-anchor="middle">grep awk tee</text>

    <rect class="card" x="940" y="250" width="160" height="220" rx="22"/>
    <circle cx="1020" cy="326" r="34" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M1020 292v34l24 18" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <text class="t label" x="1020" y="395" text-anchor="middle">Processes</text>
    <text class="t mono small muted" x="1020" y="424" text-anchor="middle">ps top kill</text>

    <rect class="card" x="1160" y="250" width="180" height="220" rx="22"/>
    <path d="M1208 340c18-42 65-42 84 0M1222 356c10-22 46-22 56 0M1236 374c6-10 22-10 28 0" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <text class="t label" x="1250" y="416" text-anchor="middle">Network</text>
    <text class="t mono small muted" x="1250" y="445" text-anchor="middle">curl ssh ss</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="565" width="860" height="78" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text class="t label" x="700" y="598" text-anchor="middle">Operate it like a real service</text>
    <text class="t mono small muted" x="700" y="625" text-anchor="middle">systemd - journalctl - backup - restore - troubleshoot</text>
  </g>
</svg>
