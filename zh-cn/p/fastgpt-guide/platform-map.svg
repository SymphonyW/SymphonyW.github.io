<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FastGPT platform map</title>
  <desc id="desc">Models, knowledge, tools and users connect through the FastGPT application layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#102c43"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19d3c5"/><stop offset="1" stop-color="#2799ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf8ff}.h{font-size:28px;font-weight:700}.s{font-size:17px;fill:#a9c6d9}.k{font-size:20px;font-weight:650}.box{fill:#102a42;stroke:#2d5872;stroke-width:2}.line{stroke:#3edbd0;stroke-width:3;fill:none;opacity:.78}.dot{fill:#ffc86a}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <g opacity=".12" stroke="#6cc7e9"><path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200"/><path d="M150 0V680M300 0V680M450 0V680M600 0V680M750 0V680M900 0V680M1050 0V680"/></g>
  <text class="t h" x="58" y="64">FastGPT application platform · AI 应用平台</text>
  <text class="t s" x="58" y="94">One control plane for models, grounded knowledge, workflows and delivery</text>
  <g class="line"><path d="M305 215C410 215 425 294 494 310"/><path d="M305 465C405 465 430 390 494 372"/><path d="M894 215C790 215 775 294 706 310"/><path d="M894 465C795 465 770 390 706 372"/></g>
