  <g filter="url(#glow)" transform="translate(476 223)"><rect width="248" height="235" rx="38" fill="url(#core)" opacity=".22" stroke="#64fff4" stroke-width="3"/><circle cx="124" cy="83" r="48" fill="url(#core)"/><g fill="#071d31"><circle cx="104" cy="70" r="8"/><circle cx="143" cy="65" r="7"/><circle cx="126" cy="98" r="9"/><path d="M104 70l39-5-17 33-22-28" stroke="#071d31" stroke-width="4" fill="none"/></g><text class="t h" x="124" y="162" text-anchor="middle">FastGPT</text><text class="t s" x="124" y="194" text-anchor="middle">Agent · RAG · Workflow</text></g>
  <g class="t s" text-anchor="middle"><text x="600" y="577">Observe inputs and outputs · inspect logs · publish once</text><text x="600" y="607">可观察输入输出 · 调试日志 · 多渠道发布</text></g>
