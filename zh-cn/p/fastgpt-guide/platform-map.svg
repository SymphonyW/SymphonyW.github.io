  <g transform="translate(58 395)"><rect class="box" width="247" height="140" rx="20"/><path d="M28 32h25v32H28zM34 25h25v32" fill="none" stroke="#ffc86a" stroke-width="3"/><text class="t k" x="72" y="48">Knowledge · 知识</text><text class="t s" x="26" y="83">Files / chunks / indexes</text><text class="t s" x="26" y="111">Hybrid search / citations</text></g>
  <g transform="translate(894 145)"><rect class="box" width="247" height="140" rx="20"/><path d="M27 34h20v20H27zm38 0h20v20H65zM46 76h20v20H46z" fill="none" stroke="#ffc86a" stroke-width="3"/><path d="M47 44h18M56 54v22" stroke="#ffc86a" stroke-width="3"/><text class="t k" x="104" y="48">Tools · 工具</text><text class="t s" x="26" y="83">HTTP / plugins / MCP</text><text class="t s" x="26" y="111">Controlled side effects</text></g>
