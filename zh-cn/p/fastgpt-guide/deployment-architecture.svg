<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FastGPT self-hosted deployment</title><desc id="desc">A secure reverse proxy fronts FastGPT, with MongoDB, vector storage, AI Proxy, model providers and optional sandbox services.</desc>
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172a"/><stop offset="1" stop-color="#12364b"/></linearGradient><style>.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#effaff}.h{font-size:27px;font-weight:700}.m{font-size:18px;font-weight:650}.s{font-size:14px;fill:#b3ccda}.c{fill:#102d44;stroke:#3c6880;stroke-width:2}.core{fill:#123d48;stroke:#45dbcc;stroke-width:2}.store{fill:#2d2c45;stroke:#8aa6ff;stroke-width:2}.opt{fill:#40351f;stroke:#ffc86f;stroke-width:2;stroke-dasharray:7 6}.a{stroke:#48d8ca;stroke-width:3;fill:none;marker-end:url(#arr)}.d{stroke:#8aa6ff;stroke-width:3;fill:none;marker-end:url(#arr2)}</style><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#48d8ca"/></marker><marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#8aa6ff"/></marker></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg4)"/><text class="t h" x="55" y="60">Self-hosted FastGPT · 私有部署架构</text><text class="t s" x="55" y="91">Separate the public edge, application services, data stores and external model plane</text>
  <g transform="translate(55 260)"><rect class="c" width="150" height="110" rx="20"/><text class="t m" x="75" y="43" text-anchor="middle">Users</text><text class="t s" x="75" y="72" text-anchor="middle">Web / API / MCP</text></g>
  <g transform="translate(260 260)"><rect class="c" width="165" height="110" rx="20"/><text class="t m" x="82" y="38" text-anchor="middle">HTTPS edge</text><text class="t s" x="82" y="67" text-anchor="middle">TLS / auth / limits</text><text class="t s" x="82" y="90" text-anchor="middle">反向代理</text></g>
  <g transform="translate(490 230)"><rect class="core" width="210" height="170" rx="26"/><text class="t m" x="105" y="43" text-anchor="middle">FastGPT app</text><text class="t s" x="105" y="77" text-anchor="middle">UI + API</text><text class="t s" x="105" y="103" text-anchor="middle">workflow runtime</text><text class="t s" x="105" y="129" text-anchor="middle">Dataset services</text></g>
  <path class="a" d="M205 315h51M425 315h61"/>
  <g transform="translate(780 118)"><rect class="store" width="170" height="100" rx="18"/><text class="t m" x="85" y="38" text-anchor="middle">MongoDB</text><text class="t s" x="85" y="68" text-anchor="middle">business + source data</text></g>
  <g transform="translate(780 265)"><rect class="store" width="170" height="100" rx="18"/><text class="t m" x="85" y="38" text-anchor="middle">Vector store</text><text class="t s" x="85" y="67" text-anchor="middle">PG / Milvus / …</text></g>
  <g transform="translate(780 412)"><rect class="core" width="170" height="100" rx="18"/><text class="t m" x="85" y="38" text-anchor="middle">AI Proxy</text><text class="t s" x="85" y="68" text-anchor="middle">provider routing</text></g>
  <path class="d" d="M700 270c37 0 39-102 76-102M700 315h76"/><path class="a" d="M700 355c37 0 39 107 76 107"/>
  <g transform="translate(1015 412)"><rect class="c" width="130" height="100" rx="18"/><text class="t m" x="65" y="38" text-anchor="middle">Models</text><text class="t s" x="65" y="67" text-anchor="middle">cloud / local</text></g><path class="a" d="M950 462h61"/>
  <g transform="translate(490 530)"><rect class="opt" width="210" height="100" rx="18"/><text class="t m" x="105" y="38" text-anchor="middle">Optional services</text><text class="t s" x="105" y="67" text-anchor="middle">sandbox / S3 / parsers</text></g><path class="a" d="M595 404v122" stroke-dasharray="7 6"/>
  <g transform="translate(1015 118)"><rect class="opt" width="130" height="247" rx="20"/><text class="t m" x="65" y="40" text-anchor="middle">Operations</text><text class="t s" x="65" y="82" text-anchor="middle">backups</text><text class="t s" x="65" y="111" text-anchor="middle">metrics</text><text class="t s" x="65" y="140" text-anchor="middle">logs</text><text class="t s" x="65" y="169" text-anchor="middle">secrets</text><text class="t s" x="65" y="198" text-anchor="middle">upgrades</text></g>
  <text class="t s" x="55" y="648">Public network</text><path d="M165 643h260" stroke="#ff8a9f" stroke-width="2"/><text class="t s" x="480" y="648">Private application network · 数据库不暴露公网</text>
</svg>
