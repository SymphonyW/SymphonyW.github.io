<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Fuzzy search flow</title>
  <desc id="desc">Fuzzy search expands typo-prone queries into similar candidates and ranks them.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2e1f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#d67b1f"/>
    </marker>
  </defs>
  <rect width="1100" height="600" rx="28" fill="#fffaf3"/>
  <text x="70" y="70" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">模糊搜索：先放宽，再排序</text>
  <text x="72" y="108" fill="#6c665f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">它解决的是“写错了、少写了、写法不一致”，不是完整语义理解</text>

  <g transform="translate(70 170)" filter="url(#shadow)">
    <rect width="214" height="150" rx="18" fill="#ffffff"/>
    <text x="26" y="45" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">用户输入</text>
    <text x="26" y="88" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">“retun policy”</text>
    <text x="26" y="119" fill="#8b6a42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">少了一个 r</text>
  </g>
  <line x1="304" y1="245" x2="390" y2="245" stroke="#d67b1f" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(410 150)" filter="url(#shadow)">
    <rect width="280" height="190" rx="18" fill="#ffffff"/>
    <text x="26" y="45" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">候选生成</text>
    <text x="26" y="84" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">编辑距离：return / retune</text>
    <text x="26" y="116" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">n-gram：ret, etu, tun</text>
    <text x="26" y="148" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">前缀：pol → policy</text>
  </g>
  <line x1="712" y1="245" x2="798" y2="245" stroke="#d67b1f" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(818 170)" filter="url(#shadow)">
    <rect width="214" height="150" rx="18" fill="#ffffff"/>
    <text x="26" y="45" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">排序输出</text>
    <text x="26" y="87" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">return policy</text>
    <text x="26" y="118" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">refund policy</text>
  </g>

  <g transform="translate(116 402)">
    <rect width="868" height="92" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="38" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">常见技术：Levenshtein 编辑距离、Damerau-Levenshtein、trigram、拼音/同音纠错、自动补全。</text>
    <text x="30" y="68" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">代价：召回扩大后会带来误匹配，所以必须配合字段权重、热度、业务规则和阈值。</text>
  </g>
</svg>
