<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Search methods cover image</title>
  <desc id="desc">Keyword matching, fuzzy search, and vector retrieval arranged from literal matching to semantic retrieval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#fff6e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#24415a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#426579"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.25">
    <circle cx="116" cy="96" r="52" fill="#4e79a7"/>
    <circle cx="1078" cy="132" r="74" fill="#59a14f"/>
    <circle cx="1020" cy="548" r="48" fill="#f28e2b"/>
    <circle cx="182" cy="536" r="68" fill="#e15759"/>
  </g>
  <text x="96" y="126" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">从匹配字符到理解语义</text>
  <text x="98" y="176" fill="#4d6275" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">关键字匹配、模糊搜索、向量检索与 RAG 的差别</text>

  <g transform="translate(94 258)" filter="url(#shadow)">
    <rect x="0" y="0" width="286" height="204" rx="22" fill="#ffffff"/>
    <rect x="0" y="0" width="286" height="10" rx="5" fill="#4e79a7"/>
    <text x="28" y="54" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750">关键字匹配</text>
    <text x="28" y="96" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">词面一致</text>
    <text x="28" y="129" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">倒排索引 / BM25</text>
    <text x="28" y="162" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">快、准、可解释</text>
    <text x="196" y="164" fill="#4e79a7" font-family="Consolas, monospace" font-size="46" font-weight="700">=</text>
  </g>

  <line x1="405" y1="360" x2="500" y2="360" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(518 258)" filter="url(#shadow)">
    <rect x="0" y="0" width="286" height="204" rx="22" fill="#ffffff"/>
    <rect x="0" y="0" width="286" height="10" rx="5" fill="#f28e2b"/>
    <text x="28" y="54" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750">模糊搜索</text>
    <text x="28" y="96" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">容忍拼写与变体</text>
    <text x="28" y="129" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">编辑距离 / n-gram</text>
    <text x="28" y="162" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">召回更多候选</text>
    <text x="193" y="164" fill="#f28e2b" font-family="Consolas, monospace" font-size="44" font-weight="700">≈</text>
  </g>

  <line x1="829" y1="360" x2="924" y2="360" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(942 258)" filter="url(#shadow)">
    <rect x="0" y="0" width="286" height="204" rx="22" fill="#ffffff"/>
    <rect x="0" y="0" width="286" height="10" rx="5" fill="#59a14f"/>
    <text x="28" y="54" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="750">向量检索</text>
    <text x="28" y="96" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">语义相近</text>
    <text x="28" y="129" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Embedding / ANN</text>
    <text x="28" y="162" fill="#516579" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">RAG 的检索底座</text>
    <circle cx="215" cy="144" r="26" fill="#59a14f" opacity="0.16"/>
    <path d="M201 149 C211 128 229 128 238 149" fill="none" stroke="#59a14f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="203" cy="137" r="5" fill="#59a14f"/>
    <circle cx="237" cy="137" r="5" fill="#59a14f"/>
  </g>

  <text x="96" y="548" fill="#5c7081" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">生产系统常用答案：结构化过滤 + 关键字召回 + 向量召回 + 重排序</text>
</svg>
