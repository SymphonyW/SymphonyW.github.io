<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="keep" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="thresh" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="cliff" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">动态阈值：按相关性分数自适应截断</text>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">不固定数量，让"取几条"从静态参数变成自适应决策</text>

  <!-- Left: Score-based threshold -->
  <g transform="translate(40,100)">
    <rect width="540" height="490" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">方式一：分数阈值 θ</text>
    <text x="270" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">保留所有 score ≥ θ 的片段</text>

    <!-- Score bar chart -->
    <g transform="translate(50,90)">
      <!-- y axis -->
      <line x1="0" y1="0" x2="0" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <line x1="0" y1="280" x2="440" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <text x="-8" y="10" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">1.0</text>
      <text x="-8" y="85" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.75</text>
      <text x="-8" y="160" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.5</text>
      <text x="-8" y="235" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.25</text>
      <text x="-8" y="285" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0</text>

      <!-- Threshold line at 0.5 -->
      <line x1="0" y1="160" x2="440" y2="160" stroke="url(#thresh)" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="445" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#dc2626">θ = 0.5</text>

      <!-- Bars (kept) -->
      <rect x="30" y="22" width="40" height="258" fill="url(#keep)"/>
      <text x="50" y="14" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">0.92</text>
      <rect x="90" y="35" width="40" height="245" fill="url(#keep)"/>
      <text x="110" y="27" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">0.88</text>
      <rect x="150" y="43" width="40" height="237" fill="url(#keep)"/>
      <text x="170" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">0.85</text>

      <!-- Bars (dropped) -->
      <rect x="210" y="166" width="40" height="114" fill="url(#drop)"/>
      <text x="230" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#64748b">0.41</text>
      <rect x="270" y="175" width="40" height="105" fill="url(#drop)"/>
      <text x="290" y="167" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#64748b">0.38</text>
      <rect x="330" y="184" width="40" height="96" fill="url(#drop)"/>
      <text x="350" y="176" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#64748b">0.35</text>
      <rect x="390" y="220" width="40" height="60" fill="url(#drop)"/>
      <text x="410" y="212" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#64748b">0.22</text>

      <text x="220" y="305" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">候选片段（按精排分数排序）</text>
    </g>

    <g transform="translate(30,410)">
      <rect width="480" height="65" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="240" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">结果：保留 3 条（绿色），丢弃 4 条（灰色）</text>
      <text x="240" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#065f46">即使 k=7 召回 7 条，最终也只取分数达标的 3 条 → 自适应</text>
      <text x="240" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-style="italic">θ 离线扫 F1 拐点得到</text>
    </g>
  </g>

  <!-- Right: Drop-off detection -->
  <g transform="translate(620,100)">
    <rect width="540" height="490" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="270" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">方式二：Drop-off 断崖检测</text>
    <text x="270" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">在分数急剧下降的位置截断</text>

    <!-- Score line chart -->
    <g transform="translate(50,90)">
      <line x1="0" y1="0" x2="0" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <line x1="0" y1="280" x2="440" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <text x="-8" y="10" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">1.0</text>
      <text x="-8" y="85" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.75</text>
      <text x="-8" y="160" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.5</text>
      <text x="-8" y="235" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0.25</text>
      <text x="-8" y="285" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0</text>

      <!-- Line: 0.92, 0.88, 0.85, 0.41, 0.38, 0.35, 0.22 -->
      <!-- Points: x = 30, 100, 170, 240, 310, 380 -->
      <!-- y: 22, 35, 43, 166, 175, 184, 220 -->
      <polyline points="30,22 100,35 170,43 240,166 310,175 380,184 420,220" fill="none" stroke="#64748b" stroke-width="2"/>

      <!-- Kept segment (green) -->
      <polyline points="30,22 100,35 170,43" fill="none" stroke="url(#keep)" stroke-width="4"/>
      <circle cx="30" cy="22" r="6" fill="url(#keep)"/>
      <circle cx="100" cy="35" r="6" fill="url(#keep)"/>
      <circle cx="170" cy="43" r="6" fill="url(#keep)"/>

      <!-- Dropped segment (gray) -->
      <polyline points="170,43 240,166 310,175 380,184 420,220" fill="none" stroke="url(#drop)" stroke-width="3" stroke-dasharray="5,3"/>
      <circle cx="240" cy="166" r="5" fill="url(#drop)"/>
      <circle cx="310" cy="175" r="5" fill="url(#drop)"/>
      <circle cx="380" cy="184" r="5" fill="url(#drop)"/>
      <circle cx="420" cy="220" r="5" fill="url(#drop)"/>

      <!-- Cliff marker -->
      <g transform="translate(170,43)">
        <line x1="0" y1="0" x2="70" y2="123" stroke="url(#cliff)" stroke-width="2" stroke-dasharray="3,2"/>
      </g>
      <g transform="translate(205,90)">
        <rect width="120" height="40" rx="6" fill="url(#cliff)"/>
        <text x="60" y="18" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">⚠ 断崖位置</text>
        <text x="60" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fef3c7">0.85 → 0.41（跌 0.44）</text>
      </g>

      <!-- Cut line -->
      <line x1="170" y1="0" x2="170" y2="280" stroke="url(#cliff)" stroke-width="2" stroke-dasharray="6,3"/>
      <text x="175" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#d97706">截断点</text>

      <text x="220" y="305" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">候选序号</text>
    </g>

    <g transform="translate(30,410)">
      <rect width="480" height="65" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <text x="240" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">结果：在第 3、4 名之间检测到分数断崖 → 在此截断</text>
      <text x="240" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#78350f">保留"高分组"，丢弃"低分组" → 无需预设 θ，纯数据驱动</text>
      <text x="240" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-style="italic">适合分数分布不均匀、问题难度差异大的场景</text>
    </g>
  </g>

  <!-- Bottom: 3 scenarios -->
  <g transform="translate(40,605)">
    <text x="1120" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e293b">简单题取 1~2 条  ·  复杂题取 4~5 条  ·  开放题取 8~10 条  →  最终再受 LLM 上下文长度预算约束</text>
  </g>
</svg>
