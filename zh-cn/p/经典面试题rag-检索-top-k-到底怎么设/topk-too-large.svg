<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="good2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="noise" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <linearGradient id="llm2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="cost" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">top-k 设大的隐患：噪声、成本、质量三重暴击</text>

  <!-- Three problem columns -->
  <!-- Column 1: Noise drowns signal -->
  <g transform="translate(60,90)">
    <rect width="340" height="490" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="170" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">① 噪声淹没信号</text>
    <text x="170" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">k = 20，前 3 条相关，后 17 条全是噪声</text>

    <!-- Recalled chunks list -->
    <g transform="translate(20,75)">
      <rect width="300" height="34" rx="6" fill="url(#good2)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#1 ✓ 相关</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">0.92</text>
    </g>
    <g transform="translate(20,115)">
      <rect width="300" height="34" rx="6" fill="url(#good2)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#2 ✓ 相关</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">0.88</text>
    </g>
    <g transform="translate(20,155)">
      <rect width="300" height="34" rx="6" fill="url(#good2)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#3 ✓ 相关</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">0.85</text>
    </g>
    <g transform="translate(20,195)">
      <rect width="300" height="34" rx="6" fill="url(#noise)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#4 ✗ 噪声</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2e8f0">0.41</text>
    </g>
    <g transform="translate(20,235)">
      <rect width="300" height="34" rx="6" fill="url(#noise)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#5 ✗ 噪声</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2e8f0">0.38</text>
    </g>
    <g transform="translate(20,275)">
      <rect width="300" height="34" rx="6" fill="url(#noise)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#6 ✗ 噪声</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2e8f0">0.35</text>
    </g>
    <g transform="translate(20,315)">
      <rect width="300" height="34" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="150" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b" font-style="italic">... 更多噪声片段 ...</text>
    </g>
    <g transform="translate(20,355)">
      <rect width="300" height="34" rx="6" fill="url(#noise)"/>
      <text x="15" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">#20 ✗ 噪声</text>
      <text x="280" y="22" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2e8f0">0.18</text>
    </g>

    <g transform="translate(20,410)">
      <rect width="300" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="150" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#dc2626">Lost in the Middle</text>
      <text x="150" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#991b1b">中间位置注意力下降，相关片段被忽略</text>
    </g>
  </g>

  <!-- Column 2: Cost grows linearly -->
  <g transform="translate(430,90)">
    <rect width="340" height="490" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="170" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">② 成本线性增长</text>
    <text x="170" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">token 费用和延迟随 k 线性上升</text>

    <!-- Bar chart -->
    <g transform="translate(40,90)">
      <!-- axis -->
      <line x1="0" y1="280" x2="280" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="280" stroke="#94a3b8" stroke-width="2"/>
      <text x="-10" y="25" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">10k</text>
      <text x="-10" y="150" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">5k</text>
      <text x="-10" y="280" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">0</text>

      <!-- k=4 bar -->
      <rect x="20" y="230" width="40" height="50" fill="url(#good2)"/>
      <text x="40" y="220" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">2k</text>
      <text x="40" y="300" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">k=4</text>

      <!-- k=10 bar -->
      <rect x="80" y="175" width="40" height="105" fill="#fbbf24"/>
      <text x="100" y="165" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#b45309">5k</text>
      <text x="100" y="300" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">k=10</text>

      <!-- k=20 bar -->
      <rect x="140" y="120" width="40" height="160" fill="#f97316"/>
      <text x="160" y="110" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#c2410c">10k</text>
      <text x="160" y="300" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">k=20</text>

      <!-- k=50 bar -->
      <rect x="200" y="20" width="40" height="260" fill="url(#cost)"/>
      <text x="220" y="12" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a3412">25k</text>
      <text x="220" y="300" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">k=50</text>

      <text x="140" y="320" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b" font-style="italic">Prompt token 数 vs k</text>
    </g>

    <g transform="translate(20,425)">
      <rect width="300" height="45" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="150" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#9a3412">高 QPS 场景下 = 真金白银的浪费</text>
    </g>
  </g>

  <!-- Column 3: Quality degrades -->
  <g transform="translate(800,90)">
    <rect width="340" height="490" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="170" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">③ 生成质量下降</text>
    <text x="170" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">噪声让模型"分心"，注意力被稀释</text>

    <!-- Attention mechanism visual -->
    <g transform="translate(40,90)">
      <text x="130" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">注意力分配</text>

      <!-- Good case: k=3 -->
      <text x="20" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#059669" font-weight="700">k=3（健康）</text>
      <rect x="20" y="65" width="80" height="22" rx="4" fill="url(#good2)"/>
      <text x="60" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff">相关#1</text>
      <rect x="105" y="65" width="80" height="22" rx="4" fill="url(#good2)"/>
      <text x="145" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff">相关#2</text>
      <rect x="190" y="65" width="80" height="22" rx="4" fill="url(#good2)"/>
      <text x="230" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fff">相关#3</text>
      <text x="130" y="105" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#059669">✓ 答案精准聚焦</text>

      <!-- Bad case: k=20 -->
      <text x="20" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="700">k=20（注意力稀释）</text>
      <rect x="20" y="155" width="25" height="22" rx="3" fill="url(#good2)"/>
      <rect x="50" y="155" width="25" height="22" rx="3" fill="url(#good2)"/>
      <rect x="80" y="155" width="25" height="22" rx="3" fill="url(#good2)"/>
      <rect x="110" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="133" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="156" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="179" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="202" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="225" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>
      <rect x="248" y="155" width="20" height="22" rx="3" fill="url(#noise)"/>

      <text x="130" y="200" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dc2626">✗ 答案跑题、啰嗦、误引</text>

      <!-- Symptoms -->
      <g transform="translate(0,225)">
        <rect width="260" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="130" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#991b1b">• 综合无关信息，回答啰嗦</text>
      </g>
      <g transform="translate(0,265)">
        <rect width="260" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="130" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#991b1b">• 把无关片段当事实引用</text>
      </g>
      <g transform="translate(0,305)">
        <rect width="260" height="30" rx="6" fill="#fef2f2" stroke="#fecaca"/>
        <text x="130" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#991b1b">• 偏离用户真实意图</text>
      </g>
    </g>
  </g>

  <!-- Bottom conclusion -->
  <g transform="translate(60,600)">
    <rect width="1080" height="30" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="540" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">核心结论：top-k 设大 → 噪声 ↑ + 成本 ↑ + 质量 ↓。多并不等于好。</text>
  </g>
</svg>
