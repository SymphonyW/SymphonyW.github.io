<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="p6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="p7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">完整 RAG 链路：top-k 不是参数，是四阶段协同思维</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">每个环节都有它的"k"，区分 k₁、k₂、k₃ 是面试加分关键</text>

  <!-- Vertical pipeline -->
  <!-- Step 1: Query Rewrite -->
  <g transform="translate(300,90)">
    <rect width="600" height="70" rx="12" fill="url(#p1)"/>
    <text x="40" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="22">✏️</text>
    <text x="85" y="30" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[Query 改写]（可选）</text>
    <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fef3c7">HyDE · Multi-Query · Step-back Prompting · Query Rewriting</text>
    <text x="570" y="42" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fef3c7" font-style="italic">让问题更适合检索</text>
  </g>
  <line x1="600" y1="165" x2="600" y2="185" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,185 593,175 607,175" fill="#94a3b8"/>

  <!-- Step 2: Coarse Retrieval -->
  <g transform="translate(300,190)">
    <rect width="600" height="80" rx="12" fill="url(#p2)"/>
    <text x="40" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22">🔍</text>
    <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[粗排] 双塔 Embedding 检索</text>
    <text x="85" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">bge-large-zh · text-embedding-3 · 余弦相似度 · ANN 索引</text>
    <g transform="translate(440,18)">
      <rect width="140" height="45" rx="8" fill="#fff"/>
      <text x="70" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">k₁ = 20~50</text>
      <text x="70" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#1e40af">保召回（撒大网）</text>
    </g>
  </g>
  <line x1="600" y1="275" x2="600" y2="295" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,295 593,285 607,285" fill="#94a3b8"/>

  <!-- Step 3: Rerank -->
  <g transform="translate(300,300)">
    <rect width="600" height="80" rx="12" fill="url(#p3)"/>
    <text x="40" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22">🎯</text>
    <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[精排] Cross-Encoder Rerank</text>
    <text x="85" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ede9fe">bge-reranker-large · Cohere Rerank · query+doc 联合编码 → 相关性分数</text>
    <g transform="translate(440,18)">
      <rect width="140" height="45" rx="8" fill="#fff"/>
      <text x="70" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">重排打分</text>
      <text x="70" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b21b6">噪声被压到末位</text>
    </g>
  </g>
  <line x1="600" y1="385" x2="600" y2="405" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,405 593,395 607,395" fill="#94a3b8"/>

  <!-- Step 4: Dynamic Threshold -->
  <g transform="translate(300,410)">
    <rect width="600" height="80" rx="12" fill="url(#p4)"/>
    <text x="40" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22">📊</text>
    <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[截断] 动态阈值 / Drop-off 检测</text>
    <text x="85" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fce7f3">分数阈值 θ · 相邻分数断崖检测 · 自适应保留高分组</text>
    <g transform="translate(440,18)">
      <rect width="140" height="45" rx="8" fill="#fff"/>
      <text x="70" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#be185d">k₂ = 3~5</text>
      <text x="70" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#be185d">保质量（过筛子）</text>
    </g>
  </g>
  <line x1="600" y1="495" x2="600" y2="515" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,515 593,505 607,505" fill="#94a3b8"/>

  <!-- Step 5: Context Compression -->
  <g transform="translate(300,520)">
    <rect width="600" height="70" rx="12" fill="url(#p5)"/>
    <text x="40" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="22">🗜️</text>
    <text x="85" y="30" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[上下文压缩]（可选）</text>
    <text x="85" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ccfbf1">LongLLMLingua · 上下文剪枝 · 受 LLM 上下文窗口预算约束</text>
    <text x="570" y="42" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ccfbf1" font-style="italic">k₃ 最终输入</text>
  </g>
  <line x1="600" y1="595" x2="600" y2="615" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,615 593,605 607,605" fill="#94a3b8"/>

  <!-- Step 6: Prompt + LLM -->
  <g transform="translate(300,620)">
    <rect width="600" height="80" rx="12" fill="url(#p6)"/>
    <text x="40" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="22">✨</text>
    <text x="85" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">[Prompt 拼装] → [LLM 生成]</text>
    <text x="85" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">Context + Question → GPT-4 / Claude / Qwen / DeepSeek → 可溯源回答</text>
    <g transform="translate(440,18)">
      <rect width="140" height="45" rx="8" fill="#fff"/>
      <text x="70" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">最终答案</text>
      <text x="70" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#047857">完整 · 准确 · 可溯源</text>
    </g>
  </g>

  <!-- Left side: k labels -->
  <g transform="translate(60,250)">
    <rect width="200" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">k₁ · 粗排 k</text>
    <text x="100" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e40af">大 · 保召回</text>
  </g>
  <line x1="260" y1="280" x2="300" y2="230" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>

  <g transform="translate(60,440)">
    <rect width="200" height="60" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#be185d">k₂ · 精排后 k</text>
    <text x="100" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#be185d">小 · 保质量</text>
  </g>
  <line x1="260" y1="470" x2="300" y2="450" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,3"/>

  <g transform="translate(60,545)">
    <rect width="200" height="60" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488">k₃ · 最终输入 k</text>
    <text x="100" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#0d9488">受上下文预算约束</text>
  </g>
  <line x1="260" y1="575" x2="300" y2="555" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Right side: mindset callout -->
  <g transform="translate(940,250)">
    <rect width="220" height="240" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="110" y="35" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="32">💡</text>
    <text x="110" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">面试核心思维</text>
    <line x1="20" y1="85" x2="200" y2="85" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#78350f">top-k 不是孤立参数，</text>
    <text x="20" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#78350f">而是贯穿 RAG 链路的</text>
    <text x="20" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">协同设计。</text>
    <text x="20" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#78350f">区分 k₁、k₂、k₃，</text>
    <text x="20" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#78350f">讲清每步目标，</text>
    <text x="20" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#92400e">超过 80% 候选人。</text>
  </g>

  <!-- Bottom slogan -->
  <g transform="translate(300,650)">
  </g>
</svg>
