<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Strapi request pipeline</title>
  <desc id="desc">An HTTP request passes through route, middleware and policy, controller, service, document service, Knex and the SQL database before a JSON response is returned.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091022"/><stop offset="1" stop-color="#17133c"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8979ff"/><stop offset="1" stop-color="#5b4bd9"/></linearGradient>
    <filter id="sh3" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".55"/></filter>
    <marker id="a3" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#64e3ff"/></marker>
    <marker id="a3p" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#9a8dff"/></marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f7f7ff}.m{fill:#aab2d2}.h{font-size:22px;font-weight:760}.s{font-size:15px}.card{fill:#181c40;stroke:#404979;stroke-width:2}.line{stroke:#64e3ff;stroke-width:4;fill:none;marker-end:url(#a3)}.back{stroke:#9a8dff;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#a3p)}
    </style>
  </defs>
  <rect width="1500" height="680" rx="30" fill="url(#bg3)"/>
  <text class="t" x="70" y="65" font-size="17" font-weight="700" letter-spacing="2">REQUEST LIFECYCLE / 请求生命周期</text>
  <text class="t m" x="1430" y="65" text-anchor="end" font-size="15">Strapi 5 layered backend</text>

  <g filter="url(#sh3)">
    <rect x="48" y="184" width="150" height="152" rx="24" fill="url(#p3)"/>
    <path d="M85 232h76M85 254h52M85 276h67" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <text class="t h" x="123" y="310" text-anchor="middle">HTTP</text>
    <text class="t s" x="123" y="365" text-anchor="middle">GET /api/articles</text>
  </g>

  <path class="line" d="M198 260h66"/>
  <g filter="url(#sh3)">
    <rect class="card" x="264" y="167" width="170" height="186" rx="22"/>
    <circle cx="349" cy="215" r="25" fill="#28275c"/><path d="M334 215h30M349 200v30" stroke="#64e3ff" stroke-width="4" stroke-linecap="round"/>
    <text class="t h" x="349" y="270" text-anchor="middle">Route</text>
    <text class="t s m" x="349" y="299" text-anchor="middle">方法 · 路径</text>
    <text class="t s m" x="349" y="323" text-anchor="middle">handler</text>
  </g>

  <path class="line" d="M434 260h50"/>
  <g filter="url(#sh3)">
    <rect class="card" x="484" y="135" width="190" height="250" rx="22"/>
    <circle cx="579" cy="187" r="25" fill="#28275c"/><path d="M565 187l10 10 20-24" fill="none" stroke="#73f0bd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t h" x="579" y="237" text-anchor="middle">Middleware</text>
    <text class="t s m" x="579" y="266" text-anchor="middle">日志 · CORS · 限流</text>
    <path d="M515 294h128" stroke="#3d477b" stroke-width="2"/>
    <text class="t h" x="579" y="331" text-anchor="middle">Policy</text>
    <text class="t s m" x="579" y="358" text-anchor="middle">认证 · 授权</text>
  </g>

  <path class="line" d="M674 260h50"/>
  <g filter="url(#sh3)">
    <rect class="card" x="724" y="167" width="170" height="186" rx="22"/>
    <circle cx="809" cy="215" r="25" fill="#28275c"/><path d="M795 204h28v23h-28zM801 198h16" fill="none" stroke="#9a8dff" stroke-width="3"/>
    <text class="t h" x="809" y="270" text-anchor="middle">Controller</text>
    <text class="t s m" x="809" y="299" text-anchor="middle">解析 ctx</text>
    <text class="t s m" x="809" y="323" text-anchor="middle">组织响应</text>
  </g>

  <path class="line" d="M894 260h50"/>
  <g filter="url(#sh3)">
    <rect class="card" x="944" y="167" width="170" height="186" rx="22"/>
    <circle cx="1029" cy="215" r="25" fill="#28275c"/><path d="M1013 222c9-22 23-22 32 0M1017 207h24" fill="none" stroke="#64e3ff" stroke-width="3"/>
    <text class="t h" x="1029" y="270" text-anchor="middle">Service</text>
    <text class="t s m" x="1029" y="299" text-anchor="middle">业务规则</text>
    <text class="t s m" x="1029" y="323" text-anchor="middle">复用与编排</text>
  </g>

  <path class="line" d="M1114 260h50"/>
  <g filter="url(#sh3)">
    <rect x="1164" y="135" width="200" height="250" rx="22" fill="url(#p3)"/>
    <path d="M1236 183l28-16 28 16v32l-28 16-28-16z" fill="none" stroke="#fff" stroke-width="4"/>
    <text class="t h" x="1264" y="270" text-anchor="middle">Document</text>
    <text class="t h" x="1264" y="297" text-anchor="middle">Service</text>
    <text class="t s" x="1264" y="330" text-anchor="middle">locale · draft</text>
    <text class="t s" x="1264" y="354" text-anchor="middle">publish · relations</text>
  </g>

  <path class="line" d="M1264 385v66"/>
  <g filter="url(#sh3)">
    <rect class="card" x="1118" y="451" width="292" height="80" rx="20"/>
    <text class="t h" x="1264" y="486" text-anchor="middle">Query Engine · Knex</text>
    <text class="t s m" x="1264" y="512" text-anchor="middle">SQL abstraction / 连接池</text>
    <path class="line" d="M1118 491H930"/>
    <ellipse cx="805" cy="475" rx="125" ry="30" fill="#252659" stroke="#8a7cff" stroke-width="3"/>
    <path d="M680 475v76c0 17 56 30 125 30s125-13 125-30v-76" fill="#1b1d45" stroke="#8a7cff" stroke-width="3"/>
    <ellipse cx="805" cy="551" rx="125" ry="30" fill="#252659" stroke="#8a7cff" stroke-width="3"/>
    <text class="t h" x="805" y="483" text-anchor="middle">SQL Database</text>
    <text class="t s m" x="805" y="558" text-anchor="middle">Postgres · MySQL · SQLite</text>
  </g>

  <path class="back" d="M805 604C580 650 270 610 123 407"/>
  <rect x="350" y="584" width="306" height="45" rx="22" fill="#211f4e" stroke="#5d58a5"/>
  <text class="t s" x="503" y="612" text-anchor="middle">JSON response · error handling · sanitize</text>
</svg>
