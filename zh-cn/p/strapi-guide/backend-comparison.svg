<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Backend stack positioning comparison</title>
  <desc id="desc">Strapi, Spring Boot, Go web frameworks and Python web frameworks compared by starting point, built-in capabilities, control and best-fit workloads.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091022"/><stop offset="1" stop-color="#17133a"/></linearGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5b4bd8"/></linearGradient>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#020617" flood-opacity=".5"/></filter>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8f7ff}.m{fill:#aab2d2}.h{font-size:25px;font-weight:780}.s{font-size:16px}.tiny{font-size:14px}.card{fill:#171b3d;stroke:#3e4778;stroke-width:2}.row{stroke:#353d6a;stroke-width:2}.pill{fill:#26275a}.dot{fill:#64e3ff}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg4)"/>
  <text class="t" x="70" y="66" font-size="17" font-weight="700" letter-spacing="2">POSITIONING MAP / 工程定位</text>
  <text class="t m" x="1330" y="66" text-anchor="end" font-size="15">不是语言之争，而是默认能力与控制力的取舍</text>

  <g transform="translate(70 110)" filter="url(#sh4)">
    <rect x="0" width="290" height="560" rx="24" fill="url(#sp)"/>
    <circle cx="52" cy="60" r="28" fill="#fff" opacity=".14"/><path d="M37 60l15-16 15 16-15 16z" fill="none" stroke="#fff" stroke-width="4"/>
    <text class="t h" x="92" y="56">Strapi</text><text class="t tiny" x="92" y="80">Node.js · TypeScript</text>
    <path class="row" d="M25 110h240" opacity=".45"/>
    <text class="t tiny" x="25" y="142">STARTING POINT</text><text class="t s" x="25" y="172">Content model first</text><text class="t s" x="25" y="198">内容模型 → 自动 API</text>
    <text class="t tiny" x="25" y="250">BUILT IN</text><text class="t s" x="25" y="280">Admin · CRUD · Media</text><text class="t s" x="25" y="306">RBAC · Draft · i18n</text>
    <text class="t tiny" x="25" y="358">TRADE-OFF</text><text class="t s" x="25" y="388">最快交付内容平台</text><text class="t s" x="25" y="414">偏离内容场景后成本上升</text>
    <rect x="25" y="468" width="240" height="62" rx="15" fill="#211e55" opacity=".7"/><text class="t s" x="145" y="494" text-anchor="middle">BEST FOR</text><text class="t s" x="145" y="518" text-anchor="middle">CMS · Omnichannel</text>
  </g>

  <g transform="translate(390 110)" filter="url(#sh4)">
    <rect class="card" width="290" height="560" rx="24"/>
    <circle cx="52" cy="60" r="28" fill="#2b305c"/><text class="t" x="52" y="68" text-anchor="middle" font-size="24" font-weight="800">J</text>
    <text class="t h" x="92" y="56">Spring Boot</text><text class="t tiny m" x="92" y="80">Java · JVM</text>
    <path class="row" d="M25 110h240"/>
    <text class="t tiny m" x="25" y="142">STARTING POINT</text><text class="t s" x="25" y="172">Domain &amp; code first</text><text class="t s" x="25" y="198">实体 · DTO · 分层</text>
    <text class="t tiny m" x="25" y="250">STRENGTH</text><text class="t s" x="25" y="280">事务 · 消息 · 集成</text><text class="t s" x="25" y="306">强类型 · 团队治理</text>
    <text class="t tiny m" x="25" y="358">TRADE-OFF</text><text class="t s" x="25" y="388">控制力和生态最完整</text><text class="t s" x="25" y="414">样板与工程成本更高</text>
    <rect class="pill" x="25" y="468" width="240" height="62" rx="15"/><text class="t s" x="145" y="494" text-anchor="middle">BEST FOR</text><text class="t s" x="145" y="518" text-anchor="middle">Enterprise · Transaction</text>
  </g>

  <g transform="translate(710 110)" filter="url(#sh4)">
    <rect class="card" width="290" height="560" rx="24"/>
    <circle cx="52" cy="60" r="28" fill="#163d59"/><text class="t" x="52" y="68" text-anchor="middle" font-size="22" font-weight="800">Go</text>
    <text class="t h" x="92" y="56">Go Web</text><text class="t tiny m" x="92" y="80">Gin · Chi · Fiber</text>
    <path class="row" d="M25 110h240"/>
    <text class="t tiny m" x="25" y="142">STARTING POINT</text><text class="t s" x="25" y="172">Explicit composition</text><text class="t s" x="25" y="198">路由 · Handler · 库</text>
    <text class="t tiny m" x="25" y="250">STRENGTH</text><text class="t s" x="25" y="280">高吞吐 · 低内存</text><text class="t s" x="25" y="306">goroutine · 单二进制</text>
    <text class="t tiny m" x="25" y="358">TRADE-OFF</text><text class="t s" x="25" y="388">运行效率与显式控制</text><text class="t s" x="25" y="414">Admin/CMS 需要另建</text>
    <rect class="pill" x="25" y="468" width="240" height="62" rx="15"/><text class="t s" x="145" y="494" text-anchor="middle">BEST FOR</text><text class="t s" x="145" y="518" text-anchor="middle">Cloud · Gateway · Infra</text>
  </g>

  <g transform="translate(1030 110)" filter="url(#sh4)">
    <rect class="card" width="300" height="560" rx="24"/>
    <circle cx="52" cy="60" r="28" fill="#374321"/><text class="t" x="52" y="68" text-anchor="middle" font-size="21" font-weight="800">Py</text>
    <text class="t h" x="92" y="56">Python Web</text><text class="t tiny m" x="92" y="80">Django · DRF · FastAPI</text>
    <path class="row" d="M25 110h250"/>
    <text class="t tiny m" x="25" y="142">STARTING POINT</text><text class="t s" x="25" y="172">Framework dependent</text><text class="t s" x="25" y="198">全家桶或轻量 API</text>
    <text class="t tiny m" x="25" y="250">STRENGTH</text><text class="t s" x="25" y="280">表达力 · 迭代速度</text><text class="t s" x="25" y="306">数据与 AI 生态</text>
    <text class="t tiny m" x="25" y="358">TRADE-OFF</text><text class="t s" x="25" y="388">Django Admin 很接近</text><text class="t s" x="25" y="414">极限吞吐通常非优势</text>
    <rect class="pill" x="25" y="468" width="250" height="62" rx="15"/><text class="t s" x="150" y="494" text-anchor="middle">BEST FOR</text><text class="t s" x="150" y="518" text-anchor="middle">Data · AI · Business App</text>
  </g>
  <path d="M164 704h1072" stroke="#3a4372" stroke-width="5" stroke-linecap="round"/>
  <circle class="dot" cx="164" cy="704" r="8"/><circle class="dot" cx="1236" cy="704" r="8"/>
  <text class="t tiny m" x="164" y="735" text-anchor="middle">更多开箱能力</text><text class="t tiny m" x="1236" y="735" text-anchor="middle">更多显式控制</text>
</svg>
