<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="970" viewBox="0 0 1040 970" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Service DNS, rule maintenance, and request forwarding</title>
  <desc id="desc">For an ordinary ClusterIP Service, DNS returns a Service IP. The control plane maintains EndpointSlices from selectors and Pod state; kube-proxy updates node rules. Requests to the Service IP follow these rules to ready Pods and do not pass through EndpointSlice objects.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#0f766e" stroke-width="2" /></marker>
    <marker id="config-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#326ce5" stroke-width="2" /></marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:600}.body{font-size:22px;fill:#516078}.small{font-size:21px;fill:#516078}
    .traffic{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}
    .config{fill:none;stroke:#326ce5;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#config-arrow)}
  </style>
  <rect width="1040" height="970" rx="24" fill="#fbfaf7" />
  <text x="48" y="60" class="heading">Separate names, backend records, and application traffic</text>
  <text x="48" y="103" class="body">Example: an ordinary ClusterIP Service with a selector, using kube-proxy.</text>
  <rect x="48" y="136" width="944" height="188" rx="18" fill="#eef8f5" stroke="#c4ded5" />
  <text x="72" y="175" class="label">1. DNS: resolve the service name to an address</text>
  <rect x="72" y="199" width="218" height="90" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="181" y="236" text-anchor="middle" class="label">Client resolver</text>
  <text x="181" y="269" text-anchor="middle" class="body">Query web-demo</text>
  <rect x="386" y="199" width="268" height="90" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="520" y="236" text-anchor="middle" class="label">Cluster DNS</text>
  <text x="520" y="269" text-anchor="middle" class="body">DNS Service → CoreDNS</text>
  <rect x="750" y="199" width="218" height="90" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="859" y="236" text-anchor="middle" class="label">DNS result</text>
  <text x="859" y="269" text-anchor="middle" class="body">Service IP</text>
  <path class="traffic" d="M290 244 H386" />
  <path class="traffic" d="M654 244 H750" />
  <rect x="48" y="356" width="944" height="236" rx="18" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="72" y="395" class="label">2. Control: backend changes drive rule updates</text>
  <rect x="72" y="423" width="250" height="116" rx="12" fill="#fff" stroke="#cbd9f1" />
  <text x="197" y="460" text-anchor="middle" class="label">Service + Pods</text>
  <text x="197" y="493" text-anchor="middle" class="body">Labels and readiness</text>
  <text x="197" y="522" text-anchor="middle" class="small">Control plane updates</text>
  <rect x="386" y="423" width="268" height="116" rx="12" fill="#fff" stroke="#cbd9f1" />
  <text x="520" y="460" text-anchor="middle" class="label">EndpointSlice</text>
  <text x="520" y="493" text-anchor="middle" class="body">IPs, ports, conditions</text>
  <text x="520" y="522" text-anchor="middle" class="small">An API object</text>
  <rect x="718" y="423" width="250" height="116" rx="12" fill="#fff" stroke="#cbd9f1" />
  <text x="843" y="460" text-anchor="middle" class="label">kube-proxy</text>
  <text x="843" y="493" text-anchor="middle" class="body">Watch API objects</text>
  <text x="843" y="522" text-anchor="middle" class="small">Update node rules</text>
  <path class="config" d="M322 481 H386" />
  <path class="config" d="M654 481 H718" />
  <text x="72" y="573" class="small">Dashed: configuration updates, not a request forwarding path.</text>
  <rect x="48" y="624" width="944" height="236" rx="18" fill="#eef8f5" stroke="#c4ded5" />
  <text x="72" y="663" class="label">3. Requests: Service IP → ready backend</text>
  <rect x="72" y="710" width="168" height="94" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="156" y="750" text-anchor="middle" class="label">Client</text>
  <text x="156" y="784" text-anchor="middle" class="body">HTTP request</text>
  <rect x="282" y="710" width="222" height="94" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="393" y="750" text-anchor="middle" class="label">Service IP : 80</text>
  <text x="393" y="784" text-anchor="middle" class="body">Virtual address</text>
  <rect x="546" y="710" width="190" height="94" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="641" y="750" text-anchor="middle" class="label">Node rules</text>
  <text x="641" y="784" text-anchor="middle" class="body">Pick backend</text>
  <rect x="778" y="710" width="190" height="94" rx="12" fill="#fff" stroke="#c4ded5" />
  <text x="873" y="750" text-anchor="middle" class="label">Pod IP : 80</text>
  <text x="873" y="784" text-anchor="middle" class="body">Serve the request</text>
  <path class="traffic" d="M240 757 H282" />
  <path class="traffic" d="M504 757 H546" />
  <path class="traffic" d="M736 757 H778" />
  <path class="config" d="M843 539 V611 H704 V710" />
  <text x="72" y="841" class="small">Logical steps: the Service IP is not a separate server.</text>
  <text x="48" y="908" class="body">Headless, ExternalName, node-local DNS caches, and other networking setups differ.</text>
  <text x="48" y="946" class="body">Solid green: queries / requests  |  Dashed blue: configuration / rules</text>
</svg>