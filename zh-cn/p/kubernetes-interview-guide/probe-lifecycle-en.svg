<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Startup, Readiness, and Liveness responsibilities</title>
  <desc id="desc">When a Startup probe is configured, it must succeed before Readiness and Liveness run independently. Readiness affects ordinary Service traffic eligibility. Repeated Liveness or Startup failures terminate the container, subject to its restart policy.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2" /></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:28px;font-weight:600}.body{font-size:23px;fill:#516078}.small{font-size:22px;fill:#516078}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="730" rx="24" fill="#fbfaf7" />
  <text x="48" y="60" class="heading">Separate startup, traffic readiness, and restart decisions</text>
  <text x="48" y="103" class="body">This sequence applies when a container has a Startup probe configured.</text>
  <rect x="48" y="140" width="944" height="146" rx="16" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="76" y="185" class="label">Startup: allow time for the application to initialize</text>
  <text x="76" y="227" class="body">Before success: Readiness and Liveness do not run</text>
  <text x="76" y="263" class="body">Repeated failures: terminate the container; apply its restart policy</text>
  <path class="link" d="M520 286 V326 H274 V386" />
  <path class="link" d="M520 326 H766 V386" />
  <text x="538" y="316" class="small">Success: both probes run independently</text>
  <rect x="48" y="386" width="452" height="204" rx="16" fill="#eef8f5" stroke="#c4ded5" />
  <text x="76" y="432" class="label">Readiness: accept traffic?</text>
  <text x="76" y="477" class="body">Failure → mark unready</text>
  <text x="76" y="514" class="body">Normally excluded by Services</text>
  <text x="76" y="556" class="body" style="fill:#0f766e">Does not directly trigger a restart</text>
  <rect x="540" y="386" width="452" height="204" rx="16" fill="#fff0ef" stroke="#ecc9c6" />
  <text x="568" y="432" class="label">Liveness: need a restart?</text>
  <text x="568" y="477" class="body">Repeated failures → terminate</text>
  <text x="568" y="514" class="body">Then apply restartPolicy</text>
  <text x="568" y="556" class="body" style="fill:#a63b42">Recover by restarting</text>
  <text x="48" y="643" class="body">Running ≠ Ready: a running process may still be unable to serve requests.</text>
  <text x="48" y="683" class="small">Direct Pod IP access and publishing unready addresses need separate consideration.</text>
</svg>