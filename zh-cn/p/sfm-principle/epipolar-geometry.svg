<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Epipolar geometry</title>
  <desc id="desc">Two cameras observing one 3D point, with epipolar lines on two image planes.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 17px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .math { font: 700 22px "Cambria Math", "Times New Roman", serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="46" y="58" class="h">对极几何：匹配点不能随便落，它必须落在一条线上</text>
  <text x="46" y="88" class="s">The fundamental matrix compresses the relative pose constraint into x₂ᵀ F x₁ = 0.</text>

  <g transform="translate(74 136)">
    <polygon points="0,190 54,160 54,220" fill="#f59e0b"/>
    <rect x="54" y="154" width="72" height="72" rx="12" fill="#f59e0b"/>
    <text x="24" y="262" class="t">Camera 1</text>
    <rect x="160" y="80" width="160" height="220" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <line x1="182" y1="118" x2="302" y2="244" stroke="#2563eb" stroke-width="3"/>
    <circle cx="232" cy="170" r="7" fill="#dc2626"/>
    <text x="205" y="330" class="s">image plane 1</text>
  </g>

  <g transform="translate(738 136)">
    <polygon points="320,190 266,160 266,220" fill="#22c55e"/>
    <rect x="194" y="154" width="72" height="72" rx="12" fill="#22c55e"/>
    <text x="205" y="262" class="t">Camera 2</text>
    <rect x="0" y="80" width="160" height="220" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <line x1="18" y1="230" x2="142" y2="116" stroke="#16a34a" stroke-width="3"/>
    <circle cx="92" cy="162" r="7" fill="#dc2626"/>
    <text x="24" y="330" class="s">image plane 2</text>
  </g>

  <circle cx="558" cy="196" r="10" fill="#ef4444"/>
  <text x="574" y="190" class="t">3D point X</text>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)" opacity="0.8">
    <path d="M200 326 L558 196"/>
    <path d="M958 326 L558 196"/>
  </g>
  <line x1="200" y1="326" x2="958" y2="326" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="508" y="352" class="s">baseline / 基线</text>

  <g transform="translate(342 412)">
    <rect x="0" y="0" width="436" height="84" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="44" y="36" class="math">x₂ᵀ F x₁ = 0</text>
    <text x="220" y="34" class="t">基础矩阵 F</text>
    <text x="220" y="58" class="s">intrinsics unknown or ignored</text>
  </g>
</svg>
