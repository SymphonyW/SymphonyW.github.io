<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">SfM outputs and downstream use</title>
  <desc id="desc">SfM outputs sparse points and cameras, which feed MVS, NeRF, and 3DGS workflows.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafc"/>
  <text x="46" y="58" class="h">SfM 的输出不是“完整模型”，而是后续三维任务的几何地基</text>
  <text x="46" y="88" class="s">It gives reliable camera poses and sparse structure, then other methods densify or render the scene.</text>

  <g transform="translate(80 170)">
    <rect class="box" x="0" y="0" width="254" height="146" rx="22"/>
    <text x="34" y="42" class="t">SfM 输出</text>
    <text x="34" y="78" class="s">camera intrinsics / extrinsics</text>
    <text x="34" y="106" class="s">sparse point cloud</text>
    <text x="34" y="134" class="s">tracks and reprojection errors</text>
  </g>

  <g transform="translate(470 72)">
    <rect class="box" x="0" y="0" width="246" height="112" rx="20" fill="#e0f2fe"/>
    <text x="34" y="43" class="t">MVS / 稠密重建</text>
    <text x="34" y="75" class="s">depth maps, meshes, textures</text>
  </g>
  <g transform="translate(470 216)">
    <rect class="box" x="0" y="0" width="246" height="112" rx="20" fill="#dcfce7"/>
    <text x="34" y="43" class="t">NeRF / 神经辐射场</text>
    <text x="34" y="75" class="s">camera poses for training</text>
  </g>
  <g transform="translate(470 360)">
    <rect class="box" x="0" y="0" width="246" height="112" rx="20" fill="#fef3c7"/>
    <text x="34" y="43" class="t">3DGS / 高斯泼溅</text>
    <text x="34" y="75" class="s">initial sparse points</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M334 218 C388 156 424 128 466 126"/>
    <path d="M334 243 H466"/>
    <path d="M334 270 C388 336 424 392 466 414"/>
  </g>

  <g transform="translate(820 160)">
    <rect x="0" y="0" width="220" height="176" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="44" class="t">一句话</text>
    <text x="28" y="82" class="s">SfM 解决“相机在哪里”</text>
    <text x="28" y="112" class="s">和“哪些点在哪里”</text>
    <text x="28" y="142" class="s">不直接解决材质、遮挡、</text>
    <text x="28" y="164" class="s">完整表面和真实渲染</text>
  </g>
</svg>
