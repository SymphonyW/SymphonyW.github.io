<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Triangulation</title>
  <desc id="desc">Two viewing rays intersecting to recover a 3D point.</desc>
  <defs>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .ray { stroke: #0f766e; stroke-width: 4; fill: none; opacity: 0.78; }
      .bad { stroke: #ef4444; stroke-width: 3; fill: none; stroke-dasharray: 8 8; opacity: 0.7; }
    </style>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafc"/>
  <text x="46" y="58" class="h">三角化：已知两个相机和两个像素，反推三维点</text>
  <text x="46" y="88" class="s">With noisy rays, triangulation finds the 3D point that minimizes reprojection error.</text>

  <g transform="translate(120 336)" fill="#f59e0b">
    <path d="M0 36 l48 -22 v43 z"/>
    <rect x="48" y="8" width="72" height="56" rx="12"/>
    <circle cx="82" cy="36" r="12" fill="#fff7ed"/>
  </g>
  <text x="134" y="438" class="t">Camera A</text>

  <g transform="translate(852 336)" fill="#22c55e">
    <path d="M120 36 l-48 -22 v43 z"/>
    <rect x="0" y="8" width="72" height="56" rx="12"/>
    <circle cx="36" cy="36" r="12" fill="#f0fdf4"/>
  </g>
  <text x="858" y="438" class="t">Camera B</text>

  <circle cx="560" cy="154" r="14" fill="#ef4444"/>
  <text x="582" y="148" class="t">Recovered 3D point</text>
  <text x="582" y="174" class="s">X in world coordinates</text>

  <path class="ray" d="M240 372 L560 154"/>
  <path class="ray" d="M852 372 L560 154"/>
  <path class="bad" d="M240 372 L600 176"/>
  <path class="bad" d="M852 372 L520 177"/>

  <g transform="translate(418 262)">
    <rect x="0" y="0" width="284" height="80" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="24" y="34" class="t">现实里射线通常不会精确相交</text>
    <text x="24" y="58" class="s">noise, lens distortion, rolling shutter, wrong matches</text>
  </g>
</svg>
