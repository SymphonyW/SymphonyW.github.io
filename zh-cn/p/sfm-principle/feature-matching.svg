<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Feature detection and matching</title>
  <desc id="desc">Two images with matching feature points connected by lines.</desc>
  <defs>
    <style>
      .h { font: 800 25px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 17px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .line { stroke: #f97316; stroke-width: 2.5; opacity: 0.76; }
    </style>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafc"/>
  <text x="46" y="56" class="h">第一步：把同一个三维点在不同照片里找出来</text>
  <text x="46" y="86" class="s">Local features create the correspondence graph that all later geometry depends on.</text>

  <g transform="translate(72 140)">
    <rect class="panel" x="0" y="0" width="360" height="250" rx="20"/>
    <rect x="24" y="26" width="312" height="176" rx="12" fill="#dbeafe"/>
    <path d="M24 202 L112 114 L168 162 L220 95 L336 202 Z" fill="#16a34a" opacity="0.75"/>
    <circle cx="284" cy="72" r="22" fill="#f59e0b"/>
    <text x="125" y="228" class="t">Image A</text>
  </g>

  <g transform="translate(688 140)">
    <rect class="panel" x="0" y="0" width="360" height="250" rx="20"/>
    <rect x="24" y="26" width="312" height="176" rx="12" fill="#dcfce7"/>
    <path d="M24 202 L94 124 L160 154 L226 88 L336 202 Z" fill="#0284c7" opacity="0.75"/>
    <circle cx="264" cy="70" r="22" fill="#f59e0b"/>
    <text x="126" y="228" class="t">Image B</text>
  </g>

  <g class="line" fill="none">
    <path d="M150 230 C348 170 562 160 772 220"/>
    <path d="M220 262 C400 240 548 236 850 260"/>
    <path d="M305 210 C440 162 612 150 936 200"/>
    <path d="M260 326 C420 348 604 344 914 318"/>
    <path d="M370 280 C496 282 610 284 978 286"/>
  </g>

  <g fill="#ef4444" stroke="#fff" stroke-width="3">
    <circle cx="150" cy="230" r="8"/><circle cx="220" cy="262" r="8"/><circle cx="305" cy="210" r="8"/><circle cx="260" cy="326" r="8"/><circle cx="370" cy="280" r="8"/>
    <circle cx="772" cy="220" r="8"/><circle cx="850" cy="260" r="8"/><circle cx="936" cy="200" r="8"/><circle cx="914" cy="318" r="8"/><circle cx="978" cy="286" r="8"/>
  </g>

  <g transform="translate(430 415)">
    <rect x="0" y="0" width="260" height="66" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="24" y="28" class="t">过滤错误匹配</text>
    <text x="24" y="50" class="s">ratio test + mutual check + RANSAC</text>
  </g>
</svg>
