<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">SfM pipeline</title>
  <desc id="desc">A pipeline from unordered images to sparse reconstruction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .accent1 { fill: #e0f2fe; }
      .accent2 { fill: #dcfce7; }
      .accent3 { fill: #fef3c7; }
      .accent4 { fill: #fae8ff; }
    </style>
  </defs>
  <rect width="1120" height="500" rx="28" fill="#f8fafc"/>
  <text x="48" y="58" class="h">SfM 不是一次“变魔术”，而是一条几何流水线</text>
  <text x="48" y="88" class="s">It repeatedly alternates between matching, camera estimation, triangulation, and global optimization.</text>

  <g transform="translate(50 142)">
    <rect class="box accent1" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="28" y="44">图像输入</text>
    <text class="s" x="32" y="70">Images</text>
    <g fill="#0284c7">
      <rect x="22" y="18" width="28" height="20" rx="4" opacity="0.35"/>
      <rect x="58" y="18" width="28" height="20" rx="4" opacity="0.55"/>
      <rect x="94" y="18" width="28" height="20" rx="4" opacity="0.75"/>
    </g>
  </g>

  <g transform="translate(218 142)">
    <rect class="box" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="28" y="44">特征匹配</text>
    <text class="s" x="30" y="70">Feature graph</text>
    <g fill="#f97316">
      <circle cx="38" cy="25" r="5"/><circle cx="70" cy="28" r="5"/><circle cx="105" cy="24" r="5"/>
    </g>
  </g>

  <g transform="translate(386 142)">
    <rect class="box accent3" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="28" y="44">对极几何</text>
    <text class="s" x="25" y="70">F / E + RANSAC</text>
  </g>

  <g transform="translate(554 142)">
    <rect class="box" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="28" y="44">估计相机</text>
    <text class="s" x="42" y="70">PnP / Pose</text>
  </g>

  <g transform="translate(722 142)">
    <rect class="box accent2" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="40" y="44">三角化</text>
    <text class="s" x="26" y="70">Triangulation</text>
  </g>

  <g transform="translate(890 142)">
    <rect class="box accent4" x="0" y="0" width="142" height="100" rx="18"/>
    <text class="t" x="28" y="44">BA 优化</text>
    <text class="s" x="17" y="70">Bundle Adjustment</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M192 192 H214"/>
    <path d="M360 192 H382"/>
    <path d="M528 192 H550"/>
    <path d="M696 192 H718"/>
    <path d="M864 192 H886"/>
  </g>

  <g transform="translate(150 324)">
    <rect x="0" y="0" width="820" height="110" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="32" y="43" class="t">输出 / Output</text>
    <text x="32" y="72" class="s">相机内外参 camera intrinsics & poses</text>
    <text x="340" y="72" class="s">稀疏点云 sparse point cloud</text>
    <text x="628" y="72" class="s">观测轨迹 tracks</text>
    <g transform="translate(252 30)" fill="#0ea5e9">
      <path d="M0 36 l34 -16 v30 z"/><rect x="34" y="16" width="45" height="28" rx="7"/>
    </g>
    <g transform="translate(552 24)" fill="#22c55e">
      <circle cx="4" cy="8" r="4"/><circle cx="32" cy="25" r="4"/><circle cx="66" cy="10" r="4"/><circle cx="86" cy="42" r="4"/><circle cx="118" cy="27" r="4"/>
    </g>
  </g>
</svg>
