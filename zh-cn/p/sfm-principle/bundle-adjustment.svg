<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Bundle adjustment</title>
  <desc id="desc">Cameras and 3D points connected by observations, with reprojection error residuals.</desc>
  <defs>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .m { font: 700 21px "Cambria Math", "Times New Roman", serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="46" y="58" class="h">Bundle Adjustment：把所有相机和点一起拧到最合理的位置</text>
  <text x="46" y="88" class="s">BA minimizes reprojection error over camera parameters and 3D point positions.</text>

  <g stroke="#94a3b8" stroke-width="2" opacity="0.55">
    <line x1="190" y1="340" x2="492" y2="184"/><line x1="190" y1="340" x2="568" y2="238"/><line x1="190" y1="340" x2="644" y2="160"/>
    <line x1="420" y1="370" x2="492" y2="184"/><line x1="420" y1="370" x2="568" y2="238"/><line x1="420" y1="370" x2="704" y2="270"/>
    <line x1="650" y1="350" x2="568" y2="238"/><line x1="650" y1="350" x2="644" y2="160"/><line x1="650" y1="350" x2="704" y2="270"/>
  </g>

  <g fill="#f59e0b">
    <path d="M132 340 l46 -22 v44 z"/><rect x="178" y="314" width="74" height="52" rx="11"/>
    <path d="M362 370 l46 -22 v44 z"/><rect x="408" y="344" width="74" height="52" rx="11"/>
    <path d="M592 350 l46 -22 v44 z"/><rect x="638" y="324" width="74" height="52" rx="11"/>
  </g>
  <g fill="#ef4444">
    <circle cx="492" cy="184" r="9"/><circle cx="568" cy="238" r="9"/><circle cx="644" cy="160" r="9"/><circle cx="704" cy="270" r="9"/>
  </g>
  <g stroke="#ef4444" stroke-width="3" stroke-linecap="round">
    <line x1="510" y1="188" x2="532" y2="198"/>
    <line x1="582" y1="242" x2="606" y2="250"/>
    <line x1="660" y1="164" x2="684" y2="172"/>
  </g>
  <text x="118" y="430" class="t">camera poses</text>
  <text x="474" y="126" class="t">3D points</text>
  <text x="674" y="196" class="s">residuals / 残差</text>

  <g transform="translate(760 142)">
    <rect x="0" y="0" width="300" height="244" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="26" y="40" class="t">优化目标</text>
    <text x="26" y="82" class="m">min Σ ρ( || xᵢⱼ - π(Pᵢ, Xⱼ) ||² )</text>
    <line x1="26" y1="110" x2="274" y2="110" stroke="#e2e8f0" stroke-width="2"/>
    <text x="26" y="144" class="s">Pᵢ: camera parameters</text>
    <text x="26" y="174" class="s">Xⱼ: 3D point</text>
    <text x="26" y="204" class="s">π: projection function</text>
    <text x="26" y="232" class="s">ρ: robust loss for outliers</text>
  </g>
</svg>
