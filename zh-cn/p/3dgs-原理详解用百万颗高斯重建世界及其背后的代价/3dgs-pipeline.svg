<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">3DGS 整体流程：从一组照片到实时新视角渲染</text>

  <!-- Stage 1: Input images -->
  <g transform="translate(40,180)">
    <rect width="170" height="180" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="85" y="40" text-anchor="middle" font-size="34">📷</text>
    <text x="85" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">① 输入图像</text>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">多视角照片</text>
    <text x="85" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">~100-300 张</text>
    <text x="85" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">已知相机姿态</text>
  </g>
  <line x1="215" y1="270" x2="245" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 2: SfM -->
  <g transform="translate(255,180)">
    <rect width="170" height="180" rx="14" fill="url(#p1)"/>
    <text x="85" y="40" text-anchor="middle" font-size="34">🧭</text>
    <text x="85" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">② SfM 初始化</text>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dbeafe">COLMAP 稀疏重建</text>
    <text x="85" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dbeafe">得到稀疏点云</text>
    <text x="85" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#bfdbfe">作为高斯初值</text>
  </g>
  <line x1="430" y1="270" x2="460" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 3: 3D Gaussians -->
  <g transform="translate(470,180)">
    <rect width="170" height="180" rx="14" fill="url(#p2)"/>
    <text x="85" y="40" text-anchor="middle" font-size="34">⚛️</text>
    <text x="85" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">③ 3D 高斯集合</text>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#d1fae5">百万级 3D 高斯</text>
    <text x="85" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#d1fae5">可微可优化</text>
    <text x="85" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#a7f3d0">位置/协方差/SH/α</text>
  </g>
  <line x1="645" y1="270" x2="675" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 4: Training -->
  <g transform="translate(685,180)">
    <rect width="170" height="180" rx="14" fill="url(#p3)"/>
    <text x="85" y="40" text-anchor="middle" font-size="34">⚙️</text>
    <text x="85" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">④ 训练优化</text>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">梯度下降迭代</text>
    <text x="85" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">自适应密度控制</text>
    <text x="85" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fde68a">克隆/分裂/剪枝</text>
  </g>
  <line x1="860" y1="270" x2="890" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 5: Render -->
  <g transform="translate(900,180)">
    <rect width="170" height="180" rx="14" fill="url(#p4)"/>
    <text x="85" y="40" text-anchor="middle" font-size="34">🖼️</text>
    <text x="85" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">⑤ 实时渲染</text>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fee2e2">可微光栅化</text>
    <text x="85" y="138" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fee2e2">Tile + α 混合</text>
    <text x="85" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fecaca">100+ FPS</text>
  </g>

  <!-- feedback loop -->
  <path d="M 985 360 Q 600 480 540 360" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="600" y="470" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-style="italic" fill="#b45309">渲染图 ↔ 真实图：计算 L1 + D-SSIM 损失，反向传播更新高斯参数</text>

  <!-- bottom note -->
  <g transform="translate(40,500)">
    <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">训练完成后得到一个 .ply 文件，包含所有高斯点的属性；推理时无需任何神经网络，直接光栅化即可。</text>
  </g>
</svg>
