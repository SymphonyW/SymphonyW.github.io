<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f472b6" stop-opacity="0.85"/><stop offset="100%" stop-color="#be185d" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/><stop offset="100%" stop-color="#b45309" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.85"/><stop offset="100%" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">Splatting 是什么：3D 椭球"压扁"成 2D 色块</text>

  <!-- left: 3D world -->
  <g transform="translate(40,90)">
    <rect width="500" height="370" rx="14" fill="#0f172a"/>
    <text x="250" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">3D 空间中的高斯集合</text>

    <!-- 3D gaussians -->
    <ellipse cx="140" cy="180" rx="70" ry="40" fill="url(#blob1)" transform="rotate(-15 140 180)"/>
    <ellipse cx="300" cy="120" rx="60" ry="50" fill="url(#blob2)"/>
    <ellipse cx="360" cy="240" rx="80" ry="35" fill="url(#blob3)" transform="rotate(20 360 240)"/>
    <ellipse cx="200" cy="290" rx="55" ry="55" fill="url(#blob4)"/>
    <ellipse cx="400" cy="320" rx="40" ry="30" fill="url(#blob1)" transform="rotate(-30 400 320)"/>

    <!-- camera -->
    <g transform="translate(20,330)">
      <polygon points="0,0 30,-15 30,15" fill="#fbbf24"/>
      <text x="-5" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fde68a">相机</text>
    </g>
    <!-- viewing frustum -->
    <path d="M 40 322 L 480 90 L 480 290 Z" fill="#fbbf24" opacity="0.08" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- arrow -->
  <line x1="555" y1="275" x2="605" y2="275" stroke="#475569" stroke-width="4" marker-end="url(#arr4)"/>
  <text x="580" y="260" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e293b">投影</text>
  <text x="580" y="295" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11" fill="#64748b">J · Σ · Jᵀ</text>

  <!-- right: 2D screen -->
  <g transform="translate(620,90)">
    <rect width="540" height="370" rx="14" fill="#1e293b"/>
    <text x="270" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">屏幕上的 2D Splats（压扁后混合）</text>

    <!-- 2D splats (flattened versions) -->
    <ellipse cx="120" cy="160" rx="55" ry="30" fill="url(#blob1)" transform="rotate(-10 120 160)"/>
    <ellipse cx="270" cy="110" rx="48" ry="40" fill="url(#blob2)"/>
    <ellipse cx="320" cy="220" rx="65" ry="25" fill="url(#blob3)" transform="rotate(15 320 220)"/>
    <ellipse cx="180" cy="260" rx="45" ry="45" fill="url(#blob4)"/>
    <ellipse cx="370" cy="295" rx="32" ry="22" fill="url(#blob1)" transform="rotate(-25 370 295)"/>

    <!-- grid -->
    <g stroke="#334155" stroke-width="0.5" opacity="0.5">
      <line x1="0" y1="60" x2="540" y2="60"/>
      <line x1="0" y1="120" x2="540" y2="120"/>
      <line x1="0" y1="180" x2="540" y2="180"/>
      <line x1="0" y1="240" x2="540" y2="240"/>
      <line x1="0" y1="300" x2="540" y2="300"/>
      <line x1="90" y1="40" x2="90" y2="350"/>
      <line x1="180" y1="40" x2="180" y2="350"/>
      <line x1="270" y1="40" x2="270" y2="350"/>
      <line x1="360" y1="40" x2="360" y2="350"/>
      <line x1="450" y1="40" x2="450" y2="350"/>
    </g>
    <text x="270" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">16×16 Tile 网格</text>
  </g>

  <text x="600" y="490" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">每个 3D 高斯在屏幕上"压"成一个 2D 高斯，再按深度排序做前向 α 混合，就得到最终像素颜色。</text>
</svg>
