<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Object, file, and block storage</title>
  <desc id="desc">Three connected storage models shown as an object bucket, a directory tree, and a stack of disk blocks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="object" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="file" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <circle cx="1060" cy="92" r="170" fill="#38bdf8" opacity=".07"/>
  <circle cx="92" cy="592" r="210" fill="#34d399" opacity=".06"/>

  <text x="72" y="92" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1">CLOUD STORAGE</text>
  <text x="72" y="132" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">THREE DATA MODELS · THREE ACCESS PATTERNS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="320" height="340" rx="28" fill="#17233a" stroke="#334155"/>
    <rect x="440" y="190" width="320" height="340" rx="28" fill="#17233a" stroke="#334155"/>
    <rect x="810" y="190" width="320" height="340" rx="28" fill="#17233a" stroke="#334155"/>
  </g>

  <g transform="translate(135 245)">
    <path d="M24 40h190l-18 156c-2 20-16 31-36 31H78c-20 0-34-11-36-31z" fill="url(#object)"/>
    <path d="M10 40h218" stroke="#7dd3fc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="84" cy="111" r="23" fill="#e0f2fe" opacity=".95"/>
    <rect x="122" y="88" width="57" height="47" rx="12" fill="#e0f2fe" opacity=".95"/>
    <path d="M78 170h104" stroke="#bae6fd" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  </g>

  <g transform="translate(500 244)">
    <path d="M20 59h75l22 25h105v135H20z" fill="url(#file)"/>
    <path d="M20 84h202" stroke="#a7f3d0" stroke-width="9" opacity=".85"/>
    <path d="M72 127h98M72 160h98M72 193h70" stroke="#d1fae5" stroke-width="11" stroke-linecap="round"/>
    <circle cx="46" cy="127" r="8" fill="#d1fae5"/>
    <circle cx="46" cy="160" r="8" fill="#d1fae5"/>
    <circle cx="46" cy="193" r="8" fill="#d1fae5"/>
  </g>

  <g transform="translate(873 238)">
    <g fill="url(#block)" stroke="#fed7aa" stroke-width="2">
      <rect x="0" y="0" width="92" height="62" rx="12"/>
      <rect x="108" y="0" width="92" height="62" rx="12"/>
      <rect x="0" y="78" width="92" height="62" rx="12"/>
      <rect x="108" y="78" width="92" height="62" rx="12"/>
      <rect x="0" y="156" width="92" height="62" rx="12"/>
      <rect x="108" y="156" width="92" height="62" rx="12"/>
    </g>
    <g fill="#fff7ed" opacity=".86">
      <circle cx="26" cy="31" r="7"/><circle cx="134" cy="31" r="7"/>
      <circle cx="26" cy="109" r="7"/><circle cx="134" cy="109" r="7"/>
      <circle cx="26" cy="187" r="7"/><circle cx="134" cy="187" r="7"/>
    </g>
  </g>

  <g fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="2">
    <text x="230" y="495">OBJECT</text>
    <text x="600" y="495">FILE</text>
    <text x="970" y="495">BLOCK</text>
  </g>
  <g fill="#64748b" opacity=".9">
    <circle cx="415" cy="360" r="5"/><circle cx="785" cy="360" r="5"/>
  </g>
</svg>
