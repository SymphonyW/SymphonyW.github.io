<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How AI token usage is counted</title>
  <desc id="desc">A diagram showing text becoming tokens, requests flowing through an API gateway, model inference, usage reporting, and billing records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#030712" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 705 C210 620 340 770 555 700 C760 633 890 530 1110 607 C1318 680 1415 740 1600 650 L1600 900 L0 900 Z" fill="#22c55e" opacity="0.16"/>
  <path d="M0 195 C210 116 345 258 565 188 C785 118 915 92 1128 167 C1305 229 1405 287 1600 205 L1600 0 L0 0 Z" fill="#67e8f9" opacity="0.13"/>

  <g transform="translate(116 122)">
    <text x="0" y="0" fill="#f0fdfa" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Token 是怎么被计算的</text>
    <text x="0" y="62" fill="#c8f2e5" font-family="Segoe UI, Arial, sans-serif" font-size="28">Tokenizer · API Gateway · Usage · Billing Ledger</text>
  </g>

  <g transform="translate(130 278)" filter="url(#shadow)">
    <rect x="0" y="0" width="1340" height="420" rx="28" fill="url(#card)"/>

    <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(130 178)">
        <rect x="-90" y="-64" width="180" height="128" rx="18" fill="#0f766e"/>
        <text x="0" y="-14" fill="#f0fdfa" font-size="26" font-weight="700">Prompt</text>
        <text x="0" y="24" fill="#ccfbf1" font-size="18">消息与上下文</text>
      </g>
      <g transform="translate(355 178)">
        <rect x="-90" y="-64" width="180" height="128" rx="18" fill="#1d4ed8"/>
        <text x="0" y="-14" fill="#eff6ff" font-size="26" font-weight="700">Tokenizer</text>
        <text x="0" y="24" fill="#bfdbfe" font-size="18">文本切分编号</text>
      </g>
      <g transform="translate(580 178)">
        <rect x="-90" y="-64" width="180" height="128" rx="18" fill="#7c3aed"/>
        <text x="0" y="-14" fill="#faf5ff" font-size="26" font-weight="700">Model</text>
        <text x="0" y="24" fill="#ddd6fe" font-size="18">逐 token 生成</text>
      </g>
      <g transform="translate(805 178)">
        <rect x="-90" y="-64" width="180" height="128" rx="18" fill="#be123c"/>
        <text x="0" y="-14" fill="#fff1f2" font-size="26" font-weight="700">Usage</text>
        <text x="0" y="24" fill="#fecdd3" font-size="18">输入输出统计</text>
      </g>
      <g transform="translate(1030 178)">
        <rect x="-90" y="-64" width="180" height="128" rx="18" fill="#a16207"/>
        <text x="0" y="-14" fill="#fffbeb" font-size="26" font-weight="700">Billing</text>
        <text x="0" y="24" fill="#fde68a" font-size="18">价格与余额</text>
      </g>
      <g transform="translate(1210 300)">
        <rect x="-80" y="-46" width="160" height="92" rx="16" fill="#334155"/>
        <text x="0" y="-6" fill="#f8fafc" font-size="22" font-weight="700">Ledger</text>
        <text x="0" y="24" fill="#cbd5e1" font-size="16">审计记录</text>
      </g>
    </g>

    <g stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.76">
      <path d="M222 178 H265"/>
      <path d="M447 178 H490"/>
      <path d="M672 178 H715"/>
      <path d="M897 178 H940"/>
      <path d="M1118 202 C1160 218 1186 244 1202 266"/>
    </g>
    <g fill="#334155" opacity="0.76">
      <path d="M265 178 l-13 -9 v18 z"/>
      <path d="M490 178 l-13 -9 v18 z"/>
      <path d="M715 178 l-13 -9 v18 z"/>
      <path d="M940 178 l-13 -9 v18 z"/>
      <path d="M1202 266 l-14 -5 8 16 z"/>
    </g>

    <g transform="translate(100 324)" font-family="Consolas, Menlo, monospace" font-size="24">
      <text x="0" y="0" fill="#0f172a">"今天天气不错" → [100644, 7421, 18904, ...]</text>
      <text x="0" y="46" fill="#475569">input_tokens + output_tokens + cache / tool / multimodal tokens</text>
    </g>
  </g>
</svg>
