<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Common image formats cover</title>
  <desc id="desc">A stylized comparison board showing common image format labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.45" stop-color="#164e63"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#e0f2fe" stroke-width="2">
    <path d="M0 690 C260 610 410 780 670 690 S1090 590 1600 720"/>
    <path d="M0 180 C230 250 400 80 640 170 S1080 300 1600 150"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="190" y="145" width="1220" height="610" rx="38" fill="url(#panel)"/>
    <rect x="235" y="205" width="1110" height="90" rx="20" fill="#0f172a"/>
    <text x="270" y="263" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">IMAGE FORMATS</text>
    <text x="920" y="260" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">compression · alpha · animation · quality</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
      <rect x="280" y="365" width="170" height="120" rx="24" fill="#fee2e2"/>
      <text x="365" y="440" fill="#991b1b" font-size="40">JPG</text>
      <rect x="500" y="365" width="170" height="120" rx="24" fill="#dcfce7"/>
      <text x="585" y="440" fill="#166534" font-size="40">PNG</text>
      <rect x="720" y="365" width="170" height="120" rx="24" fill="#fef3c7"/>
      <text x="805" y="440" fill="#92400e" font-size="40">GIF</text>
      <rect x="940" y="365" width="170" height="120" rx="24" fill="#e0f2fe"/>
      <text x="1025" y="440" fill="#075985" font-size="36">WebP</text>
      <rect x="1160" y="365" width="170" height="120" rx="24" fill="#ede9fe"/>
      <text x="1245" y="440" fill="#5b21b6" font-size="38">AVIF</text>
      <rect x="500" y="540" width="170" height="120" rx="24" fill="#fae8ff"/>
      <text x="585" y="615" fill="#86198f" font-size="40">SVG</text>
      <rect x="720" y="540" width="170" height="120" rx="24" fill="#ccfbf1"/>
      <text x="805" y="615" fill="#115e59" font-size="38">HEIC</text>
      <rect x="940" y="540" width="170" height="120" rx="24" fill="#e2e8f0"/>
      <text x="1025" y="615" fill="#334155" font-size="38">TIFF</text>
    </g>
  </g>
</svg>
