<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Model Context Protocol architecture</title>
  <desc id="desc">An MCP hub connects an agent host to remote tools and data sources.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe4"/>
      <stop offset="1" stop-color="#ded7c5"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f594c"/>
      <stop offset="1" stop-color="#25382f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2c25" flood-opacity=".18"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#5e6b61" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#667268" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 16" opacity=".72">
    <path d="M385 320C550 320 555 450 680 450"/>
    <path d="M920 450C1050 450 1050 236 1218 236"/>
    <path d="M920 450C1050 450 1050 450 1218 450"/>
    <path d="M920 450C1050 450 1050 664 1218 664"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="220" width="300" height="200" rx="28" fill="#fbfaf6" stroke="#7f887f" stroke-width="3"/>
    <rect x="680" y="330" width="240" height="240" rx="52" fill="url(#mcp)"/>
    <rect x="1218" y="150" width="250" height="170" rx="24" fill="#fbfaf6" stroke="#7f887f" stroke-width="3"/>
    <rect x="1218" y="365" width="250" height="170" rx="24" fill="#fbfaf6" stroke="#7f887f" stroke-width="3"/>
    <rect x="1218" y="580" width="250" height="170" rx="24" fill="#fbfaf6" stroke="#7f887f" stroke-width="3"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="270" y="292" font-size="30" font-weight="700" fill="#29372f">AGENT HOST</text>
    <text x="270" y="342" font-size="22" fill="#657068">LLM · policy · client</text>
    <text x="800" y="426" font-size="54" font-weight="800" fill="#f5f1e7">MCP</text>
    <text x="800" y="474" font-size="20" letter-spacing="5" fill="#cbd4cc">PROTOCOL</text>
    <text x="800" y="516" font-size="17" fill="#aebdb2">JSON-RPC · HTTP</text>
    <text x="1343" y="216" font-size="27" font-weight="700" fill="#29372f">TOOLS</text>
    <text x="1343" y="261" font-size="19" fill="#657068">actions &amp; APIs</text>
    <text x="1343" y="431" font-size="27" font-weight="700" fill="#29372f">RESOURCES</text>
    <text x="1343" y="476" font-size="19" fill="#657068">data &amp; context</text>
    <text x="1343" y="646" font-size="27" font-weight="700" fill="#29372f">PROMPTS</text>
    <text x="1343" y="691" font-size="19" fill="#657068">workflow templates</text>
  </g>
  <g fill="#3f594c">
    <circle cx="420" cy="320" r="8"/><circle cx="680" cy="450" r="8"/>
    <circle cx="920" cy="450" r="8"/><circle cx="1218" cy="236" r="8"/>
    <circle cx="1218" cy="450" r="8"/><circle cx="1218" cy="664" r="8"/>
  </g>
  <text x="120" y="790" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#29372f">One protocol. Many capabilities.</text>
  <text x="122" y="833" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#657068">From tool discovery to safe remote execution</text>
</svg>
