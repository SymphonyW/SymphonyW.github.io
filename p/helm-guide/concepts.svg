<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">四个概念，一次分清</title><desc id="desc">One chart can produce multiple independent releases.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2768cf"/></marker></defs><rect width="1200" height="660" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif"><text x="54" y="58" font-size="32" font-weight="700" fill="#16324f" text-anchor="start">四个概念，一次分清</text><text x="54" y="95" font-size="20" font-weight="400" fill="#576b80" text-anchor="start">One chart can produce multiple independent releases.</text><rect x="54" y="144" width="310" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="54" y="160" width="5" height="156" rx="2" fill="#2768cf"/><text x="78" y="186" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Repository / Registry</text><text x="78" y="217" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">存放 Chart 包</text><text x="78" y="259" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">HTTP repository</text><text x="78" y="293" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">or OCI registry</text><path d="M 372 235 L 423 235" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="437" y="144" width="310" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="437" y="160" width="5" height="156" rx="2" fill="#2768cf"/><text x="461" y="186" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Chart</text><text x="461" y="217" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">可复用的部署方案</text><text x="461" y="259" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">templates + defaults</text><text x="461" y="293" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Chart version: 0.1.0</text><text x="783" y="244" font-size="34" font-weight="600" fill="#576b80" text-anchor="start">+</text><rect x="821" y="144" width="325" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="821" y="160" width="5" height="156" rx="2" fill="#087f8c"/><text x="845" y="186" font-size="27" font-weight="700" fill="#087f8c" text-anchor="start">values</text><text x="845" y="217" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">本次安装的参数</text><text x="845" y="259" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">dev: 1 replica</text><text x="845" y="293" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">prod: 3 replicas</text><path d="M 592 342 L 592 365 L 983 365 L 983 342 M 787 365 L 787 382 L 315 382 M 787 382 L 885 382" fill="none" stroke="#2768cf" stroke-width="2"/><path d="M 315 382 L 315 399" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><path d="M 885 382 L 885 399" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="54" y="400" width="522" height="179" rx="18" fill="#edf4ff" stroke="#b9d0f4" stroke-width="2"/><text x="80" y="444" font-size="28" font-weight="700" fill="#2768cf" text-anchor="start">Release: web-dev</text><text x="80" y="485" font-size="23" font-weight="400" fill="#16324f" text-anchor="start">namespace: helm-dev</text><text x="80" y="526" font-size="22" font-weight="400" fill="#576b80" text-anchor="start">1 replica · independent history</text><rect x="624" y="400" width="522" height="179" rx="18" fill="#e8f5f3" stroke="#a9d8d1" stroke-width="2"/><text x="650" y="444" font-size="28" font-weight="700" fill="#087f8c" text-anchor="start">Release: web-prod</text><text x="650" y="485" font-size="23" font-weight="400" fill="#16324f" text-anchor="start">namespace: helm-prod</text><text x="650" y="526" font-size="22" font-weight="400" fill="#576b80" text-anchor="start">3 replicas · independent history</text><text x="1146" y="636" font-size="14" font-weight="600" fill="#576b80" text-anchor="end">SNOW / HELM FIELD NOTES</text></g></svg>
