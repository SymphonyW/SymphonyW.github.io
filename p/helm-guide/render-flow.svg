<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Helm 负责交付，Kubernetes 持续维护运行</title><desc id="desc">Rendering and release records belong to Helm; reconciliation belongs to Kubernetes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2768cf"/></marker></defs><rect width="1200" height="720" fill="#f4f7fb"/><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif"><text x="54" y="58" font-size="32" font-weight="700" fill="#16324f" text-anchor="start">Helm 负责交付，Kubernetes 持续维护运行</text><text x="54" y="95" font-size="20" font-weight="400" fill="#576b80" text-anchor="start">Rendering and release records belong to Helm; reconciliation belongs to Kubernetes.</text><rect x="54" y="146" width="300" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="54" y="162" width="5" height="156" rx="2" fill="#2768cf"/><text x="78" y="188" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Inputs / 输入</text><text x="78" y="219" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">Chart + values + context</text><text x="78" y="261" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">{{ .Values.replicaCount }}</text><text x="78" y="295" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicaCount: 2</text><path d="M 363 239 L 423 239" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="437" y="146" width="307" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="437" y="162" width="5" height="156" rx="2" fill="#2768cf"/><text x="461" y="188" font-size="27" font-weight="700" fill="#2768cf" text-anchor="start">Helm render / 渲染</text><text x="461" y="219" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">生成普通 Kubernetes YAML</text><text x="461" y="261" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">kind: Deployment</text><text x="461" y="295" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">replicas: 2</text><path d="M 753 239 L 812 239" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="146" width="320" height="188" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="826" y="162" width="5" height="156" rx="2" fill="#087f8c"/><text x="850" y="188" font-size="27" font-weight="700" fill="#087f8c" text-anchor="start">API Server</text><text x="850" y="219" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">接收并校验资源</text><text x="850" y="261" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">RBAC · API validation</text><text x="850" y="295" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Admission policies</text><path d="M 986 344 L 986 400" fill="none" stroke="#2768cf" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="418" width="514" height="184" rx="18" fill="#fff" stroke="#d7e2ee" stroke-width="2"/><rect x="632" y="434" width="5" height="152" rx="2" fill="#087f8c"/><text x="656" y="460" font-size="27" font-weight="700" fill="#087f8c" text-anchor="start">Kubernetes controllers</text><text x="656" y="491" font-size="18" font-weight="400" fill="#576b80" text-anchor="start">持续使实际状态接近期望状态</text><text x="656" y="533" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Deployment → ReplicaSet → Pods</text><text x="656" y="567" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Pod fails? Kubernetes replaces it.</text><rect x="54" y="418" width="516" height="184" rx="18" fill="#edf4ff" stroke="#b9d0f4" stroke-width="2"/><text x="80" y="463" font-size="28" font-weight="700" fill="#2768cf" text-anchor="start">Release record / 发布记录</text><text x="80" y="506" font-size="22" font-weight="400" fill="#16324f" text-anchor="start">Default storage: namespace Secret</text><text x="80" y="546" font-size="21" font-weight="400" fill="#576b80" text-anchor="start">Chart · values · manifests · revision</text><text x="54" y="661" font-size="23" font-weight="600" fill="#16324f" text-anchor="start">Helm CLI exits → Kubernetes keeps running. 退出 Helm 不会停止应用。</text><text x="1146" y="696" font-size="14" font-weight="600" fill="#576b80" text-anchor="end">SNOW / HELM FIELD NOTES</text></g></svg>
