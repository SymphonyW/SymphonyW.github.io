<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flask 路由、视图函数与模板</title>
  <desc id="desc">展示路由表如何找到视图函数，并由视图函数返回 HTML、JSON、重定向或错误页</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffdf8"/><stop offset="100%" stop-color="#f4fffc"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0f766e"/></marker>
    <style>.font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Cascadia Mono",monospace}.h{font-size:48px;font-weight:800;fill:#17202a}.sub{font-size:27px;fill:#52606d}.panel-title{font-size:36px;font-weight:800}.line{font-size:30px;fill:#17202a}.code{font-size:26px;fill:#17202a}.note{font-size:29px;fill:#17202a}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="122" class="font h">路由、视图函数与模板</text>
  <text x="92" y="164" class="font sub">Flask 的核心很薄：URL Rule 找到视图函数，视图函数决定返回 HTML 或 JSON</text>
  <g class="font">
    <rect x="110" y="247" width="435" height="433" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="155" y="334" class="panel-title" fill="#2563eb">路由表</text>
    <text x="155" y="389" class="mono line">GET  /</text><text x="155" y="437" class="mono line">GET  /items</text><text x="155" y="485" class="mono line">POST /items</text><text x="155" y="533" class="mono line">GET  /items/&lt;id&gt;</text>
    <line x1="555" y1="462" x2="690" y2="462" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="705" y="247" width="395" height="433" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="750" y="334" class="panel-title" fill="#0f766e">视图函数</text>
    <text x="750" y="387" class="mono code">def index():</text><text x="778" y="425" class="mono code">return render_template(...)</text>
    <text x="750" y="503" class="mono code">def create_item():</text><text x="778" y="541" class="mono code">return jsonify(...), 201</text>
    <line x1="1112" y1="462" x2="1230" y2="462" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1245" y="247" width="245" height="433" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1290" y="334" class="panel-title" fill="#e76f51">输出</text>
    <text x="1290" y="393" class="line">HTML 页面</text><text x="1290" y="441" class="line">JSON API</text><text x="1290" y="489" class="line">重定向</text><text x="1290" y="537" class="line">错误页</text>
    <rect x="185" y="735" width="1230" height="78" rx="22" fill="#fff" stroke="#b9e3dd" stroke-width="3"/>
    <text x="225" y="786" font-size="30" font-weight="800" fill="#0f766e">经验法则：</text>
    <text x="380" y="786" class="note">页面项目重点掌握 Jinja2 模板；纯 API 项目重点管理 JSON、状态码和错误结构。</text>
  </g>
</svg>
