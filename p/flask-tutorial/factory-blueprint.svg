<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Flask 应用工厂与 Blueprint</title>
  <desc id="desc">展示 Flask 项目如何用 create_app 和 Blueprint 组织目录与模块</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f5fff8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0f766e"/></marker>
    <style>.font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Cascadia Mono",monospace}.h{font-size:48px;font-weight:800;fill:#17202a}.sub{font-size:27px;fill:#52606d}.tree-bold{font-size:27px;font-weight:800;fill:#0f766e}.tree{font-size:25px;fill:#17202a}.box-title{font-size:30px;font-weight:800}.body{font-size:22px;fill:#52606d}</style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="90" y="122" class="font h">应用工厂与 Blueprint</text>
  <text x="92" y="164" class="font sub">项目变大后，不要把所有路由堆进 app.py；用 create_app 和蓝图组织模块</text>
  <g class="font">
    <rect x="100" y="225" width="550" height="610" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="155" y="298" class="tree-bold">▸ flask-shop/</text><text x="183" y="335" class="tree-bold">▸ app/</text><text x="211" y="372" class="tree">• __init__.py</text>
    <text x="211" y="409" class="tree-bold">▸ blueprints/</text><text x="239" y="446" class="tree">• items.py</text><text x="239" y="483" class="tree">• users.py</text>
    <text x="211" y="520" class="tree-bold">▸ templates/</text><text x="239" y="557" class="tree">• base.html</text><text x="239" y="594" class="tree">• items/list.html</text>
    <text x="211" y="631" class="tree-bold">▸ static/</text><text x="239" y="668" class="tree">• style.css</text><text x="211" y="705" class="tree">• config.py</text>
    <text x="183" y="742" class="tree-bold">▸ tests/</text><text x="211" y="779" class="tree">• test_items.py</text>
    <line x1="662" y1="520" x2="760" y2="520" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(790 250)"><rect width="650" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="61" cy="67" r="25" fill="#2563eb"/><text x="115" y="63" class="box-title" fill="#2563eb">create_app</text><text x="115" y="98" class="body">创建 Flask 实例　读取配置　注册扩展和蓝图</text></g>
    <g transform="translate(790 400)"><rect width="650" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="61" cy="67" r="25" fill="#0f766e"/><text x="115" y="63" class="box-title" fill="#0f766e">Blueprint</text><text x="115" y="98" class="body">按业务域拆路由　items / users / admin　便于测试和复用</text></g>
    <g transform="translate(790 550)"><rect width="650" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="61" cy="67" r="25" fill="#e76f51"/><text x="115" y="63" class="box-title" fill="#e76f51">Extensions</text><text x="115" y="98" class="body">SQLAlchemy　Flask-Login　Flask-WTF</text></g>
    <g transform="translate(790 700)"><rect width="650" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="61" cy="67" r="25" fill="#7c3aed"/><text x="115" y="63" class="box-title" fill="#7c3aed">Templates / Static</text><text x="115" y="98" class="body">模板继承　CSS / JS / 图片　页面资产集中管理</text></g>
  </g>
</svg>
