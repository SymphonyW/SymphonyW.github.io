<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flask 请求生命周期</title>
  <desc id="desc">展示浏览器、WSGI Server、Flask App、视图函数和响应之间的请求流转</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f9fbff"/><stop offset="100%" stop-color="#fffdf7"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#0f766e"/></marker>
    <style>.font{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.h{font-size:48px;font-weight:800;fill:#17202a}.sub{font-size:27px;fill:#52606d}.box-title{font-size:28px;font-weight:800}.body{font-size:24px;fill:#52606d}.note{font-size:26px;fill:#17202a}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="122" class="font h">Flask 请求生命周期</text>
  <text x="92" y="164" class="font sub">从 WSGI Server 到视图函数，再到响应对象和模板渲染</text>
  <g class="font">
    <g transform="translate(115 280)"><rect width="245" height="235" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="245" height="12" fill="#2563eb"/><text x="122" y="62" text-anchor="middle" class="box-title" fill="#2563eb">浏览器</text><text x="28" y="110" class="body">HTTP 请求</text><text x="28" y="143" class="body">路径 / 方法</text><text x="28" y="176" class="body">Cookie</text></g>
    <line x1="370" y1="398" x2="402" y2="398" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(415 280)"><rect width="245" height="235" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="245" height="12" fill="#7c3aed"/><text x="122" y="62" text-anchor="middle" class="box-title" fill="#7c3aed">WSGI Server</text><text x="28" y="110" class="body">Gunicorn</text><text x="28" y="143" class="body">Waitress</text><text x="28" y="176" class="body">uWSGI</text></g>
    <line x1="670" y1="398" x2="702" y2="398" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(715 280)"><rect width="245" height="235" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="245" height="12" fill="#0f766e"/><text x="122" y="62" text-anchor="middle" class="box-title" fill="#0f766e">Flask App</text><text x="28" y="110" class="body">创建 request</text><text x="28" y="143" class="body">匹配 URL Rule</text><text x="28" y="176" class="body">执行钩子</text></g>
    <line x1="970" y1="398" x2="1002" y2="398" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1015 280)"><rect width="245" height="235" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="245" height="12" fill="#12a67a"/><text x="122" y="62" text-anchor="middle" class="box-title" fill="#12a67a">视图函数</text><text x="28" y="110" class="body">读取 request</text><text x="28" y="143" class="body">调用业务逻辑</text><text x="28" y="176" class="body">返回数据</text></g>
    <line x1="1270" y1="398" x2="1302" y2="398" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1315 280)"><rect width="245" height="235" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><rect width="245" height="12" fill="#e76f51"/><text x="122" y="62" text-anchor="middle" class="box-title" fill="#e76f51">响应</text><text x="28" y="110" class="body">JSON / HTML</text><text x="28" y="143" class="body">状态码</text><text x="28" y="176" class="body">Header</text></g>
    <rect x="210" y="650" width="1180" height="115" rx="26" fill="#fff" stroke="#b9e3dd" stroke-width="3"/>
    <text x="250" y="722" font-size="31" font-weight="800" fill="#0f766e">理解重点</text>
    <text x="420" y="705" class="note">Flask 本身负责请求上下文、路由匹配和响应构造；</text>
    <text x="420" y="740" class="note">数据库、表单校验、登录系统等能力由扩展或你的代码组合完成。</text>
  </g>
</svg>
