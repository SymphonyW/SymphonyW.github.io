<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">From content model to generated APIs</title>
  <desc id="desc">A Strapi content model drives database schema, admin forms, REST routes and optional GraphQL schema.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1022"/><stop offset="1" stop-color="#16143b"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5947d5"/></linearGradient>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity=".5"/></filter>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6de4ff"/></marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8f7ff}.m{fill:#aab2d4}.h{font-size:25px;font-weight:760}.s{font-size:17px}.tiny{font-size:14px}.card{fill:#171b3d;stroke:#3b4477;stroke-width:2}.tag{fill:#282657;stroke:#6f63dd}.line{fill:none;stroke:#6de4ff;stroke-width:4;stroke-linecap:round;marker-end:url(#arr2)}
    </style>
  </defs>
  <rect width="1400" height="720" rx="30" fill="url(#bg2)"/>
  <text class="t" x="70" y="68" font-size="17" font-weight="700" letter-spacing="2">CONTENT MODEL FIRST / 模型驱动</text>
  <g filter="url(#shadow2)">
    <rect class="card" x="70" y="112" width="350" height="500" rx="26"/>
    <rect x="96" y="138" width="298" height="68" rx="16" fill="url(#core)"/>
    <text class="t h" x="122" y="179">Article / 文章</text>
    <text class="t tiny m" x="96" y="240">FIELD</text><text class="t tiny m" x="300" y="240">TYPE</text>
    <g class="t s">
      <rect class="tag" x="96" y="260" width="298" height="48" rx="12"/><text x="116" y="290">title</text><text x="300" y="290">Text *</text>
      <rect class="tag" x="96" y="322" width="298" height="48" rx="12"/><text x="116" y="352">slug</text><text x="300" y="352">UID</text>
      <rect class="tag" x="96" y="384" width="298" height="48" rx="12"/><text x="116" y="414">content</text><text x="300" y="414">Blocks</text>
      <rect class="tag" x="96" y="446" width="298" height="48" rx="12"/><text x="116" y="476">cover</text><text x="300" y="476">Media</text>
      <rect class="tag" x="96" y="508" width="298" height="48" rx="12"/><text x="116" y="538">author</text><text x="300" y="538">Relation</text>
    </g>
    <text class="t tiny m" x="245" y="588" text-anchor="middle">schema.json · source of truth</text>
  </g>

  <path class="line" d="M420 362h140"/>
  <g filter="url(#shadow2)">
    <circle cx="700" cy="362" r="143" fill="url(#core)"/>
    <circle cx="700" cy="362" r="113" fill="#151638" stroke="#b4abff" stroke-opacity=".5" stroke-width="2"/>
    <path d="M653 298l47-27 47 27v54l-47 27-47-27z" fill="none" stroke="#9d90ff" stroke-width="6"/>
    <path d="M678 309l22-13 22 13v27l-22 13-22-13z" fill="#6de4ff"/>
    <text class="t h" x="700" y="422" text-anchor="middle">Strapi Core</text>
    <text class="t tiny" x="700" y="448" text-anchor="middle" fill="#c6c1ff">装配而非复制模板代码</text>
  </g>

  <path class="line" d="M843 290C914 290 898 165 970 165"/>
  <path class="line" d="M843 335C910 335 912 312 970 312"/>
  <path class="line" d="M843 385C910 385 912 459 970 459"/>
  <path class="line" d="M843 430C914 430 898 606 970 606"/>

  <g filter="url(#shadow2)">
    <rect class="card" x="970" y="102" width="360" height="126" rx="22"/>
    <circle cx="1026" cy="165" r="28" fill="#262960"/><path d="M1011 165h30M1026 150v30" stroke="#6de4ff" stroke-width="4" stroke-linecap="round"/>
    <text class="t h" x="1070" y="154">Database schema</text><text class="t s m" x="1070" y="184">表、字段、关系与索引</text>
    <rect class="card" x="970" y="249" width="360" height="126" rx="22"/>
    <circle cx="1026" cy="312" r="28" fill="#262960"/><rect x="1012" y="298" width="28" height="28" rx="4" fill="none" stroke="#8b7cff" stroke-width="3"/><path d="M1018 307h16M1018 315h12" stroke="#8b7cff" stroke-width="2"/>
    <text class="t h" x="1070" y="301">Admin UI</text><text class="t s m" x="1070" y="331">编辑表单、列表与校验</text>
    <rect class="card" x="970" y="396" width="360" height="126" rx="22"/>
    <circle cx="1026" cy="459" r="28" fill="#262960"/><text class="t" x="1026" y="466" text-anchor="middle" font-size="20" font-weight="800">REST</text>
    <text class="t h" x="1070" y="448">CRUD routes</text><text class="t s m" x="1070" y="478">GET · POST · PUT · DELETE</text>
    <rect class="card" x="970" y="543" width="360" height="126" rx="22"/>
    <circle cx="1026" cy="606" r="28" fill="#262960"/><path d="M1012 606l14-18 14 18-14 18z" fill="none" stroke="#e599ff" stroke-width="3"/>
    <text class="t h" x="1070" y="595">GraphQL schema</text><text class="t s m" x="1070" y="625">可选插件自动扩展类型</text>
  </g>
  <text class="t tiny m" x="700" y="679" text-anchor="middle">Change the model once → evolve every delivery surface together</text>
</svg>
