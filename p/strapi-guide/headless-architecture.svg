<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Strapi headless content architecture</title>
  <desc id="desc">Content teams manage structured content in Strapi, which stores it in a database and distributes it through APIs to web, mobile, mini programs and smart devices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1024"/><stop offset="1" stop-color="#17113c"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5b4bd8"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65e7ff"/><stop offset="1" stop-color="#4b8cff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#65e7ff"/></marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8f7ff}.muted{fill:#a9afd0}.cap{font-size:16px;font-weight:700;letter-spacing:2px}.h{font-size:25px;font-weight:750}.s{font-size:17px}.tiny{font-size:14px}.card{fill:#171a3a;stroke:#3e467a;stroke-width:2}.line{fill:none;stroke:#65e7ff;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="700" cy="365" r="250" fill="#6553f5" opacity=".08"/>
  <text class="t cap" x="70" y="73">CREATE / 管理内容</text>
  <text class="t cap" x="1130" y="73">DELIVER / 多端分发</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="120" width="290" height="130" rx="22"/>
    <circle cx="108" cy="166" r="22" fill="#8b7cff"/>
    <path d="M98 166h20M108 156v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text class="t h" x="145" y="162">Content team</text>
    <text class="t s muted" x="145" y="192">编辑、审核、发布</text>
    <rect class="card" x="60" y="282" width="290" height="130" rx="22"/>
    <rect x="87" y="315" width="48" height="43" rx="7" fill="none" stroke="#65e7ff" stroke-width="3"/>
    <path d="M97 329h28M97 341h20" stroke="#65e7ff" stroke-width="3" stroke-linecap="round"/>
    <text class="t h" x="154" y="329">Admin panel</text>
    <text class="t s muted" x="154" y="359">内容模型与媒体库</text>
    <rect class="card" x="60" y="444" width="290" height="130" rx="22"/>
    <path d="M91 493h42M91 507h32M91 521h37" stroke="#8b7cff" stroke-width="5" stroke-linecap="round"/>
    <text class="t h" x="154" y="491">Workflow</text>
    <text class="t s muted" x="154" y="521">草稿、i18n、权限</text>
  </g>

  <path class="line" d="M350 185C445 185 430 280 500 300"/>
  <path class="line" d="M350 347C430 347 430 347 500 347"/>
  <path class="line" d="M350 509C445 509 430 415 500 395"/>

  <g filter="url(#shadow)">
    <rect x="500" y="180" width="400" height="340" rx="36" fill="url(#purple)"/>
    <rect x="526" y="206" width="348" height="288" rx="25" fill="#151538" stroke="#b5adff" stroke-opacity=".45"/>
    <path d="M655 273l45-27 45 27v54l-45 27-45-27z" fill="none" stroke="#9e91ff" stroke-width="6"/>
    <path d="M677 285l23-14 23 14v28l-23 14-23-14z" fill="#65e7ff" opacity=".9"/>
    <text class="t" x="700" y="398" text-anchor="middle" font-size="36" font-weight="800">STRAPI</text>
    <text class="t s" x="700" y="430" text-anchor="middle" fill="#c8c3ff">Content Hub / 内容中枢</text>
    <rect x="593" y="455" width="214" height="42" rx="21" fill="#26245b"/>
    <text class="t tiny" x="700" y="481" text-anchor="middle">REST · GraphQL · Webhooks</text>
  </g>

  <path d="M700 520v70" stroke="#8b7cff" stroke-width="5"/>
  <g filter="url(#shadow)">
    <ellipse cx="700" cy="611" rx="128" ry="35" fill="#252354" stroke="#8b7cff" stroke-width="3"/>
    <path d="M572 611v72c0 19 57 35 128 35s128-16 128-35v-72" fill="#1c1c45" stroke="#8b7cff" stroke-width="3"/>
    <ellipse cx="700" cy="683" rx="128" ry="35" fill="#252354" stroke="#8b7cff" stroke-width="3"/>
    <text class="t s" x="700" y="618" text-anchor="middle">SQL Database</text>
    <text class="t tiny muted" x="700" y="684" text-anchor="middle">PostgreSQL · MySQL · SQLite</text>
  </g>

  <path class="line" d="M900 278C992 278 970 165 1060 165"/>
  <path class="line" d="M900 333C1002 333 975 333 1060 333"/>
  <path class="line" d="M900 388C992 388 970 501 1060 501"/>
  <path class="line" d="M900 443C982 443 975 645 1060 645"/>

  <g filter="url(#shadow)">
    <rect class="card" x="1060" y="104" width="280" height="122" rx="22"/>
    <rect x="1090" y="132" width="76" height="51" rx="6" fill="none" stroke="#65e7ff" stroke-width="4"/><path d="M1128 183v14m-24 0h48" stroke="#65e7ff" stroke-width="4"/>
    <text class="t h" x="1190" y="153">Web</text><text class="t tiny muted" x="1190" y="181">Next.js · Nuxt · Hugo</text>
    <rect class="card" x="1060" y="272" width="280" height="122" rx="22"/>
    <rect x="1104" y="293" width="47" height="76" rx="9" fill="none" stroke="#8b7cff" stroke-width="4"/><circle cx="1127.5" cy="358" r="3" fill="#8b7cff"/>
    <text class="t h" x="1190" y="321">Mobile</text><text class="t tiny muted" x="1190" y="349">iOS · Android · Flutter</text>
    <rect class="card" x="1060" y="440" width="280" height="122" rx="22"/>
    <rect x="1091" y="468" width="75" height="55" rx="12" fill="none" stroke="#65e7ff" stroke-width="4"/><path d="M1108 538h42" stroke="#65e7ff" stroke-width="4"/>
    <text class="t h" x="1190" y="489">Mini App</text><text class="t tiny muted" x="1190" y="517">小程序 · Kiosk</text>
    <rect class="card" x="1060" y="598" width="280" height="96" rx="22"/>
    <circle cx="1128" cy="646" r="24" fill="none" stroke="#8b7cff" stroke-width="4"/><circle cx="1128" cy="646" r="7" fill="#65e7ff"/>
    <text class="t h" x="1190" y="640">IoT</text><text class="t tiny muted" x="1190" y="665">Voice · Smart device</text>
  </g>
  <circle cx="930" cy="278" r="5" fill="#65e7ff" filter="url(#glow)"/><circle cx="970" cy="333" r="5" fill="#65e7ff" filter="url(#glow)"/><circle cx="940" cy="405" r="5" fill="#65e7ff" filter="url(#glow)"/>
</svg>
