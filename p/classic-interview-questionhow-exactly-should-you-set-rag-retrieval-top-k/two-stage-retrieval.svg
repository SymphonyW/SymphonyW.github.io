<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="recall" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="rerank" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="final" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="twin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">两阶段检索：粗排保召回，精排提质量</text>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">双塔 Embedding 大 k 撒网 → Cross-Encoder 重排 → 取小 k 喂 LLM</text>

  <!-- Query -->
  <g transform="translate(40,310)">
    <rect width="140" height="80" rx="12" fill="#fbbf24"/>
    <text x="70" y="38" text-anchor="middle" font-size="26">🙋</text>
    <text x="70" y="65" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">用户 Query</text>
  </g>
  <line x1="185" y1="350" x2="215" y2="350" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="215,350 205,344 205,356" fill="#94a3b8"/>

  <!-- Stage 1: Coarse retrieval -->
  <g transform="translate(220,140)">
    <rect width="280" height="420" rx="14" fill="url(#recall)"/>
    <text x="140" y="40" text-anchor="middle" font-size="28">🔍</text>
    <text x="140" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">① 粗排（Recall）</text>
    <text x="140" y="95" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dbeafe">宁可错杀，不可放过</text>

    <!-- Twin tower visualization -->
    <g transform="translate(40,120)">
      <rect width="80" height="100" rx="8" fill="url(#twin)"/>
      <text x="40" y="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">Query</text>
      <text x="40" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20">📐</text>
      <text x="40" y="75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#cffafe">向量化</text>
      <text x="40" y="92" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#cffafe">[0.2,0.7..]</text>

      <text x="105" y="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#fff">cos</text>
      <text x="105" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">相似</text>

      <rect x="130" y="0" width="80" height="100" rx="8" fill="url(#twin)"/>
      <text x="170" y="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">Doc</text>
      <text x="170" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20">📚</text>
      <text x="170" y="75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#cffafe">向量化</text>
      <text x="170" y="92" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#cffafe">[0.3,0.6..]</text>
    </g>

    <g transform="translate(20,250)">
      <text x="120" y="0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">特点</text>
      <text x="20" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">• 双塔分别编码</text>
      <text x="20" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">• 向量可预索引</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">• 速度极快（ms级）</text>
      <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dbeafe">• 精度有限</text>
    </g>

    <g transform="translate(20,360)">
      <rect width="240" height="45" rx="8" fill="#fff" stroke="#1e40af" stroke-width="2"/>
      <text x="120" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">k₁ = 20~50</text>
      <text x="120" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e40af">召回大批候选（含噪声）</text>
    </g>
  </g>
  <line x1="505" y1="350" x2="535" y2="350" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="535,350 525,344 525,356" fill="#94a3b8"/>
  <text x="520" y="335" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">20~50 条</text>

  <!-- Stage 2: Rerank -->
  <g transform="translate(540,140)">
    <rect width="280" height="420" rx="14" fill="url(#rerank)"/>
    <text x="140" y="40" text-anchor="middle" font-size="28">🎯</text>
    <text x="140" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">② 精排（Precision）</text>
    <text x="140" y="95" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ede9fe">去伪存真，只留真金</text>

    <!-- Cross-encoder visualization -->
    <g transform="translate(40,120)">
      <rect width="200" height="100" rx="8" fill="url(#cross)"/>
      <text x="100" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">[Query + Doc] 拼接</text>
      <text x="100" y="55" text-anchor="middle" font-size="24">🔗</text>
      <text x="100" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fef3c7">Cross-Encoder</text>
      <text x="100" y="95" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#fef3c7">联合编码 → 相关性分数</text>
    </g>

    <g transform="translate(20,250)">
      <text x="120" y="0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">特点</text>
      <text x="20" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ede9fe">• query+doc 联合编码</text>
      <text x="20" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ede9fe">• 捕捉细粒度交互</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ede9fe">• 精度极高</text>
      <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ede9fe">• 速度慢（无索引）</text>
    </g>

    <g transform="translate(20,360)">
      <rect width="240" height="45" rx="8" fill="#fff" stroke="#5b21b6" stroke-width="2"/>
      <text x="120" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">重排打分 → 按分排序</text>
      <text x="120" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#5b21b6">噪声被压到末位</text>
    </g>
  </g>
  <line x1="825" y1="350" x2="855" y2="350" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="855,350 845,344 845,356" fill="#94a3b8"/>
  <text x="840" y="335" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">3~5 条</text>

  <!-- Final: feed to LLM -->
  <g transform="translate(860,140)">
    <rect width="280" height="420" rx="14" fill="url(#final)"/>
    <text x="140" y="40" text-anchor="middle" font-size="28">✨</text>
    <text x="140" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">③ 喂给 LLM</text>
    <text x="140" y="95" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#d1fae5">小而精的上下文</text>

    <!-- Selected chunks -->
    <g transform="translate(20,120)">
      <rect width="240" height="40" rx="6" fill="#fff"/>
      <text x="15" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">#1 相关 0.95</text>
      <text x="15" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">完整请假流程片段</text>
    </g>
    <g transform="translate(20,170)">
      <rect width="240" height="40" rx="6" fill="#fff"/>
      <text x="15" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">#2 相关 0.91</text>
      <text x="15" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">超3天补充规定</text>
    </g>
    <g transform="translate(20,220)">
      <rect width="240" height="40" rx="6" fill="#fff"/>
      <text x="15" y="18" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">#3 相关 0.88</text>
      <text x="15" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">HR备案流程</text>
    </g>

    <g transform="translate(20,290)">
      <text x="120" y="0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">优势</text>
      <text x="20" y="22" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">• 上下文完整</text>
      <text x="20" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">• 噪声被过滤</text>
      <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">• token 成本可控</text>
      <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">• 生成质量高</text>
    </g>

    <g transform="translate(20,380)">
      <rect width="240" height="30" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/>
      <text x="120" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">k₂ = 3~5 → LLM</text>
    </g>
  </g>

  <!-- Bottom comparison -->
  <g transform="translate(40,590)">
    <rect width="1120" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="560" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">为什么不能直接用 Cross-Encoder 检索？</text>
    <text x="560" y="52" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e3a8a">Cross-Encoder 无索引，需对库里每条 doc 都跑一次模型 → 百万级库扛不住。所以：双塔粗排（快但糙）→ Cross-Encoder 精排（慢但准）→ 取 Top-N 喂 LLM</text>
  </g>
</svg>
