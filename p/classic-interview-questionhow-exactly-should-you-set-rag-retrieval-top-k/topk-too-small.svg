<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="qs" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="good" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="miss" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="llm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="hallu" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">top-k 设小的隐患：排名第一 ≠ 信息完整</text>

  <!-- User Query -->
  <g transform="translate(60,260)">
    <rect width="170" height="90" rx="12" fill="url(#qs)"/>
    <text x="85" y="42" text-anchor="middle" font-size="30">🙋</text>
    <text x="85" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">公司请假流程？</text>
  </g>
  <line x1="235" y1="305" x2="275" y2="305" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="275,305 263,298 263,312" fill="#94a3b8"/>

  <!-- Vector DB with chunks -->
  <g transform="translate(280,130)">
    <rect width="240" height="350" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="120" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">向量数据库</text>
    <line x1="20" y1="48" x2="220" y2="48" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Chunk A - rank 1, kept -->
    <g transform="translate(20,60)">
      <rect width="200" height="70" rx="8" fill="url(#good)"/>
      <text x="100" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">片段 A · 排名 #1</text>
      <text x="100" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#d1fae5">"提交申请，主管审批"</text>
      <text x="100" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a7f3d0">score: 0.92 ✓ 被召回</text>
    </g>

    <!-- Chunk B - rank 2, missed -->
    <g transform="translate(20,140)">
      <rect width="200" height="70" rx="8" fill="url(#miss)" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="100" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">片段 B · 排名 #2</text>
      <text x="100" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fecaca">"超3天需医院证明"</text>
      <text x="100" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fca5a5">score: 0.88 ✗ 被丢弃</text>
    </g>

    <!-- Chunk C - rank 3 -->
    <g transform="translate(20,220)">
      <rect width="200" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="100" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">片段 C · 排名 #3</text>
      <text x="100" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">"年假天数规定"</text>
      <text x="100" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">score: 0.85 ✗ 被丢弃</text>
    </g>

    <text x="120" y="320" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dc2626" font-weight="700">k = 1（只取 Top-1）</text>
    <text x="120" y="338" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">完整答案被切成两半，丢失一半</text>
  </g>
  <line x1="525" y1="305" x2="565" y2="305" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="565,305 553,298 553,312" fill="#94a3b8"/>

  <!-- LLM -->
  <g transform="translate(570,260)">
    <rect width="170" height="90" rx="12" fill="url(#llm)"/>
    <text x="85" y="42" text-anchor="middle" font-size="30">🧠</text>
    <text x="85" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">LLM 生成</text>
  </g>
  <line x1="745" y1="305" x2="785" y2="305" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="785,305 773,298 773,312" fill="#94a3b8"/>

  <!-- Hallucinated answer -->
  <g transform="translate(790,180)">
    <rect width="360" height="250" rx="14" fill="url(#hallu)"/>
    <text x="180" y="40" text-anchor="middle" font-size="32">⚠️</text>
    <text x="180" y="75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">幻觉产生</text>
    <text x="180" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">上下文不完整 → 模型被迫"脑补"</text>
    <line x1="40" y1="125" x2="320" y2="125" stroke="#fbcfe8" stroke-width="1"/>
    <text x="180" y="152" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fce7f3">模型回答：</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fff">"请假需提交申请由主管审批，</text>
    <text x="20" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fff"> 超过3天可能需要……</text>
    <text x="20" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fde047">【此处模型编造】相关材料。"</text>
    <text x="180" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fbcfe8" font-style="italic">— 模型不是撒谎，是被逼"脑补"</text>
  </g>

  <!-- Bottom conclusion -->
  <g transform="translate(60,520)">
    <rect width="1080" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="540" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">核心结论</text>
    <text x="540" y="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#78350f">top-k 设小 → 召回不足 → 上下文不完整 → 模型幻觉。排名第一只能保证"最相关"，不能保证"最完整"。</text>
  </g>
</svg>
