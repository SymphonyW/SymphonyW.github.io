<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SfM cover image</title>
  <desc id="desc">A cover illustration showing multi-view images, camera poses, and a sparse 3D point cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 76px "Inter", "Segoe UI", Arial, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .sub { font: 500 28px "Inter", "Segoe UI", Arial, sans-serif; fill: #d1fae5; letter-spacing: 0; }
      .small { font: 600 20px "Inter", "Segoe UI", Arial, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .label { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .muted { fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="984" cy="104" r="152" fill="#22c55e" opacity="0.1"/>
  <circle cx="168" cy="556" r="190" fill="#f59e0b" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="80" y="94" width="238" height="154" rx="20" fill="#f8fafc"/>
    <rect x="100" y="118" width="198" height="100" rx="12" fill="#dbeafe"/>
    <circle cx="141" cy="154" r="16" fill="#f97316"/>
    <path d="M104 216 L164 170 L210 204 L244 176 L296 216 Z" fill="#15803d" opacity="0.9"/>
    <text x="120" y="282" class="small">image 01</text>

    <rect x="150" y="285" width="238" height="154" rx="20" fill="#f8fafc"/>
    <rect x="170" y="309" width="198" height="100" rx="12" fill="#dcfce7"/>
    <circle cx="319" cy="342" r="15" fill="#f59e0b"/>
    <path d="M174 407 L224 358 L260 386 L304 348 L366 407 Z" fill="#0369a1" opacity="0.9"/>
    <text x="190" y="473" class="small">image 02</text>

    <rect x="250" y="132" width="238" height="154" rx="20" fill="#f8fafc"/>
    <rect x="270" y="156" width="198" height="100" rx="12" fill="#ffedd5"/>
    <circle cx="312" cy="190" r="14" fill="#ef4444"/>
    <path d="M274 254 L320 210 L354 235 L398 198 L466 254 Z" fill="#0f766e" opacity="0.9"/>
    <text x="290" y="320" class="small">image 03</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 210 C585 175 650 200 724 248" stroke="#a7f3d0" stroke-width="4" opacity="0.75"/>
    <path d="M510 332 C610 282 676 302 756 350" stroke="#fde68a" stroke-width="4" opacity="0.75"/>
    <path d="M480 248 C594 282 640 350 704 436" stroke="#bfdbfe" stroke-width="4" opacity="0.75"/>
  </g>

  <g transform="translate(724 142)">
    <g fill="#e2e8f0" opacity="0.96">
      <circle cx="78" cy="112" r="5"/>
      <circle cx="137" cy="72" r="4"/>
      <circle cx="184" cy="121" r="6"/>
      <circle cx="246" cy="88" r="4"/>
      <circle cx="302" cy="151" r="5"/>
      <circle cx="114" cy="188" r="4"/>
      <circle cx="206" cy="213" r="6"/>
      <circle cx="284" cy="238" r="4"/>
      <circle cx="162" cy="284" r="5"/>
      <circle cx="90" cy="268" r="4"/>
      <circle cx="238" cy="310" r="5"/>
      <circle cx="334" cy="286" r="4"/>
    </g>
    <g fill="none" stroke="#86efac" stroke-width="2" opacity="0.45">
      <path d="M78 112 L137 72 L184 121 L246 88 L302 151 L206 213 L114 188 Z"/>
      <path d="M114 188 L90 268 L162 284 L238 310 L284 238 L206 213 Z"/>
      <path d="M184 121 L206 213 L284 238 L302 151"/>
    </g>
    <g fill="#fbbf24" opacity="0.95">
      <path d="M38 368 l42 -20 v38 z"/>
      <rect x="80" y="343" width="54" height="34" rx="8"/>
      <path d="M210 372 l43 -21 v39 z"/>
      <rect x="253" y="346" width="54" height="34" rx="8"/>
      <path d="M363 347 l39 -18 v35 z"/>
      <rect x="402" y="323" width="50" height="31" rx="8"/>
    </g>
  </g>

  <text x="78" y="542" class="title">SfM 原理详解</text>
  <text x="82" y="584" class="sub">Structure from Motion: from photos to cameras and sparse 3D points</text>
  <rect x="82" y="36" width="258" height="42" rx="21" fill="#f8fafc" opacity="0.95"/>
  <text x="108" y="64" class="label">Computer Vision / 3D Reconstruction</text>
</svg>
