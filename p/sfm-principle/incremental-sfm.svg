<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Incremental SfM loop</title>
  <desc id="desc">A loop showing seed pair, register image, triangulate points, and bundle adjustment.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .h { font: 800 26px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .t { font: 700 18px "Inter", "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .s { font: 500 14px "Inter", "Segoe UI", Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="46" y="58" class="h">增量式 SfM：从一对好照片开始，一张一张把相机接进来</text>
  <text x="46" y="88" class="s">The reconstruction grows by alternating camera registration, point triangulation, and local/global BA.</text>

  <g transform="translate(90 170)">
    <rect class="node" x="0" y="0" width="190" height="104" rx="20"/>
    <text x="32" y="42" class="t">1. 初始化图像对</text>
    <text x="32" y="70" class="s">seed pair + relative pose</text>
  </g>
  <g transform="translate(365 92)">
    <rect class="node" x="0" y="0" width="190" height="104" rx="20"/>
    <text x="34" y="42" class="t">2. 注册新图像</text>
    <text x="34" y="70" class="s">2D-3D matches + PnP</text>
  </g>
  <g transform="translate(650 170)">
    <rect class="node" x="0" y="0" width="190" height="104" rx="20"/>
    <text x="34" y="42" class="t">3. 三角化新点</text>
    <text x="34" y="70" class="s">new tracks become 3D</text>
  </g>
  <g transform="translate(365 326)">
    <rect class="node" x="0" y="0" width="190" height="104" rx="20"/>
    <text x="34" y="42" class="t">4. BA 优化</text>
    <text x="34" y="70" class="s">reduce reprojection error</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M280 210 C318 154 332 138 362 132"/>
    <path d="M555 132 C610 136 626 154 646 202"/>
    <path d="M745 274 C700 360 638 382 558 382"/>
    <path d="M365 382 C270 365 212 330 176 278"/>
    <path d="M460 326 C460 286 460 246 460 200"/>
  </g>

  <g transform="translate(870 116)">
    <rect x="0" y="0" width="184" height="318" rx="22" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
    <text x="24" y="42" class="t">停止条件</text>
    <text x="24" y="82" class="s">没有足够 2D-3D 匹配</text>
    <text x="24" y="112" class="s">重投影误差过大</text>
    <text x="24" y="142" class="s">候选图像耗尽</text>
    <line x1="24" y1="174" x2="160" y2="174" stroke="#67e8f9" stroke-width="2"/>
    <text x="24" y="214" class="t">常用策略</text>
    <text x="24" y="252" class="s">优先注册观测多的图</text>
    <text x="24" y="282" class="s">局部 BA 高频运行</text>
  </g>
</svg>
