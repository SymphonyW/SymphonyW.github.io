  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="130" y="128" font-size="46" font-weight="700" fill="#f3fbff">Claude Code vs Codex</text>
    <text x="130" y="172" font-size="22" fill="rgba(243,251,255,0.72)">Local-first coding workflow and cloud-delegated coding workflow</text>
  </g>
</svg>
