<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code vs Codex cover</title>
  <desc id="desc">An abstract split-screen illustration comparing a local terminal-centric coding workflow with a cloud pull-request workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09131f"/>
      <stop offset="100%" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="leftGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13c4ff"/>
      <stop offset="100%" stop-color="#35f3c1"/>
    </linearGradient>
    <linearGradient id="rightGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66d9ff"/>
      <stop offset="100%" stop-color="#7bf59a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="800" height="900" fill="rgba(19,196,255,0.06)"/>
  <rect x="800" y="0" width="800" height="900" fill="rgba(123,245,154,0.05)"/>
  <rect x="798" y="90" width="4" height="720" rx="2" fill="rgba(255,255,255,0.14)"/>

  <g opacity="0.8">
    <circle cx="250" cy="170" r="120" fill="rgba(19,196,255,0.08)"/>
    <circle cx="1320" cy="730" r="150" fill="rgba(123,245,154,0.08)"/>
    <circle cx="1070" cy="170" r="100" fill="rgba(102,217,255,0.05)"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="140" y="210" width="520" height="320" rx="22" fill="#0d1b2a" stroke="url(#leftGlow)" stroke-width="2"/>
    <rect x="225" y="330" width="430" height="250" rx="20" fill="#0b1622" stroke="#37e7c8" stroke-width="2"/>
    <rect x="940" y="180" width="470" height="270" rx="22" fill="#f6fbff" opacity="0.96"/>
    <rect x="1030" y="360" width="310" height="210" rx="20" fill="#eff7fc" opacity="0.98"/>
    <rect x="860" y="430" width="300" height="180" rx="18" fill="#ffffff" opacity="0.98"/>
  </g>

  <g opacity="0.9">
