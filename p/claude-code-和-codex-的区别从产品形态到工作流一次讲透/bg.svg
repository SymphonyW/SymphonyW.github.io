    <rect x="972" y="292" width="325" height="10" rx="5" fill="#dce8f1"/>
    <rect x="972" y="322" width="250" height="10" rx="5" fill="#dce8f1"/>
    <rect x="972" y="352" width="295" height="10" rx="5" fill="#dce8f1"/>
    <rect x="972" y="382" width="200" height="10" rx="5" fill="#dce8f1"/>
