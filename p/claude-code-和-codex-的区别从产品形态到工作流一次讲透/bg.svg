    <rect x="970" y="462" width="95" height="12" rx="6" fill="#c3d9e6"/>
    <rect x="885" y="494" width="240" height="10" rx="5" fill="#d8e6ee"/>
    <rect x="885" y="524" width="180" height="10" rx="5" fill="#d8e6ee"/>
    <rect x="885" y="554" width="120" height="10" rx="5" fill="#d8e6ee"/>
    <rect x="1018" y="516" width="88" height="34" rx="8" fill="#d8f6e5"/>
    <rect x="939" y="516" width="66" height="34" rx="8" fill="#eef7fb"/>
    <rect x="885" y="594" width="160" height="8" rx="4" fill="#b9d8c9"/>
