  <g fill="none" stroke-width="4" opacity="0.85">
    <path d="M655 420 C730 420,760 450,835 450" stroke="url(#leftGlow)"/>
    <path d="M650 500 C740 500,780 540,860 540" stroke="url(#rightGlow)"/>
    <path d="M710 610 C810 610,870 580,1035 580" stroke="url(#leftGlow)" opacity="0.65"/>
  </g>

  <g opacity="0.55" stroke-linecap="round">
    <rect x="720" y="384" width="56" height="6" rx="3" fill="#50d7ff"/>
    <rect x="732" y="405" width="30" height="6" rx="3" fill="#7bf59a"/>
    <rect x="734" y="524" width="72" height="6" rx="3" fill="#50d7ff"/>
    <rect x="820" y="524" width="42" height="6" rx="3" fill="#7bf59a"/>
    <rect x="780" y="596" width="54" height="6" rx="3" fill="#50d7ff"/>
