    <rect x="255" y="422" width="215" height="10" rx="5" fill="#63d2ff"/>
    <rect x="255" y="452" width="180" height="10" rx="5" fill="rgba(255,255,255,0.14)"/>
    <rect x="255" y="482" width="240" height="10" rx="5" fill="#59f0c9"/>
