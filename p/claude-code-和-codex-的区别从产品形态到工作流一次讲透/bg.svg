    <rect x="1070" y="425" width="220" height="10" rx="5" fill="#d7e8f1"/>
    <rect x="1070" y="455" width="160" height="10" rx="5" fill="#d7e8f1"/>
    <rect x="1070" y="492" width="92" height="56" rx="12" fill="#d7eef7"/>
