<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 与 Codex 的安全模型对比</title>
  <desc id="desc">左侧以权限审批为中心展示 Claude Code，右侧以沙箱与审批策略为中心展示 Codex。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#12263c"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ad2ff"/>
      <stop offset="100%" stop-color="#40eec6"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#75d7ff"/>
      <stop offset="100%" stop-color="#9bf08d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#eef8ff">
    <text x="90" y="58" font-size="32" font-weight="700">安全控制的思路差别</text>
    <text x="90" y="92" font-size="18" fill="rgba(238,248,255,0.72)">一个更像权限分层，一个更像沙箱分层</text>
  </g>

  <g>
    <rect x="90" y="130" width="470" height="560" rx="30" fill="rgba(15,27,43,0.82)" stroke="rgba(64,238,198,0.36)"/>
    <rect x="640" y="130" width="470" height="560" rx="30" fill="rgba(15,27,43,0.82)" stroke="rgba(155,240,141,0.36)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="160" y="182" font-size="30" font-weight="700" fill="#eef8ff">Claude Code</text>
    <text x="710" y="182" font-size="30" font-weight="700" fill="#eef8ff">Codex</text>

    <g>
      <circle cx="325" cy="340" r="118" fill="rgba(26,210,255,0.1)" stroke="url(#l)" stroke-width="3"/>
      <circle cx="325" cy="340" r="62" fill="rgba(26,210,255,0.12)" stroke="url(#l)" stroke-width="2"/>
      <text x="325" y="334" text-anchor="middle" font-size="25" font-weight="700" fill="#eef8ff">权限审批</text>
      <text x="325" y="366" text-anchor="middle" font-size="18" fill="rgba(238,248,255,0.82)">按动作逐步放权</text>
      <text x="162" y="530" font-size="18" fill="rgba(238,248,255,0.86)">默认只读</text>
      <text x="162" y="562" font-size="18" fill="rgba(238,248,255,0.86)">修改命令需批准</text>
      <text x="162" y="594" font-size="18" fill="rgba(238,248,255,0.86)">写入受工作区限制</text>
      <text x="162" y="626" font-size="18" fill="rgba(238,248,255,0.86)">可叠加 allow/deny、hooks、trust</text>
    </g>

    <g>
      <rect x="760" y="250" width="230" height="94" rx="24" fill="rgba(26,45,61,0.94)" stroke="url(#r)" stroke-width="2"/>
      <rect x="740" y="392" width="270" height="104" rx="24" fill="rgba(26,45,61,0.94)" stroke="url(#r)" stroke-width="2"/>
      <rect x="785" y="544" width="180" height="76" rx="22" fill="rgba(26,45,61,0.94)" stroke="url(#r)" stroke-width="2"/>
      <text x="875" y="305" text-anchor="middle" font-size="24" font-weight="700" fill="#eef8ff">Sandbox Mode</text>
      <text x="875" y="334" text-anchor="middle" font-size="16" fill="rgba(238,248,255,0.82)">先决定技术边界</text>
      <text x="875" y="438" text-anchor="middle" font-size="24" font-weight="700" fill="#eef8ff">Approval Policy</text>
      <text x="875" y="468" text-anchor="middle" font-size="16" fill="rgba(238,248,255,0.82)">再决定哪些动作要停下来询问</text>
      <text x="875" y="590" text-anchor="middle" font-size="22" font-weight="700" fill="#eef8ff">Cloud Isolation</text>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="rgba(238,248,255,0.84)" font-size="18">
    <text x="694" y="654">本地：OS 级沙箱</text>
    <text x="694" y="684">云端：隔离环境 + setup / agent 分层</text>
  </g>
</svg>
