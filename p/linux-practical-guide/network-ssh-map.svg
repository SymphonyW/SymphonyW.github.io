<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Network and SSH mental model</title>
  <desc id="desc">A diagram explaining local loopback, service listening addresses, SSH identity, file transfer, and port forwarding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12323b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#38bdf8"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#cbd5e1}
      .h{font-size:34px;font-weight:820}
      .label{font-size:22px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .box{fill:#111827;stroke:#334155;stroke-width:2}
      .line{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="740" cy="380" r="275" fill="#38bdf8" opacity=".06"/>
  <text class="t h" x="80" y="86">Networking and SSH</text>
  <text class="t small muted" x="82" y="120">Separate where the client runs, where the service listens, and which identity is trusted.</text>

  <g filter="url(#shadow)">
    <rect class="box" x="90" y="205" width="360" height="330" rx="24"/>
    <text class="t label" x="270" y="252" text-anchor="middle">Client</text>
    <rect x="140" y="296" width="260" height="64" rx="14" fill="#172033" stroke="#475569"/>
    <text class="t mono small" x="270" y="336" text-anchor="middle">curl 127.0.0.1:18000</text>
    <rect x="140" y="394" width="260" height="64" rx="14" fill="#172033" stroke="#475569"/>
    <text class="t mono small" x="270" y="434" text-anchor="middle">ssh -i key server</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="525" y="165" width="350" height="410" rx="24"/>
    <text class="t label" x="700" y="214" text-anchor="middle">SSH Tunnel</text>
    <path d="M628 326c34-60 110-60 144 0M650 356c22-32 78-32 100 0M674 386c10-12 42-12 52 0" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
    <text class="t mono small muted" x="700" y="455" text-anchor="middle">-L 127.0.0.1:18000</text>
    <text class="t mono small muted" x="700" y="484" text-anchor="middle">to 127.0.0.1:8000</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="box" x="950" y="205" width="360" height="330" rx="24"/>
    <text class="t label" x="1130" y="252" text-anchor="middle">Server</text>
    <rect x="1000" y="296" width="260" height="64" rx="14" fill="#172033" stroke="#475569"/>
    <text class="t mono small" x="1130" y="336" text-anchor="middle">ss -lntp :8000</text>
    <rect x="1000" y="394" width="260" height="64" rx="14" fill="#172033" stroke="#475569"/>
    <text class="t mono small" x="1130" y="434" text-anchor="middle">systemd service</text>
  </g>

  <path class="line" d="M400 328h104"/>
  <path class="line" d="M875 328h104"/>
  <path class="dash" d="M400 426h132"/>
  <path class="dash" d="M868 426h132"/>

  <g filter="url(#shadow)">
    <rect x="232" y="604" width="936" height="82" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text class="t mono small" x="700" y="639" text-anchor="middle">127.0.0.1 means "this machine" from the current network namespace.</text>
    <text class="t mono small muted" x="700" y="666" text-anchor="middle">404 = HTTP reached a service; refused = no listener or active reject.</text>
  </g>
</svg>
