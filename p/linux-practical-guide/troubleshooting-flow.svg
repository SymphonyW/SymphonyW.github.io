<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux troubleshooting flow</title>
  <desc id="desc">A service troubleshooting flow from symptom and scope to evidence, root cause, repair, and verification with common Linux commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#3b1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#fb7185"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#cbd5e1}
      .h{font-size:34px;font-weight:820}
      .label{font-size:22px;font-weight:760}
      .small{font-size:16px}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .card{fill:#111827;stroke:#334155;stroke-width:2}
      .line{fill:none;stroke:#fb7185;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <circle cx="1120" cy="150" r="220" fill="#fb7185" opacity=".07"/>
  <circle cx="260" cy="630" r="240" fill="#38bdf8" opacity=".07"/>
  <text class="t h" x="80" y="84">Troubleshooting: Follow the Evidence</text>
  <text class="t small muted" x="82" y="120">Move from what happened to a verified repair, one layer at a time.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="210" width="210" height="120" rx="22"/>
    <text class="t label" x="185" y="253" text-anchor="middle">Symptom</text>
    <text class="t mono small muted" x="185" y="289" text-anchor="middle">what changed?</text>

    <rect class="card" x="350" y="210" width="210" height="120" rx="22"/>
    <text class="t label" x="455" y="253" text-anchor="middle">Scope</text>
    <text class="t mono small muted" x="455" y="289" text-anchor="middle">one host?</text>

    <rect class="card" x="620" y="210" width="210" height="120" rx="22"/>
    <text class="t label" x="725" y="253" text-anchor="middle">Evidence</text>
    <text class="t mono small muted" x="725" y="289" text-anchor="middle">status logs port</text>

    <rect class="card" x="890" y="210" width="210" height="120" rx="22"/>
    <text class="t label" x="995" y="253" text-anchor="middle">Root cause</text>
    <text class="t mono small muted" x="995" y="289" text-anchor="middle">file config process</text>

    <rect class="card" x="1160" y="210" width="210" height="120" rx="22"/>
    <text class="t label" x="1265" y="253" text-anchor="middle">Repair</text>
    <text class="t mono small muted" x="1265" y="289" text-anchor="middle">small change</text>
  </g>

  <path class="line" d="M290 270h40"/>
  <path class="line" d="M560 270h40"/>
  <path class="line" d="M830 270h40"/>
  <path class="line" d="M1100 270h40"/>
  <path class="line" d="M1265 330v88c0 45-36 82-80 82H247c-44 0-80-37-80-82v-58"/>

  <g filter="url(#shadow)">
    <rect class="card" x="214" y="448" width="972" height="150" rx="24"/>
    <text class="t label" x="700" y="493" text-anchor="middle">Verify after every repair</text>
    <text class="t mono small muted" x="700" y="535" text-anchor="middle">systemctl status    journalctl -u    ss -lntp    curl /health</text>
    <text class="t mono small muted" x="700" y="565" text-anchor="middle">If evidence changed, update the diagnosis before editing more.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="650" width="1240" height="56" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text class="t mono small muted" x="700" y="685" text-anchor="middle">Port conflict, permission denied, bad environment value, bad ExecStart path: observe first, then fix.</text>
  </g>
</svg>
