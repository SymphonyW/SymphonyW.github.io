<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux practical guide cover</title>
  <desc id="desc">A terminal-centered Linux learning map connecting files, permissions, processes, networking, services, logs, and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101828"/>
      <stop offset=".52" stop-color="#13324a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#38bdf8"/>
    </marker>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .muted{fill:#b6c6d8}
      .small{font-size:18px}
      .tiny{font-size:14px}
      .label{font-size:18px;font-weight:720}
      .mono{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
      .line{fill:none;stroke:#38bdf8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      .node{fill:#111827;stroke:#334155;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1110" cy="128" r="190" fill="#22c55e" opacity=".08"/>
  <circle cx="200" cy="624" r="220" fill="#38bdf8" opacity=".08"/>
  <g opacity=".22" stroke="#94a3b8" stroke-width="1">
    <path d="M80 114h1240M80 214h1240M80 314h1240M80 414h1240M80 514h1240M80 614h1240"/>
    <path d="M160 70v620M320 70v620M480 70v620M640 70v620M800 70v620M960 70v620M1120 70v620M1280 70v620"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="105" y="112" width="620" height="402" rx="26" fill="url(#term)" stroke="#334155" stroke-width="2"/>
    <rect x="105" y="112" width="620" height="56" rx="26" fill="#182235"/>
    <circle cx="147" cy="140" r="8" fill="#ef4444"/>
    <circle cx="175" cy="140" r="8" fill="#f59e0b"/>
    <circle cx="203" cy="140" r="8" fill="#22c55e"/>
    <text class="t mono tiny" x="246" y="146">~/linux-lab</text>
    <text class="t mono small" x="148" y="222">$ pwd</text>
    <text class="t mono small muted" x="148" y="256">/home/alice/linux-lab</text>
    <text class="t mono small" x="148" y="306">$ systemctl status linux-lab</text>
    <text class="t mono small" x="148" y="340">active (running)</text>
    <text class="t mono small" x="148" y="390">$ journalctl -u linux-lab -f</text>
    <text class="t mono small muted" x="148" y="424">logs explain behavior</text>
  </g>

  <text class="t" x="790" y="185" font-size="58" font-weight="850">Linux</text>
  <text class="t" x="790" y="246" font-size="50" font-weight="760">Practical Guide</text>
  <text class="t small muted" x="794" y="294">files, permissions, processes, networking, services, logs, automation</text>

  <path class="line" d="M740 362h105"/>
  <g filter="url(#shadow)">
    <rect class="node" x="870" y="321" width="160" height="82" rx="18"/>
    <text class="t label" x="950" y="354" text-anchor="middle">Files</text>
    <text class="t mono tiny muted" x="950" y="379" text-anchor="middle">find chmod tar</text>
  </g>
  <path class="line" d="M1040 362h82"/>
  <g filter="url(#shadow)">
    <rect class="node" x="1146" y="321" width="160" height="82" rx="18"/>
    <text class="t label" x="1226" y="354" text-anchor="middle">Services</text>
    <text class="t mono tiny muted" x="1226" y="379" text-anchor="middle">systemd logs</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="790" y="462" width="168" height="80" rx="18"/>
    <text class="t label" x="874" y="494" text-anchor="middle">Network</text>
    <text class="t mono tiny muted" x="874" y="519" text-anchor="middle">curl ssh ss</text>
    <rect class="node" x="1000" y="462" width="168" height="80" rx="18"/>
    <text class="t label" x="1084" y="494" text-anchor="middle">Processes</text>
    <text class="t mono tiny muted" x="1084" y="519" text-anchor="middle">ps top kill</text>
    <rect class="node" x="1210" y="462" width="168" height="80" rx="18"/>
    <text class="t label" x="1294" y="494" text-anchor="middle">Shell</text>
    <text class="t mono tiny muted" x="1294" y="519" text-anchor="middle">pipes scripts</text>
  </g>

  <path d="M870 407c-12 32-6 50 17 55M1036 408c28 30 33 44 25 54M1218 408c-42 25-58 41-47 54" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 8" opacity=".75"/>
  <text class="t tiny muted" x="790" y="626">from zero to daily operation and service management</text>
</svg>
