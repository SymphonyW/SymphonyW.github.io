" text-anchor="start"><tspan x="389" dy="0">Collect option B</tspan></text><text x="389" y="400" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="389" dy="0">Source + version</tspan></text><rect x="365" y="485" width="245" height="105" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="389" y="527" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="389" dy="0">Collect option C</tspan></text><text x="389" y="565" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="389" dy="0">Source + version</tspan></text><path d="M 300 370 H 330 V 207 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 330 370 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 330 370 V 537 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="680" y="300" width="225" height="140" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="704" y="342" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="704" dy="0">Compare</tspan></text><text x="704" y="380" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="704" dy="0">Check evidence</tspan><tspan x="704" dy="32.199999999999996">Resolve gaps</tspan></text><path d="M 610 207 H 645 V 342 H 675" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 610 372 H 675" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 610 537 H 645 V 402 H 675" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="965" y="300" width="180" height="140" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="989" y="342" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="989" dy="0">Deliver</tspan></text><text x="989" y="380" fill="#5e6d65" font-size="23" font-weight="400" text-an