<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">A tool call is a controlled pipeline</title><desc id="desc">Valid formatting is the start; execution needs authorization and result checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">A tool call is a controlled pipeline</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Valid formatting is the start; execution needs authorization and result checks.</tspan></text><rect x="55" y="165" width="235" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">1  Propose</tspan></text><text x="79" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Name, arguments</tspan><tspan x="79" dy="32.199999999999996">Correlate call ID</tspan></text><rect x="340" y="165" width="235" height="140" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="364" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="364" dy="0">2  Validate</tspan></text><text x="364" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="364" dy="0">Schema and access</tspan><tspan x="364" dy="32.199999999999996">Trusted identity</tspan></text><rect x="625" y="165" width="235" height="140" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="649" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="649" dy="0">3  Execute</tspan></text><text x="649" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="649" dy="0">Time and budget</tspan><tspan x="649" dy="32.199999999999996">Observe outcome</tspan></text><rect x="910" y="165" width="235" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="934" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="934" dy="0">4  Return</tspan></text><text x="934" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="934" dy="0">Bound and source</tspan><tspan x="934" dy="32.199999999999996">Match original call</tspan></text><path d="M 290 235 H 335" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 575 235 H 620" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 860 235 H 905" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 457 305 V 362 H 215 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 742 362 H 600 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 742 362 H 985 V 410" fill="none" stroke="#5e6d65" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="55" y="415" width="320" height="180" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Correctable input</tspan></text><text x="79" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Return field errors</tspan><tspan x="79" dy="32.199999999999996">Correct arguments</tspan><tspan x="79" dy="32.199999999999996">Never bypass access</tspan></text><rect x="440" y="415" width="320" height="180" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="464" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="464" dy="0">Transient read error</tspan></text><text x="464" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="464" dy="0">Bounded backoff</tspan><tspan x="464" dy="32.199999999999996">Rediscover missing IDs</tspan><tspan x="464" dy="32.199999999999996">Paginate large results</tspan></text><rect x="825" y="415" width="320" height="180" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="849" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="849" dy="0">Uncertain write</tspan></text><text x="849" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="849" dy="0">Reconcile the action</tspan><tspan x="849" dy="32.199999999999996">Use durable idempotency</tspan><tspan x="849" dy="32.199999999999996">Pause if unresolved</tspan></text><text x="55" y="667" fill="#20352e" font-size="25" font-weight="600" text-anchor="start"><tspan x="55" dy="0">Timeout does not prove failure. Avoid blindly creating the report twice.</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">Teaching design / not framework defaults</tspan></text></g></svg>