<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">A controlled agent execution loop</title><desc id="desc">Select information, validate actions, and verify completion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">A controlled agent execution loop</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Select information, validate actions, and verify completion.</tspan></text><rect x="55" y="155" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Task state</tspan></text><text x="79" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Goal, progress, pending</tspan></text><rect x="450" y="155" width="300" height="115" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">Context assembly</tspan></text><text x="474" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Select relevant inputs</tspan></text><rect x="845" y="155" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="197" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">Long-term memory</tspan></text><text x="869" y="235" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">Scoped and sourced</tspan></text><path d="M 355 210 H 445" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 210 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="55" y="350" width="300" height="125" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Deliverable checks</tspan></text><text x="79" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Are claims supported?</tspan><tspan x="79" dy="32.199999999999996">Does the artifact exist?</tspan></text><rect x="450" y="350" width="300" height="125" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">Model and planning</tspan></text><text x="474" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Propose a next action</tspan><tspan x="474" dy="32.199999999999996">or request completion</tspan></text><rect x="845" y="350" width="300" height="125" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="392" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">Runtime controls</tspan></text><text x="869" y="430" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">Access, inputs, budget</tspan><tspan x="869" dy="32.199999999999996">Execute after checks</tspan></text><path d="M 600 270 V 345" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 407 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 750 407 H 840" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="555" width="300" height="115" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="597" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">Observe and record</tspan></text><text x="474" y="635" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Facts inform the next step</tspan></text><rect x="845" y="555" width="300" height="115" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="597" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">External tools</tspan></text><text x="869" y="635" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">Search, read, save</tspan></text><path d="M 995 475 V 550" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 612 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 612 H 25 V 210 H 50" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><text x="250" y="592" fill="#5e6d65" font-size="21" font-weight="400" text-anchor="start"><tspan x="250" dy="0">Record facts</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">Teaching design / not framework defaults</tspan></text></g></svg>