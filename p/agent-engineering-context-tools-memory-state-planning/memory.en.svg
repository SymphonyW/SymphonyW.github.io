<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Memory needs a lifecycle</title><desc id="desc">Retain reusable information with provenance, scope, freshness, and conflict handling.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="760" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">Memory needs a lifecycle</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Retain reusable information with provenance, scope, freshness, and conflict handling.</tspan></text><rect x="55" y="165" width="300" height="140" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Candidates</tspan></text><text x="79" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Preferences and facts</tspan><tspan x="79" dy="32.199999999999996">Validated experience</tspan></text><rect x="450" y="165" width="300" height="140" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">Before writing</tspan></text><text x="474" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Useful beyond this task?</tspan><tspan x="474" dy="32.199999999999996">Sourced and scoped?</tspan></text><rect x="845" y="165" width="300" height="140" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="207" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">Memory store</tspan></text><text x="869" y="245" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">Source, time, version</tspan><tspan x="869" dy="32.199999999999996">Revisable and deletable</tspan></text><path d="M 355 235 H 445" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 750 235 H 840" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="845" y="415" width="300" height="145" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="869" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="869" dy="0">Before retrieval</tspan></text><text x="869" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="869" dy="0">Authorize tenant and user</tspan><tspan x="869" dy="32.199999999999996">Then relevance and age</tspan></text><rect x="450" y="415" width="300" height="145" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="474" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="474" dy="0">Resolve conflicts</tspan></text><text x="474" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="474" dy="0">Current request wins</tspan><tspan x="474" dy="32.199999999999996">Recheck uncertain claims</tspan></text><rect x="55" y="415" width="300" height="145" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="457" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Enter context</tspan></text><text x="79" y="495" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Include useful records</tspan><tspan x="79" dy="32.199999999999996">Keep source references</tspan></text><path d="M 995 305 V 410" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 845 485 H 755" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 450 485 H 360" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><text x="55" y="650" fill="#20352e" font-size="24" font-weight="600" text-anchor="start"><tspan x="55" dy="0">Start with JSON or a table. Vector search is an optional retrieval method.</tspan></text><text x="52" y="735" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="735" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">Teaching design / not framework defaults</tspan></text></g></svg>