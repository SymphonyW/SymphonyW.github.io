<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Context holds the inputs for this step</title><desc id="desc">Preserve constraints, select evidence, and keep originals retrievable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6d65"/></marker></defs><rect width="1200" height="780" fill="#f6f2e9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="52" y="60" fill="#20352e" font-size="36" font-weight="700" text-anchor="start"><tspan x="52" dy="0">Context holds the inputs for this step</tspan></text><text x="52" y="103" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Preserve constraints, select evidence, and keep originals retrievable.</tspan></text><rect x="55" y="160" width="310" height="110" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="202" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Task and rules</tspan></text><text x="79" y="240" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Goal, limits, access</tspan></text><rect x="55" y="295" width="310" height="110" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="337" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">State and history</tspan></text><text x="79" y="375" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Progress, turns, summary</tspan></text><rect x="55" y="430" width="310" height="110" rx="15" fill="#fffdf7" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="472" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">Memory and sources</tspan></text><text x="79" y="510" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Preferences and excerpts</tspan></text><rect x="435" y="290" width="300" height="160" rx="15" fill="#f0dfc6" stroke="#a6b1a6" stroke-width="2"/><text x="459" y="332" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="459" dy="0">Select and assemble</tspan></text><text x="459" y="370" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="459" dy="0">Scope, relevance, age</tspan><tspan x="459" dy="32.199999999999996">Deduplicate and count</tspan></text><path d="M 365 215 H 400 V 337 H 430" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 365 350 H 430" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 365 485 H 400 V 403 H 430" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="805" y="160" width="340" height="380" rx="15" fill="#e0eaf1" stroke="#a6b1a6" stroke-width="2"/><text x="830" y="205" fill="#20352e" font-size="28" font-weight="650" text-anchor="start"><tspan x="830" dy="0">Current model input</tspan></text><text x="830" y="255" fill="#20352e" font-size="23" font-weight="400" text-anchor="start"><tspan x="830" dy="0">1  Rules and current goal</tspan></text><text x="830" y="312" fill="#20352e" font-size="23" font-weight="400" text-anchor="start"><tspan x="830" dy="0">2  Relevant state and plan</tspan></text><text x="830" y="369" fill="#20352e" font-size="23" font-weight="400" text-anchor="start"><tspan x="830" dy="0">3  Recent turns and summary</tspan></text><text x="830" y="426" fill="#20352e" font-size="23" font-weight="400" text-anchor="start"><tspan x="830" dy="0">4  Evidence with references</tspan></text><text x="830" y="483" fill="#20352e" font-size="23" font-weight="400" text-anchor="start"><tspan x="830" dy="0">5  Stage-appropriate tools</tspan></text><path d="M 735 370 H 800" fill="none" stroke="#5e6d65" stroke-width="3"  marker-end="url(#arrow)"/><rect x="55" y="600" width="1090" height="100" rx="15" fill="#dce7d5" stroke="#a6b1a6" stroke-width="2"/><text x="79" y="642" fill="#20352e" font-size="27" font-weight="650" text-anchor="start"><tspan x="79" dy="0">External storage: original documents, events, artifacts</tspan></text><text x="79" y="680" fill="#5e6d65" font-size="23" font-weight="400" text-anchor="start"><tspan x="79" dy="0">Read more through references when needed; do not resend everything each turn.</tspan></text><text x="52" y="755" fill="#5e6d65" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">SNOW / OPEN NOTEBOOK</tspan></text><text x="1148" y="755" fill="#5e6d65" font-size="16" font-weight="400" text-anchor="end"><tspan x="1148" dy="0">Teaching design / not framework defaults</tspan></text></g></svg>