<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FastGPT RAG pipeline</title><desc id="desc">Offline ingestion and online retrieval paths in a FastGPT Dataset.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182b"/><stop offset="1" stop-color="#12334a"/></linearGradient><style>.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf8ff}.h{font-size:27px;font-weight:700}.m{font-size:19px;font-weight:650}.s{font-size:15px;fill:#afcada}.card{fill:#102d45;stroke:#315c75;stroke-width:2}.a{stroke:#35d7ca;stroke-width:3;fill:none;marker-end:url(#arrow)}.b{stroke:#ffc466;stroke-width:3;fill:none;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#35d7ca"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#ffc466"/></marker></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg2)"/><text class="t h" x="55" y="60">FastGPT Dataset: ingestion + retrieval · 入库与检索</text>
  <text class="t m" x="55" y="116" fill="#35d7ca">OFFLINE / 离线建库</text>
  <g transform="translate(55 145)"><rect class="card" width="195" height="118" rx="18"/><text class="t m" x="97" y="42" text-anchor="middle">Files · 文档</text><text class="t s" x="97" y="73" text-anchor="middle">PDF / DOCX / URL</text><text class="t s" x="97" y="97" text-anchor="middle">text / tables / images</text></g>
  <g transform="translate(310 145)"><rect class="card" width="195" height="118" rx="18"/><text class="t m" x="97" y="42" text-anchor="middle">Parse · 解析</text><text class="t s" x="97" y="73" text-anchor="middle">clean + preserve structure</text><text class="t s" x="97" y="97" text-anchor="middle">OCR when needed</text></g>
  <g transform="translate(565 145)"><rect class="card" width="195" height="118" rx="18"/><text class="t m" x="97" y="42" text-anchor="middle">Chunk · 分块</text><text class="t s" x="97" y="73" text-anchor="middle">complete semantics</text><text class="t s" x="97" y="97" text-anchor="middle">metadata + versions</text></g>
  <g transform="translate(820 145)"><rect class="card" width="325" height="118" rx="18"/><text class="t m" x="162" y="39" text-anchor="middle">Index &amp; store · 索引入库</text><text class="t s" x="162" y="69" text-anchor="middle">MongoDB source + metadata</text><text class="t s" x="162" y="94" text-anchor="middle">vector store / multi-vector mapping</text></g>
  <path class="a" d="M250 204h56M505 204h56M760 204h56"/>
  <path d="M55 311H1145" stroke="#315c75" stroke-width="2" stroke-dasharray="7 8"/><text class="t m" x="55" y="361" fill="#ffc466">ONLINE / 在线问答</text>
  <g transform="translate(55 391)"><rect class="card" width="165" height="112" rx="18"/><text class="t m" x="82" y="42" text-anchor="middle">Question</text><text class="t s" x="82" y="75" text-anchor="middle">用户问题</text></g>
  <g transform="translate(270 391)"><rect class="card" width="175" height="112" rx="18"/><text class="t m" x="87" y="42" text-anchor="middle">Rewrite</text><text class="t s" x="87" y="72" text-anchor="middle">resolve references</text><text class="t s" x="87" y="94" text-anchor="middle">指代消解 / 扩展</text></g>
  <g transform="translate(495 365)"><rect class="card" width="210" height="164" rx="18"/><text class="t m" x="105" y="37" text-anchor="middle">Multi-path recall</text><text class="t s" x="105" y="69" text-anchor="middle">semantic vectors</text><text class="t s" x="105" y="94" text-anchor="middle">full-text / images</text><text class="t s" x="105" y="121" text-anchor="middle">多路召回</text><circle cx="35" cy="69" r="7" fill="#35d7ca"/><circle cx="35" cy="94" r="7" fill="#ffc466"/></g>
  <g transform="translate(755 391)"><rect class="card" width="165" height="112" rx="18"/><text class="t m" x="82" y="40" text-anchor="middle">RRF + Rerank</text><text class="t s" x="82" y="72" text-anchor="middle">fuse and refine</text><text class="t s" x="82" y="94" text-anchor="middle">融合与精排</text></g>
  <g transform="translate(970 391)"><rect class="card" width="175" height="112" rx="18"/><text class="t m" x="87" y="40" text-anchor="middle">Context</text><text class="t s" x="87" y="72" text-anchor="middle">relevance + token cap</text><text class="t s" x="87" y="94" text-anchor="middle">引用上下文</text></g>
  <path class="b" d="M220 447h46M445 447h46M705 447h46M920 447h46"/>
  <g transform="translate(364 603)"><rect x="0" y="0" width="472" height="90" rx="24" fill="#123d51" stroke="#35d7ca" stroke-width="2"/><text class="t m" x="236" y="37" text-anchor="middle">LLM generates a grounded answer</text><text class="t s" x="236" y="66" text-anchor="middle">模型基于引用生成回答，可显示来源</text></g>
  <path class="a" d="M1057 507C1057 574 835 572 805 600"/>
</svg>
