<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Function Calling and MCP</title>
  <desc id="desc">Function calling connects a model to an application. MCP connects the application to a tool server, which accesses a business system.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#f5f0e5"/>
      <stop offset="1" stop-color="#e5dfcf"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#586752"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#263629">
    <text x="100" y="125" font-size="22" letter-spacing="5">SNOW / OPEN NOTEBOOK</text>
    <text x="100" y="235" font-size="68" font-weight="650">Function Calling + MCP</text>
    <text x="104" y="293" font-size="28" fill="#59634f">One tool call. Two interface boundaries.</text>
    <path d="M100 346H1500" stroke="#a5ac95" stroke-width="2"/>
    <rect x="388" y="420" width="354" height="122" rx="12" fill="#dedbc8"/>
    <rect x="805" y="420" width="354" height="122" rx="12" fill="#d7dfcf"/>
    <text x="565" y="466" text-anchor="middle" font-size="28" font-weight="600">Function Calling</text>
    <text x="565" y="510" text-anchor="middle" font-size="22">Name + arguments</text>
    <text x="982" y="466" text-anchor="middle" font-size="28" font-weight="600">MCP</text>
    <text x="982" y="510" text-anchor="middle" font-size="22">Discover + invoke</text>
    <g stroke="#586752" stroke-width="3" marker-end="url(#arrow)">
      <path d="M337 625H644"/>
      <path d="M837 625H1144"/>
    </g>
    <g stroke="#7f8b72" stroke-width="2">
      <rect x="100" y="565" width="235" height="120" rx="16" fill="#fcfaf4"/>
      <rect x="650" y="565" width="185" height="120" rx="16" fill="#334b38"/>
      <rect x="1150" y="565" width="350" height="120" rx="16" fill="#fcfaf4"/>
    </g>
    <text x="218" y="637" text-anchor="middle" font-size="34" font-weight="600">Model</text>
    <text x="742" y="637" text-anchor="middle" font-size="31" font-weight="600" fill="#fffdf4">App</text>
    <text x="1325" y="617" text-anchor="middle" font-size="31" font-weight="600">MCP Server</text>
    <text x="1325" y="658" text-anchor="middle" font-size="22">Business system access</text>
    <text x="100" y="792" font-size="26" fill="#59634f">The model proposes. The application routes. The service executes.</text>
  </g>
</svg>
