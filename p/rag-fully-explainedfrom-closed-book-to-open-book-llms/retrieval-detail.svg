<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="v1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="v2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="v3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">混合检索 + 重排：提升召回质量</text>
  <!-- query -->
  <g transform="translate(500,90)">
    <rect width="200" height="60" rx="10" fill="#1e293b"/>
    <text x="100" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">用户 Query</text>
  </g>
  <line x1="600" y1="150" x2="600" y2="180" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,180 594,170 606,170" fill="#94a3b8"/>
  <!-- query rewrite -->
  <g transform="translate(480,185)">
    <rect width="240" height="50" rx="10" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <text x="120" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#6d28d9">🔄 Query 改写 / HyDE</text>
  </g>
  <!-- split into two -->
  <line x1="600" y1="235" x2="280" y2="275" stroke="#94a3b8" stroke-width="3"/>
  <line x1="600" y1="235" x2="920" y2="275" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="280,275 290,272 286,283" fill="#94a3b8"/>
  <polygon points="920,275 910,272 914,283" fill="#94a3b8"/>
  <!-- vector retrieval -->
  <g transform="translate(150,280)">
    <rect width="260" height="120" rx="12" fill="url(#v1)"/>
    <text x="130" y="42" text-anchor="middle" font-size="30">🧬</text>
    <text x="130" y="75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">向量检索</text>
    <text x="130" y="98" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#dbeafe">语义相似 · 余弦相似度</text>
  </g>
  <!-- keyword retrieval -->
  <g transform="translate(790,280)">
    <rect width="260" height="120" rx="12" fill="url(#v2)"/>
    <text x="130" y="42" text-anchor="middle" font-size="30">🔑</text>
    <text x="130" y="75" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">关键词检索 (BM25)</text>
    <text x="130" y="98" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">字面匹配 · 精确召回</text>
  </g>
  <!-- merge -->
  <line x1="280" y1="400" x2="540" y2="445" stroke="#94a3b8" stroke-width="3"/>
  <line x1="920" y1="400" x2="660" y2="445" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="540,445 530,442 534,453" fill="#94a3b8"/>
  <polygon points="660,445 670,442 666,453" fill="#94a3b8"/>
  <!-- rerank -->
  <g transform="translate(450,450)">
    <rect width="300" height="70" rx="12" fill="url(#v3)"/>
    <text x="150" y="32" text-anchor="middle" font-size="26">🏆</text>
    <text x="150" y="58" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Rerank 精排 → Top-K</text>
  </g>
  <line x1="750" y1="485" x2="820" y2="485" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="820,485 810,479 810,491" fill="#94a3b8"/>
  <!-- output -->
  <g transform="translate(825,455)">
    <rect width="180" height="60" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#16a34a">高质量上下文</text>
  </g>
  <text x="600" y="545" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">两路召回互补：向量检索擅长语义、BM25 擅长精确术语；Rerank（如 bge-reranker）再做交叉编码精排</text>
</svg>
