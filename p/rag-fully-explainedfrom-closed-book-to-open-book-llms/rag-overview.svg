<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="r2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="r3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">RAG 工作流程：检索 → 增强 → 生成</text>
  <!-- user query -->
  <g transform="translate(60,200)">
    <rect width="150" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="75" y="42" text-anchor="middle" font-size="30">🙋</text>
    <text x="75" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">用户提问</text>
  </g>
  <!-- arrow -->
  <line x1="215" y1="245" x2="245" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="245,245 235,239 235,251" fill="#94a3b8"/>
  <!-- 1 Retrieval -->
  <g transform="translate(250,150)">
    <rect width="220" height="190" rx="14" fill="url(#r1)"/>
    <text x="110" y="50" text-anchor="middle" font-size="34">🔍</text>
    <text x="110" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">① 检索 Retrieval</text>
    <text x="110" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">从向量数据库中</text>
    <text x="110" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">召回相关文档片段</text>
    <text x="110" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#bfdbfe">Embedding 相似度匹配</text>
  </g>
  <line x1="475" y1="245" x2="505" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="505,245 495,239 495,251" fill="#94a3b8"/>
  <!-- 2 Augmentation -->
  <g transform="translate(510,150)">
    <rect width="220" height="190" rx="14" fill="url(#r2)"/>
    <text x="110" y="50" text-anchor="middle" font-size="34">🔗</text>
    <text x="110" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">② 增强 Augmentation</text>
    <text x="110" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">把检索结果拼接到</text>
    <text x="110" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">Prompt 上下文中</text>
    <text x="110" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ddd6fe">Context + Question</text>
  </g>
  <line x1="735" y1="245" x2="765" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="765,245 755,239 755,251" fill="#94a3b8"/>
  <!-- 3 Generation -->
  <g transform="translate(770,150)">
    <rect width="220" height="190" rx="14" fill="url(#r3)"/>
    <text x="110" y="50" text-anchor="middle" font-size="34">✨</text>
    <text x="110" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">③ 生成 Generation</text>
    <text x="110" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">LLM 基于上下文</text>
    <text x="110" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">生成准确回答</text>
    <text x="110" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fbcfe8">可附带引用来源</text>
  </g>
  <line x1="995" y1="245" x2="1025" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="1025,245 1015,239 1015,251" fill="#94a3b8"/>
  <!-- answer -->
  <g transform="translate(1030,200)">
    <rect width="120" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="60" y="42" text-anchor="middle" font-size="30">💬</text>
    <text x="60" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">回答</text>
  </g>
  <!-- offline note -->
  <g transform="translate(60,420)">
    <rect width="1090" height="110" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="30" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#4338ca">📚 离线阶段（提前准备）</text>
    <text x="30" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">原始文档 → 切分 Chunking → 向量化 Embedding → 存入向量数据库</text>
    <text x="30" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">↑ 检索阶段所查询的"知识库"就是在离线阶段建好的；知识更新只需重建索引，无需重训模型</text>
  </g>
</svg>
