<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="a1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="a2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="a3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="a4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#0f172a"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">RAG 进阶技术矩阵</text>
  <text x="600" y="82" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#94a3b8">从"能用"到"好用"的四个关键方向</text>
  <!-- card 1: Query Rewrite -->
  <g transform="translate(60,120)">
    <rect width="520" height="220" rx="14" fill="url(#a1)"/>
    <text x="30" y="50" font-size="32">🔄</text>
    <text x="80" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Query 改写 / HyDE</text>
    <text x="80" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ddd6fe">让问题更适合检索</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#f5f3ff">
      <text x="30" y="115">• Query Rewriting：口语化问题改写成检索友好形式</text>
      <text x="30" y="145">• HyDE：先让 LLM 生成假设答案，再用答案去检索</text>
      <text x="30" y="175">• Multi-Query：一个问题拆成多个子问题分别检索</text>
      <text x="30" y="205">• Step-back：先抽象出上位概念再检索</text>
    </g>
  </g>
  <!-- card 2: Rerank -->
  <g transform="translate(620,120)">
    <rect width="520" height="220" rx="14" fill="url(#a2)"/>
    <text x="30" y="50" font-size="32">🏆</text>
    <text x="80" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">混合检索 + Rerank</text>
    <text x="80" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#cffafe">多路召回，精排提纯</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#ecfeff">
      <text x="30" y="115">• 向量检索（语义）+ BM25（关键词）并行召回</text>
      <text x="30" y="145">• RRF（Reciprocal Rank Fusion）融合两路结果</text>
      <text x="30" y="175">• Cross-Encoder 重排：bge-reranker、Cohere Rerank</text>
      <text x="30" y="205">• 精排后再取 Top-K，显著降低噪声</text>
    </g>
  </g>
  <!-- card 3: GraphRAG -->
  <g transform="translate(60,360)">
    <rect width="520" height="220" rx="14" fill="url(#a3)"/>
    <text x="30" y="50" font-size="32">🕸️</text>
    <text x="80" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">GraphRAG（微软）</text>
    <text x="80" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fef3c7">基于知识图谱的全局检索</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#fffbeb">
      <text x="30" y="115">• 从文档抽取实体与关系，构建知识图谱</text>
      <text x="30" y="145">• 社区检测（Leiden）形成主题层次</text>
      <text x="30" y="175">• 擅长"总结性/全局性"问题</text>
      <text x="30" y="205">• 如：总结整个文档集的核心主题</text>
    </g>
  </g>
  <!-- card 4: Self-RAG -->
  <g transform="translate(620,360)">
    <rect width="520" height="220" rx="14" fill="url(#a4)"/>
    <text x="30" y="50" font-size="32">🧠</text>
    <text x="80" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Self-RAG / 自适应 RAG</text>
    <text x="80" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fbcfe8">让模型自己决定要不要检索</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#fdf2f8">
      <text x="30" y="115">• 检索触发判断：简单问题直接答，复杂问题才检索</text>
      <text x="30" y="145">• 检索结果相关性评判，过滤无关片段</text>
      <text x="30" y="175">• 生成结果自我反思，是否忠于检索内容</text>
      <text x="30" y="205">• 降低无关检索对生成的干扰，省 token</text>
    </g>
  </g>
</svg>
