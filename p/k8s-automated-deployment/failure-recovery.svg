<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">Release gates and failure recovery / 发布门禁与失败恢复</title>
  <desc id="desc">Test or build failures do not change the cluster. Release or smoke-test failures collect evidence. With an existing template, restore it and verify recovery; without one, investigate manually. Recovery does not turn the failed release green.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63765e" stroke-width="2"/></marker></defs>
  <rect width="1200" height="830" rx="18" fill="#f6f1e7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#24362d">
    <text x="48" y="63" font-size="34" font-weight="600">A failed release needs an explicit recovery path</text>
    <text x="48" y="105" font-size="23" fill="#52624f">先保留现场，再恢复；没有旧版本，就不能假设可以回滚。</text>
    <g fill="#fffdf8" stroke="#c8cebd"><rect x="64" y="151" width="470" height="92" rx="9"/><rect x="64" y="310" width="470" height="92" rx="9"/><rect x="64" y="469" width="470" height="92" rx="9"/></g>
    <g font-size="25" font-weight="600"><text x="92" y="190">Test + build</text><text x="92" y="349">Apply + rollout + smoke test</text><text x="92" y="508">Collect evidence / 收集现场</text></g>
    <g font-size="20" fill="#52624f"><text x="92" y="221">Fail before deployment → preserve live version</text><text x="92" y="380">All checks pass → observe release</text><text x="92" y="539">Deployment · Pods · Events · Logs</text></g>
    <rect x="716" y="151" width="420" height="92" rx="9" fill="#e3edd9" stroke="#78916b"/>
    <text x="744" y="190" font-size="25" font-weight="600">No cluster change</text><text x="744" y="221" font-size="20" fill="#52624f">测试 / 构建失败，不进入发布</text>
    <rect x="716" y="310" width="420" height="92" rx="9" fill="#e3edd9" stroke="#78916b"/>
    <text x="744" y="349" font-size="25" font-weight="600">Observe / 持续观察</text><text x="744" y="380" font-size="20" fill="#52624f">Errors · latency · business metrics</text>
    <rect x="716" y="469" width="420" height="92" rx="9" fill="#fff0d5" stroke="#ba924b"/>
    <text x="744" y="508" font-size="25" font-weight="600">Previous template exists?</text><text x="744" y="539" font-size="20" fill="#52624f">发布前是否已有 Pod 模板快照？</text>
    <rect x="64" y="647" width="560" height="92" rx="9" fill="#e3edd9" stroke="#78916b"/>
    <text x="92" y="686" font-size="25" font-weight="600">Restore template → verify recovery</text><text x="92" y="717" font-size="20" fill="#52624f">恢复后继续验证；失败发布仍然标记为失败</text>
    <rect x="716" y="647" width="420" height="92" rx="9" fill="#f4e3dc" stroke="#b78a77"/>
    <text x="744" y="686" font-size="25" font-weight="600">Manual investigation</text><text x="744" y="717" font-size="20" fill="#52624f">首次部署 / 无旧版 / 恢复失败</text>
    <g fill="none" stroke="#63765e" stroke-width="2" marker-end="url(#a)"><path d="M534 197H703"/><path d="M299 243V297"/><path d="M534 356H703"/><path d="M299 402V456"/><path d="M534 515H703"/><path d="M926 561V632"/><path d="M800 561V601H344V634"/></g>
    <g font-size="20" fill="#52624f"><text x="580" y="181">Fail</text><text x="320" y="280">Pass</text><text x="580" y="340">Pass</text><text x="320" y="439">Fail</text><text x="947" y="610">No</text><text x="565" y="587">Yes</text></g>
    <text x="64" y="791" font-size="22" fill="#52624f">Runner / API loss can prevent recovery. Independent monitoring must detect it.</text>
  </g>
</svg>
