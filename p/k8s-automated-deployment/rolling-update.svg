<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Rolling update with two replicas / 两副本滚动更新</title>
  <desc id="desc">The ideal progression is two old ready Pods, one additional new Pod starting, the new Pod becoming ready before an old Pod is removed, and finally two new ready Pods.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63765e" stroke-width="2"/></marker></defs>
  <rect width="1200" height="730" rx="18" fill="#f6f1e7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#24362d">
    <text x="48" y="64" font-size="34" font-weight="600">Replace capacity only after readiness</text>
    <text x="48" y="108" font-size="23" fill="#52624f">replicas: 2 · maxUnavailable: 0 · maxSurge: 1 · minReadySeconds: 5</text>
    <path d="M48 145H1152" stroke="#ccc8b8"/>
    <g fill="#fffdf8" stroke="#c8cebd"><rect x="48" y="181" width="252" height="350" rx="10"/><rect x="332" y="181" width="252" height="350" rx="10"/><rect x="616" y="181" width="252" height="350" rx="10"/><rect x="900" y="181" width="252" height="350" rx="10"/></g>
    <g font-size="22" font-weight="600"><text x="70" y="224">01 / Stable</text><text x="354" y="224">02 / Start new</text><text x="638" y="224">03 / New ready</text><text x="922" y="224">04 / Complete</text></g>
    <g stroke="#9ca9b6" fill="#e6ebef"><rect x="70" y="257" width="208" height="58" rx="7"/><rect x="70" y="331" width="208" height="58" rx="7"/><rect x="354" y="257" width="208" height="58" rx="7"/><rect x="354" y="331" width="208" height="58" rx="7"/><rect x="638" y="257" width="208" height="58" rx="7"/></g>
    <rect x="354" y="405" width="208" height="58" rx="7" fill="#fff0d5" stroke="#ba924b" stroke-dasharray="6 4"/>
    <g stroke="#78916b" fill="#e3edd9"><rect x="638" y="331" width="208" height="58" rx="7"/><rect x="922" y="257" width="208" height="58" rx="7"/><rect x="922" y="331" width="208" height="58" rx="7"/></g>
    <g font-size="22" text-anchor="middle"><text x="174" y="294">v1 · Ready</text><text x="174" y="368">v1 · Ready</text><text x="458" y="294">v1 · Ready</text><text x="458" y="368">v1 · Ready</text><text x="458" y="442">v2 · Starting</text><text x="742" y="294">v1 · Ready</text><text x="742" y="368">v2 · Ready</text><text x="1026" y="294">v2 · Ready</text><text x="1026" y="368">v2 · Ready</text></g>
    <g fill="none" stroke="#63765e" stroke-width="2" marker-end="url(#a)"><path d="M304 352H327"/><path d="M588 352H611"/><path d="M872 352H895"/></g>
    <g font-size="20" fill="#52624f" text-anchor="middle"><text x="174" y="498">2 available</text><text x="458" y="498">2 available + 1 starting</text><text x="742" y="498">Repeat for next Pod</text><text x="1026" y="498">2 updated / available</text></g>
    <text x="48" y="594" font-size="24" font-weight="600">Not Ready → no normal Service traffic / 未就绪，不接正常服务流量</text>
    <text x="48" y="643" font-size="22" fill="#52624f">Ideal sequence; reserve spare capacity. Terminating Pods may use extra resources.</text>
    <text x="48" y="682" font-size="22" fill="#52624f">这是理想顺序；资源余量、连接排空与应用兼容性仍需单独设计。</text>
  </g>
</svg>
