<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Deployment identities and network paths / 发布权限与网络</title>
  <desc id="desc">The runner pushes to GHCR and calls the Kubernetes API. Nodes pull images separately using imagePullSecrets. User traffic enters through a gateway and Service.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63765e" stroke-width="2"/></marker></defs>
  <rect width="1200" height="810" rx="18" fill="#f6f1e7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#24362d">
    <text x="48" y="62" font-size="34" font-weight="600">Three identities, separate connections</text>
    <text x="48" y="100" font-size="23" fill="#52624f">发布控制、镜像推送、节点拉取，分别检查权限与连通性</text>
    <rect x="48" y="140" width="314" height="475" rx="12" fill="#fffdf8" stroke="#c8cebd"/>
    <text x="74" y="179" font-size="18" fill="#607354" letter-spacing="2">CI / RUNNER</text>
    <text x="74" y="245" font-size="29" font-weight="600">GitHub Actions</text>
    <text x="74" y="289" font-size="23">Build → push image</text>
    <text x="74" y="324" font-size="20" fill="#52624f">GITHUB_TOKEN</text>
    <path d="M74 360H336" stroke="#d6d8c9"/>
    <text x="74" y="406" font-size="23">Deploy → call API</text>
    <text x="74" y="443" font-size="20" fill="#52624f">Restricted KUBE_CONFIG</text>
    <text x="74" y="544" font-size="22" fill="#52624f">受限发布身份</text>
    <text x="74" y="579" font-size="20" fill="#52624f">Namespace-scoped RBAC</text>
    <rect x="558" y="140" width="594" height="160" rx="12" fill="#e7eddc" stroke="#bdc9ad"/>
    <text x="586" y="179" font-size="18" fill="#607354" letter-spacing="2">REGISTRY</text>
    <text x="586" y="223" font-size="30" font-weight="600">GHCR / image@sha256:...</text>
    <text x="586" y="266" font-size="23">Private image → package read permission</text>
    <rect x="558" y="350" width="594" height="265" rx="12" fill="#eef0e8" stroke="#bdc9ad"/>
    <text x="586" y="390" font-size="18" fill="#607354" letter-spacing="2">KUBERNETES / demo-prod</text>
    <rect x="586" y="417" width="238" height="78" rx="8" fill="#fffdf8" stroke="#c8cebd"/>
    <text x="610" y="464" font-size="25" font-weight="600">API Server</text>
    <rect x="858" y="417" width="266" height="78" rx="8" fill="#fffdf8" stroke="#c8cebd"/>
    <text x="880" y="464" font-size="25" font-weight="600">Node / kubelet</text>
    <text x="586" y="545" font-size="22">Node credential: imagePullSecrets</text>
    <text x="586" y="582" font-size="22" fill="#52624f">节点独立访问仓库并拉取镜像</text>
    <g fill="none" stroke="#63765e" stroke-width="2.5" marker-end="url(#a)">
      <path d="M362 244H543"/><path d="M362 456H573"/><path d="M991 417V314"/>
    </g>
    <g font-size="20" fill="#52624f"><text x="397" y="229">push</text><text x="386" y="440">kubectl</text><text x="1010" y="336">pull</text></g>
    <path d="M48 659H1152" stroke="#ccc8b8"/>
    <text x="48" y="706" font-size="24" font-weight="600">User → Gateway / Ingress → Service → Ready Pod</text>
    <text x="48" y="752" font-size="22" fill="#52624f">发布链路可达 ≠ 用户访问链路已验证 / Verify the real entry point separately.</text>
  </g>
</svg>
