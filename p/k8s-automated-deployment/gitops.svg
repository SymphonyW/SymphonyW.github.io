<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Push CD and GitOps / 两种部署控制方式</title>
  <desc id="desc">In push deployment, CI calls the Kubernetes API. In GitOps, CI publishes an image and proposes a digest change to a deployment repository. A reconciler reads the approved desired state and updates the cluster.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#63765e" stroke-width="2"/></marker></defs>
  <rect width="1200" height="750" rx="18" fill="#f6f1e7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#24362d">
    <text x="48" y="62" font-size="34" font-weight="600">Who owns the desired state?</text>
    <text x="48" y="103" font-size="23" fill="#52624f">从 CI 直接发布，演进到持续协调 Git 中的环境版本</text>
    <text x="48" y="166" font-size="24" font-weight="600">PUSH CD / 本文主线</text>
    <g fill="#fffdf8" stroke="#c8cebd"><rect x="48" y="194" width="290" height="110" rx="9"/><rect x="455" y="194" width="290" height="110" rx="9"/><rect x="862" y="194" width="290" height="110" rx="9"/></g>
    <g font-size="25" font-weight="600" text-anchor="middle"><text x="193" y="240">Source + CI</text><text x="600" y="240">Deploy Job</text><text x="1007" y="240">K8s API</text></g>
    <g font-size="20" fill="#52624f" text-anchor="middle"><text x="193" y="277">Build immutable image</text><text x="600" y="277">Holds cluster credential</text><text x="1007" y="277">Apply and roll out</text></g>
    <g fill="none" stroke="#63765e" stroke-width="2.5" marker-end="url(#a)"><path d="M338 249H441"/><path d="M745 249H848"/></g>
    <path d="M48 350H1152" stroke="#ccc8b8"/>
    <text x="48" y="404" font-size="24" font-weight="600">GITOPS / 进一步演进</text>
    <g fill="#fffdf8" stroke="#c8cebd"><rect x="48" y="437" width="245" height="126" rx="9"/><rect x="345" y="437" width="245" height="126" rx="9"/><rect x="642" y="437" width="245" height="126" rx="9" fill="#e3edd9"/><rect x="939" y="437" width="213" height="126" rx="9"/></g>
    <g font-size="25" font-weight="600" text-anchor="middle"><text x="170" y="481">CI + Registry</text><text x="467" y="481">Deploy Git</text><text x="764" y="481">Argo / Flux</text><text x="1045" y="481">Kubernetes</text></g>
    <g font-size="20" fill="#52624f" text-anchor="middle"><text x="170" y="521">Publish digest</text><text x="467" y="521">Review digest change</text><text x="764" y="521">Read + reconcile</text><text x="1045" y="521">Actual state</text></g>
    <g fill="none" stroke="#63765e" stroke-width="2.5" marker-end="url(#a)"><path d="M293 500H332"/><path d="M590 500H629"/><path d="M887 500H926"/><path d="M1045 571V614H764V575"/></g>
    <text x="888" y="641" font-size="20" text-anchor="middle" fill="#52624f">Observe drift / 检测偏差</text>
    <text x="48" y="687" font-size="23" fill="#52624f">Rollback the desired version in Git; self-heal and prune depend on policy.</text>
    <text x="48" y="723" font-size="22" fill="#52624f">回滚也要修改 Git 中的期望版本；自愈与删除策略需要明确配置。</text>
  </g>
</svg>
