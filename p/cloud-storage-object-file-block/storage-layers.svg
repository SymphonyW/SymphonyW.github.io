<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Three cloud storage abstraction layers</title>
  <desc id="desc">Object storage maps a bucket and key through an API and object index. File storage resolves a path through a file-system client and metadata. Block storage maps a logical block address through a virtual device and volume map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1">ONE MEDIUM, THREE ABSTRACTIONS</text>
  <text x="64" y="104" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">THE INTERFACE DETERMINES HOW DATA IS NAMED, COORDINATED, AND STORED</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="48" y="140" width="1104" height="132" rx="22" fill="#16243c" stroke="#2563eb" stroke-opacity=".8"/>
    <rect x="48" y="290" width="1104" height="132" rx="22" fill="#162b35" stroke="#059669" stroke-opacity=".8"/>
    <rect x="48" y="440" width="1104" height="132" rx="22" fill="#2b2430" stroke="#f97316" stroke-opacity=".8"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g fill="#38bdf8">
      <circle cx="102" cy="190" r="24"/><rect x="78" y="222" width="48" height="25" rx="12"/>
    </g>
    <text x="154" y="193" fill="#f8fafc" font-size="24" font-weight="700">OBJECT</text>
    <text x="154" y="227" fill="#7dd3fc" font-size="18">BUCKET + KEY</text>

    <g fill="#34d399">
      <path d="M76 338h25l9 10h24v35H76z"/><path d="M76 348h58" stroke="#a7f3d0" stroke-width="4"/>
    </g>
    <text x="154" y="343" fill="#f8fafc" font-size="24" font-weight="700">FILE</text>
    <text x="154" y="377" fill="#6ee7b7" font-size="18">/TEAM/REPORT.MD</text>

    <g fill="#fb923c">
      <rect x="76" y="480" width="27" height="27" rx="5"/><rect x="109" y="480" width="27" height="27" rx="5"/>
      <rect x="76" y="513" width="27" height="27" rx="5"/><rect x="109" y="513" width="27" height="27" rx="5"/>
    </g>
    <text x="154" y="493" fill="#f8fafc" font-size="24" font-weight="700">BLOCK</text>
    <text x="154" y="527" fill="#fdba74" font-size="18">LBA + LENGTH</text>
  </g>

  <g fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">
    <g>
      <rect x="342" y="174" width="190" height="64" rx="14" fill="#1d4f91"/>
      <text x="437" y="212">HTTP API</text>
      <rect x="616" y="174" width="190" height="64" rx="14" fill="#1d4f91"/>
      <text x="711" y="212">OBJECT INDEX</text>
      <rect x="890" y="174" width="190" height="64" rx="14" fill="#1d4f91"/>
      <text x="985" y="212">DATA FRAGMENTS</text>
    </g>
    <g>
      <rect x="342" y="324" width="190" height="64" rx="14" fill="#116149"/>
      <text x="437" y="362">FS CLIENT</text>
      <rect x="616" y="324" width="190" height="64" rx="14" fill="#116149"/>
      <text x="711" y="362">METADATA</text>
      <rect x="890" y="324" width="190" height="64" rx="14" fill="#116149"/>
      <text x="985" y="362">DATA BLOCKS</text>
    </g>
    <g>
      <rect x="342" y="474" width="190" height="64" rx="14" fill="#9a4519"/>
      <text x="437" y="512">VIRTUAL DEVICE</text>
      <rect x="616" y="474" width="190" height="64" rx="14" fill="#9a4519"/>
      <text x="711" y="512">VOLUME MAP</text>
      <rect x="890" y="474" width="190" height="64" rx="14" fill="#9a4519"/>
      <text x="985" y="512">PHYSICAL BLOCKS</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <path d="M278 206h48"/><path d="M548 206h52"/><path d="M822 206h52"/>
    <path d="M278 356h48"/><path d="M548 356h52"/><path d="M822 356h52"/>
    <path d="M278 506h48"/><path d="M548 506h52"/><path d="M822 506h52"/>
  </g>

  <g fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" letter-spacing="1">
    <text x="437" y="610">PROTOCOL</text>
    <text x="711" y="610">ADDRESS MAPPING</text>
    <text x="985" y="610">DURABLE DATA</text>
  </g>
</svg>
