<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">熵编码与文件压缩</title>
  <desc id="desc">原始数据经过建模、变换和熵编码，成为更短比特流的封面示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.56" stop-color="#123047"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <style>
      .title { font: 800 66px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .sub { font: 500 25px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #bae6fd; }
      .label { font: 700 22px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #e2e8f0; }
      .small { font: 600 16px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #94a3b8; }
      .bit { font: 700 20px "Cascadia Mono", Consolas, monospace; fill: #d9f99d; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1058" cy="78" r="194" fill="#38bdf8" opacity="0.08"/>
  <circle cx="116" cy="574" r="212" fill="#2dd4bf" opacity="0.08"/>

  <g transform="translate(70 84)" filter="url(#shadow)">
    <rect width="280" height="232" rx="28" fill="#0f2438" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <text x="32" y="46" class="label">原始数据</text>
    <text x="32" y="72" class="small">RAW DATA</text>
    <g transform="translate(32 100)">
      <rect width="216" height="18" rx="9" fill="#334155"/>
      <rect y="32" width="186" height="18" rx="9" fill="#475569"/>
      <rect y="64" width="216" height="18" rx="9" fill="#334155"/>
      <rect y="96" width="154" height="18" rx="9" fill="#475569"/>
      <g fill="#7dd3fc">
        <circle cx="22" cy="9" r="6"/><circle cx="62" cy="9" r="6"/><circle cx="104" cy="9" r="6"/>
        <circle cx="22" cy="41" r="6"/><circle cx="62" cy="41" r="6"/><circle cx="104" cy="41" r="6"/>
      </g>
    </g>
  </g>

  <g stroke="url(#flow)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M374 200 H462"/>
    <path d="M728 200 H816"/>
  </g>
  <g fill="#67e8f9">
    <path d="M462 200 l-16 -10 v20 z"/>
    <path d="M816 200 l-16 -10 v20 z"/>
  </g>

  <g transform="translate(464 84)" filter="url(#shadow)">
    <rect width="264" height="232" rx="28" fill="#f8fafc"/>
    <text x="32" y="46" style="font:700 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a">压缩流水线</text>
    <text x="32" y="72" style="font:600 16px 'Segoe UI',sans-serif;fill:#64748b">MODEL + TRANSFORM</text>
    <g transform="translate(32 100)">
      <rect width="200" height="34" rx="10" fill="#e0f2fe"/>
      <text x="100" y="23" text-anchor="middle" style="font:600 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#075985">预测 / 字典 / 变换</text>
      <rect y="48" width="200" height="34" rx="10" fill="#ccfbf1"/>
      <text x="100" y="71" text-anchor="middle" style="font:600 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#115e59">概率建模</text>
      <rect y="96" width="200" height="34" rx="10" fill="#fef3c7"/>
      <text x="100" y="119" text-anchor="middle" style="font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#92400e">熵编码</text>
    </g>
  </g>

  <g transform="translate(818 84)" filter="url(#shadow)">
    <rect width="312" height="232" rx="28" fill="#0f2438" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2"/>
    <text x="32" y="46" class="label">更短的比特流</text>
    <text x="32" y="72" class="small">COMPRESSED BITSTREAM</text>
    <g transform="translate(32 104)">
      <text y="20" class="bit">0  110  10  0</text>
      <text y="55" class="bit">111  0  10</text>
      <text y="90" class="bit">0  0  110</text>
      <rect y="112" width="190" height="8" rx="4" fill="#2dd4bf"/>
      <rect x="196" y="112" width="52" height="8" rx="4" fill="#334155"/>
    </g>
  </g>

  <text x="68" y="420" class="title">熵编码与文件压缩</text>
  <text x="72" y="466" class="sub">从概率到比特：Huffman、Arithmetic、ANS 与完整压缩流水线</text>
  <g transform="translate(72 520)">
    <rect width="168" height="40" rx="20" fill="#e0f2fe"/>
    <text x="84" y="26" text-anchor="middle" style="font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#075985">概率模型</text>
    <rect x="184" width="168" height="40" rx="20" fill="#ccfbf1"/>
    <text x="268" y="26" text-anchor="middle" style="font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#115e59">局部连续性</text>
    <rect x="368" width="168" height="40" rx="20" fill="#fef3c7"/>
    <text x="452" y="26" text-anchor="middle" style="font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#92400e">无损与有损</text>
  </g>
</svg>
