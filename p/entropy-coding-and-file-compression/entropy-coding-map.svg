<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">常见熵编码方法对比</title>
  <desc id="desc">Huffman、算术编码、Range Coding、ANS 和 Golomb Rice 编码在速度、概率精度与适用数据上的对比。</desc>
  <defs>
    <style>
      .h { font: 800 28px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#0f172a; }
      .t { font: 800 20px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#0f172a; }
      .s { font: 500 14px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#475569; }
      .tag { font: 700 13px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f8fafc"/>
  <text x="48" y="58" class="h">熵编码器解决同一件事，但工程取舍不同</text>
  <text x="48" y="88" class="s">横轴不是严格排名：实现、模型和硬件会改变真实速度与压缩率。</text>

  <g transform="translate(48 132)">
    <rect class="card" width="336" height="188" rx="22"/>
    <rect width="336" height="10" rx="5" fill="#38bdf8"/>
    <text x="26" y="52" class="t">Huffman</text>
    <text x="26" y="82" class="s">高频符号短码，低频符号长码</text>
    <text x="26" y="108" class="s">优点：简单、成熟、查表解码快</text>
    <text x="26" y="134" class="s">限制：单符号码长必须是整数 bit</text>
    <rect x="26" y="151" width="102" height="25" rx="12" fill="#e0f2fe"/>
    <text x="77" y="168" text-anchor="middle" class="tag" fill="#0369a1">前缀码</text>
  </g>
  <g transform="translate(432 132)">
    <rect class="card" width="336" height="188" rx="22"/>
    <rect width="336" height="10" rx="5" fill="#a78bfa"/>
    <text x="26" y="52" class="t">Arithmetic / Range</text>
    <text x="26" y="82" class="s">把整段序列缩进连续概率区间</text>
    <text x="26" y="108" class="s">优点：能利用细粒度概率，接近熵极限</text>
    <text x="26" y="134" class="s">限制：状态依赖、重归一化与精度处理</text>
    <rect x="26" y="151" width="102" height="25" rx="12" fill="#f3e8ff"/>
    <text x="77" y="168" text-anchor="middle" class="tag" fill="#7e22ce">区间编码</text>
  </g>
  <g transform="translate(816 132)">
    <rect class="card" width="336" height="188" rx="22"/>
    <rect width="336" height="10" rx="5" fill="#2dd4bf"/>
    <text x="26" y="52" class="t">ANS / FSE</text>
    <text x="26" y="82" class="s">用整数状态或状态表吸收符号</text>
    <text x="26" y="108" class="s">优点：概率精度高，适合高吞吐实现</text>
    <text x="26" y="134" class="s">限制：频率归一化、表和状态管理</text>
    <rect x="26" y="151" width="102" height="25" rx="12" fill="#ccfbf1"/>
    <text x="77" y="168" text-anchor="middle" class="tag" fill="#0f766e">状态编码</text>
  </g>

  <g transform="translate(240 366)">
    <rect class="card" width="336" height="188" rx="22"/>
    <rect width="336" height="10" rx="5" fill="#f59e0b"/>
    <text x="26" y="52" class="t">Golomb / Rice</text>
    <text x="26" y="82" class="s">商用一元码，余数用二进制码</text>
    <text x="26" y="108" class="s">优点：实现极简，善于编码小整数残差</text>
    <text x="26" y="134" class="s">限制：依赖近似几何分布</text>
    <rect x="26" y="151" width="102" height="25" rx="12" fill="#fef3c7"/>
    <text x="77" y="168" text-anchor="middle" class="tag" fill="#92400e">残差编码</text>
  </g>
  <g transform="translate(624 366)">
    <rect class="card" width="336" height="188" rx="22"/>
    <rect width="336" height="10" rx="5" fill="#fb7185"/>
    <text x="26" y="52" class="t">Context + Binary Coder</text>
    <text x="26" y="82" class="s">上下文模型配合二进制算术编码</text>
    <text x="26" y="108" class="s">优点：条件概率更准，适合结构化语法</text>
    <text x="26" y="134" class="s">限制：计算复杂、并行化难度更高</text>
    <rect x="26" y="151" width="102" height="25" rx="12" fill="#ffe4e6"/>
    <text x="77" y="168" text-anchor="middle" class="tag" fill="#be123c">CABAC 类</text>
  </g>

  <g transform="translate(48 600)">
    <circle cx="7" cy="0" r="7" fill="#64748b"/>
    <text x="24" y="5" class="s">模型决定概率是否准确；编码器决定如何把概率高效落到比特上。</text>
  </g>
</svg>
