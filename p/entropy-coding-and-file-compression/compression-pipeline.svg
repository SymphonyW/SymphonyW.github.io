<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">完整压缩流水线</title>
  <desc id="desc">文件压缩包含建模变换、可选量化、概率建模、熵编码和文件封装，熵编码只是其中一环。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .h { font: 800 28px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .t { font: 700 19px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .s { font: 500 14px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="540" rx="28" fill="#f8fafc"/>
  <text x="48" y="58" class="h">文件压缩是一条流水线，熵编码只是其中一站</text>
  <text x="48" y="88" class="s">先把结构性冗余变成偏斜的符号分布，再用概率编码写成比特。</text>

  <g transform="translate(44 150)">
    <rect class="box" width="158" height="112" rx="18" fill="#e0f2fe"/>
    <text x="79" y="46" text-anchor="middle" class="t">原始数据</text>
    <text x="79" y="73" text-anchor="middle" class="s">字节 / 像素 / 采样</text>
  </g>
  <g transform="translate(232 150)">
    <rect class="box" width="184" height="112" rx="18" fill="#dcfce7"/>
    <text x="92" y="40" text-anchor="middle" class="t">建模与变换</text>
    <text x="92" y="67" text-anchor="middle" class="s">LZ / 预测 / Delta</text>
    <text x="92" y="88" text-anchor="middle" class="s">BWT / DCT / 分块</text>
  </g>
  <g transform="translate(446 150)">
    <rect class="box" width="152" height="112" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="76" y="40" text-anchor="middle" class="t">可选量化</text>
    <text x="76" y="67" text-anchor="middle" class="s">降低精度</text>
    <text x="76" y="88" text-anchor="middle" class="s">有损来源</text>
  </g>
  <g transform="translate(628 150)">
    <rect class="box" width="158" height="112" rx="18" fill="#f3e8ff"/>
    <text x="79" y="46" text-anchor="middle" class="t">概率建模</text>
    <text x="79" y="73" text-anchor="middle" class="s">频率 / 上下文</text>
  </g>
  <g transform="translate(816 142)">
    <rect width="158" height="128" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="79" y="50" text-anchor="middle" class="t">熵编码</text>
    <text x="79" y="78" text-anchor="middle" class="s">Huffman / ANS</text>
    <text x="79" y="99" text-anchor="middle" class="s">Arithmetic / Rice</text>
  </g>
  <g transform="translate(1004 150)">
    <rect class="box" width="152" height="112" rx="18" fill="#cffafe"/>
    <text x="76" y="46" text-anchor="middle" class="t">文件封装</text>
    <text x="76" y="73" text-anchor="middle" class="s">头 / 索引 / CRC</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M202 206 H226"/><path d="M416 206 H440"/><path d="M598 206 H622"/>
    <path d="M786 206 H810"/><path d="M974 206 H998"/>
  </g>

  <g transform="translate(228 330)">
    <rect width="746" height="104" rx="24" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
    <text x="28" y="42" class="t">文件压缩的范围</text>
    <text x="28" y="72" class="s">从输入建模到格式封装，目标是体积、速度、内存、可恢复性和随机访问的整体平衡。</text>
  </g>
  <g transform="translate(796 462)">
    <rect width="198" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="99" y="27" text-anchor="middle" class="s" style="font-weight:700;fill:#92400e">熵编码的范围</text>
    <path d="M99 0 V-178" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
</svg>
