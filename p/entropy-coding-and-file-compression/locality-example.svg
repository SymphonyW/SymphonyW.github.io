<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">局部连续性与差分残差</title>
  <desc id="desc">两组数据拥有相同直方图，连续排列经差分后全部为一，乱序排列经差分后仍然分散。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .h { font: 800 28px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#0f172a; }
      .t { font: 700 18px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#0f172a; }
      .s { font: 500 14px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill:#475569; }
      .n { font: 700 16px "Cascadia Mono", Consolas, monospace; fill:#0f172a; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="610" rx="28" fill="#f8fafc"/>
  <text x="48" y="58" class="h">同一组数、同一直方图，局部顺序仍会改变可压缩性</text>
  <text x="48" y="88" class="s">无上下文编码只看计数；预测或差分会把局部连续性转化为低熵残差。</text>

  <g transform="translate(48 132)">
    <rect class="card" width="506" height="382" rx="24"/>
    <rect width="506" height="12" rx="6" fill="#2dd4bf"/>
    <text x="28" y="52" class="t">局部连续</text>
    <text x="28" y="78" class="s">相邻值只变化 1</text>
    <g transform="translate(28 104)">
      <g fill="#ccfbf1" stroke="#5eead4">
        <rect width="50" height="48" rx="10"/><rect x="56" width="50" height="48" rx="10"/>
        <rect x="112" width="50" height="48" rx="10"/><rect x="168" width="50" height="48" rx="10"/>
        <rect x="224" width="50" height="48" rx="10"/><rect x="280" width="50" height="48" rx="10"/>
        <rect x="336" width="50" height="48" rx="10"/><rect x="392" width="50" height="48" rx="10"/>
      </g>
      <g class="n" text-anchor="middle">
        <text x="25" y="30">100</text><text x="81" y="30">101</text><text x="137" y="30">102</text><text x="193" y="30">103</text>
        <text x="249" y="30">104</text><text x="305" y="30">105</text><text x="361" y="30">106</text><text x="417" y="30">107</text>
      </g>
    </g>
    <path d="M253 174 V218" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="276" y="205" class="s">一阶差分</text>
    <g transform="translate(60 238)">
      <g fill="#dcfce7" stroke="#86efac">
        <rect width="48" height="48" rx="10"/><rect x="54" width="48" height="48" rx="10"/><rect x="108" width="48" height="48" rx="10"/>
        <rect x="162" width="48" height="48" rx="10"/><rect x="216" width="48" height="48" rx="10"/><rect x="270" width="48" height="48" rx="10"/>
        <rect x="324" width="48" height="48" rx="10"/>
      </g>
      <g class="n" text-anchor="middle">
        <text x="24" y="30">+1</text><text x="78" y="30">+1</text><text x="132" y="30">+1</text><text x="186" y="30">+1</text>
        <text x="240" y="30">+1</text><text x="294" y="30">+1</text><text x="348" y="30">+1</text>
      </g>
    </g>
    <rect x="28" y="318" width="450" height="40" rx="12" fill="#ecfdf5"/>
    <text x="253" y="344" text-anchor="middle" class="s" style="font-weight:700;fill:#047857">残差只有一种：分布高度集中，容易编码</text>
  </g>

  <g transform="translate(646 132)">
    <rect class="card" width="506" height="382" rx="24"/>
    <rect width="506" height="12" rx="6" fill="#fb7185"/>
    <text x="28" y="52" class="t">局部被打乱</text>
    <text x="28" y="78" class="s">数值和频次没变，相邻关系变了</text>
    <g transform="translate(28 104)">
      <g fill="#ffe4e6" stroke="#fda4af">
        <rect width="50" height="48" rx="10"/><rect x="56" width="50" height="48" rx="10"/>
        <rect x="112" width="50" height="48" rx="10"/><rect x="168" width="50" height="48" rx="10"/>
        <rect x="224" width="50" height="48" rx="10"/><rect x="280" width="50" height="48" rx="10"/>
        <rect x="336" width="50" height="48" rx="10"/><rect x="392" width="50" height="48" rx="10"/>
      </g>
      <g class="n" text-anchor="middle">
        <text x="25" y="30">100</text><text x="81" y="30">107</text><text x="137" y="30">101</text><text x="193" y="30">106</text>
        <text x="249" y="30">102</text><text x="305" y="30">105</text><text x="361" y="30">103</text><text x="417" y="30">104</text>
      </g>
    </g>
    <path d="M253 174 V218" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="276" y="205" class="s">一阶差分</text>
    <g transform="translate(60 238)">
      <g fill="#fff1f2" stroke="#fda4af">
        <rect width="48" height="48" rx="10"/><rect x="54" width="48" height="48" rx="10"/><rect x="108" width="48" height="48" rx="10"/>
        <rect x="162" width="48" height="48" rx="10"/><rect x="216" width="48" height="48" rx="10"/><rect x="270" width="48" height="48" rx="10"/>
        <rect x="324" width="48" height="48" rx="10"/>
      </g>
      <g class="n" text-anchor="middle">
        <text x="24" y="30">+7</text><text x="78" y="30">−6</text><text x="132" y="30">+5</text><text x="186" y="30">−4</text>
        <text x="240" y="30">+3</text><text x="294" y="30">−2</text><text x="348" y="30">+1</text>
      </g>
    </g>
    <rect x="28" y="318" width="450" height="40" rx="12" fill="#fff1f2"/>
    <text x="253" y="344" text-anchor="middle" class="s" style="font-weight:700;fill:#be123c">残差有七种：分布分散，编码成本更高</text>
  </g>

  <g transform="translate(258 552)">
    <rect width="684" height="36" rx="18" fill="#e0f2fe"/>
    <text x="342" y="24" text-anchor="middle" class="s" style="font-weight:700;fill:#075985">关键：两边零阶熵相同，条件熵与差分后的熵不同</text>
  </g>
</svg>
