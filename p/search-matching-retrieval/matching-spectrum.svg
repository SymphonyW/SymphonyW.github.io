<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Search capability spectrum</title>
  <desc id="desc">A spectrum from exact lexical matching through fuzzy matching to semantic vector retrieval.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e79a7"/>
      <stop offset="0.5" stop-color="#f28e2b"/>
      <stop offset="1" stop-color="#59a14f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b4557" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1100" height="520" rx="28" fill="#f8fbfc"/>
  <text x="70" y="76" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">三类检索的能力光谱</text>
  <text x="72" y="113" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">从“字面完全一致”逐步走向“意思接近也能找到”</text>

  <line x1="126" y1="250" x2="972" y2="250" stroke="url(#line)" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="210" cy="250" r="18" fill="#4e79a7"/>
    <circle cx="550" cy="250" r="18" fill="#f28e2b"/>
    <circle cx="890" cy="250" r="18" fill="#59a14f"/>
  </g>

  <g transform="translate(92 310)" filter="url(#shadow)">
    <rect width="240" height="132" rx="18" fill="#ffffff"/>
    <text x="24" y="38" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">关键字匹配</text>
    <text x="24" y="75" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">“退款政策”</text>
    <text x="24" y="104" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">匹配含有这些词的文档</text>
  </g>
  <g transform="translate(430 310)" filter="url(#shadow)">
    <rect width="240" height="132" rx="18" fill="#ffffff"/>
    <text x="24" y="38" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">模糊搜索</text>
    <text x="24" y="75" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">“退宽政策”</text>
    <text x="24" y="104" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">仍可能召回“退款政策”</text>
  </g>
  <g transform="translate(768 310)" filter="url(#shadow)">
    <rect width="240" height="132" rx="18" fill="#ffffff"/>
    <text x="24" y="38" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">向量检索</text>
    <text x="24" y="75" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">“买了还能反悔吗”</text>
    <text x="24" y="104" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">找到退货、撤销、售后规则</text>
  </g>

  <g fill="#708391" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
    <text x="142" y="206">词面精确</text>
    <text x="492" y="206">容错变体</text>
    <text x="824" y="206">语义相似</text>
  </g>
</svg>
