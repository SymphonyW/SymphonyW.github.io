<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Search method decision map</title>
  <desc id="desc">Decision matrix for keyword matching, fuzzy search, vector retrieval, and hybrid retrieval.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24384a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="560" rx="28" fill="#fbfcfd"/>
  <text x="70" y="70" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">选型速查图</text>
  <text x="72" y="108" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">看“用户输入是否明确”和“结果是否必须可控”</text>

  <line x1="164" y1="458" x2="938" y2="458" stroke="#8fa2b0" stroke-width="3"/>
  <line x1="164" y1="458" x2="164" y2="154" stroke="#8fa2b0" stroke-width="3"/>
  <text x="420" y="506" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">输入从明确到模糊</text>
  <text x="72" y="330" fill="#506474" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" transform="rotate(-90 72 330)">结果控制要求</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="214" y="330" width="210" height="92" rx="18" fill="#ffffff"/>
    <rect x="214" y="330" width="12" height="92" rx="6" fill="#4e79a7"/>
    <text x="244" y="365" fill="#1f2d3d" font-size="23" font-weight="750">关键字匹配</text>
    <text x="244" y="395" fill="#5c6f7e" font-size="16">编号、术语、标签</text>

    <rect x="468" y="292" width="210" height="92" rx="18" fill="#ffffff"/>
    <rect x="468" y="292" width="12" height="92" rx="6" fill="#f28e2b"/>
    <text x="498" y="327" fill="#1f2d3d" font-size="23" font-weight="750">模糊搜索</text>
    <text x="498" y="357" fill="#5c6f7e" font-size="16">错别字、拼写、补全</text>

    <rect x="704" y="190" width="210" height="92" rx="18" fill="#ffffff"/>
    <rect x="704" y="190" width="12" height="92" rx="6" fill="#59a14f"/>
    <text x="734" y="225" fill="#1f2d3d" font-size="23" font-weight="750">向量检索</text>
    <text x="734" y="255" fill="#5c6f7e" font-size="16">语义问答、相似推荐</text>

    <rect x="486" y="166" width="210" height="92" rx="18" fill="#ffffff"/>
    <rect x="486" y="166" width="12" height="92" rx="6" fill="#7b68ee"/>
    <text x="516" y="201" fill="#1f2d3d" font-size="23" font-weight="750">混合检索</text>
    <text x="516" y="231" fill="#5c6f7e" font-size="16">电商、企业搜索、RAG</text>
  </g>

  <text x="156" y="490" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">明确</text>
  <text x="908" y="490" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">模糊</text>
  <text x="124" y="462" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">高</text>
  <text x="124" y="164" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">更高</text>
</svg>
