<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Inverted index flow</title>
  <desc id="desc">Keyword search tokenizes documents and maps terms to document ids in an inverted index.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#203449" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4e79a7"/>
    </marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#f8fbff"/>
  <text x="70" y="70" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">关键字匹配：倒排索引把“词”指向“文档”</text>
  <text x="72" y="108" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">适合明确字段、术语、编号、标签和短文本检索</text>

  <g transform="translate(72 166)" filter="url(#shadow)">
    <rect width="270" height="250" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">原始文档</text>
    <rect x="24" y="72" width="222" height="44" rx="10" fill="#e9f1fa"/>
    <text x="42" y="100" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">D1: 退款政策说明</text>
    <rect x="24" y="130" width="222" height="44" rx="10" fill="#e9f1fa"/>
    <text x="42" y="158" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">D2: 会员积分规则</text>
    <rect x="24" y="188" width="222" height="44" rx="10" fill="#e9f1fa"/>
    <text x="42" y="216" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">D3: 退货运费标准</text>
  </g>

  <line x1="363" y1="290" x2="460" y2="290" stroke="#4e79a7" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(478 166)" filter="url(#shadow)">
    <rect width="210" height="250" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">分词与归一化</text>
    <rect x="24" y="76" width="162" height="36" rx="18" fill="#dfeaf5"/>
    <text x="58" y="100" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">退款</text>
    <rect x="24" y="126" width="162" height="36" rx="18" fill="#dfeaf5"/>
    <text x="58" y="150" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">退货</text>
    <rect x="24" y="176" width="162" height="36" rx="18" fill="#dfeaf5"/>
    <text x="58" y="200" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">政策</text>
  </g>

  <line x1="710" y1="290" x2="807" y2="290" stroke="#4e79a7" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(825 146)" filter="url(#shadow)">
    <rect width="220" height="292" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">倒排表</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
      <rect x="24" y="72" width="172" height="38" rx="8" fill="#edf4fb"/>
      <text x="40" y="97" fill="#33485a">退款 → D1</text>
      <rect x="24" y="124" width="172" height="38" rx="8" fill="#edf4fb"/>
      <text x="40" y="149" fill="#33485a">政策 → D1, D3</text>
      <rect x="24" y="176" width="172" height="38" rx="8" fill="#edf4fb"/>
      <text x="40" y="201" fill="#33485a">积分 → D2</text>
      <rect x="24" y="228" width="172" height="38" rx="8" fill="#edf4fb"/>
      <text x="40" y="253" fill="#33485a">运费 → D3</text>
    </g>
  </g>

  <g transform="translate(214 476)">
    <rect width="674" height="70" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="28" y="43" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">查询“退款政策” → 合并词项命中 → 用 TF-IDF / BM25 / 字段权重排序</text>
  </g>
</svg>
