<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid retrieval stack</title>
  <desc id="desc">A practical production retrieval stack combines filters, keyword retrieval, vector retrieval, reranking, and generation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#273746" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#426579"/>
    </marker>
  </defs>
  <rect width="1100" height="620" rx="28" fill="#f8f9fb"/>
  <text x="70" y="70" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">生产系统常见做法：混合检索</text>
  <text x="72" y="108" fill="#5f7281" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">不是三选一，而是按业务约束把它们串成一条更稳的流水线</text>

  <g transform="translate(74 172)" filter="url(#shadow)">
    <rect width="178" height="104" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">结构化过滤</text>
    <text x="24" y="73" fill="#586c7a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">权限 / 类目 / 时间</text>
  </g>
  <line x1="274" y1="224" x2="332" y2="224" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(354 146)" filter="url(#shadow)">
    <rect width="190" height="104" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">关键字召回</text>
    <text x="24" y="73" fill="#586c7a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">BM25 / 字段权重</text>
  </g>
  <g transform="translate(354 280)" filter="url(#shadow)">
    <rect width="190" height="104" rx="18" fill="#ffffff"/>
    <text x="24" y="42" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">向量召回</text>
    <text x="24" y="73" fill="#586c7a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">语义相似 Top-K</text>
  </g>
  <line x1="565" y1="198" x2="668" y2="248" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="565" y1="332" x2="668" y2="280" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(690 210)" filter="url(#shadow)">
    <rect width="168" height="112" rx="18" fill="#ffffff"/>
    <text x="24" y="45" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">融合排序</text>
    <text x="24" y="77" fill="#586c7a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">RRF / 加权分数</text>
  </g>
  <line x1="880" y1="266" x2="936" y2="266" stroke="#426579" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(958 210)" filter="url(#shadow)">
    <rect width="172" height="112" rx="18" fill="#ffffff"/>
    <text x="24" y="45" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">重排序</text>
    <text x="24" y="77" fill="#586c7a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Cross-encoder</text>
  </g>

  <g transform="translate(120 452)">
    <rect width="860" height="92" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="38" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">经验公式：能精确过滤的先过滤；需要准确术语的用关键字；问法发散的用向量；最后交给重排器和业务规则收口。</text>
    <text x="30" y="68" fill="#33485a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">如果接 RAG，再把排序后的少量片段送进 Prompt，控制噪声、成本和可溯源性。</text>
  </g>
</svg>
