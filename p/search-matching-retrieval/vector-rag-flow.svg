<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Vector retrieval and RAG flow</title>
  <desc id="desc">Documents are chunked and embedded into a vector database; user questions are embedded, retrieved, and inserted into an LLM prompt.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#203b2d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4a8f52"/>
    </marker>
  </defs>
  <rect width="1100" height="660" rx="28" fill="#f6fbf6"/>
  <text x="70" y="70" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">向量检索与 RAG：把“意思”变成可搜索的坐标</text>
  <text x="72" y="108" fill="#5e725f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">适合问法多变、同义表达多、知识库内容需要被大模型引用的场景</text>

  <g transform="translate(74 160)" filter="url(#shadow)">
    <rect width="210" height="118" rx="18" fill="#ffffff"/>
    <text x="24" y="43" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">文档</text>
    <text x="24" y="78" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">PDF / 网页 / Markdown</text>
  </g>
  <line x1="305" y1="219" x2="385" y2="219" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(405 160)" filter="url(#shadow)">
    <rect width="210" height="118" rx="18" fill="#ffffff"/>
    <text x="24" y="43" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">切分 Chunk</text>
    <text x="24" y="78" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">保留标题、来源、段落</text>
  </g>
  <line x1="636" y1="219" x2="716" y2="219" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(736 160)" filter="url(#shadow)">
    <rect width="210" height="118" rx="18" fill="#ffffff"/>
    <text x="24" y="43" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">Embedding</text>
    <text x="24" y="78" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">文本 → 高维向量</text>
  </g>
  <line x1="841" y1="298" x2="841" y2="368" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(719 388)" filter="url(#shadow)">
    <rect width="244" height="126" rx="18" fill="#ffffff"/>
    <text x="26" y="44" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">向量数据库</text>
    <text x="26" y="79" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">HNSW / IVF / PQ</text>
  </g>

  <g transform="translate(74 388)" filter="url(#shadow)">
    <rect width="222" height="126" rx="18" fill="#ffffff"/>
    <text x="24" y="44" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">用户问题</text>
    <text x="24" y="79" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">“买了还能反悔吗”</text>
  </g>
  <line x1="318" y1="451" x2="402" y2="451" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(422 388)" filter="url(#shadow)">
    <rect width="210" height="126" rx="18" fill="#ffffff"/>
    <text x="24" y="44" fill="#1f2d3d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">查询向量</text>
    <text x="24" y="79" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">同一模型编码</text>
  </g>
  <line x1="654" y1="451" x2="699" y2="451" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="841" y1="514" x2="841" y2="572" stroke="#4a8f52" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(544 584)">
    <rect width="594" height="54" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    <text x="26" y="35" fill="#365344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Top-K 片段 + 引用来源 → Prompt → LLM 生成有上下文的回答</text>
  </g>

  <g transform="translate(86 552)">
    <text x="0" y="0" fill="#5e725f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">RAG 的关键风险：切分太碎、向量模型不匹配、Top-K 不合适、噪声片段未重排。</text>
  </g>
</svg>
