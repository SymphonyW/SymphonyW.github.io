<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <radialGradient id="gauss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">单个 3D 高斯的解剖：5 类可优化属性</text>

  <!-- center gaussian blob -->
  <ellipse cx="600" cy="320" rx="180" ry="120" fill="url(#gauss)" stroke="#be185d" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="320" r="6" fill="#1e293b"/>
  <text x="612" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e293b">μ (中心)</text>

  <!-- scale arrows -->
  <line x1="600" y1="320" x2="780" y2="320" stroke="#0ea5e9" stroke-width="3"/>
  <polygon points="780,320 770,314 770,326" fill="#0ea5e9"/>
  <text x="700" y="312" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0369a1">scale s (3)</text>
  <line x1="600" y1="320" x2="600" y2="200" stroke="#0ea5e9" stroke-width="3"/>
  <polygon points="600,200 594,210 606,210" fill="#0ea5e9"/>
  <line x1="600" y1="320" x2="500" y2="420" stroke="#0ea5e9" stroke-width="3"/>
  <polygon points="500,420 510,416 506,406" fill="#0ea5e9"/>

  <!-- rotation arc -->
  <path d="M 700 260 A 80 80 0 0 1 760 350" fill="none" stroke="#a855f7" stroke-width="3"/>
  <text x="745" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7e22ce">rotation q (4)</text>

  <!-- attribute cards around -->
  <!-- top-left: position -->
  <g transform="translate(40,110)">
    <rect width="220" height="100" rx="12" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">📍 位置 Position</text>
    <text x="14" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">μ = (x, y, z) — 3 个浮点</text>
    <text x="14" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">高斯椭球的中心坐标</text>
    <text x="14" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">直接优化，无激活函数</text>
  </g>
  <!-- top-middle: opacity -->
  <g transform="translate(290,110)">
    <rect width="220" height="100" rx="12" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">🌫️ 不透明度 Opacity</text>
    <text x="14" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">α = σ(o) — 1 个浮点</text>
    <text x="14" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">经 sigmoid 映射到 [0,1]</text>
    <text x="14" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">剪枝的关键判据</text>
  </g>
  <!-- top-right: SH color -->
  <g transform="translate(540,110)">
    <rect width="220" height="100" rx="12" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">🌈 颜色 Color (SH)</text>
    <text x="14" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">球谐系数 3 阶 — 48 个</text>
    <text x="14" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">表达与视角相关的颜色</text>
    <text x="14" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">高光/反射可被建模</text>
  </g>
  <!-- top-right2: scale -->
  <g transform="translate(790,110)">
    <rect width="220" height="100" rx="12" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">📏 缩放 Scale</text>
    <text x="14" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">s = (s₀,s₁,s₂) — 3 个</text>
    <text x="14" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">指数激活保证非负</text>
    <text x="14" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">控制椭球大小</text>
  </g>
  <!-- rightmost: rotation -->
  <g transform="translate(950,230)">
    <rect width="220" height="100" rx="12" fill="url(#card)" stroke="#cbd5e1"/>
    <text x="14" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e293b">🔄 旋转 Rotation</text>
    <text x="14" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">q = (q₀,q₁,q₂,q₃) — 4 个</text>
    <text x="14" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">单位四元数，归一化使用</text>
    <text x="14" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">控制椭球朝向</text>
  </g>

  <!-- covariance formula bottom -->
  <g transform="translate(60,470)">
    <rect width="1080" height="70" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="30" y="30" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#4338ca">协方差矩阵的参数化：避免学习到非正定的 Σ</text>
    <text x="30" y="55" font-family="Consolas,Menlo,monospace" font-size="14" fill="#1e293b">Σ = R · diag(s) · diag(s)ᵀ · Rᵀ    ⇒    始终半正定，可微，且只引入 7 个参数（而非 9 个）</text>
  </g>
</svg>
