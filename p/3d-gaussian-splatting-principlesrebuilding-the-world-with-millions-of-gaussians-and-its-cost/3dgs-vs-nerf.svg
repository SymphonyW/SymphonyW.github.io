<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="nerf" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="gs" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#065f46"/></linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">NeRF vs 3DGS：两种范式的对决</text>

  <!-- NeRF column -->
  <g transform="translate(80,90)">
    <rect width="480" height="500" rx="16" fill="url(#nerf)"/>
    <text x="240" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">NeRF · 隐式表示</text>
    <text x="240" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">用一个 MLP 把 (x,d) → (c,σ)</text>

    <g transform="translate(20,100)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">✅ 优点</text>
      <text x="0" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 模型紧凑（MB 级）</text>
      <text x="0" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 表达连续场，理论上无上限</text>
      <text x="0" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 几何平滑，无悬浮物</text>
    </g>

    <g transform="translate(20,210)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">❌ 痛点</text>
      <text x="0" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 渲染极慢：每像素要采样几十~几百条射线</text>
      <text x="0" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 训练也慢，几小时起步</text>
      <text x="0" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 体素密度场有偏，容易模糊</text>
      <text x="0" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">• 难做交互式编辑</text>
    </g>

    <g transform="translate(20,350)">
      <rect width="440" height="120" rx="10" fill="#4c1d95" opacity="0.6"/>
      <text x="20" y="26" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">渲染管线（每像素）：</text>
      <text x="20" y="50" font-family="Consolas,Menlo,monospace" font-size="12" fill="#ddd6fe">射线 r = o + t·d</text>
      <text x="20" y="70" font-family="Consolas,Menlo,monospace" font-size="12" fill="#ddd6fe">→ 在射线上采样 N 个点 → 全喂给 MLP</text>
      <text x="20" y="90" font-family="Consolas,Menlo,monospace" font-size="12" fill="#ddd6fe">→ 体渲染积分累加 C(r)</text>
      <text x="20" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ede9fe">推理一次就要几秒~几十秒 / 张图</text>
    </g>
  </g>

  <!-- 3DGS column -->
  <g transform="translate(640,90)">
    <rect width="480" height="500" rx="16" fill="url(#gs)"/>
    <text x="240" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">3DGS · 显式表示</text>
    <text x="240" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">一组 3D 高斯，渲染时直接光栅化</text>

    <g transform="translate(20,100)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">✅ 优点</text>
      <text x="0" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 实时渲染：100+ FPS @ 1080p</text>
      <text x="0" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 表达力强，重建质量高</text>
      <text x="0" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 推理无神经网络，全 GPU 光栅化</text>
      <text x="0" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 易于编辑、变换、剪枝</text>
    </g>

    <g transform="translate(20,250)">
      <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">❌ 痛点</text>
      <text x="0" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 单场景需几百 MB ~ 数 GB</text>
      <text x="0" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 必须每场景重新训练</text>
      <text x="0" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 浮点 / "弹出"伪影</text>
      <text x="0" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">• 对 SfM 质量敏感</text>
    </g>

    <g transform="translate(20,390)">
      <rect width="440" height="80" rx="10" fill="#064e3b" opacity="0.6"/>
      <text x="20" y="26" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">渲染管线（一次性）：</text>
      <text x="20" y="50" font-family="Consolas,Menlo,monospace" font-size="12" fill="#a7f3d0">高斯 → 投影 2D → Tile + 排序 → α 混合 → 像素</text>
      <text x="20" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#d1fae5">训练约 30-45 分钟 / 场景</text>
    </g>
  </g>
</svg>
