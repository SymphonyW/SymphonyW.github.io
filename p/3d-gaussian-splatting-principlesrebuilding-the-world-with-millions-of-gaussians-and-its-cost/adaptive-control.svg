<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="ad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="ad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="ad3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">自适应密度控制：3DGS 训练的灵魂</text>
  <text x="600" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">每 100 次迭代触发一次密度调整，根据"位置梯度"和"大小"决定克隆、分裂还是剪枝</text>

  <!-- center: the optimizer -->
  <g transform="translate(440,180)">
    <rect width="320" height="140" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="40" text-anchor="middle" font-size="32">⚙️</text>
    <text x="160" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">梯度优化 + 损失监控</text>
    <text x="160" y="98" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">每 100 步统计每个高斯</text>
    <text x="160" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">的位置梯度 ‖∇μ‖ 与平均大小</text>
  </g>

  <!-- Clone -->
  <g transform="translate(40,400)">
    <rect width="360" height="140" rx="14" fill="url(#ad1)"/>
    <text x="20" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">🌱 克隆 Clone</text>
    <text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">触发：小高斯 + 位置梯度大</text>
    <text x="20" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">含义：欠重建区域，需要更多高斯</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#d1fae5">动作：复制一份并随机位移</text>
    <text x="20" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#a7f3d0">→ 把"未捕获到的几何"复制到附近</text>
  </g>

  <!-- Split -->
  <g transform="translate(420,400)">
    <rect width="360" height="140" rx="14" fill="url(#ad2)"/>
    <text x="20" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">✂️ 分裂 Split</text>
    <text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">触发：大高斯 + 位置梯度大</text>
    <text x="20" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">含义：一个高斯覆盖太大区域，需细分</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbeafe">动作：替换为 2 个更小的高斯</text>
    <text x="20" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#bfdbfe">→ 大椭球用采样替代，再缩小</text>
  </g>

  <!-- Prune -->
  <g transform="translate(800,400)">
    <rect width="360" height="140" rx="14" fill="url(#ad3)"/>
    <text x="20" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">🧹 剪枝 Prune</text>
    <text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">触发：α &lt; ε 或 超大 / 重置的 SH</text>
    <text x="20" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">含义：该高斯对渲染几乎没贡献</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">动作：直接删除</text>
    <text x="20" y="124" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fecaca">→ 同时清掉"逃逸"的离群点</text>
  </g>

  <!-- arrows from center to three -->
  <path d="M 540 320 Q 380 360 220 400" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 600 320 Q 600 360 600 400" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arr3)"/>
  <path d="M 660 320 Q 820 360 980 400" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arr3)"/>

  <!-- top: trigger -->
  <g transform="translate(440,110)">
    <rect width="320" height="50" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="160" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#92400e">📊 周期性密度调整 (每 100 iter)</text>
  </g>
  <line x1="600" y1="160" x2="600" y2="180" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr3)"/>

  <!-- bottom: result -->
  <g transform="translate(340,560)">
    <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">三项操作让高斯数量从初始几万 → 几百万，自动匹配场景复杂度，是 3DGS 拟合能力的核心来源。</text>
  </g>
</svg>
