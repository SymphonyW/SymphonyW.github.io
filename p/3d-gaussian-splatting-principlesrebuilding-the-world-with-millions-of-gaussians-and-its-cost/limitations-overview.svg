<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#a16207"/></linearGradient>
    <linearGradient id="l4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="l5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="l6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#9d174d"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">3DGS 的六大缺陷全景</text>
  <text x="600" y="74" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">这些缺陷催生了大量后续工作：压缩、泛化、动态、抗伪影</text>

  <!-- 6 cards in 2x3 -->
  <!-- 1. Storage -->
  <g transform="translate(40,110)">
    <rect width="360" height="220" rx="14" fill="url(#l1)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">① 存储爆炸</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">单高斯 ≈ 59 个 float ≈ 236B</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">百万级高斯 → 200~700MB / 场景</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fee2e2">无法直接上移动端 / Web</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fee2e2">LightGaussian / CompGS /</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fee2e2">SOG / 3DGS 量化剪枝</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-style="italic" fill="#fecaca">目标：10×~50× 压缩比</text>
  </g>

  <!-- 2. Train cost -->
  <g transform="translate(420,110)">
    <rect width="360" height="220" rx="14" fill="url(#l2)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">② 训练不算快</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ffedd5">单场景 30~45 分钟</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ffedd5">需 24GB+ 显存（百万高斯）</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ffedd5">密度膨胀期显存占用飙升</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ffedd5">Mip-Splatting / AbsGrad /</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ffedd5">Warm-start 初始化策略</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-style="italic" fill="#fed7aa">目标：分钟级训练 + 抗膨胀</text>
  </g>

  <!-- 3. No generalization -->
  <g transform="translate(800,110)">
    <rect width="360" height="220" rx="14" fill="url(#l3)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">③ 无法泛化</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fef3c7">每个场景独立训练</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fef3c7">不能"喂一张新图就出模型"</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fef3c7">少样本下质量崩塌</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">PixelSplat / MVSplat /</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef3c7">Splatter Image / LRM-Gauss</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-style="italic" fill="#fde68a">目标：前馈网络 1 秒推理</text>
  </g>

  <!-- 4. Artifacts -->
  <g transform="translate(40,360)">
    <rect width="360" height="220" rx="14" fill="url(#l4)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">④ 视觉伪影</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">悬浮高斯 / "飞虫"</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">视角切换时"弹出"伪影</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#ede9fe">放大缩小时锯齿严重</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ede9fe">Mip-Splatting（3D 平滑滤波）/</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ede9fe">3DGS 正则化约束 /</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ede9fe">深度一致性损失</text>
  </g>

  <!-- 5. Dynamic -->
  <g transform="translate(420,360)">
    <rect width="360" height="220" rx="14" fill="url(#l5)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">⑤ 动态场景弱</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#cffafe">原版仅支持静态场景</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#cffafe">运动物体 / 长视频难以建模</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#cffafe">时间一致性差</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#cffafe">4DGS / Deformable 3DGS /</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#cffafe">Dynamic 3D Gaussians /</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#cffafe">SC-GS</text>
  </g>

  <!-- 6. Sensitivity -->
  <g transform="translate(800,360)">
    <rect width="360" height="220" rx="14" fill="url(#l6)"/>
    <text x="20" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">⑥ 鲁棒性弱</text>
    <text x="20" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">强依赖 SfM 点云质量</text>
    <text x="20" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">纹理稀疏区域重建失败</text>
    <text x="20" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fce7f3">大场景下漂移、断点</text>
    <text x="20" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">→ 后续工作：</text>
    <text x="20" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fce7f3">无 SfM 初始化 / 深度监督 /</text>
    <text x="20" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fce7f3">多源融合 / GS-SLAM 类</text>
    <text x="20" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-style="italic" fill="#fbcfe8">目标：摆脱对 COLMAP 的依赖</text>
  </g>

  <text x="600" y="612" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">原论文本身就公开了这些局限，3DGS 后续生态 = 一场大规模的"打补丁"运动。</text>
</svg>
