<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Delivery responsibilities and artifact flow</title><desc id="desc">GitLab schedules jobs, Runner executes them, the registry stores images, Helm applies a release and Kubernetes reconciles it. Production reuses staging's image digest and chart.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#506c85" stroke-width="2"/></marker></defs>
<rect width="1200" height="780" rx="24" fill="#f1f5fa"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="52" y="68" fill="#152e48" font-size="34" font-weight="700">One delivery chain, distinct responsibilities</text>
<g fill="#fff" stroke="#bdcddd" stroke-width="2"><rect x="52" y="114" width="310" height="124" rx="14"/><rect x="445" y="114" width="310" height="124" rx="14"/><rect x="838" y="114" width="310" height="124" rx="14"/></g>
<g fill="#152e48" text-anchor="middle" font-size="30" font-weight="600"><text x="207" y="162">Git commit / MR</text><text x="600" y="162">GitLab</text><text x="993" y="162">Runner</text></g>
<g fill="#526d83" text-anchor="middle" font-size="23"><text x="207" y="205">source + pipeline config</text><text x="600" y="205">rules + DAG + job queue</text><text x="993" y="205">isolated job execution</text></g>
<g fill="none" stroke="#506c85" stroke-width="3" marker-end="url(#a)"><path d="M374 176h58"/><path d="M767 176h58"/><path d="M993 250v42H230v46"/></g>
<g fill="#e4f3ef" stroke="#5a9b8a" stroke-width="2"><rect x="52" y="352" width="350" height="146" rx="14"/><rect x="445" y="352" width="310" height="146" rx="14"/><rect x="838" y="352" width="310" height="146" rx="14"/></g>
<g text-anchor="middle"><g fill="#174c44" font-size="29" font-weight="600"><text x="227" y="400">Image + chart package</text><text x="600" y="400">Helm</text><text x="993" y="400">Kubernetes</text></g><g fill="#3c6961" font-size="23"><text x="227" y="441">registry digest + .tgz</text><text x="227" y="474">immutable release inputs</text><text x="600" y="441">templates + values</text><text x="600" y="474">release revision</text><text x="993" y="441">Deployment → Pod</text><text x="993" y="474">continuous reconciliation</text></g></g>
<g fill="none" stroke="#506c85" stroke-width="3" marker-end="url(#a)"><path d="M414 425h18"/><path d="M767 425h58"/></g>
<rect x="52" y="554" width="1096" height="168" rx="16" fill="#152e48"/>
<g text-anchor="middle"><g fill="#fff" font-size="28" font-weight="600"><text x="255" y="609">STAGING</text><text x="600" y="609">MANUAL GATE</text><text x="945" y="609">PRODUCTION</text></g><g fill="#a9d6cf" font-size="24"><text x="255" y="654">rollout + smoke test</text><text x="600" y="654">release decision</text><text x="945" y="654">rollout + smoke test</text></g><text x="600" y="698" fill="#d4e3ef" font-size="23">Same image digest + same chart package; environment values may differ.</text></g>
<g fill="none" stroke="#99cbc2" stroke-width="3" marker-end="url(#a)"><path d="M390 606h45"/><path d="M767 606h45"/></g>
</g></svg>
