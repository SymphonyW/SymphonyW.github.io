<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">责任划分矩阵：谁在管哪一层</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">蓝色 = 用户负责，灰色 = 厂商负责</text>

  <!-- 表头 -->
  <g transform="translate(80,110)">
    <!-- 列名行 -->
    <rect x="0" y="0" width="240" height="56" fill="#1e293b"/>
    <rect x="240" y="0" width="200" height="56" fill="#1e293b"/>
    <rect x="440" y="0" width="200" height="56" fill="#1e293b"/>
    <rect x="640" y="0" width="200" height="56" fill="#1e293b"/>
    <rect x="840" y="0" width="200" height="56" fill="#1e293b"/>
    <text x="120" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">层级</text>
    <text x="340" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">On-Prem</text>
    <text x="540" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">IaaS</text>
    <text x="740" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">PaaS</text>
    <text x="940" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">SaaS</text>

    <!-- 应用层 -->
    <rect x="0" y="56" width="240" height="56" fill="#f1f5f9"/>
    <rect x="240" y="56" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="56" width="200" height="56" fill="#3b82f6"/>
    <rect x="640" y="56" width="200" height="56" fill="#3b82f6"/>
    <rect x="840" y="56" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">应用（App）</text>
    <text x="340" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="740" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="940" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 数据层 -->
    <rect x="0" y="112" width="240" height="56" fill="#f8fafc"/>
    <rect x="240" y="112" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="112" width="200" height="56" fill="#3b82f6"/>
    <rect x="640" y="112" width="200" height="56" fill="#3b82f6"/>
    <rect x="840" y="112" width="200" height="56" fill="#3b82f6"/>
    <text x="120" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">数据（Data）</text>
    <text x="340" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="740" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="940" y="146" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管（数据归你）</text>

    <!-- 运行时 -->
    <rect x="0" y="168" width="240" height="56" fill="#f1f5f9"/>
    <rect x="240" y="168" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="168" width="200" height="56" fill="#3b82f6"/>
    <rect x="640" y="168" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="168" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">运行时（Runtime/中间件）</text>
    <text x="340" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="740" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- OS -->
    <rect x="0" y="224" width="240" height="56" fill="#f8fafc"/>
    <rect x="240" y="224" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="224" width="200" height="56" fill="#3b82f6"/>
    <rect x="640" y="224" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="224" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">操作系统（OS）</text>
    <text x="340" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="740" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 虚拟化 -->
    <rect x="0" y="280" width="240" height="56" fill="#f1f5f9"/>
    <rect x="240" y="280" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="280" width="200" height="56" fill="#cbd5e1"/>
    <rect x="640" y="280" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="280" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="314" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">虚拟化（Hypervisor）</text>
    <text x="340" y="314" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="314" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="740" y="314" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="314" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 服务器 -->
    <rect x="0" y="336" width="240" height="56" fill="#f8fafc"/>
    <rect x="240" y="336" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="336" width="200" height="56" fill="#cbd5e1"/>
    <rect x="640" y="336" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="336" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">服务器硬件</text>
    <text x="340" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="740" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 网络 -->
    <rect x="0" y="392" width="240" height="56" fill="#f1f5f9"/>
    <rect x="240" y="392" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="392" width="200" height="56" fill="#cbd5e1"/>
    <rect x="640" y="392" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="392" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">网络与存储</text>
    <text x="340" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="740" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="426" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 机房设施 -->
    <rect x="0" y="448" width="240" height="56" fill="#f8fafc"/>
    <rect x="240" y="448" width="200" height="56" fill="#3b82f6"/>
    <rect x="440" y="448" width="200" height="56" fill="#cbd5e1"/>
    <rect x="640" y="448" width="200" height="56" fill="#cbd5e1"/>
    <rect x="840" y="448" width="200" height="56" fill="#cbd5e1"/>
    <text x="120" y="482" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0f172a">机房设施（电/空调/安防）</text>
    <text x="340" y="482" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff">你管</text>
    <text x="540" y="482" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="740" y="482" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>
    <text x="940" y="482" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">厂商</text>

    <!-- 表格边框 -->
    <rect x="0" y="0" width="240" height="504" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="240" y="0" width="200" height="504" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="440" y="0" width="200" height="504" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="640" y="0" width="200" height="504" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="840" y="0" width="200" height="504" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(80,640)">
    <rect x="0" y="0" width="14" height="14" fill="#3b82f6"/>
    <text x="22" y="12" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">用户负责</text>
    <rect x="120" y="0" width="14" height="14" fill="#cbd5e1"/>
    <text x="142" y="12" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1e293b">云厂商负责</text>
    <text x="700" y="12" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">注意：SaaS 中"数据"始终由用户负责，这是合规底线</text>
  </g>
</svg>
