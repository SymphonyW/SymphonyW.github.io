<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">如何选型：从团队规模到业务场景</text>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">没有最好的 XaaS，只有最匹配当前阶段的方案</text>

  <!-- 起点 -->
  <g transform="translate(500,110)">
    <rect x="0" y="0" width="200" height="60" rx="30" fill="#1e293b"/>
    <text x="100" y="38" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">我要做什么？</text>
  </g>
  <line x1="600" y1="170" x2="600" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,200 594,190 606,190" fill="#94a3b8"/>

  <!-- 第一层判断 -->
  <g transform="translate(400,210)">
    <polygon points="200,0 400,60 200,120 0,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">直接用现成软件？</text>
    <text x="200" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">协作/办公/CRM 等通用需求</text>
  </g>

  <!-- 是 -> SaaS -->
  <g transform="translate(60,230)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">选 SaaS</text>
    <text x="100" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">钉钉/飞书/Notion</text>
    <text x="100" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Salesforce/有赞</text>
  </g>
  <line x1="400" y1="270" x2="260" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="260,270 270,264 270,276" fill="#94a3b8"/>
  <text x="330" y="262" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">是</text>

  <!-- 否 -> 继续判断 -->
  <line x1="600" y1="330" x2="600" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,360 594,350 606,350" fill="#94a3b8"/>
  <text x="630" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">否</text>

  <!-- 第二层判断 -->
  <g transform="translate(400,370)">
    <polygon points="200,0 400,60 200,120 0,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">自己写代码？</text>
    <text x="200" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">有定制化业务逻辑</text>
  </g>

  <!-- 是 -> 进入开发分支 -->
  <line x1="600" y1="490" x2="600" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,520 594,510 606,510" fill="#94a3b8"/>
  <text x="630" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">是</text>

  <!-- 第三层判断 -->
  <g transform="translate(400,530)">
    <polygon points="200,0 400,60 200,120 0,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">前端/移动端为主？</text>
    <text x="200" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">后端只是 CRUD + 登录</text>
  </g>

  <!-- 是 -> BaaS -->
  <g transform="translate(60,550)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9d174d">选 BaaS</text>
    <text x="100" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Firebase / Supabase</text>
    <text x="100" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">微信云开发 / LeanCloud</text>
  </g>
  <line x1="400" y1="590" x2="260" y2="590" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="260,590 270,584 270,596" fill="#94a3b8"/>
  <text x="330" y="582" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">是</text>

  <!-- 否 -> 进入常规后端 -->
  <line x1="600" y1="650" x2="600" y2="680" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,680 594,670 606,670" fill="#94a3b8"/>
  <text x="630" y="670" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">否</text>

  <!-- 第四层判断：常规后端开发 -->
  <g transform="translate(800,210)">
    <polygon points="200,0 400,60 200,120 0,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">事件驱动 + 突发流量？</text>
    <text x="200" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">短时任务，空闲为 0</text>
  </g>

  <!-- 是 -> FaaS -->
  <g transform="translate(940,230)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">选 FaaS</text>
    <text x="100" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">AWS Lambda / 阿里 FC</text>
    <text x="100" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">腾讯 SCF / Workers</text>
  </g>
  <line x1="800" y1="270" x2="730" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="730,270 740,264 740,276" fill="#94a3b8"/>
  <text x="765" y="262" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">是</text>

  <!-- 否 -> 继续判断 PaaS vs IaaS -->
  <line x1="600" y1="330" x2="800" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <line x1="800" y1="270" x2="800" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <text x="765" y="320" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">否</text>

  <!-- PaaS vs IaaS 判断 -->
  <g transform="translate(800,370)">
    <polygon points="200,0 400,60 200,120 0,60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">有专职运维？</text>
    <text x="200" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">需要 OS/网络层控制权</text>
  </g>

  <!-- 是 -> IaaS -->
  <g transform="translate(940,550)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#166534">选 IaaS</text>
    <text x="100" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">EC2 / ECS / CVM</text>
    <text x="100" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">+ 自管 K8s / 数据库</text>
  </g>
  <line x1="1000" y1="490" x2="1000" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="1000,550 994,540 1006,540" fill="#94a3b8"/>
  <text x="1030" y="525" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">是</text>

  <!-- 否 -> PaaS -->
  <g transform="translate(800,550)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">选 PaaS</text>
    <text x="100" y="56" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Vercel / Render / Heroku</text>
    <text x="100" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">阿里云 EDAS / App Engine</text>
  </g>
  <line x1="900" y1="490" x2="900" y2="550" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="900,550 894,540 906,540" fill="#94a3b8"/>
  <text x="870" y="525" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#166534">否</text>

  <!-- 底部说明 -->
  <text x="600" y="720" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">提示：现实项目经常组合使用——例如 IaaS（虚拟机） + DBaaS（托管库） + SaaS（用 GitHub 做代码托管）</text>
</svg>
