<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="title desc">
  <title id="title">Startup、Readiness 与 Liveness 的职责和顺序</title>
  <desc id="desc">配置 Startup 后，先完成启动检查。成功后 Readiness 和 Liveness 独立执行：Readiness 影响普通 Service 的流量资格，Liveness 失败达到阈值后终止容器并按重启策略处理。Startup 一直失败也会终止容器。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:28px;font-weight:600}.body{font-size:23px;fill:#516078}.small{font-size:22px;fill:#516078}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="730" rx="24" fill="#fbfaf7"/>
  <text x="48" y="60" class="heading">“启动了”“能接请求”“需要重启”，分开判断</text>
  <text x="48" y="103" class="body">以下顺序适用于已经配置 Startup Probe 的容器。</text>
  <rect x="48" y="140" width="944" height="146" rx="16" fill="#edf3ff" stroke="#cbd9f1"/>
  <text x="76" y="185" class="label">Startup：先给应用完成启动的时间</text>
  <text x="76" y="227" class="body">成功前：不执行 Readiness 和 Liveness</text>
  <text x="76" y="263" class="body">持续失败达到阈值：终止容器，按重启策略处理</text>
  <path class="link" d="M520 286 V326 H274 V386"/>
  <path class="link" d="M520 326 H766 V386"/>
  <text x="538" y="316" class="small">成功后，两类检查各自执行</text>
  <rect x="48" y="386" width="452" height="204" rx="16" fill="#eef8f5" stroke="#c4ded5"/>
  <text x="76" y="432" class="label">Readiness：现在能接请求吗？</text>
  <text x="76" y="477" class="body">失败 → 标记为未就绪</text>
  <text x="76" y="514" class="body">普通 Service 通常不再选它作后端</text>
  <text x="76" y="556" class="body" style="fill:#0f766e">不会单纯因为检查失败就重启</text>
  <rect x="540" y="386" width="452" height="204" rx="16" fill="#fff0ef" stroke="#ecc9c6"/>
  <text x="568" y="432" class="label">Liveness：是否需要重启？</text>
  <text x="568" y="477" class="body">失败达到阈值 → 终止容器</text>
  <text x="568" y="514" class="body">再按照 restartPolicy 处理</text>
  <text x="568" y="556" class="body" style="fill:#a63b42">用于无法自行恢复的存活故障</text>
  <text x="48" y="643" class="body">Running 不等于 Ready；容器进程运行中，应用仍可能没有准备好。</text>
  <text x="48" y="683" class="small">直接访问 Pod IP 或显式发布未就绪地址等情况，需要另外判断流量行为。</text>
</svg>
