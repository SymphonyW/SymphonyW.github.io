<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Scheduling, resource requests, and limits</title>
  <desc id="desc">The main scheduling sequence is filtering, scoring, and binding. Requests inform capacity decisions and some runtime allocation. Limits constrain runtime use. CPU is generally throttled, while memory shortages may cause OOM kills.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2" /></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:27px;font-weight:600}.body{font-size:23px;fill:#516078}.small{font-size:22px;fill:#516078}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="800" rx="24" fill="#fbfaf7" />
  <text x="48" y="60" class="heading">Choose a node first; constrain resource use at runtime</text>
  <rect x="48" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="188" y="153" text-anchor="middle" class="label">1. Filtering</text>
  <text x="188" y="193" text-anchor="middle" class="body">Capacity and rules</text>
  <rect x="380" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="520" y="153" text-anchor="middle" class="label">2. Scoring</text>
  <text x="520" y="193" text-anchor="middle" class="body">Rank eligible nodes</text>
  <rect x="712" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="852" y="153" text-anchor="middle" class="label">3. Binding</text>
  <text x="852" y="193" text-anchor="middle" class="body">Assign Pod to node</text>
  <path class="link" d="M328 172 H380" />
  <path class="link" d="M660 172 H712" />
  <rect x="48" y="284" width="452" height="200" rx="14" fill="#edf3ff" stroke="#cbd9f1" />
  <text x="74" y="328" class="label">requests: resource requests</text>
  <text x="74" y="370" class="body">Example: 500m CPU / 512Mi memory</text>
  <text x="74" y="410" class="body">Check whether a Pod fits</text>
  <text x="74" y="450" class="small">Also affect some runtime allocation</text>
  <rect x="540" y="284" width="452" height="200" rx="14" fill="#eef8f5" stroke="#c4ded5" />
  <text x="566" y="328" class="label">limits: resource ceilings</text>
  <text x="566" y="370" class="body">Example: 1 CPU / 1Gi memory</text>
  <text x="566" y="410" class="body">Enforced by the runtime and kernel</text>
  <text x="566" y="450" class="small">CPU and memory behave differently</text>
  <rect x="48" y="526" width="452" height="164" rx="14" fill="#fff5e6" stroke="#e9d1a9" />
  <text x="74" y="570" class="label" style="fill:#9b5b11">CPU limit → usually throttling</text>
  <text x="74" y="612" class="body">Restrict available CPU time</text>
  <text x="74" y="652" class="body">May slow responses instead of killing</text>
  <rect x="540" y="526" width="452" height="164" rx="14" fill="#fff0ef" stroke="#ecc9c6" />
  <text x="566" y="570" class="label" style="fill:#a63b42">Memory shortage → OOM risk</text>
  <text x="566" y="612" class="body">Slowing down cannot free memory</text>
  <text x="566" y="652" class="body">May kill a process; inspect why</text>
  <text x="48" y="745" class="small">Low current usage does not guarantee that uncommitted capacity is available.</text>
  <text x="48" y="780" class="small">Current usage ≠ committed requests; requests are not constant actual usage.</text>
</svg>