<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
  <title id="title">调度流程与资源请求、上限的区别</title>
  <desc id="desc">调度的主线是过滤、打分和绑定。requests 用于节点容量判断等，limits 约束运行时资源。CPU 超限通常节流，内存不足可能触发 OOM。调度器不只看当前用量。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:27px;font-weight:600}.body{font-size:23px;fill:#516078}.small{font-size:22px;fill:#516078}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="800" rx="24" fill="#fbfaf7"/>
  <text x="48" y="60" class="heading">先决定放在哪，再约束能用多少</text>
  <rect x="48" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <text x="188" y="153" text-anchor="middle" class="label">1. 过滤 Filtering</text>
  <text x="188" y="193" text-anchor="middle" class="body">资源、标签、污点、存储</text>
  <rect x="380" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <text x="520" y="153" text-anchor="middle" class="label">2. 打分 Scoring</text>
  <text x="520" y="193" text-anchor="middle" class="body">候选节点中按策略评分</text>
  <rect x="712" y="110" width="280" height="126" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <text x="852" y="153" text-anchor="middle" class="label">3. 绑定 Binding</text>
  <text x="852" y="193" text-anchor="middle" class="body">记录 Pod 与节点的关系</text>
  <path class="link" d="M328 172 H380"/>
  <path class="link" d="M660 172 H712"/>
  <rect x="48" y="284" width="452" height="200" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <text x="74" y="328" class="label">requests：资源请求</text>
  <text x="74" y="370" class="body">例：500m CPU / 512Mi 内存</text>
  <text x="74" y="410" class="body">调度器按请求判断节点是否放得下</text>
  <text x="74" y="450" class="small">也影响运行时的部分资源分配行为</text>
  <rect x="540" y="284" width="452" height="200" rx="14" fill="#eef8f5" stroke="#c4ded5"/>
  <text x="566" y="328" class="label">limits：资源上限</text>
  <text x="566" y="370" class="body">例：1 CPU / 1Gi 内存</text>
  <text x="566" y="410" class="body">运行时和内核负责执行资源限制</text>
  <text x="566" y="450" class="small">CPU 与内存的限制机制不同</text>
  <rect x="48" y="526" width="452" height="164" rx="14" fill="#fff5e6" stroke="#e9d1a9"/>
  <text x="74" y="570" class="label" style="fill:#9b5b11">CPU 超限 → 通常节流</text>
  <text x="74" y="612" class="body">限制可获得的 CPU 时间</text>
  <text x="74" y="652" class="body">表现可能是响应变慢，而非被杀</text>
  <rect x="540" y="526" width="452" height="164" rx="14" fill="#fff0ef" stroke="#ecc9c6"/>
  <text x="566" y="570" class="label" style="fill:#a63b42">内存不足 → 可能 OOM</text>
  <text x="566" y="612" class="body">无法靠减少时间片解决分配需求</text>
  <text x="566" y="652" class="body">内核可能杀死进程，需结合证据判断</text>
  <text x="48" y="745" class="small">节点当前用量很低，也可能没有足够的剩余可分配容量。</text>
  <text x="48" y="780" class="small">当前用量 ≠ 已申请资源；requests 也不是每时每刻的实际用量。</text>
</svg>
