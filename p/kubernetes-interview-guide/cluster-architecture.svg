<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 控制面与工作节点的组件分工</title>
  <desc id="desc">控制器和调度器通过 API Server 协作，API Server 连接 etcd。工作节点的 kubelet 通过 API 观察任务，协调容器运行时启动 Pod。kube-proxy 或替代实现维护 Service 的转发能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2"/></marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:600}.body{font-size:22px;fill:#516078}.small{font-size:21px;fill:#516078}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="800" rx="24" fill="#fbfaf7"/>
  <text x="48" y="60" class="heading">Kubernetes：控制面管理，节点执行</text>
  <rect x="48" y="100" width="944" height="310" rx="20" fill="#edf3ff" stroke="#cbd9f1" stroke-width="2"/>
  <text x="72" y="140" class="label" fill="#326ce5">控制面 · Control Plane</text>
  <rect x="76" y="168" width="310" height="86" rx="12" fill="#fff" stroke="#cbd9f1"/>
  <text x="96" y="203" class="label">Controller Manager</text>
  <text x="96" y="235" class="body">持续调谐各类资源</text>
  <rect x="76" y="286" width="310" height="86" rx="12" fill="#fff" stroke="#cbd9f1"/>
  <text x="96" y="321" class="label">Scheduler</text>
  <text x="96" y="353" class="body">为未绑定的 Pod 选节点</text>
  <rect x="442" y="225" width="270" height="94" rx="12" fill="#326ce5"/>
  <text x="577" y="264" text-anchor="middle" class="label" style="fill:#fff">API Server</text>
  <text x="577" y="296" text-anchor="middle" class="body" style="fill:#fff">统一资源读写入口</text>
  <rect x="768" y="225" width="196" height="94" rx="12" fill="#fff" stroke="#cbd9f1"/>
  <text x="866" y="264" text-anchor="middle" class="label">etcd</text>
  <text x="866" y="296" text-anchor="middle" class="body">保存集群状态</text>
  <path class="link" d="M386 211 H411 V246 H442" marker-start="url(#arrow)"/>
  <path class="link" d="M386 329 H411 V296 H442" marker-start="url(#arrow)"/>
  <path class="link" d="M712 272 H768" marker-start="url(#arrow)"/>
  <rect x="48" y="466" width="944" height="282" rx="20" fill="#eef8f5" stroke="#c4ded5" stroke-width="2"/>
  <text x="72" y="507" class="label">工作节点 · Node（可有多个）</text>
  <rect x="76" y="535" width="240" height="94" rx="12" fill="#fff" stroke="#c4ded5"/>
  <text x="196" y="574" text-anchor="middle" class="label">kubelet</text>
  <text x="196" y="606" text-anchor="middle" class="body">观察任务、协调运行</text>
  <rect x="400" y="535" width="240" height="94" rx="12" fill="#fff" stroke="#c4ded5"/>
  <text x="520" y="574" text-anchor="middle" class="label">containerd 等</text>
  <text x="520" y="606" text-anchor="middle" class="body">管理镜像与容器</text>
  <rect x="724" y="535" width="240" height="94" rx="12" fill="#fff" stroke="#c4ded5"/>
  <text x="844" y="574" text-anchor="middle" class="label">Pods</text>
  <text x="844" y="606" text-anchor="middle" class="body">应用容器运行在这里</text>
  <path class="link" d="M577 319 V438 H58 V520 H196 V535" marker-start="url(#arrow)"/>
  <text x="596" y="445" class="small">通过 API 观察与上报状态</text>
  <path class="link" d="M316 582 H400"/>
  <text x="344" y="560" class="small">CRI</text>
  <path class="link" d="M640 582 H724"/>
  <rect x="76" y="655" width="888" height="62" rx="12" fill="#fff" stroke="#c4ded5"/>
  <text x="100" y="694" class="body">kube-proxy 或替代实现：维护 Service 转发能力，也通过 API 获取配置</text>
  <text x="48" y="778" class="small">图示为逻辑分工；核心组件通常不绕过 API Server 直接读写 etcd。</text>
</svg>
