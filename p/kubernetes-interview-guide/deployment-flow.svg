<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1000" viewBox="0 0 1040 1000" role="img" aria-labelledby="title desc">
  <title id="title">从提交 Deployment 到应用接收流量</title>
  <desc id="desc">提交配置后，Deployment 控制器创建 ReplicaSet，ReplicaSet 控制器创建 Pod，Scheduler 绑定节点，kubelet 协调运行时启动容器，就绪后加入普通 Service 的可用后端。这是通过 API 观察和更新状态的异步协作。</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#68809c" stroke-width="2"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20314b}
    .heading{font-size:32px;font-weight:700}.label{font-size:27px;font-weight:600}.body{font-size:23px;fill:#516078}.num{font-size:26px;font-weight:700;fill:#fff}
    .link{fill:none;stroke:#68809c;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="1000" rx="24" fill="#fbfaf7"/>
  <text x="48" y="60" class="heading">一个配置文件，怎样变成两个可访问的副本</text>
  <text x="48" y="100" class="body">这是一条协作顺序；各组件通过 API 观察与更新资源状态。</text>
  <rect x="136" y="140" width="856" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <circle cx="80" cy="192" r="28" fill="#326ce5"/><text x="80" y="201" text-anchor="middle" class="num">1</text>
  <text x="160" y="180" class="label">kubectl → API Server → etcd</text>
  <text x="160" y="219" class="body">提交 Deployment；校验并持久化“需要两个副本”的声明</text>
  <path class="link" d="M80 220 V288"/>
  <rect x="136" y="280" width="856" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <circle cx="80" cy="332" r="28" fill="#326ce5"/><text x="80" y="341" text-anchor="middle" class="num">2</text>
  <text x="160" y="320" class="label">Deployment 控制器 → ReplicaSet</text>
  <text x="160" y="359" class="body">为这个版本建立副本管理对象</text>
  <path class="link" d="M80 360 V428"/>
  <rect x="136" y="420" width="856" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <circle cx="80" cy="472" r="28" fill="#326ce5"/><text x="80" y="481" text-anchor="middle" class="num">3</text>
  <text x="160" y="460" class="label">ReplicaSet 控制器 → 两个 Pod 对象</text>
  <text x="160" y="499" class="body">发现实际副本不足，创建缺少的 Pod；此时容器还没运行</text>
  <path class="link" d="M80 500 V568"/>
  <rect x="136" y="560" width="856" height="104" rx="14" fill="#edf3ff" stroke="#cbd9f1"/>
  <circle cx="80" cy="612" r="28" fill="#326ce5"/><text x="80" y="621" text-anchor="middle" class="num">4</text>
  <text x="160" y="600" class="label">Scheduler → 选择节点并绑定</text>
  <text x="160" y="639" class="body">过滤不合适的节点，再给候选节点打分</text>
  <path class="link" d="M80 640 V708"/>
  <rect x="136" y="700" width="856" height="104" rx="14" fill="#eef8f5" stroke="#c4ded5"/>
  <circle cx="80" cy="752" r="28" fill="#0f766e"/><text x="80" y="761" text-anchor="middle" class="num">5</text>
  <text x="160" y="740" class="label">kubelet → 运行时 → 容器进程</text>
  <text x="160" y="779" class="body">协调卷、网络、镜像拉取与容器启动，并上报运行状态</text>
  <path class="link" d="M80 780 V848"/>
  <rect x="136" y="840" width="856" height="104" rx="14" fill="#eef8f5" stroke="#c4ded5"/>
  <circle cx="80" cy="892" r="28" fill="#0f766e"/><text x="80" y="901" text-anchor="middle" class="num">6</text>
  <text x="160" y="880" class="label">通过就绪检查 → 作为可用后端</text>
  <text x="160" y="919" class="body">普通 Service 开始向就绪副本转发流量</text>
  <text x="48" y="981" class="body">Pod 对象已经创建、容器已经运行、应用已经就绪，是三个不同的判断。</text>
</svg>
