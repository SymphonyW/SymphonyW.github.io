    <line x1="390" y1="180" x2="415" y2="180"/><polygon points="415,180 405,174 405,186" fill="#64748b"/>
    <line x1="580" y1="180" x2="605" y2="180"/><polygon points="605,180 595,174 595,186" fill="#64748b"/>
    <line x1="770" y1="180" x2="795" y2="180"/><polygon points="795,180 785,174 785,186" fill="#64748b"/>
