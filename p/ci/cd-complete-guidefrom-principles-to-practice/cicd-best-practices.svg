<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect width="1200" height="560" fill="#0f172a"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">CI/CD 落地最佳实践</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(60,90)">
      <rect width="510" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <circle cx="50" cy="50" r="26" fill="#f59e0b"/>
      <text x="50" y="58" text-anchor="middle" font-size="26">⚡</text>
      <text x="95" y="45" font-size="20" font-weight="700" fill="#fbbf24">快速失败</text>
      <text x="95" y="68" font-size="13" fill="#94a3b8">Fast Fail</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="30" y="115">• lint / 单元测试放最前面</text>
        <text x="30" y="142">• 慢的集成测试、E2E 放后面</text>
        <text x="30" y="169">• 让开发者尽早收到反馈</text>
      </g>
    </g>
    <g transform="translate(630,90)">
      <rect width="510" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <circle cx="50" cy="50" r="26" fill="#06b6d4"/>
      <text x="50" y="58" text-anchor="middle" font-size="26">🔄</text>
      <text x="95" y="45" font-size="20" font-weight="700" fill="#22d3ee">幂等性</text>
      <text x="95" y="68" font-size="13" fill="#94a3b8">Idempotency</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="30" y="115">• 同一次 push 多次执行结果一致</text>
        <text x="30" y="142">• 不依赖外部可变状态</text>
        <text x="30" y="169">• 失败可安全重试</text>
      </g>
    </g>
    <g transform="translate(60,310)">
      <rect width="510" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <circle cx="50" cy="50" r="26" fill="#8b5cf6"/>
      <text x="50" y="58" text-anchor="middle" font-size="26">💾</text>
      <text x="95" y="45" font-size="20" font-weight="700" fill="#a78bfa">缓存依赖</text>
      <text x="95" y="68" font-size="13" fill="#94a3b8">Caching</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="30" y="115">• actions/cache 缓存 node_modules</text>
        <text x="30" y="142">• 缓存 ~/.m2、~/.gradle、Go mod</text>
        <text x="30" y="169">• 构建时间可砍掉一半</text>
      </g>
    </g>
    <g transform="translate(630,310)">
      <rect width="510" height="200" rx="14" fill="#1e293b" stroke="#334155"/>
      <circle cx="50" cy="50" r="26" fill="#ef4444"/>
      <text x="50" y="58" text-anchor="middle" font-size="26">🔒</text>
      <text x="95" y="45" font-size="20" font-weight="700" fill="#f87171">安全优先</text>
      <text x="95" y="68" font-size="13" fill="#94a3b8">Security</text>
      <g font-size="14" fill="#cbd5e1">
        <text x="30" y="115">• 密钥走 secrets，绝不硬编码</text>
        <text x="30" y="142">• 第三方 Action 锁版本 @v4</text>
        <text x="30" y="169">• 最小权限原则授予 TOKEN</text>
      </g>
    </g>
  </g>
  <text x="600" y="545" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">四条铁律：快速失败 · 幂等性 · 缓存依赖 · 安全优先</text>
</svg>
