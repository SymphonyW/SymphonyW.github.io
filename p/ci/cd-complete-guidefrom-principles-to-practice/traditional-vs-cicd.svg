<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">传统开发 vs CI/CD 自动化</text>
  <line x1="600" y1="90" x2="600" y2="560" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>
  <g transform="translate(50,100)">
    <rect x="0" y="0" width="500" height="450" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="250" y="40" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#dc2626">传统开发模式</text>
    <g transform="translate(30,80)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#fca5a5"/>
      <circle cx="30" cy="30" r="14" fill="#ef4444"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">1</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">手动集成代码</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">合并冲突多，耗时数小时</text>
    </g>
    <g transform="translate(30,160)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#fca5a5"/>
      <circle cx="30" cy="30" r="14" fill="#ef4444"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">2</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">手动打包上传</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">一次上线 2+ 小时，易出错</text>
    </g>
    <g transform="translate(30,240)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#fca5a5"/>
      <circle cx="30" cy="30" r="14" fill="#ef4444"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">3</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">环境不一致</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">"在我电脑上能跑啊"</text>
    </g>
    <g transform="translate(30,320)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#fca5a5"/>
      <circle cx="30" cy="30" r="14" fill="#ef4444"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">4</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">频繁回滚</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">不可追溯，难以定位问题</text>
    </g>
    <text x="250" y="420" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#dc2626">慢 · 险 · 累</text>
  </g>
  <g transform="translate(650,100)">
    <rect x="0" y="0" width="500" height="450" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="250" y="40" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#16a34a">CI/CD 模式</text>
    <g transform="translate(30,80)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#86efac"/>
      <circle cx="30" cy="30" r="14" fill="#22c55e"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">1</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">git push 触发</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">一条命令，自动启动流水线</text>
    </g>
    <g transform="translate(30,160)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#86efac"/>
      <circle cx="30" cy="30" r="14" fill="#22c55e"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">2</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">自动构建 + 测试</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">机器执行，1 分钟完成</text>
    </g>
    <g transform="translate(30,240)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#86efac"/>
      <circle cx="30" cy="30" r="14" fill="#22c55e"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">3</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">环境一致</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">容器化，处处可运行</text>
    </g>
    <g transform="translate(30,320)">
      <rect x="0" y="0" width="440" height="60" rx="8" fill="#fff" stroke="#86efac"/>
      <circle cx="30" cy="30" r="14" fill="#22c55e"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">4</text>
      <text x="60" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">一键回滚</text>
      <text x="60" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">全程可追溯，秒级回退</text>
    </g>
    <text x="250" y="420" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#16a34a">快 · 稳 · 省</text>
  </g>
</svg>
