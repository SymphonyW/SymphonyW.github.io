<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="t4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">CI/CD 演进趋势</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(60,90)">
      <rect width="510" height="200" rx="14" fill="url(#t1)"/>
      <text x="30" y="55" font-size="32">🎯</text>
      <text x="80" y="50" font-size="22" font-weight="700" fill="#fff">GitOps</text>
      <text x="80" y="72" font-size="13" fill="#cffafe">Git 作为单一事实源</text>
      <g font-size="14" fill="#fff" opacity="0.95">
        <text x="30" y="115">• 部署状态完全由 Git 仓库描述</text>
        <text x="30" y="142">• 声明式优于命令式</text>
        <text x="30" y="169">• 代表工具：ArgoCD、Flux</text>
      </g>
    </g>
    <g transform="translate(630,90)">
      <rect width="510" height="200" rx="14" fill="url(#t2)"/>
      <text x="30" y="55" font-size="32">🐦</text>
      <text x="80" y="50" font-size="22" font-weight="700" fill="#fff">Progressive Delivery</text>
      <text x="80" y="72" font-size="13" fill="#ede9fe">渐进式发布</text>
      <g font-size="14" fill="#fff" opacity="0.95">
        <text x="30" y="115">• 金丝雀发布，小流量先验证</text>
        <text x="30" y="142">• 特性开关随时关闭新功能</text>
        <text x="30" y="169">• 把发布风险降到最低</text>
      </g>
    </g>
    <g transform="translate(60,310)">
      <rect width="510" height="200" rx="14" fill="url(#t3)"/>
      <text x="30" y="55" font-size="32">🤖</text>
      <text x="80" y="50" font-size="22" font-weight="700" fill="#fff">AI 辅助 CI</text>
      <text x="80" y="72" font-size="13" fill="#fef3c7">机器学习加速流水线</text>
      <g font-size="14" fill="#fff" opacity="0.95">
        <text x="30" y="115">• 预测哪些测试可能失败</text>
        <text x="30" y="142">• 跳过无关测试，优先跑高风险</text>
        <text x="30" y="169">• 智能分析代码改动影响范围</text>
      </g>
    </g>
    <g transform="translate(630,310)">
      <rect width="510" height="200" rx="14" fill="url(#t4)"/>
      <text x="30" y="55" font-size="32">🛡️</text>
      <text x="80" y="50" font-size="22" font-weight="700" fill="#fff">供应链安全</text>
      <text x="80" y="72" font-size="13" fill="#d1fae5">Supply Chain Security</text>
      <g font-size="14" fill="#fff" opacity="0.95">
        <text x="30" y="115">• SLSA 框架保证构建可验证</text>
        <text x="30" y="142">• Sigstore 签名制品</text>
        <text x="30" y="169">• 从源码到产物全链路可信</text>
      </g>
    </g>
  </g>
  <text x="600" y="545" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">未来方向：声明式 · 渐进式 · 智能化 · 可信化</text>
</svg>
