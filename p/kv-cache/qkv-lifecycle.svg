<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Prefill and decode lifecycle</title>
  <desc id="desc">KV Cache is created during prefill and extended during decode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">KV Cache 出现在哪里：Prefill 与 Decode</text>
  <text x="70" y="116" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Prompt 阶段把所有历史 token 的 K/V 建好；之后每一步只处理新 token，并把它的 K/V 追加进去。</text>

  <g filter="url(#shadow)" transform="translate(72 172)">
    <rect width="460" height="330" rx="24" fill="#ffffff" stroke="#fed7aa"/>
    <text x="36" y="48" fill="#9a3412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">1. Prefill：读完整 Prompt</text>
    <text x="36" y="82" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">一次性处理 x1...xn，生成初始缓存</text>
    <g transform="translate(38 122)">
      <rect x="0" y="0" width="64" height="50" rx="12" fill="#fed7aa"/>
      <rect x="78" y="0" width="64" height="50" rx="12" fill="#fed7aa"/>
      <rect x="156" y="0" width="64" height="50" rx="12" fill="#fed7aa"/>
      <rect x="234" y="0" width="64" height="50" rx="12" fill="#fed7aa"/>
      <text x="32" y="32" text-anchor="middle" fill="#7c2d12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">x1</text>
      <text x="110" y="32" text-anchor="middle" fill="#7c2d12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">x2</text>
      <text x="188" y="32" text-anchor="middle" fill="#7c2d12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">...</text>
      <text x="266" y="32" text-anchor="middle" fill="#7c2d12" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">xn</text>
      <path d="M320 25 H370" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(38 220)">
      <rect x="0" y="0" width="360" height="54" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="180" y="35" text-anchor="middle" fill="#155e75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">K/V cache: 1...n</text>
    </g>
  </g>

  <path d="M560 335 H640" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" transform="translate(668 172)">
    <rect width="460" height="330" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="36" y="48" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">2. Decode：逐 token 生成</text>
    <text x="36" y="82" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">每一步只算新 token 的 Q/K/V</text>
    <g transform="translate(38 116)">
      <rect x="0" y="0" width="102" height="58" rx="14" fill="#dbeafe"/>
      <text x="51" y="36" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">new x</text>
      <path d="M122 29 H176" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="200" y="-12" width="190" height="82" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="295" y="22" text-anchor="middle" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">project</text>
      <text x="295" y="52" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">q_new, k_new, v_new</text>
    </g>
    <g transform="translate(38 230)">
      <rect x="0" y="0" width="150" height="54" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="75" y="35" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Q_new 立即用</text>
      <rect x="182" y="0" width="218" height="54" rx="14" fill="#dcfce7" stroke="#34d399"/>
      <text x="291" y="35" text-anchor="middle" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">K/V_new 追加缓存</text>
    </g>
  </g>
</svg>
