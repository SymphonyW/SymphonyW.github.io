<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache memory cost</title>
  <desc id="desc">KV Cache memory grows linearly with layers, sequence length, and KV heads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">KV Cache 的成本：显存线性增长</text>
  <text x="70" y="116" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">它省掉重复计算，但会把每一层、每个历史 token 的 K/V 留在显存里。</text>

  <g transform="translate(92 165)" filter="url(#shadow)">
    <rect width="1016" height="156" rx="24" fill="#111827"/>
    <text x="48" y="60" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="25">bytes ≈ 2 × layers × batch × seq_len × kv_heads × head_dim × bytes_per_elem</text>
    <text x="48" y="108" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">前面的 2 来自 K 和 V 两份张量；seq_len 越长，缓存越大。</text>
  </g>

  <g transform="translate(105 385)">
    <g>
      <rect x="0" y="82" width="180" height="90" rx="18" fill="#bfdbfe"/>
      <text x="90" y="134" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">layers</text>
    </g>
    <g>
      <rect x="205" y="40" width="180" height="132" rx="18" fill="#c7d2fe"/>
      <text x="295" y="112" text-anchor="middle" fill="#3730a3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">seq_len</text>
    </g>
    <g>
      <rect x="410" y="12" width="180" height="160" rx="18" fill="#bae6fd"/>
      <text x="500" y="100" text-anchor="middle" fill="#075985" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">kv_heads</text>
    </g>
    <g>
      <rect x="615" y="65" width="180" height="107" rx="18" fill="#bbf7d0"/>
      <text x="705" y="126" text-anchor="middle" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">head_dim</text>
    </g>
    <g>
      <rect x="820" y="98" width="180" height="74" rx="18" fill="#fde68a"/>
      <text x="910" y="142" text-anchor="middle" fill="#92400e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">dtype</text>
    </g>
  </g>

  <text x="600" y="592" text-anchor="middle" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">只要把 Q 也长期存下来，显存立刻变大；而它又不能被未来复用。</text>
</svg>
