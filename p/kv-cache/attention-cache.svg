<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Attention as memory read</title>
  <desc id="desc">Query reads cached keys and values in decoder self attention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dff7f2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">把 Attention 看成一次“查表”</text>
  <text x="72" y="116" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Q 是读请求，K 是地址，V 是内容。生成新 token 时，只有新的 Q 会出现。</text>

  <g filter="url(#soft)">
    <rect x="70" y="178" width="210" height="138" rx="22" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="175" y="232" text-anchor="middle" fill="#1e3a8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Q_t</text>
    <text x="175" y="270" text-anchor="middle" fill="#1e40af" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">当前 token 想读什么</text>
  </g>

  <path d="M295 247 C 365 247, 380 247, 448 247" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="370" y="228" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">点积匹配</text>

  <g filter="url(#soft)" transform="translate(465 158)">
    <rect x="0" y="0" width="270" height="178" rx="22" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="135" y="42" text-anchor="middle" fill="#155e75" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">K_cache</text>
    <rect x="38" y="70" width="52" height="64" rx="10" fill="#67e8f9"/>
    <rect x="108" y="70" width="52" height="64" rx="10" fill="#67e8f9" opacity="0.83"/>
    <rect x="178" y="70" width="52" height="64" rx="10" fill="#67e8f9" opacity="0.66"/>
    <text x="64" y="108" text-anchor="middle" fill="#164e63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">K1</text>
    <text x="134" y="108" text-anchor="middle" fill="#164e63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">K2</text>
    <text x="204" y="108" text-anchor="middle" fill="#164e63" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Kt</text>
  </g>

  <path d="M746 247 C 805 247, 828 247, 892 247" stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="820" y="228" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">加权求和</text>

  <g filter="url(#soft)" transform="translate(910 158)">
    <rect x="0" y="0" width="220" height="178" rx="22" fill="#dcfce7" stroke="#34d399"/>
    <text x="110" y="42" text-anchor="middle" fill="#166534" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">V_cache</text>
    <rect x="34" y="70" width="44" height="64" rx="10" fill="#34d399"/>
    <rect x="88" y="70" width="44" height="64" rx="10" fill="#34d399" opacity="0.83"/>
    <rect x="142" y="70" width="44" height="64" rx="10" fill="#34d399" opacity="0.66"/>
    <text x="56" y="108" text-anchor="middle" fill="#14532d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">V1</text>
    <text x="110" y="108" text-anchor="middle" fill="#14532d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">V2</text>
    <text x="164" y="108" text-anchor="middle" fill="#14532d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Vt</text>
  </g>

  <g transform="translate(110 405)">
    <rect width="980" height="118" rx="20" fill="#0f172a"/>
    <text x="42" y="48" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="24">Attention(q_t, K_1:t, V_1:t) = softmax(q_t K_1:t^T / sqrt(d)) V_1:t</text>
    <text x="42" y="88" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">注意：公式里没有 q_1, q_2, ..., q_{t-1}，所以旧 Query 没有持久缓存价值。</text>
  </g>
</svg>
