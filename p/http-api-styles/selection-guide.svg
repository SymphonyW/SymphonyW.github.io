<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc">
  <title id="title">从需求选择 API 设计 / Choose an API design by need</title>
  <desc id="desc">Resource operations suggest resource-oriented HTTP; explicit actions suggest RPC; varied field needs suggest GraphQL; generated service contracts suggest gRPC; existing SOAP services retain their contract. Event delivery is a separate choice.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#426c66" stroke-width="2"/></marker></defs>
  <rect width="1200" height="925" fill="#f8f5ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20373c">
    <text x="60" y="66" fill="#627671" font-size="22" letter-spacing="3">05 / START WITH THE NEED</text>
    <text x="60" y="123" font-size="39" font-weight="700">先看要解决什么问题，再选名字</text>
    <text x="60" y="164" fill="#627671" font-size="24">Starting points, not exclusive rules or a performance ranking</text>
    <text x="80" y="224" fill="#627671" font-size="23">需求 / Need</text>
    <text x="735" y="224" fill="#627671" font-size="23">可以优先考虑 / Consider</text>
    <g transform="translate(60 250)">
      <rect width="1080" height="88" rx="8" fill="#dceee7"/>
      <text x="22" y="37" font-size="27">清晰的资源查询与修改</text>
      <text x="22" y="69" fill="#506960" font-size="21">Resource operations</text>
      <path d="M520 45H620" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="665" y="54" font-size="28" font-weight="700">资源式 HTTP / REST</text>
    </g>
    <g transform="translate(60 354)">
      <rect width="1080" height="88" rx="8" fill="#f9e3cd"/>
      <text x="22" y="37" font-size="27">明确的业务动作</text>
      <text x="22" y="69" fill="#816045" font-size="21">Explicit business actions</text>
      <path d="M520 45H620" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="665" y="54" font-size="28" font-weight="700">HTTP RPC / JSON-RPC</text>
    </g>
    <g transform="translate(60 458)">
      <rect width="1080" height="88" rx="8" fill="#e9e2f5"/>
      <text x="22" y="37" font-size="27">不同客户端要不同字段组合</text>
      <text x="22" y="69" fill="#6e5e81" font-size="21">Different client data needs</text>
      <path d="M520 45H620" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="665" y="54" font-size="28" font-weight="700">GraphQL</text>
    </g>
    <g transform="translate(60 562)">
      <rect width="1080" height="88" rx="8" fill="#e2ebed"/>
      <text x="22" y="37" font-size="27">服务契约与跨语言代码生成</text>
      <text x="22" y="69" fill="#506970" font-size="21">Typed contracts + code generation</text>
      <path d="M520 45H620" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="665" y="54" font-size="28" font-weight="700">gRPC</text>
    </g>
    <g transform="translate(60 666)">
      <rect width="1080" height="88" rx="8" fill="#eee8dc"/>
      <text x="22" y="37" font-size="27">合作方已有 SOAP / WSDL</text>
      <text x="22" y="69" fill="#766b56" font-size="21">An existing partner contract</text>
      <path d="M520 45H620" stroke="#426c66" stroke-width="2.5" marker-end="url(#arrow)"/>
      <text x="665" y="54" font-size="28" font-weight="700">SOAP</text>
    </g>
    <path d="M60 790H1140" stroke="#ccd3cb"/>
    <text x="60" y="838" font-size="27">持续更新另选通信方式 / Choose event delivery separately</text>
    <text x="60" y="884" fill="#627671" font-size="25">单向事件 SSE · 双向消息 WebSocket · 系统回调 Webhook</text>
  </g>
</svg>
