<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HTTP API 设计方式 / HTTP API styles</title>
  <desc id="desc">REST focuses on resources, RPC on methods, and GraphQL on selected fields. All three can communicate through HTTP.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#b8cdc7" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#142b31"/>
  <g stroke="#284047" stroke-width="1"><path d="M80 0V900M400 0V900M720 0V900M1040 0V900M1360 0V900"/><path d="M0 180H1600M0 500H1600M0 820H1600"/></g>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="100" y="110" fill="#9bbdb5" font-size="25" letter-spacing="5">SNOW / ENGINEERING NOTES</text>
    <text x="100" y="240" fill="#fbf7ee" font-size="100" font-weight="700">HTTP API</text>
    <text x="105" y="306" fill="#fbf7ee" font-size="40">从资源、方法到字段选择，读懂接口的设计方式</text>
    <text x="105" y="357" fill="#b8cdc7" font-size="28">Resources · Remote methods · Selected fields</text>
    <g transform="translate(100 425)">
      <rect width="435" height="225" rx="12" fill="#dceee7"/>
      <text x="30" y="65" fill="#17604e" font-size="43" font-weight="700">REST</text>
      <text x="30" y="115" fill="#23463b" font-size="29">对资源做操作 / Resources</text>
      <path d="M30 142H405" stroke="#b5d5c6"/>
      <text x="30" y="187" fill="#23463b" font-family="Consolas, monospace" font-size="27">GET /orders/1001</text>
    </g>
    <g transform="translate(583 425)">
      <rect width="435" height="225" rx="12" fill="#f9e3cd"/>
      <text x="30" y="65" fill="#8b4b1d" font-size="43" font-weight="700">RPC</text>
      <text x="30" y="115" fill="#65472b" font-size="29">调用远处的方法 / Methods</text>
      <path d="M30 142H405" stroke="#e6c7a6"/>
      <text x="30" y="187" fill="#65472b" font-family="Consolas, monospace" font-size="27">GetOrder(id="1001")</text>
    </g>
    <g transform="translate(1066 425)">
      <rect width="435" height="225" rx="12" fill="#e9e2f5"/>
      <text x="30" y="65" fill="#62428c" font-size="43" font-weight="700">GraphQL</text>
      <text x="30" y="115" fill="#59476d" font-size="29">选择所需字段 / Fields</text>
      <path d="M30 142H405" stroke="#cfc1e4"/>
      <text x="30" y="187" fill="#59476d" font-family="Consolas, monospace" font-size="27">order { id status }</text>
    </g>
    <path d="M318 670V716H1283V670M800 670V740" fill="none" stroke="#b8cdc7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="800" y="798" text-anchor="middle" fill="#fbf7ee" font-size="32">都可以通过 HTTP 通信 / All can use HTTP</text>
    <text x="100" y="858" fill="#9bbdb5" font-size="23">JSON-RPC · gRPC · SOAP · SSE · WebSocket · Webhook</text>
  </g>
</svg>
