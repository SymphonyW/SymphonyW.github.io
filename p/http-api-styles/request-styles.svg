<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc">
  <title id="title">查询同一个订单的三种表达 / Three ways to read an order</title>
  <desc id="desc">REST identifies the order resource, RPC names a GetOrder method, and GraphQL selects fields. These are illustrative request shapes rather than a performance ranking.</desc>
  <rect width="1200" height="825" fill="#f8f5ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20373c">
    <text x="60" y="66" fill="#627671" font-size="22" letter-spacing="3">02 / SAME NEED, DIFFERENT SHAPES</text>
    <text x="60" y="123" font-size="39" font-weight="700">同样查订单，请求在强调什么？</text>
    <text x="60" y="164" fill="#627671" font-size="24">Read order 1001: resource, method, or selected fields</text>
    <g transform="translate(60 205)">
      <rect width="1080" height="160" rx="8" fill="#dceee7"/>
      <text x="27" y="56" fill="#17604e" font-size="34" font-weight="700">REST</text>
      <text x="27" y="99" font-size="25">资源 / Resource</text>
      <path d="M290 24V136" stroke="#b4d2c4"/>
      <text x="325" y="54" font-family="Consolas, monospace" font-size="29">GET /orders/1001</text>
      <text x="325" y="99" font-size="25">路径标识订单，HTTP 方法表达读取</text>
      <text x="325" y="133" fill="#506960" font-size="22">The URL identifies a resource; GET reads its representation.</text>
    </g>
    <g transform="translate(60 385)">
      <rect width="1080" height="160" rx="8" fill="#f9e3cd"/>
      <text x="27" y="56" fill="#8b4b1d" font-size="34" font-weight="700">RPC</text>
      <text x="27" y="99" font-size="25">方法 / Method</text>
      <path d="M290 24V136" stroke="#e5c8a9"/>
      <text x="325" y="54" font-family="Consolas, monospace" font-size="29">GetOrder(order_id="1001")</text>
      <text x="325" y="99" font-size="25">调用远程方法，订单编号作为参数</text>
      <text x="325" y="133" fill="#816045" font-size="22">Name an operation and pass its arguments.</text>
    </g>
    <g transform="translate(60 565)">
      <rect width="1080" height="160" rx="8" fill="#e9e2f5"/>
      <text x="27" y="56" fill="#62428c" font-size="34" font-weight="700">GraphQL</text>
      <text x="27" y="99" font-size="25">字段 / Fields</text>
      <path d="M290 24V136" stroke="#cfc1e4"/>
      <text x="325" y="54" font-family="Consolas, monospace" font-size="27">order(id:"1001") { id status }</text>
      <text x="325" y="99" font-size="25">在服务端提供的类型中，选择所需字段</text>
      <text x="325" y="133" fill="#6e5e81" font-size="22">Select fields exposed by the server's schema.</text>
    </g>
    <text x="60" y="781" fill="#627671" font-size="24">表达方式不同，不代表数据库次数或性能已经确定。</text>
  </g>
</svg>
