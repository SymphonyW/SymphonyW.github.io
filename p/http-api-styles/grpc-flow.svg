<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">gRPC 从契约到远程调用 / From contract to a gRPC call</title>
  <desc id="desc">A shared proto definition generates client and server code. Encoded messages travel over HTTP/2, and the client checks the final gRPC status.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#426c66" stroke-width="2"/></marker></defs>
  <rect width="1200" height="850" fill="#f8f5ef"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#20373c">
    <text x="60" y="66" fill="#627671" font-size="22" letter-spacing="3">03 / CONTRACT TO CALL</text>
    <text x="60" y="123" font-size="39" font-weight="700">看起来像方法调用，实际会跨网络</text>
    <text x="60" y="164" fill="#627671" font-size="24">gRPC: generated code, encoded messages, network boundaries</text>
    <rect x="340" y="205" width="520" height="104" rx="8" fill="#e9e2f5"/>
    <text x="600" y="249" text-anchor="middle" font-size="29" font-weight="700">.proto 共享契约 / Shared contract</text>
    <text x="600" y="286" text-anchor="middle" fill="#6e5e81" font-size="22">Services · methods · message fields</text>
    <path d="M450 309V355H255V400" fill="none" stroke="#426c66" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <path d="M750 309V355H945V400" fill="none" stroke="#426c66" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="600" y="371" text-anchor="middle" fill="#627671" font-size="23">生成代码 / Generate code</text>
    <rect x="60" y="410" width="345" height="220" rx="8" fill="#dceee7"/>
    <text x="90" y="459" font-size="30" font-weight="700">客户端 / Client</text>
    <text x="90" y="505" font-size="25">调用生成的方法</text>
    <text x="90" y="544" font-size="25">编码请求，解码响应</text>
    <text x="90" y="591" fill="#506960" font-size="22">Generated stub + codec</text>
    <rect x="795" y="410" width="345" height="220" rx="8" fill="#f9e3cd"/>
    <text x="825" y="459" font-size="30" font-weight="700">服务端 / Server</text>
    <text x="825" y="505" font-size="25">解码后执行业务</text>
    <text x="825" y="544" font-size="25">编码响应，返回结果</text>
    <text x="825" y="591" fill="#816045" font-size="22">Handler + business logic</text>
    <path d="M425 485H775" fill="none" stroke="#426c66" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="459" text-anchor="middle" font-size="25">HTTP/2 请求 / Request</text>
    <path d="M775 574H425" fill="none" stroke="#426c66" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="548" text-anchor="middle" font-size="25">响应 / Response</text>
    <text x="600" y="615" text-anchor="middle" fill="#627671" font-size="22">默认编码：Protobuf</text>
    <rect x="60" y="672" width="1080" height="70" rx="8" fill="#e2ebed"/>
    <text x="600" y="716" text-anchor="middle" font-size="27">HTTP 200 ≠ RPC 成功；还要检查最终 grpc-status</text>
    <text x="60" y="799" fill="#627671" font-size="23">调用模式 / Modes: Unary · Server streaming · Client streaming · Bidirectional</text>
  </g>
</svg>
