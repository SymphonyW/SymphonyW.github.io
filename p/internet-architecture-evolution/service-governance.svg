<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Microservice governance</title>
  <desc id="desc">A microservice governance diagram with gateway, registry, services, message queue, tracing, and circuit breaking.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 32px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .gate { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .svc { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .mid { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .obs { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .h { font: 800 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .s { font: 600 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="60" y="66">微服务拆开以后，真正的难点是治理</text>
  <g transform="translate(70 120)">
    <rect class="box" x="0" y="200" width="140" height="96" rx="16"/>
    <text class="h" x="70" y="240" text-anchor="middle">用户请求</text>
    <text class="s" x="70" y="268" text-anchor="middle">Web / App</text>
    <rect class="gate" x="210" y="200" width="160" height="96" rx="16"/>
    <text class="h" x="290" y="240" text-anchor="middle">API 网关</text>
    <text class="s" x="290" y="268" text-anchor="middle">认证 限流 路由</text>
    <rect class="svc" x="460" y="70" width="160" height="88" rx="16"/>
    <text class="h" x="540" y="106" text-anchor="middle">用户服务</text>
    <text class="s" x="540" y="132" text-anchor="middle">User</text>
    <rect class="svc" x="460" y="200" width="160" height="88" rx="16"/>
    <text class="h" x="540" y="236" text-anchor="middle">订单服务</text>
    <text class="s" x="540" y="262" text-anchor="middle">Order</text>
    <rect class="svc" x="460" y="330" width="160" height="88" rx="16"/>
    <text class="h" x="540" y="366" text-anchor="middle">库存服务</text>
    <text class="s" x="540" y="392" text-anchor="middle">Stock</text>
    <rect class="mid" x="720" y="70" width="170" height="88" rx="16"/>
    <text class="h" x="805" y="106" text-anchor="middle">注册中心</text>
    <text class="s" x="805" y="132" text-anchor="middle">服务发现</text>
    <rect class="mid" x="720" y="230" width="170" height="88" rx="16"/>
    <text class="h" x="805" y="266" text-anchor="middle">消息队列</text>
    <text class="s" x="805" y="292" text-anchor="middle">削峰 解耦</text>
    <rect class="obs" x="720" y="390" width="170" height="88" rx="16"/>
    <text class="h" x="805" y="426" text-anchor="middle">可观测性</text>
    <text class="s" x="805" y="452" text-anchor="middle">日志 指标 链路</text>
    <rect class="obs" x="960" y="180" width="160" height="116" rx="16"/>
    <text class="h" x="1040" y="222" text-anchor="middle">熔断降级</text>
    <text class="s" x="1040" y="250" text-anchor="middle">超时 重试</text>
    <text class="s" x="1040" y="276" text-anchor="middle">隔离保护</text>
    <path class="line" d="M140 248 H210"/>
    <path class="line" d="M370 248 H460"/>
    <path class="line" d="M620 244 C655 244 675 274 720 274"/>
    <path class="dash" d="M620 114 H720"/>
    <path class="dash" d="M620 374 C660 374 680 434 720 434"/>
    <path class="dash" d="M890 434 C930 434 930 238 960 238"/>
    <path class="line" d="M540 288 V330"/>
    <path class="line" d="M540 200 V158"/>
    <text class="s" x="500" y="505">服务拆分提高交付弹性，也把可靠性问题从“代码结构”推向“运行治理”。</text>
  </g>
</svg>
