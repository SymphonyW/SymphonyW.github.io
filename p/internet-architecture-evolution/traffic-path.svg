<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Typical read traffic path</title>
  <desc id="desc">A read request path through CDN, load balancer, application, cache, and database replicas.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 32px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .edge { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .hit { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .miss { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .h { font: 800 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .s { font: 600 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .tag { font: 800 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="60" y="64">读请求链路：能在前面命中，就不要打到数据库</text>
  <g transform="translate(60 120)">
    <rect class="box" x="0" y="110" width="130" height="88" rx="16"/>
    <text class="h" x="65" y="150" text-anchor="middle">用户</text>
    <text class="s" x="65" y="176" text-anchor="middle">Browser</text>
    <rect class="box" x="180" y="40" width="160" height="88" rx="16" fill="#e0f2fe"/>
    <text class="h" x="260" y="80" text-anchor="middle">CDN</text>
    <text class="s" x="260" y="106" text-anchor="middle">静态资源</text>
    <rect class="box" x="180" y="180" width="160" height="88" rx="16" fill="#dcfce7"/>
    <text class="h" x="260" y="220" text-anchor="middle">浏览器缓存</text>
    <text class="s" x="260" y="246" text-anchor="middle">强缓存 / 协商</text>
    <rect class="box" x="400" y="110" width="160" height="88" rx="16" fill="#fef3c7"/>
    <text class="h" x="480" y="150" text-anchor="middle">Nginx</text>
    <text class="s" x="480" y="176" text-anchor="middle">负载均衡</text>
    <rect class="box" x="620" y="110" width="160" height="88" rx="16" fill="#ede9fe"/>
    <text class="h" x="700" y="150" text-anchor="middle">应用服务</text>
    <text class="s" x="700" y="176" text-anchor="middle">业务逻辑</text>
    <rect class="box" x="840" y="40" width="160" height="88" rx="16" fill="#ccfbf1"/>
    <text class="h" x="920" y="80" text-anchor="middle">本地缓存</text>
    <text class="s" x="920" y="106" text-anchor="middle">进程内命中</text>
    <rect class="box" x="840" y="180" width="160" height="88" rx="16" fill="#bbf7d0"/>
    <text class="h" x="920" y="220" text-anchor="middle">Redis</text>
    <text class="s" x="920" y="246" text-anchor="middle">分布式缓存</text>
    <rect class="box" x="480" y="370" width="160" height="88" rx="16" fill="#fee2e2"/>
    <text class="h" x="560" y="410" text-anchor="middle">主库</text>
    <text class="s" x="560" y="436" text-anchor="middle">写入真相源</text>
    <rect class="box" x="720" y="370" width="160" height="88" rx="16" fill="#e0f2fe"/>
    <text class="h" x="800" y="410" text-anchor="middle">从库</text>
    <text class="s" x="800" y="436" text-anchor="middle">读取副本</text>
    <path class="edge" d="M130 154 H180"/>
    <path class="edge" d="M340 84 C370 84 370 154 400 154"/>
    <path class="edge" d="M340 224 C370 224 370 154 400 154"/>
    <path class="edge" d="M560 154 H620"/>
    <path class="hit" d="M780 154 C810 154 810 84 840 84"/>
    <path class="hit" d="M780 154 C810 154 810 224 840 224"/>
    <path class="miss" d="M920 268 C920 335 840 414 880 414"/>
    <path class="edge" d="M640 414 H720"/>
    <path class="edge" d="M560 370 V198"/>
    <rect x="1020" y="42" width="86" height="28" rx="14" fill="#16a34a"/>
    <text class="tag" x="1063" y="62" text-anchor="middle">命中</text>
    <rect x="1020" y="88" width="86" height="28" rx="14" fill="#dc2626"/>
    <text class="tag" x="1063" y="108" text-anchor="middle">回源</text>
  </g>
</svg>
