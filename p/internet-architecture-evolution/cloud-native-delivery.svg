<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cloud native delivery pipeline</title>
  <desc id="desc">A delivery pipeline from source code to image registry, Kubernetes cluster, scaling, and observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .bg { fill: #ecfeff; }
      .title { font: 800 32px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #0891b2; stroke-width: 2; }
      .cluster { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; }
      .pod { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .line { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .h { font: 800 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .s { font: 600 16px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #475569; }
      .small { font: 700 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0f766e; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="60" y="66">云原生交付：把部署从手工操作变成平台能力</text>
  <g transform="translate(60 140)">
    <rect class="box" x="0" y="140" width="140" height="96" rx="16"/>
    <text class="h" x="70" y="180" text-anchor="middle">代码</text>
    <text class="s" x="70" y="208" text-anchor="middle">Git Commit</text>
    <rect class="box" x="190" y="140" width="150" height="96" rx="16"/>
    <text class="h" x="265" y="180" text-anchor="middle">CI/CD</text>
    <text class="s" x="265" y="208" text-anchor="middle">测试 构建</text>
    <rect class="box" x="390" y="140" width="150" height="96" rx="16"/>
    <text class="h" x="465" y="180" text-anchor="middle">镜像仓库</text>
    <text class="s" x="465" y="208" text-anchor="middle">Image Tag</text>
    <path class="line" d="M140 188 H190"/>
    <path class="line" d="M340 188 H390"/>
    <path class="line" d="M540 188 H620"/>
    <rect class="cluster" x="630" y="20" width="470" height="360" rx="24"/>
    <text class="h" x="865" y="62" text-anchor="middle">Kubernetes 集群</text>
    <rect class="pod" x="680" y="110" width="120" height="76" rx="14"/>
    <text class="h" x="740" y="142" text-anchor="middle">Pod</text>
    <text class="s" x="740" y="166" text-anchor="middle">v1</text>
    <rect class="pod" x="840" y="110" width="120" height="76" rx="14"/>
    <text class="h" x="900" y="142" text-anchor="middle">Pod</text>
    <text class="s" x="900" y="166" text-anchor="middle">v1</text>
    <rect class="pod" x="760" y="230" width="120" height="76" rx="14"/>
    <text class="h" x="820" y="262" text-anchor="middle">Pod</text>
    <text class="s" x="820" y="286" text-anchor="middle">v2</text>
    <rect class="pod" x="930" y="230" width="120" height="76" rx="14"/>
    <text class="h" x="990" y="262" text-anchor="middle">Service</text>
    <text class="s" x="990" y="286" text-anchor="middle">稳定入口</text>
    <text class="small" x="690" y="342">滚动发布 / 自愈 / 自动扩缩容 / 回滚</text>
    <rect class="box" x="90" y="340" width="170" height="82" rx="16"/>
    <text class="h" x="175" y="374" text-anchor="middle">配置与密钥</text>
    <text class="s" x="175" y="400" text-anchor="middle">Config / Secret</text>
    <rect class="box" x="330" y="340" width="170" height="82" rx="16"/>
    <text class="h" x="415" y="374" text-anchor="middle">可观测性</text>
    <text class="s" x="415" y="400" text-anchor="middle">监控 告警 追踪</text>
    <path class="line" d="M260 381 H330"/>
    <path class="line" d="M500 381 C580 381 595 304 630 304"/>
  </g>
</svg>
