<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">真实项目中的数据库组合架构</text>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">以电商系统为例：单一数据库无法满足所有需求，多库协同才是工业界常态</text>

  <!-- 客户端 -->
  <g transform="translate(450,90)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#1e293b"/>
    <text x="150" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">客户端（Web / App / 小程序）</text>
  </g>
  <line x1="600" y1="140" x2="600" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,170 596,162 604,162" fill="#94a3b8"/>

  <!-- 网关 -->
  <g transform="translate(450,170)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#475569"/>
    <text x="150" y="32" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">API 网关 / 负载均衡</text>
  </g>

  <!-- 服务层 -->
  <g transform="translate(80,260)">
    <rect x="0" y="0" width="1040" height="100" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1e40af">微服务层（每个服务按需选数据库）</text>

    <g transform="translate(20,40)">
      <rect x="0" y="0" width="170" height="48" rx="6" fill="#dbeafe"/>
      <text x="85" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#1e40af">用户服务</text>
      <text x="85" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">账号 / 资料 / 鉴权</text>
    </g>
    <g transform="translate(210,40)">
      <rect x="0" y="0" width="170" height="48" rx="6" fill="#fef3c7"/>
      <text x="85" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#854d0e">商品服务</text>
      <text x="85" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">SKU / 类目 / 详情</text>
    </g>
    <g transform="translate(400,40)">
      <rect x="0" y="0" width="170" height="48" rx="6" fill="#dcfce7"/>
      <text x="85" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">订单服务</text>
      <text x="85" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">下单 / 履约 / 状态</text>
    </g>
    <g transform="translate(590,40)">
      <rect x="0" y="0" width="170" height="48" rx="6" fill="#ede9fe"/>
      <text x="85" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">推荐服务</text>
      <text x="85" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">个性化 / 协同过滤</text>
    </g>
    <g transform="translate(780,40)">
      <rect x="0" y="0" width="170" height="48" rx="6" fill="#ccfbf1"/>
      <text x="85" y="20" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#115e59">监控服务</text>
      <text x="85" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">埋点 / 指标 / 告警</text>
    </g>
  </g>

  <!-- 连接线 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,4">
    <line x1="180" y1="360" x2="180" y2="430"/>
    <line x1="290" y1="360" x2="290" y2="430"/>
    <line x1="480" y1="360" x2="480" y2="430"/>
    <line x1="670" y1="360" x2="670" y2="430"/>
    <line x1="860" y1="360" x2="860" y2="430"/>
    <line x1="1050" y1="360" x2="1050" y2="430"/>
  </g>

  <!-- 数据库层 -->
  <g transform="translate(40,430)">
    <text x="0" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">数据存储层</text>
  </g>

  <!-- MySQL 用户库 -->
  <g transform="translate(60,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#3b82f6"/>
    <rect x="0" y="18" width="170" height="14" fill="#3b82f6"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">MySQL</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">用户服务 / 订单服务</text>
      <text x="10" y="76">• accounts 表</text>
      <text x="10" y="94">• orders 表</text>
      <text x="10" y="112">• transactions 表</text>
      <text x="10" y="138" font-weight="600" fill="#1e40af">理由：</text>
      <text x="10" y="152" fill="#475569">强事务、外键约束</text>
    </g>
  </g>

  <!-- Redis -->
  <g transform="translate(245,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#ef4444"/>
    <rect x="0" y="18" width="170" height="14" fill="#ef4444"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Redis</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">所有服务共用</text>
      <text x="10" y="76">• Session 缓存</text>
      <text x="10" y="94">• 商品热点缓存</text>
      <text x="10" y="112">• 限流 / 排行榜</text>
      <text x="10" y="138" font-weight="600" fill="#991b1b">理由：</text>
      <text x="10" y="152" fill="#475569">10万 QPS，亚毫秒</text>
    </g>
  </g>

  <!-- MongoDB -->
  <g transform="translate(430,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#ec4899"/>
    <rect x="0" y="18" width="170" height="14" fill="#ec4899"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">MongoDB</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">商品服务</text>
      <text x="10" y="76">• products 集合</text>
      <text x="10" y="94">• 不同类目字段不同</text>
      <text x="10" y="112">• 商品评价 / 评论</text>
      <text x="10" y="138" font-weight="600" fill="#9d174d">理由：</text>
      <text x="10" y="152" fill="#475569">Schema 灵活易扩展</text>
    </g>
  </g>

  <!-- ES -->
  <g transform="translate(615,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#f43f5e"/>
    <rect x="0" y="18" width="170" height="14" fill="#f43f5e"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Elasticsearch</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">商品服务 / 日志</text>
      <text x="10" y="76">• 商品搜索索引</text>
      <text x="10" y="94">• 全文检索 + 分词</text>
      <text x="10" y="112">• 业务日志聚合</text>
      <text x="10" y="138" font-weight="600" fill="#9f1239">理由：</text>
      <text x="10" y="152" fill="#475569">倒排索引秒级搜索</text>
    </g>
  </g>

  <!-- Neo4j -->
  <g transform="translate(800,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="0" y="18" width="170" height="14" fill="#8b5cf6"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Neo4j</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">推荐服务</text>
      <text x="10" y="76">• User 节点</text>
      <text x="10" y="94">• Product 节点</text>
      <text x="10" y="112">• VIEW/BUY/LIKE 关系</text>
      <text x="10" y="138" font-weight="600" fill="#5b21b6">理由：</text>
      <text x="10" y="152" fill="#475569">多跳关系查询极快</text>
    </g>
  </g>

  <!-- InfluxDB -->
  <g transform="translate(985,440)">
    <rect x="0" y="0" width="170" height="160" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="32" rx="10" fill="#14b8a6"/>
    <rect x="0" y="18" width="170" height="14" fill="#14b8a6"/>
    <text x="85" y="22" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">InfluxDB</text>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="10" y="54">监控服务</text>
      <text x="10" y="76">• QPS / RT 指标</text>
      <text x="10" y="94">• 服务器 CPU/内存</text>
      <text x="10" y="112">• 用户行为埋点</text>
      <text x="10" y="138" font-weight="600" fill="#115e59">理由：</text>
      <text x="10" y="152" fill="#475569">时序压缩 + 自动降采样</text>
    </g>
  </g>

  <!-- 底部数据流向说明 -->
  <g transform="translate(60,625)">
    <rect x="0" y="0" width="1095" height="110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="20" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">数据流关键点</text>

    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e293b">
      <text x="20" y="48"><tspan font-weight="700" fill="#3b82f6">① 写路径：</tspan>订单服务先写 MySQL（强一致保证），同步发 Kafka 事件，异步更新 ES 索引和推荐特征</text>
      <text x="20" y="68"><tspan font-weight="700" fill="#ef4444">② 读路径：</tspan>商品详情先查 Redis 缓存 → 未命中查 MongoDB → 搜索请求走 ES → 用户关系走 Neo4j</text>
      <text x="20" y="88"><tspan font-weight="700" fill="#14b8a6">③ 监控旁路：</tspan>所有服务通过 SDK 把指标推送到 InfluxDB，不参与业务主链路，挂掉不影响交易</text>
    </g>
  </g>
</svg>
